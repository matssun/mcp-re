# SPDX-License-Identifier: Apache-2.0
#
# The declared PERFORMANCE SURFACE, and the shape of a measurement's CONTEXT.
#
# WHY THIS FILE EXISTS. The SLO lane was the only evidence in this repository that was not
# content-addressed. `.verification/attestations` are keyed on a fingerprint and are never
# re-derived while their inputs are unchanged; `scripts/local_slo_lane.sh` re-measured
# unconditionally. So an unchanged tree object was asked to prove itself twice, and the
# second attempt failed on host contention — the measured proof that it WAS contention is in
# the v0.17 record: tree `d8a53be9…` gave 6/6 PASS at median 15,282.6 rps on a quiet box,
# and the re-run gave 4/6 FAIL with rep 2 at p99 262,944 us, while 48,000/48,000 requests
# succeeded across both rounds. Descheduling, not serving.
#
# WHY TWO IDENTITIES AND NOT ONE. A performance result is not a proof result. A proof is a
# theorem about the tree and nothing else, so `(tree, toolchain)` is a complete identity for
# it. A throughput number is a claim about a tree RUNNING ON SOMETHING, and the something
# drifts: kernels, container runtimes, and the benchmark harness's own configuration all
# move under an unchanged source tree. Keying a performance result on the source alone would
# make an old number permanently reusable, which is the opposite error to re-measuring
# unconditionally.
#
# So a recorded SLO result carries two:
#
#   performance surface   the declared inputs below — source that can change how fast the
#                         serving path runs, the build configuration that compiles it, the
#                         harness that measures it, the envelope it measures under, and the
#                         toolchain. A change here INVALIDATES the result.
#
#   measurement context   hardware class, OS/kernel class, container-runtime class and the
#                         benchmark configuration, captured at measurement time. A DIFFERENT
#                         context does not invalidate the old result; it means the old result
#                         is about a different question, so this one has to be measured.
#
# Reuse requires: same surface, same context, and a record no older than `max_age_days`.
# Anything else is a re-measurement, and the decision says which of the three it was.
#
# EVERY DECLARED INPUT MUST BE GIT-TRACKED. `scripts/slo_evidence_identity.py` refuses an
# untracked one: a fingerprint input that is not in the tree makes one commit fingerprint
# two ways depending on whose working copy computed it.

[surface]
# The serving path and everything it links. `mcp-re-proxy` is what is measured;
# `mcp-re-core`, `mcp-re-policy` and `mcp-re-http-profile` are its dependencies and are on
# the per-request path — a change in signature verification or policy evaluation moves
# throughput as surely as a change in the accept loop. `mcp-re-client-core` is here because
# the harness's load generator builds its signed requests through it, so it sets the cost of
# the OFFERED load rather than of serving it; a change there moves the number either way.
source = [
  "mcp-re-proxy/src",
  "mcp-re-core/src",
  "mcp-re-policy/src",
  "mcp-re-http-profile/src",
  "mcp-re-client-core/src",
]

# What compiles it. `Cargo.lock` is the reason a dependency bump is not invisible here, and
# `rust-toolchain.toml` is why a compiler change is not either.
build_configuration = [
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
  "mcp-re-proxy/Cargo.toml",
  "mcp-re-core/Cargo.toml",
  "mcp-re-policy/Cargo.toml",
  "mcp-re-http-profile/Cargo.toml",
  "mcp-re-client-core/Cargo.toml",
]

# The instrument. A harness change is not a code regression, but it absolutely changes the
# number — and a result measured by a different instrument is not comparable to one that is
# not. The lane script and the two gates are here for the same reason: they decide what is
# measured and what counts as passing.
harness = [
  "mcp-re-proxy/tests/tls_load_harness_bench.rs",
  "scripts/local_slo_lane.sh",
  "scripts/adr051_slo_gate.py",
  "scripts/slo_gate.py",
  "tools/slo/run_slo_job.sh",
]

# The envelope and the anchor. The envelope says what load is applied; the anchor says what
# the result is compared against. Either moving makes an old verdict a verdict about a
# question nobody asked.
envelope = [
  "docs/bench/adr-051-benchmark-envelope.json",
  "docs/bench/adr-051-baseline-local.json",
  "docs/bench/adr-051-baseline-dev1.json",
  "docs/bench/adr-051-slo-targets.json",
]

# The image the cloud Job measures inside. It has no effect on the LOCAL lane and every
# effect on the declared-hardware one, and both are keyed by this same surface so that a
# result cannot be reused across a change to the thing that built the binary.
images = ["deploy/docker/Dockerfile.bench"]

[freshness]
# A performance result ages even with the surface and the context unchanged, because the
# context is a CLASS and not a machine: "arm64, 14 cores, macOS 25" is the same class before
# and after a firmware update, a thermal-paste year, or a background daemon nobody declared.
# 90 days is the reuse window; a release may demand a shorter one with --max-age-days.
max_age_days = 90

[context]
# The fields that constitute the measurement context. Named here rather than hardcoded so
# that adding one is a declared change to the identity, not an invisible one — adding a
# field necessarily makes every existing record's context differ, which is the correct and
# visible consequence.
fields = [
  "hardware_class",
  "os_class",
  "container_runtime_class",
  "cpu_count",
  "concurrency",
  "requests",
  "connection_mode",
  "declared_cores",
]

# ---------------------------------------------------------------------------------------
# The declared HARDWARE CLASSES — the named measurement contexts a result may be about.
#
# `hardware_class` is the field of the context that decides WHICH QUESTION a number answers,
# and it was the one field with no declared vocabulary: a class was whatever
# `MCP_RE_LOADGEN_HW_CLASS` happened to hold, `scripts/adr051_slo_gate.py` compared any
# report against the one committed anchor whatever class it carried, and
# `scripts/slo_gate.py` carried its own private list of two classes that may never be an
# SLO verdict. Three consumers, no shared vocabulary, and the middle one performed a
# cross-class comparison silently.
#
# A comparison across classes is not a stricter or looser gate — it is a gate about a
# different question. So each class names its own regression anchor, and a class with none
# has nothing to be compared against until a deliberate run declares one.
#
#   name                the value the harness records in `config.hardware_class`
#   kind                what sort of machine the class describes
#   slo_declarable      may a report on this class be an absolute production-SLO verdict?
#   regression_anchor   the committed baseline `adr051_slo_gate.py` compares it against,
#                       or "" when no anchor has been declared for this class yet
#   github_actions_runner
#                       true on the ONE class the self-hosted Actions runner measures as.
#                       `.github/workflows/slo.yml` resolves the value from here rather than
#                       restating it, for the reason `config/ports.toml` exists.
#   reason              why `slo_declarable = false`, printed by the gate that refuses

[[context.class]]
name = "apple-m4-pro-14c-dev"
kind = "developer-workstation"
slo_declarable = false
regression_anchor = "docs/bench/adr-051-baseline-local.json"
github_actions_runner = false
reason = "a developer workstation with the load generator CO-LOCATED on the same cores; docs/bench/adr-051-baseline-local.json declares itself NOT authoritative for production release SLOs"

[[context.class]]
name = "dev1-macos-arm64"
kind = "self-hosted-actions-runner-retired"
slo_declarable = false
regression_anchor = "docs/bench/adr-051-baseline-dev1.json"
github_actions_runner = false
retired = "2026-09-11"
retired_reason = """RETIRED as the runner class, not deleted: its records remain true for
what they measured. This class measured with the Redis fleet on the `colima-db` Docker
daemon -- the same VM as the 3.6M-row EODHD corpus and unrelated testcontainer churn. A
durable PASS exists at 15,447.96 rps (2026-09-10). The successor `dev1-slo-v1` runs the
fleet on a dedicated daemon, which is a different question, so it carries its own class and
its own anchor rather than inheriting these numbers.

This retirement is load-bearing. `measurement_context()` folds `container_runtime_class`,
which is derived from the Docker SERVER VERSION and reads `docker-29.2` on BOTH daemons --
so had this class simply been pointed at the new endpoint, the context digest would have
been byte-identical and that PASS would have been silently reused for a VM it was never
measured in."""
reason = "a self-hosted Actions runner; the load generator is co-located exactly as it is on a developer workstation, so this class detects REGRESSION and states no capacity"
note = "The anchor is this class's own, and none may be inferred from another one. The runner's chip, core count and thermal envelope are not the developer workstation's, so its numbers are a different question — that is the two-identity model working. It was declared from run 34323483201, the first run of this lane on this host, which reported UNANCHORED exactly as designed and whose retained reports are the six reps the anchor records. Its `caveat` states the box state it was measured at and which half of the band that leaves loose."

[[context.class]]
name = "dev1-slo-v1"
kind = "self-hosted-actions-runner"
slo_declarable = false
regression_anchor = ""
github_actions_runner = true
reason = "a self-hosted Actions runner with the load generator co-located on the same cores, exactly as its predecessor; this class detects REGRESSION and states no capacity"
note = """Successor to `dev1-macos-arm64`. `regression_anchor` is empty ON PURPOSE: no
measurement of THIS environment exists yet, so the first run must report UNANCHORED, which
is the same path `dev1-macos-arm64` took on run 34323483201. An anchor inherited from the
predecessor would be a number measured in a different VM.

THE ENVIRONMENT BELOW IS THE IDENTITY, AND IT IS ENFORCED, NOT MERELY RECORDED.
`tools/slo/environment_preflight.py` verifies every field against the live endpoint before
a measurement may begin, and REFUSES on any mismatch. A declared invariant nobody checks is
evidence-starved: it reads as a guarantee while permitting exactly the drift it names.

These facts are here, in the class, and NOT added as separate `measurement_context()`
fields. The class name is already folded into the context digest, so changing class changes
the identity on its own. Restating the same facts in both places would create two
authorities that can disagree."""

[context.class.environment]
docker_endpoint = "unix:///Users/mats/.colima/slo/docker.sock"
colima_profile = "slo"
vm_cpus = 4
vm_memory_gib = 4
vm_arch = "aarch64"
vm_storage = "internal"
docker_server_version = "29.2.1"
redis_image = "redis:7-alpine"
redis_image_digest = "sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf"
redis_server_version = "7.4.11"

[[context.class]]
name = "kind-local"
kind = "plumbing-rehearsal"
slo_declarable = false
regression_anchor = ""
github_actions_runner = false
reason = "a single unpinned node on a developer box (PROVIDER=kind — a plumbing rehearsal)"

[[context.class]]
name = "smoke"
kind = "unclassified"
slo_declarable = false
regression_anchor = ""
github_actions_runner = false
reason = "the harness default when MCP_RE_LOADGEN_HW_CLASS is unset — no class was declared at all"

[[context.class]]
name = "e2-standard-8"
kind = "declared-production"
slo_declarable = true
regression_anchor = ""
github_actions_runner = false

[[context.class]]
name = "c3-standard-8"
kind = "declared-production"
slo_declarable = true
regression_anchor = ""
github_actions_runner = false
