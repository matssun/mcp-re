# SPDX-License-Identifier: Apache-2.0
#
# Doc-path debt registry — the population `scripts/doc_path_gate.py` lands over.
#
# A row says: this file names N paths that do not resolve in this repository. It is a
# DEBT REGISTER, not an exception mechanism, and it carries the same three states as
# `config/module-size-debt.toml`, because investigation status and disposition are
# separate facts:
#
#   unreviewed                 a dead path nobody has investigated
#   reviewed-action-required   investigated; the repair is identified and not yet made
#   reviewed-exception         investigated, and the text is correct as written
#
# Both reviewed states carry a `review_ref` naming a record in
# `docs/architecture/review-dispositions.md`, and the gate fails if the named document
# does not exist: a completed review points at a record rather than at a memory of one.
#
# `dead_tokens` must EQUAL the measurement. A registered file that gains a token fails —
# an entry pins a file, it does not exempt one — and a file whose tokens are repaired
# fails until its count is lowered or its entry removed, so the registry cannot keep
# describing debt that has been paid.
#
# Re-measure with `python3 scripts/doc_path_gate.py --emit-registry`. That emitter writes
# every row as `unreviewed`; a status is a review's output and is never regenerated.
#
# The counts here were measured at 9e0ba722 by the gate that enforces them. They are NOT
# the figures in the census that proposed the gate: that census reported ~70 tokens and
# 49 hits over a scope it did not re-derive after its second sweep, and its 40/9
# mechanical/human split does not sum against its own table.

