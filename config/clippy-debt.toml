#
# Clippy debt registry — ADR-MCPRE-061 §6.4, §6.5 (C-4, C-5).
#
# Enforced by `scripts/clippy_ratchet_gate.py`, which switches the adopted lints on over
# PRODUCTION targets only (`--lib --bins`) and compares per-crate counts against this file.
# Baselined at 4dc4dac.
#
# A count may only fall. Lowering one is the point; the gate FAILS if a count drops below
# its baseline without this file being updated, so an improvement cannot silently create
# new headroom — and so a wide `allow` cannot be cashed in as progress.
#
# `clippy::unwrap_used` is absent by design: it was measured at 0 production sites across
# the workspace and is denied at zero. The first production `unwrap` fails the gate.
#
# `too_many_lines` reached 0 across every crate in MCPRE-175 and its entries are kept at 0
# rather than removed: an entry at zero is a measured fact that the campaign closed the
# backlog, and removing it would make the next long function look like a file nobody had
# ever counted.
#
# WHEN YOU TOUCH AN `arithmetic_side_effects` SITE, there are three legitimate outcomes
# (ADR-MCPRE-061 §6.6). Pick the one that is true; do not pick the quiet one:
#   1. overflow is a real possibility -> checked_add/checked_sub/checked_mul, handled;
#   2. wrapping or saturating IS the intended algebra -> say so with the named operation;
#   3. the operation is provably bounded -> keep `a + b` and carry a narrow
#      `#[allow(clippy::arithmetic_side_effects)]` naming the owning type, check or
#      theorem that establishes the bound.
# Never a crate- or module-wide allow, and never an
# `arithmetic-side-effects-allowed*` type exemption. The gate refuses both.
#
# Not adopted, and therefore not listed:
#   cognitive_complexity — 7 sites, 6 of which too_many_lines already reports
#
# Re-emit with: python3 scripts/clippy_ratchet_gate.py --emit-registry

# MCPRE-176 (partial operations in security/proof-bearing code) closed `expect_used`,
# `indexing_slicing` and `arithmetic_side_effects` to zero across the seven runtime crates
# it audited: mcp-re-core, mcp-re-http-profile, mcp-re-proxy, mcp-re-client-core,
# mcp-re-client-proxy, mcp-re-client and mcp-re-transport. Their entries are KEPT AT ZERO
# for the same reason `too_many_lines` was: an entry at zero is a measured fact that the
# audit closed that lint for that crate, and removing it would make the next occurrence
# look like a lint nobody had ever counted there. The sites that survive the audit carry
# narrow, justified `#[allow]`s — the allow-discipline half of this gate is what keeps
# those honest, and a crate-wide one would fail it.
#
# mcp-re-demo, mcp-re-host and mcp-re-test-paths were out of that audit's scope. The one
# exception taken is the operations mcp-re-client actually depends on — `mcp-re-host`'s
# OS-CSPRNG nonce source and its `SystemClock` — which were audited and are now a
# justified allow and a `checked_neg` respectively.


