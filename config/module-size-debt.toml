#
# Module-size debt registry — ADR-MCPRE-061 §6.3, §6.4.
#
# Enforced by `scripts/module_size_gate.py`. This is a DEBT REGISTER, not an exception
# mechanism. Investigation status and disposition are separate facts, so there are three
# states rather than two:
#
#   unreviewed                 over the threshold, and nobody has investigated it
#   reviewed-action-required   investigated; specific architectural work identified
#   reviewed-exception         investigated, and deliberately kept intact
#
# Both reviewed states carry a `review_ref` naming their ADR-MCPRE-061 §14 record in
# `docs/architecture/review-dispositions.md`, and the gate checks the named document exists: a
# completed review must point at a record, not at a memory of one. The field was called
# `exception_ref` until a §14 record first DECLINED an exception (EX-002); a leftover
# `exception_ref` is now refused as an unknown field.
#
# Permitted transitions are checked against `origin/main`. Every one preserves or increases
# what is known, and NOTHING returns to `unreviewed` — that would say nobody had looked.
#
# Review granularity equals exception granularity. A function-level exception does not make
# its file a reviewed exception — `mcp-re-proxy/src/cli.rs` stays `unreviewed` despite the
# ADR-MCPRE-058 ruling on `parse_args`, and `mcp-re-proxy/src/app.rs` stays `unreviewed`
# despite the substantiated item-level exception on `run_validated` (see EX-002).
#
# An exception is not a licence to grow. The ratchet applies to every entry whatever its
# status, and `--selftest` pins that.
#
# The registry may only shrink. The gate fails if a listed file grows, if a new file
# crosses the threshold, if a listed file drops to or below the threshold without its entry
# being removed, or if an entry names a file that no longer exists.
#
# `baseline_prod_loc` is measured by the ADR-MCPRE-061 §5.1 rule: every line NOT inside a
# test region, where a region opens at `^#[cfg((all()?test` and closes with the module it
# introduces — counting resumes after it, so production code below the tests still counts.
# Re-measure with
# `python3 scripts/module_size_gate.py --emit-registry`; never hand-edit a count upward.

