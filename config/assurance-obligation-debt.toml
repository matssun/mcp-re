#
# THE ADR-MCPRE-068 N1 OBLIGATION BACKLOG — a MIGRATION RATCHET, and nothing else.
#
# N1: any proposition classified `tested` whose EFFECTIVE consequence severity is Medium,
# High or Critical must name at least one registered falsifier that attacks its production
# property. This file lists the propositions that owed one when the rule was switched on, so
# that switching it on did not require discharging 63 obligations in a single change.
#
# WHAT IT IS NOT, and each of these is mechanical rather than aspirational
# (ADR-MCPRE-068 §9.4, as narrowed by the owner's ratification):
#
#   * NOT an evidence class, an exception, a waiver, or a substitute for a falsifier. A row
#     never subtracts from the obligation and never adds to the assurance.
#   * An entry remains INCOMPLETE. `review` reports it as an open obligation, and an
#     incomplete proposition does not satisfy a root assurance dependency.
#   * CLOSED TO NEW WORK. A proposition that gains an obligation by being added,
#     reclassified, or raised in severity discharges it or fails the gate. It may not be
#     added here — `scripts/assurance_obligation_gate.py` refuses a row this file did not
#     already hold at the baseline.
#   * ONE-WAY. A row closes and never reopens; nothing returns to `unreviewed`.
#   * SUCCESSION is the ONE exception to "closed to new work", and it adds nothing: a row
#     may carry `succeeds` and `decomposition_ref` when an ADR-MCPRE-068 Phase 1
#     decomposition has replaced one wide proposition with the narrower ones it was the
#     conjunction of. The gate requires the predecessor to be a BASE row that no longer
#     owes, every successor's effective severity to be at most the predecessor's, and every
#     successor unit's `paths` to be a SUBSET of the predecessor's at the base — so new
#     production code cannot ride one, nothing at stake rises, and the authorization is
#     SPENT BY THE MERGE THAT USES IT: once a successor row is in the base registry it is an
#     ordinary pre-existing row, and its `succeeds`/`decomposition_ref` remain as PROVENANCE
#     rather than authority. A successor row is an ordinary open obligation.
#   * Each row names its EXACT owning proposition and the obligation it owes, because a
#     registry that cannot say what closing a row would mean is a list, not a ratchet.
#
# IT DOES NOT DUPLICATE `assumptions.toml`. A premise there says WHY a chain terminates
# without MCP-RE establishing the proposition. A row here says MCP-RE OWES this
# establishment and has not yet produced it. Recording one as the other is how a permanent
# gap acquires a temporary shape, or a migration residue acquires a permanent one.
#
# THE MEASURED POPULATION IS LARGER THAN THE RECORD ESTIMATED, and the difference is the
# ratification working. §2 estimated 42 obligated units by counting the ROOT-REACHABLE
# estate. N3 as ratified rejects root-only severity, so a unit's own `direct` label obligates
# it whether or not a declared root reaches it — which adds 28 propositions the estimate
# could not see. 63 is measured, not estimated.
#
#   effective severity of the 63:  34 critical, 19 high, 10 medium
#   root-reachable:                35 of 63
#
# A DERIVATION CORRECTION IS THE ONE EDIT A ROW MAY TAKE, and it is not a waiver. When a
# Phase-1 dependency correction places an existing proposition under a root, three rows'
# `inherited_severity` and `root_reachable` move while `effective_severity` — the value N1
# obligates on — does not. The obligation is the same size; the derivation now decomposes it
# correctly. `scripts/assurance_obligation_gate.py` says so in its own refusal: reachability
# "changes nothing about the obligation, and a stale copy of it is a reader's false premise".
# Applied 2026-09-18 for the AWS/GCP/PKCS#11 adapter rows, when THM-0082 gained THM-0116.
#
# `root_reachable` is recorded per row as the graph fact it is. NOT-ROOT-REACHABLE means
# only that no currently declared system root transitively depends on this proposition. It
# is not low importance, not complete assurance, and not permission to omit evidence — and
# it does not reduce the obligation, which is why those rows are here at all.
#
# Run: python3 scripts/assurance_obligation_gate.py

