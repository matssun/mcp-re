[package]
name = "mcp-re-demo"
version = "0.17.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "MCP-RE demo certificate material: the DemoFixtures mTLS fixture generator (one source-of-truth material set for the proxy/client round-trip tests)."

# The library is `demo_fixtures` and nothing else. It mints the demo's security
# material — server/client CAs and leaves, trust.json, a signing seed — and every
# dependency below is one that `src/demo_fixtures.rs` names.
[dependencies]
mcp-re-core = { path = "../mcp-re-core" }
serde_json = { workspace = true }
# MCPS-055 (MCP-RE-EPIC-P6.6): the fixture generator mints certificates with rcgen,
# which stays OUT of mcp-re-core/mcp-re-host (pure / transport-free).
rcgen = { workspace = true }
# `now`-relative validity for the short-lived (< strict 3600s) client leaf that
# lets a `--strict` fleet be driven live (see demo_fixtures::make_leaf_windowed).
time = { workspace = true }

# The integration test drives a real rustls TLS stack against the proxy. These are
# the test binary's dependencies, not the library's: the library never names them,
# and this crate is a default workspace member, so a normal-dependency edge here
# would unify their features into every build in the workspace.
[dev-dependencies]
mcp-re-proxy = { path = "../mcp-re-proxy" }
mcp-re-transport = { path = "../mcp-re-transport" }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
mcp-re-test-paths = { path = "../mcp-re-test-paths" }

[lib]
name = "mcp_re_demo"
path = "src/lib.rs"

[lints]
workspace = true
