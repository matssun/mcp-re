[package]
name = "mcp-re-operator-display"
version = "0.17.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The one projection of an operator-configured locator for human eyes: scheme, host and port only, with every credential-bearing component removed and its removal reported."

# STD-ONLY, ZERO DEPENDENCIES, and that is load-bearing.
#
# The authority this crate owns is that no operational error or operator-facing
# diagnostic renders a configured locator directly. It is consumed by more than one
# workspace crate (mcp-re-proxy, and any other that must name a locator in a message), so
# it sits at workspace level: two independently authored redactions of one fact are the
# defect the type exists to remove.
#
# The URL decomposition is hand-written over `std` rather than delegated to a parser. A
# projection whose safety depended on an upstream parser's shape decisions would change
# what it publishes when that parser changed its mind, and a parse failure would arrive as
# a shape this crate did not choose how to name. Here every shape it cannot confidently
# take apart is NAMED, never echoed.

[dependencies]

