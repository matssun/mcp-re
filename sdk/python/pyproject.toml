[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[project]
name = "mcp-re-sdk"
version = "0.1.0"
description = "MCP-RE Python SDK — runtime-evidence security (signed requests, verified responses) for the MCP Python SDK, via a transport adapter over the audited mcp-re-client-core."
# BOUNDED AT BOTH ENDS, and neither end is caution — each is a support claim matching the
# evidence. `verification/policy/toolchains.lock.toml` `[python].interpreters` names the
# exact patch versions the authoritative lane runs, and `scripts/python_runtime_gate.py`
# fails the build if this range and that set diverge — so claiming a minor is claiming
# evidence for it (ADR-MCPRE-059 §28 / issue #746).
#
# THE FLOOR IS 3.14.5, NOT 3.14.0, and the patch component is deliberate. CPython 3.14.0
# replaced the generational cycle collector with an incremental one; it caused significant
# memory pressure in production and was REVERTED in 3.14.5, whose release was pulled
# forward to ship the revert. 3.14.0 through 3.14.4 therefore run a collector upstream has
# withdrawn, and this package does not claim them.
#
# The floor was previously ">=3.10", inherited from the upstream MCP SDK's own range. A
# dependency's floor is not this package's obligation: supporting five minors means
# measuring the root battery on five interpreters, and the owner narrowed the claim rather
# than carry that. Widening it again is a support decision plus five measured batteries,
# in that order.
requires-python = ">=3.14.5,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "Mats Sundvall" }]
readme = "README.md"
# No hard runtime deps: the signing/verification core (mcp_re_sdk._core) needs none, and
# a caller who only wants the bindings should not be made to install the upstream MCP SDK.
# `mcp` is required only to open a real session, so it stays an extra.
dependencies = []

[project.optional-dependencies]
# The UPSTREAM MCP Python SDK (a third-party package, not MCP-RE) — required to open a
# session, not to load the core. The transport adapter binds to this package's seam:
# ClientSession consumes anyio streams of parsed `SessionMessage` objects, so JSON-RPC is
# serialized inside the transport and that is the only byte-exact place to sign. A major
# bump can move that seam, so the range is capped rather than open-ended (#413).
mcp = ["mcp>=2.0,<3.0"]
# dev pulls in `mcp` (and its `anyio`) so the transport-adapter tests run.
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "maturin>=1.5,<2.0", "anyio>=4", "mcp>=2.0,<3.0"]

[tool.coverage.run]
# Only the hand-written Python layer is measured. The native `_core` extension is
# Rust behind PyO3 — coverage.py cannot see it, and the Rust it binds is covered by
# the cargo suites in the root workspace.
source = ["mcp_re_sdk"]
omit = ["*/_core*"]

[tool.coverage.report]
# The repo-wide bar. Below it, `pytest --cov` exits non-zero.
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.maturin]
# Mixed Rust/Python layout: Python sources under python/, native ext built from
# the Cargo crate and installed as `mcp_re_sdk._core`.
python-source = "python"
module-name = "mcp_re_sdk._core"
features = ["pyo3/extension-module"]
