# SPDX-License-Identifier: Apache-2.0
#
# ADR-MCPRE-051 §7 SLO lane, on the self-hosted runner.
#
# WHY THE LANE MOVED. The load generator is CO-LOCATED with the proxy: it shares the
# machine's cores with the process it measures, so an unrelated build on the same box halves
# throughput and triples the tail. That is not a hypothesis. Tree `d8a53be9…` gave 6/6 PASS
# at a median 15,282.6 rps on a quiet box; the re-run gave 4/6 FAIL with rep 2 at p99
# 262,944 us and max 445,764 us, while 48,000/48,000 requests succeeded across both rounds.
# Descheduling, not serving — an environmental FAIL that says nothing about the code, and it
# cost a full A/B/B/A investigation before anyone could say so.
#
# `scripts/slo_evidence_identity.py` removed the re-measurements that had no reason to
# happen. It did not make the remaining ones comparable: a developer workstation runs
# editors, other workspaces and a multi-gigabyte container VM, and none of that is declared
# anywhere. This job moves the measurement to a machine that is not doing those things.
#
# WHAT THIS JOB RELIES ON, stated plainly because the exclusivity claim is the point:
#
#   * dev1 enforces a HOST-LEVEL EXCLUSIVE RESERVATION for release-grade SLO measurement.
#     All runner applications sharing the physical host honour it at pre-job admission,
#     work already executing drains before measurement, and the lane begins only after
#     bounded quiescence has been established.
#
#     The previous version of this comment said a single registered runner made contention
#     "structurally impossible". That was MEASURED FALSE on 2026-09-10: dev1 hosts three
#     registered runner applications —
#
#         dev1         -> github.com/matssun/code       (macOS)
#         dev1-mcp-re  -> github.com/matssun/mcp-re     (macOS)
#         dev1-linux   -> github.com/matssun/code       (colima VM, 4 of 14 cores)
#
#     — which serve DIFFERENT repositories and therefore never compete for jobs, only for
#     the machine. A failed rep ran at host load 12.43 beside another runner. The assurance
#     now comes from coordination, not from topology: the host does not need to have one
#     runner, and this file no longer claims that it does. See tools/slo/host_gate.py.
#   * The `concurrency` group below serialises this workflow against itself, so a push and a
#     deliberate operator run cannot interleave two measurements. `cancel-in-progress` is
#     false: cancelling a measurement mid-run is how a release ends up with no number at all.
#
# WHAT IT DOES NOT ESTABLISH: that the host is idle. Nothing in GitHub Actions can assert
# that, so the lane MEASURES it instead — `scripts/local_slo_lane.sh` reads the 1-minute load
# average, waits for the box to settle, and reports a missed tolerance under load as
# INCONCLUSIVE rather than as a regression. The "measured box state" step below records the
# same numbers in the log, so a verdict can always be read against the box that produced it.
# There is no override for the noisy-box handling and none may be added.
#
# WHAT IT MEASURES IS UNCHANGED. Same harness, same canonical v2 envelope (concurrency 128 /
# 8000 requests / cold TLS1.3-mTLS), same gates. Only the machine is different — which makes
# this a different MEASUREMENT CONTEXT under the two-identity model in
# `config/performance-surface.toml`, not a different or a better verdict about the old one.
# The class is `[[context.class]] github_actions_runner = true`, it has no committed
# regression anchor yet, and `scripts/adr051_slo_gate.py` reports UNANCHORED rather than
# comparing this machine's numbers against a developer workstation's.

name: slo

# WHEN THIS LANE RUNS — the owner's rule, 2026-09-14: an SLO run belongs to a RELEASE, not
# to a pull request.
#
# `workflow_dispatch` ONLY. It previously ran on `pull_request` and on `push` to main behind
# a `paths:` filter derived from the declared performance surface, and the measured effect
# was waste rather than assurance: the lane takes the self-hosted host EXCLUSIVELY, so every
# PR touching the serving path -- or merely `scripts/local_gate.sh` -- queued a job that
# drained the other repository's runners through the host arbiter. One such run sat in
# "Set up runner" for twenty minutes and would then have concluded REUSE, because the
# surface had not moved at all.
#
# NOTHING IS LOST BY REMOVING THE FILTER, and this is the part worth reading. A `paths:`
# filter answers "did an input change?" by NAME. `scripts/slo_evidence_identity.py --decide`
# answers it by CONTENT -- it folds the declared surface (source, build configuration,
# harness, envelope, images) and the measurement context (hardware, OS and container-runtime
# classes, benchmark configuration) into two digests and compares them against the attested
# results in the durable store. The filter was the weaker of the two mechanisms and the only
# one that cost a host.
#
# So the question moves to where a release already asks it:
# `tools/verification/release-assurance` runs `--decide` as a step, and a release whose
# surface HAS moved fails there, naming which of surface, context or freshness moved and
# telling the operator to dispatch this lane. A PR cannot answer that question usefully; a
# release must.
on:
  workflow_dispatch:
    inputs:
      reps:
        description: "anchor reps (the committed anchor is a 6-rep median)"
        required: false
        default: "6"
      force_remeasure:
        description: "measure even when the attested result for this identity is reusable"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Serialised against itself, never cancelled. Two measurements interleaved on one host is
# the contention this workflow exists to remove, and a cancelled measurement is a release
# with no number rather than a fast one.
concurrency:
  group: slo-self-hosted
  cancel-in-progress: false

jobs:
  lane:
    name: ADR-MCPRE-051 §7 SLO lane (self-hosted)
    # Same-repository refs only, exactly as both `verification.yml` jobs are. This job
    # executes the checked-out tree's own `scripts/*` on a persistent self-hosted Mac mini
    # that holds the pinned toolchains and the operator's cloud credentials, so a fork pull
    # request reaching this runner is arbitrary code execution on the release verification
    # host, not a sandboxed CI job. The runner is not ephemeral: anything a run leaves behind
    # is read by every later run.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    # A release build of the workspace plus six reps of 8,000 requests, on a box that may
    # have to settle first.
    timeout-minutes: 90
    env:
      # The durable evidence store. NOT inside the checkout: Actions cleans the workspace
      # between runs, so a PASS written there is destroyed and the next identical
      # fingerprint re-measures for no reason. slo_evidence_identity.py FAILS CLOSED if
      # this is unset or resolves inside GITHUB_WORKSPACE.
      MCP_RE_SLO_EVIDENCE_STORE: /opt/verification/slo
      SLO_REPS: ${{ github.event.inputs.reps || '6' }}
      SLO_FORCE_REMEASURE: ${{ github.event.inputs.force_remeasure == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7

      # The class is resolved FROM the declaration, never typed here. A literal in a second
      # place is a fact that can drift, and a drifted class name would key the record to a
      # measurement context nobody declared — the same rule `config/ports.toml` exists for.
      - name: Resolve the declared measurement context
        id: context
        run: |
          set -euo pipefail
          hw="$(python3 scripts/slo_evidence_identity.py --runner-class)"
          echo "hardware_class=$hw" >> "$GITHUB_OUTPUT"
          echo "This runner measures as hardware_class '$hw'."

      # The exclusivity this job relies on cannot be asserted from inside Actions, so it is
      # measured and recorded. A verdict read months later without the box state beside it is
      # a number with no context, and that is how a contended run became a "33% regression".
      - name: Measured box state before the lane
        run: |
          set -euo pipefail
          echo "cpus:   $(sysctl -n hw.ncpu)"
          echo "load:   $(uptime)"
          echo "runner: ${RUNNER_NAME:-<unset>}"
          df -h . | tail -2

      # THE ARBITER THAT DECIDES MUST BE THE ARBITER IN THIS TREE.
      #
      # Every step below runs `/opt/verification/runner-arbiter/bin/*.py` -- host copies
      # installed by `tools/slo/install_arbiter.py`, outside the checkout on purpose so a
      # runner self-update cannot delete the pre-job hook. What those files answer is
      # EVIDENCE: `physical_host_exclusive: true` is an assertion a reader takes on the
      # strength of the source in this repository, and nothing established that the
      # installed copy IS that source. `install_host` only ever wrote; `--check` reported
      # directory and `.env` state and never compared a byte.
      #
      # Run from the CHECKOUT, and first. An installed file that had drifted cannot be the
      # thing that certifies itself, and a wrapper edited to stop calling the arbiter makes
      # admission fail OPEN while every file is still present.
      - name: The installed arbiter is this checkout's
        run: python3 tools/slo/install_arbiter.py --verify

      # The declared environment must BE the environment, and the fleet must be built in
      # it. `dev1-slo-v1` names a dedicated Docker daemon; the bench harness shells plain
      # `docker`, which would otherwise reach whatever the ambient context happens to be --
      # so a PASS could be recorded under a class describing a VM it never touched. The
      # endpoint is read from the declaration, never restated here.
      - name: Resolve and verify the declared measurement environment
        id: plane
        env:
          # The installed copies live outside the checkout, so they are told where the
          # declaration is rather than guessing from their own location.
          MCP_RE_SURFACE_TOML: ${{ github.workspace }}/config/performance-surface.toml
        run: |
          set -euo pipefail
          endpoint="$(python3 /opt/verification/runner-arbiter/bin/environment_preflight.py --print-endpoint)"
          echo "docker_host=$endpoint" >> "$GITHUB_OUTPUT"
          echo "The declared measurement plane is $endpoint"
          python3 /opt/verification/runner-arbiter/bin/environment_preflight.py

      # RUN LIFECYCLE, opened before the first ephemeral resource exists.
      #
      # Host exclusivity says nothing about what a PREVIOUS SLO run left behind. A stale
      # fleet's load lands in the quiescence window, and a fleet answering on the port this
      # run expects would be measured as though this run had started it. So reconciliation
      # happens here -- after the reservation and drain, BEFORE anything is measured.
      #
      # Reconciliation acts only on resources whose ownership is established by label. An
      # unlabelled occupant is INFRASTRUCTURE_UNAVAILABLE and the run refuses: we do not
      # destroy what we did not create.
      - name: Open the run lifecycle (reconcile, then assert a clean plane)
        id: run
        env:
          MCP_RE_SURFACE_TOML: ${{ github.workspace }}/config/performance-surface.toml
        run: |
          set -euo pipefail
          run_id="$(python3 /opt/verification/runner-arbiter/bin/run_supervisor.py run-id)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "SLO run identity: $run_id"
          MCP_RE_SLO_RUN_ID="$run_id" python3 /opt/verification/runner-arbiter/bin/run_supervisor.py begin

      # Only NOW, on a plane proven empty by the supervisor above.
      - name: Establish host quiescence (after the plane is clean)
        run: |
          set -euo pipefail
          exec /usr/bin/env python3 \
            /opt/verification/runner-arbiter/bin/runner_arbiter.py quiesce

      # ASK the host authority; do not become it. The admission state machine lives on the
      # host in tools/slo/host_gate.py, installed at /opt/verification/runner-arbiter, and
      # this step reads its verdict rather than re-deriving exclusivity in YAML. A non-zero
      # exit here means the reservation, the drain, the participation of all three runner
      # applications, or the quiescence could not be established — in which case the lane
      # must NOT publish a number.
      - name: Assert physical-host exclusivity (host arbiter)
        run: |
          set -euo pipefail
          /opt/verification/runner-arbiter/bin/job-started.sh >/dev/null 2>&1 || true
          exec /usr/bin/env python3 \
            /opt/verification/runner-arbiter/bin/runner_arbiter.py assert-exclusive

      # The aggregate, not the lane script directly. Stage 4 is a PROCEDURE — decide against
      # the evidence identity, refuse below the declared disk floor, measure, then attest a
      # PASS and only a PASS — and `scripts/local_gate.sh` is where that procedure is
      # defined. Re-typing it here would be the same fact in two places, and the copy would
      # be the one that stopped attesting or stopped refusing.
      #
      # `--from 4` selects exactly stage 4: stages 1-3 report SKIPPED and stage 5 is outside
      # the range. The run prints exactly one `LOCAL GATE:` line; the step's exit status is
      # the gate's own, unpiped.
      - name: SLO lane (local_gate.sh stage 4)
        env:
          MCP_RE_LOADGEN_HW_CLASS: ${{ steps.context.outputs.hardware_class }}
          # Routes the bench harness's Redis fleet to the daemon the class declares,
          # instead of whatever the ambient Docker context points at.
          DOCKER_HOST: ${{ steps.plane.outputs.docker_host }}
          # Every Docker resource the harness creates is stamped with this, which is what
          # lets teardown and the next run's reconciliation find them.
          MCP_RE_SLO_RUN_ID: ${{ steps.run.outputs.run_id }}
        run: scripts/local_gate.sh --from 4

      # UNCONDITIONAL. `if: always()` so it runs on success, on a benchmark FAIL, on
      # INCONCLUSIVE, on a setup failure after partial startup, and on cancellation where
      # GitHub still reaches the step. It exits non-zero if anything this run created
      # survived -- a measurement that leaves its plane dirty is not attestable, because
      # cleanup success is part of the validity of the result.
      #
      # It does NOT claim to cover SIGKILL or power loss: no code of ours executes there.
      # Those are repaired by the next run's reconciliation, which is why ownership is a
      # durable label rather than a destructor.
      # `always()` AND a run id: if the lifecycle never opened, this run created nothing,
      # so there is nothing to close. Running teardown anyway would fail looking for a
      # declaration and report an infrastructure failure that did not happen.
      - name: Close the run lifecycle (teardown, then assert a clean plane)
        if: always() && steps.run.outputs.run_id != ''
        env:
          MCP_RE_SLO_RUN_ID: ${{ steps.run.outputs.run_id }}
          DOCKER_HOST: ${{ steps.plane.outputs.docker_host }}
          MCP_RE_SURFACE_TOML: ${{ github.workspace }}/config/performance-surface.toml
        run: python3 /opt/verification/runner-arbiter/bin/run_supervisor.py end

      # The reports are what an operator declares this class's anchor from, and what a later
      # reader compares a regression against. Kept on `always()`: a FAIL, an INCONCLUSIVE and
      # an UNANCHORED run all produce reports worth reading, and the failing one most of all.
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slo-reports-${{ steps.context.outputs.hardware_class }}-${{ github.run_id }}
          path: target/slo-local/
          if-no-files-found: warn
          retention-days: 90
