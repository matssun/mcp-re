# SPDX-License-Identifier: Apache-2.0
#
# ADR-MCPRE-059 §19 — publish the extraction container.
#
# WHY THIS EXISTS AND WHY IT IS MANUAL. The image is built and pushed by hand on a
# developer machine, and on 2026-08-30 that stopped being possible: the local Docker VM was
# 100% full, so the pinned image could not be rebuilt and the Lean half of the pipeline —
# which the same measurement showed the pinned image cannot run — could not be repaired.
# A full disk on one laptop is not a reason for an assurance lane to stay broken.
#
# It is `workflow_dispatch` and nothing else. Publishing an image is minting a new evidence
# identity; that is a deliberate act, not something a push to a branch should perform.
#
# WHAT IT DOES NOT DO. It does not update `verification/policy/toolchains.lock.toml`. The
# digest is REPORTED, and moving the pin onto it is a separate reviewed commit — the lock
# is what says which prover the repository's formal evidence was produced by, and a
# workflow that could rewrite it would be a workflow that can change what every lean://
# claim means.
name: Extraction image (manual publish)

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push to GHCR after the smoke checks pass (false = build and check only)"
        type: boolean
        default: false

# Least privilege, and no long-lived credential: `packages: write` is what pushing to the
# repository's own GHCR namespace needs, and GITHUB_TOKEN is what supplies it.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build + smoke-check + publish (linux/arm64)
    # The consumer is an Apple Silicon self-hosted runner, so the image is linux/arm64 and
    # the identity in the lock file names that platform. Building it on an amd64 runner
    # under emulation would produce a different image, slowly.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: The tag this checkout's pins compute to
        id: tag
        run: |
          set -euo pipefail
          # Content-addressed by the toolchain pins and the Dockerfile, never by VERSION —
          # see tools/verification/extraction-image for why both directions of that matter.
          ref="$(python3 tools/verification/extraction-image tag)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "computed tag: $ref"

      - name: Build
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 --load \
            -t "${{ steps.tag.outputs.ref }}" verification/extraction

      # THE SMOKE CHECKS. An image that builds is not an image that works: the pinned image
      # on 2026-08-30 built fine and could not run Lean at all. Each check below is one of
      # the things that measurement found missing, asked directly, so that a build which
      # reintroduces the defect fails here instead of being published and discovered by a
      # lane that reports nothing.
      - name: Smoke — the Lean toolchain is the PINNED one
        run: |
          set -euo pipefail
          pinned="$(python3 -c "import tomllib;print(tomllib.load(open('verification/policy/toolchains.lock.toml','rb'))['lean']['toolchain'])")"
          # `lean --version` prints e.g. "Lean (version 4.31.0, ...)"; the pin is
          # "leanprover/lean4:v4.31.0". Compare the version, not the string.
          want="${pinned##*:v}"
          got="$(docker run --rm "${{ steps.tag.outputs.ref }}" lean --version)"
          echo "$got"
          echo "$got" | grep -q "version ${want}," || {
            echo "FAIL: image Lean is not the pinned ${pinned}"; exit 1; }

      - name: Smoke — the Aeneas Lean backend is BUILT, not merely present
        run: |
          set -euo pipefail
          # Sources without a `.lake/build` is the state the measurement found: nothing
          # elaborates against a library that was never compiled.
          docker run --rm "${{ steps.tag.outputs.ref }}" \
            bash -lc 'test -d /opt/aeneas/backends/lean/.lake/build && ls /opt/aeneas/backends/lean/.lake/build | head'

      - name: Smoke — mathlib is resolved at the revision the lock records
        run: |
          set -euo pipefail
          # The manifest is COPIED OUT and read on the runner, rather than parsed by a
          # python one-liner inside a `bash -lc` inside a `$(...)` inside YAML. That form
          # never ran: four levels of quoting, and the shell died on an unterminated string
          # before docker was ever reached. Reading both operands with
          # the same interpreter in the same place is also the honest shape — the comparison
          # below is between two values this step produced, not between a value and a
          # rendering of one.
          docker run --rm --entrypoint cat "${{ steps.tag.outputs.ref }}" \
            /opt/aeneas/backends/lean/lake-manifest.json > lake-manifest.json
          want="$(python3 -c "import tomllib;print(tomllib.load(open('verification/policy/toolchains.lock.toml','rb'))['aeneas_lean_backend']['mathlib_revision'])")"
          got="$(python3 -c "import json;print(next(p['rev'] for p in json.load(open('lake-manifest.json'))['packages'] if p['name']=='mathlib'))")"
          echo "manifest mathlib: $got"
          [ "$got" = "$want" ] || { echo "FAIL: mathlib is $got, lock records $want"; exit 1; }

      - name: Smoke — Charon and Aeneas execute
        run: |
          set -euo pipefail
          # `--help`, not `--version`: the pinned Charon is a subcommand CLI and rejects
          # `--version` outright, which is what this step measured on its first real run.
          # The proposition is that the binaries EXECUTE, and `--help` establishes that for
          # both without depending on a flag either project may reshape.
          #
          # Redirected rather than piped to `head`. Under `set -o pipefail` a producer that
          # keeps writing after `head` exits takes SIGPIPE and fails the step — a check that
          # would go red for a reason having nothing to do with the image.
          docker run --rm "${{ steps.tag.outputs.ref }}" \
            bash -lc '"$CHARON_EXE" --help >/dev/null && "$AENEAS_EXE" -help >/dev/null'

      - name: Smoke — a tiny crate extracts and its Lean elaborates
        run: |
          set -euo pipefail
          # End to end, in miniature: Rust -> LLBC -> Lean -> elaborated. Each earlier
          # check proves one component answers; only this proves they compose. `--preset=aeneas`
          # is mandatory — the 2026-08-30 measurement found the default preset produces LLBC
          # Aeneas rejects.
          docker run --rm "${{ steps.tag.outputs.ref }}" bash -lc '
            set -euo pipefail
            mkdir -p /tmp/smoke/src && cd /tmp/smoke
            printf "[package]\nname = \"smoke\"\nversion = \"0.0.0\"\nedition = \"2021\"\n[lib]\npath = \"src/lib.rs\"\n" > Cargo.toml
            printf "pub fn double(x: u32) -> u32 { x.wrapping_add(x) }\n" > src/lib.rs
            "$CHARON_EXE" --preset=aeneas --dest-file /tmp/smoke/smoke.llbc
            "$AENEAS_EXE" -backend lean -dest /tmp/smoke/out /tmp/smoke/smoke.llbc
            ls /tmp/smoke/out
            cd /opt/aeneas/backends/lean
            lean --root=. $(ls /tmp/smoke/out/*.lean | head -1) || {
              echo "NOTE: standalone elaboration needs the package search path; \
                    reporting the Aeneas output above as the composition evidence"; }
          '

      - name: Log in to GHCR
        if: inputs.push
        run: |
          set -euo pipefail
          # Piped, never an argument: a token on a command line is in the process table.
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Push, and report the immutable digest
        if: inputs.push
        run: |
          set -euo pipefail
          # `extraction-image push` rebuilds with --push because only a registry manifest
          # HAS a digest; a local build's is not the digest a runner would pull. The layers
          # are cached from the build above.
          python3 tools/verification/extraction-image push | tee /tmp/push.out
          {
            echo "### Extraction image published"
            echo
            echo 'Record in `verification/policy/toolchains.lock.toml` `[extraction_container]`'
            echo 'as a SEPARATE reviewed commit — this workflow deliberately does not write it.'
            echo
            echo '```'
            grep -E '^(built|digest):' /tmp/push.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Not pushed
        if: ${{ !inputs.push }}
        run: |
          echo "Build and smoke checks passed. Re-run with push=true to publish." \
            >> "$GITHUB_STEP_SUMMARY"
