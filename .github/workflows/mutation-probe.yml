# SPDX-License-Identifier: Apache-2.0
#
# The V0 evidence self-test — ADR-MCPRE-059,
# `verification/policy/mutation-probes.toml`.
#
# A class-V0 theorem rests on a test battery, and "the battery passed" is not evidence
# that any production check is LOAD-BEARING. This lane deliberately weakens each check a
# theorem names and requires a DECLARED negative control to go red. It is the same
# argument as `clippy_ratchet_gate.py --activation-probe`: a gate claiming a rule is
# enforced is much stronger when breaking the rule provably turns it red.
#
# It is a SELF-TEST of one unit's evidence, not a merge gate on unrelated work, so it is
# filtered to the things that can invalidate it:
#
#   * the implementation the probes weaken;
#   * the test evidence whose controls must go red;
#   * the probe definitions and the lane itself;
#   * the manifest that says which controls the unit declares.
#
# A probe whose anchor no longer matches exactly one site fails as STALE. That is a demand
# to RE-ADJUDICATE the probe against the new implementation — never to restore the old
# code. Refactoring `verify.rs` is expected; losing a claimed conjunct's control silently
# is not.
#
# `tools/verification/verify` ALSO runs this lane, and the duplication is deliberate. There
# it is one step of the run whose records `attest` consumes, so the attestation closure can
# be produced in a single invocation; here it is a fast, narrowly-filtered signal on the
# pull requests that can actually invalidate it. Neither makes the other redundant: the
# umbrella run is not path-filtered, and this job writes no attestation.

name: mutation probe

on:
  pull_request:
    paths:
      - "verification/policy/mutation-probes.toml"
      - "verification/policy/verification.toml"
      - "tools/verification/verify-mutations"
      - "tools/verification/test_mutation_lane.py"
      - "tools/verification/_manifest.py"
      - ".github/workflows/mutation-probe.yml"
      - "docs/architecture/components/evidence-verification.md"
      - "mcp-re-http-profile/src/**"
      - "mcp-re-http-profile/tests/**"
      - "mcp-re-core/src/**"
      - "mcp-re-proxy/src/tls_listener_state/**"
      - "mcp-re-proxy/src/tls.rs"
      # MCPRE-175 split this into an owner subtree (`client_revocation_posture.rs`,
      # `crl_reload_worker.rs`). A SUBTREE pattern rather than today's children: the
      # authority is the plane, and a filter enumerating its current members would go
      # stale the next time one is added — silently, because a filter that matches
      # nothing fails nothing.
      - "mcp-re-proxy/src/tls_plane/**"
      - "mcp-re-proxy/src/delegated_tls.rs"
  push:
    branches: [main]
    paths:
      - "verification/policy/mutation-probes.toml"
      - "verification/policy/verification.toml"
      - "tools/verification/verify-mutations"
      - "tools/verification/test_mutation_lane.py"
      - "tools/verification/_manifest.py"
      - ".github/workflows/mutation-probe.yml"
      - "docs/architecture/components/evidence-verification.md"
      - "mcp-re-http-profile/src/**"
      - "mcp-re-http-profile/tests/**"
      - "mcp-re-core/src/**"
      - "mcp-re-proxy/src/tls_listener_state/**"
      - "mcp-re-proxy/src/tls.rs"
      # MCPRE-175 split this into an owner subtree (`client_revocation_posture.rs`,
      # `crl_reload_worker.rs`). A SUBTREE pattern rather than today's children: the
      # authority is the plane, and a filter enumerating its current members would go
      # stale the next time one is added — silently, because a filter that matches
      # nothing fails nothing.
      - "mcp-re-proxy/src/tls_plane/**"
      - "mcp-re-proxy/src/delegated_tls.rs"

concurrency:
  group: mutation-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: V0 evidence self-test (mutation probes)
    runs-on: ubuntu-latest
    steps:
      # Depth 2: a pull request checks out its MERGE commit, and `select-units` measures the
      # change against that commit's first parent.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # A PULL REQUEST APPLIES THE PROBES OF THE UNITS ITS CHANGE AFFECTS; a push applies
      # all of them. Same selection as `verification.yml`: moved fingerprints plus their
      # prerequisite consumers, narrowed to the units that owe the mutation lane evidence,
      # and a FULL run whenever the platform itself changed or the scope cannot be computed.
      - name: Select the units this change affects
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "full run: a ${{ github.event_name }} event applies every probe"
            { echo "args="; echo "measure=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            base=HEAD^1
          else
            base='${{ github.event.pull_request.base.sha }}'
            git fetch -q --no-tags --depth=1 origin "$base"
          fi
          units="$RUNNER_TEMP/mutation-units"
          python3 tools/verification/select-units --base "$base" --out "$units" \
            --lane mutation --github-output
          mode=$(sed -n 's/^mode=//p' "$GITHUB_OUTPUT" | tail -1)
          count=$(sed -n 's/^count=//p' "$GITHUB_OUTPUT" | tail -1)
          if [ "$mode" = "scoped" ]; then
            echo "args=$(sed 's/^/--unit /' "$units" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
          if [ "$mode" = "scoped" ] && [ "$count" = "0" ]; then
            echo "measure=false" >> "$GITHUB_OUTPUT"
          else
            echo "measure=true" >> "$GITHUB_OUTPUT"
          fi

      - name: No affected unit owes mutation evidence
        if: steps.scope.outputs.measure != 'true'
        run: echo "This change moves no mutation-evidence unit; the push to main applies every probe."

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install stable --profile minimal

      # The lane's own false-green catalogue, first: it is python-only and fails in
      # seconds, before ~26 cargo runs discover the same defect slowly.
      - name: Mutation-lane self-tests
        run: python3 tools/verification/test_mutation_lane.py

      # Unpiped, and the verdict line is read from the exit status: a gate read through a
      # pipe reports the pipe's status, which has already turned a failed gate green once
      # in this repository.
      #
      # `--skip-unprepared` because this job deliberately builds no SDK matrix. A probe over
      # an `sdk_python.*` or `sdk_typescript.*` unit needs a maturin wheel and a four-runtime
      # Node install, which is the umbrella run's job and is most of why it takes an hour.
      # Those probes are reported UNAVAILABLE BY NAME and counted in the verdict line, so
      # this job's green cannot be read as "every probe was applied" — which is why the step
      # is no longer called that. Without the flag they FAIL here, and correctly: an absent
      # prepared environment in a lane that was supposed to have one is a defect.
      - name: Apply every probe this environment can run
        if: steps.scope.outputs.measure == 'true'
        run: tools/verification/verify-mutations --skip-unprepared ${{ steps.scope.outputs.args }}
