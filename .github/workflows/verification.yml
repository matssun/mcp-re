# SPDX-License-Identifier: Apache-2.0
#
# ADR-MCPRE-059 verification platform — AUTHORITATIVE.
#
# This workflow GATES. The host job runs `./tools/verification/verify --gate`, so a lane
# that fails, or that could not run and says so, fails the build.
#
# This header read "REPORT-ONLY ... It does not gate merges and must not, until the
# platform has been measured and the pilots exist" long after the pilots landed and the
# step was changed to `--gate`. The posture it described was right for Phase 1 — a gate
# that blocks before it is calibrated teaches people to bypass it — and wrong about the
# tree for as long as it stood. Corrected in the v0.17 Slice B sweep, and recorded rather
# than silently replaced: a workflow whose prose understates what it enforces costs a
# reader the same trust as one that overstates it.
#
# Host split (§19). The two lanes do not run in the same place:
#
#   * Verus runs natively on the macOS host. Its release archive is self-contained
#     (own Z3) and its rustc requirement matches the repository's pinned channel.
#   * Charon/Aeneas/Lean run only inside the pinned Linux container. Charon is a rustc
#     driver, and on aarch64-apple-darwin the rustc-dev component ships the compiler
#     crates as .rmeta with no .rlib, so it cannot link there.
#
# The runner is a self-hosted Mac mini. GitHub's job-level `container:` key is supported
# ONLY on Linux runners, so the extraction steps invoke the image explicitly with
# `docker run` rather than declaring a job container. That also keeps the local and CI
# invocations textually identical.

name: verification

# The declared unit sources are part of the trigger set. A unit's evidence is a claim
# about production Rust, so a change to `mcp-re-core/src/`, `mcp-re-http-profile/src/` or
# `runtime_state.rs` is exactly the change `check-assumptions` exists to catch — a lane
# scoped only to `verification/**` would never see a deleted theorem or a new
# `external_body` in the code the theorem is about.
on:
  pull_request:
    paths:
      - "verification/**"
      - "tools/verification/**"
      - ".github/workflows/verification.yml"
      - "mcp-re-core/src/**"
      - "mcp-re-http-profile/src/**"
      # Encoding v4 digests the INTEGRATION-TEST SOURCES a unit's selectors run, not only
      # their names: a control can keep its declared name and lose its body, and the
      # fingerprint has to see that. `scripts/verification_trigger_gate.py` derives this
      # requirement from the manifest, so a new selected target fails the build until the
      # filter covers it.
      - "mcp-re-http-profile/tests/**"
      - "mcp-re-proxy/src/runtime_state.rs"
      # Issue #744: the two store-materialization owners, sibling authorities that had
      # no unit between them.
      - "mcp-re-proxy/src/replay_plane/**"
      # THM-0129: what the enforcement point may be handed as authoritative admission
      # state, and that a reachable store which answered is never an outage.
      - "mcp-re-proxy/src/admission_source/**"
      #   The shared arm of the same claim. Compiled only under `redis_replay`, so it
      #   does not reach the default lane — and the classification clause is quantified
      #   over every source, so a change here dirties the unit either way.
      - "mcp-re-proxy/src/redis_admission_source/**"
      # The async replay retention account (THM-0105); `l1_fast_reject.rs` is dormant and
      # excluded from the unit, but the glob covers the directory so a fingerprint input
      # cannot land outside every trigger.
      - "mcp-re-proxy/src/async_replay/**"
      # r11 R11-097 / R11-203: the §7 admission gate, the ADR-065 authorization capability
      # and the two configuration-recognition halves. Directory globs rather than file
      # entries, for the reason stated beside `async_replay/**` above — a fingerprint input
      # must not be able to land outside every trigger.
      - "mcp-re-proxy/src/admission_enforcer/**"
      - "mcp-re-proxy/src/authorization/**"
      - "mcp-re-proxy/src/config_state/admission.rs"
      - "mcp-re-proxy/src/config_state/authorization.rs"
      # The deployable replay backends (THM-0106 / THM-0107). Feature-gated, so a plain
      # cargo lane compiles them to zero tests — which is exactly why a change to one must
      # still re-trigger the units that carry them.
      - "mcp-re-proxy/src/redis_store.rs"
      - "mcp-re-proxy/src/async_redis_store.rs"
      - "mcp-re-proxy/src/etcd_store.rs"
      - "mcp-re-proxy/src/async_etcd_store.rs"
      # The provider-agnostic Ed25519 KMS seam (THM-0108). The provider adapters beneath it
      # are unowned and are their own slice.
      - "mcp-re-proxy/src/kms_keysource/**"
      # The client mTLS transport (THM-0109 / THM-0110). Whole crate, sources and the two
      # integration batteries alike: `mtls_client_test.rs` and `dos_hardening_test.rs` ARE
      # the evidence for both units, so a change to either must re-trigger them.
      - "mcp-re-transport/src/**"
      - "mcp-re-transport/tests/**"
      - "mcp-re-transport/Cargo.toml"
      # The v0.17 policy-authority slice (THM-0111). Three units:
      #   - the frozen ADR-MCPS-013 taxonomy, the sole owner of the authorization mapping;
      #   - the client seam's binding-spec refusal and its Core projection;
      #   - the workspace walk that MEASURES how many files decide what a verdict says.
      # The walk reads every crate's source tree, so its own inputs are already covered by
      # the broad filters above; what is enumerated here is the units' declared paths.
      - "mcp-re-policy/src/**"
      - "mcp-re-policy/Cargo.toml"
      - "mcp-re-client-core/src/binding_spec/**"
      - "mcp-re-client-core/src/core_projection.rs"
      - "mcp-re-conformance/tests/audit_vocabulary_guard_test.rs"
      - "mcp-re-conformance/tests/audit_vocabulary_guard_test/**"
      # The scanner the walk rests on. A change to what counts as a brace changes what the
      # control reads, so it is a fingerprint input and must re-trigger the lane.
      - "mcp-re-test-paths/src/**"
      - "mcp-re-test-paths/Cargo.toml"
      # The v0.17 measured-remainder slice.
      #   - THM-0114: the deployable client's two freshness inputs, and the audit #81
      #     boundary that keeps their deterministic fixtures off a production build. The
      #     MANIFEST is a fingerprint input because `default = ["test-fixtures"]` would
      #     satisfy every `#[cfg]` in the crate with no source line changing.
      - "mcp-re-host/src/**"
      - "mcp-re-host/Cargo.toml"
      #   - THM-0115: the remote-signer failure value and the quota rule that reads it.
      #     Compiled under `any(aws_kms_keysource, gcp_kms_keysource)`, so neither of its two
      #     units runs in the default lane and a change here must still re-trigger both.
      - "mcp-re-proxy/src/remote_signer_call/**"
      - "mcp-re-proxy/src/continuation_store/**"
      - "mcp-re-proxy/src/redis_continuation_store.rs"
      # Issue #744, D1b′: the continuation MATERIALIZATION owners — which capability the
      # runtime installs for the plan it was given, and the composition root's half of it.
      # `startup_posture` is here because the declaration conjunct is part of that claim.
      - "mcp-re-proxy/src/serving_capabilities/**"
      - "mcp-re-proxy/src/config_state/continuation_control.rs"
      - "mcp-re-proxy/src/startup_posture.rs"
      - "mcp-re-proxy/src/startup_posture/**"
      # Issue #742: the two outbound authorities. Registered as units because R9's only
      # Critical was a credential-bearing egress reaching an authority the configuration
      # did not select, and both modules were fixed while neither was declared — a fix
      # that maps to no unit is covered by nothing.
      - "mcp-re-proxy/src/outbound_fetch/**"
      - "mcp-re-proxy/src/kms_endpoint_policy/**"
      # The ratified theorem-architecture closure, Stage 1: three authorities that already
      # existed and were simply unmeasured. Enumerated rather than given a subtree pattern
      # because none of them IS a subtree — `exchange_state.rs` and `request_stages.rs` are
      # single files, and the other two units take one file each out of directories whose
      # remaining members belong to other owners.
      - "mcp-re-proxy/src/exchange_state.rs"
      - "mcp-re-proxy/src/request_stages.rs"
      # v0.17 trust-plane ownership slice: the runtime trust plane, `proxy.trust_plane_runtime`.
      # The subtree pattern also matches `window_policy.rs`, which the unit excludes; a
      # filter that over-triggers is the safe direction, one that under-triggers is the
      # defect this gate exists for.
      - "mcp-re-proxy/src/trust_plane/**"
      - "mcp-re-proxy/src/trust_epoch.rs"
      - "mcp-re-proxy/src/reloading_trust.rs"
      # v0.17: the trust-document parser, `proxy.trust_document_interpretation`.
      - "mcp-re-proxy/src/trust_document.rs"
      # #741 put the inner-plane seam inside the dispatch-commitment closure: the capability
      # the ready state carries is produced there, so a change to it dirties the unit and
      # this lane must re-measure it.
      - "mcp-re-proxy/src/async_inner/**"
      - "mcp-re-proxy/src/authorization/dispatch.rs"
      - "mcp-re-proxy/src/http_profile_serve/dispatch_commitment.rs"
      - "mcp-re-proxy/src/refusal/**"
      - "mcp-re-proxy/src/config_state/cross_machine.rs"
      # Stage 3 gave the posture authority its own unit: the one operation that produces an
      # AuthorizationPosture, and the two facts it keeps apart.
      - "mcp-re-proxy/src/authorization/decide.rs"
      - "mcp-re-proxy/src/authorization/posture.rs"
      # Stage 4 gave the client crate its four semantic owners. A subtree pattern: the four
      # units between them name most of the crate, and a filter enumerating today's members
      # would go stale the next time one is added — silently, because a filter that matches
      # nothing reports nothing.
      - "mcp-re-client-core/src/**"
      # The manifest too: the fingerprint reads it, and a dependency change that moves a
      # unit's measurement must reach the lane that re-measures it.
      - "mcp-re-client-core/Cargo.toml"
      # The shipped client PROXY: THM-0084 is the joint between the request it sends and
      # the expectation it verifies against, and it lives here rather than in client-core.
      - "mcp-re-client-proxy/src/**"
      - "mcp-re-client-proxy/Cargo.toml"
      # #743: the sidecar BINARY crate's inner face — where the listener is exposed, which
      # HTTP authority names reach signing, and the head guards that run before a byte is
      # signed. A subtree pattern for the same reason as client-core's.
      - "mcp-re-client/src/**"
      # THM-0120 / THM-0123: the deployable's e2e battery is the witness that the anchor
      # refresh and the local pipeline hold for the LISTENER, not only for the modules.
      - "mcp-re-client/tests/**"
      # v0.17 priority 5, the provider adapters beneath the KMS seam (THM-0116, THM-0117)
      # and the token custody THM-0116 covers. Each exists only under its own non-default
      # feature, so none of their units runs in the default lane and a change here must
      # still re-trigger every one of them.
      - "mcp-re-proxy/src/aws_kms_keysource.rs"
      - "mcp-re-proxy/src/aws_sigv4.rs"
      - "mcp-re-proxy/src/aws_sts.rs"
      - "mcp-re-proxy/src/gcp_kms_keysource.rs"
      - "mcp-re-proxy/src/pkcs11_keysource/**"
      # ADR-MCPRE-069 CO-S3-4: `proxy.pkcs11_adapter` now names a
      # `tests/pkcs11_keysource_e2e_test#` selector, so this file's BYTES are one of the
      # unit's fingerprint inputs — the token adapter's only control taken over a real
      # Cryptoki surface. Without the filter the body could change under the same name
      # and no verification lane would re-run.
      - "mcp-re-proxy/tests/pkcs11_keysource_e2e_test.rs"
      - "mcp-re-proxy/tests/pkcs11_keysource_e2e_test/**"
      - "mcp-re-client/Cargo.toml"
      # #740: the retained-evidence corpus this implementation produced. The ARTIFACTS are in
      # the fingerprint, not just the test that reads them — a frozen vector whose bytes can
      # change without the lane re-running is a vector that proves whatever it currently is.
      - "mcp-re-conformance/Cargo.toml"
      - "mcp-re-conformance/tests/scitt_retained_corpus_test.rs"
      - "mcp-re-conformance/tests/scitt_retained_corpus_test/**"
      - "mcp-re-conformance/tests/vectors/scitt/retained/**"
      # #746: the two SDK exchange paths. Their SOURCE, their tests, and the manifests and
      # lockfiles that decide what their dependencies are — the same closure a crate gets,
      # because the fingerprint measures all three for a non-Rust unit too (#745).
      - "sdk/python/python/**"
      - "sdk/python/tests/**"
      - "sdk/python/pyproject.toml"
      # TRACKED, and therefore in the fingerprint at last: the lock was `.gitignore`d as a
      # maturin by-product, so the Python dependency resolution contributed nothing to any
      # unit while `project_inputs` claimed it did. The matrix environments are built from
      # it, so a re-resolution changes what the batteries ran under (#746).
      - "sdk/python/uv.lock"
      # The matrix preparation and the support-claim gates decide WHICH runtimes the SDK
      # evidence covers, so a change to any of them changes what this lane measures
      # (#746 for Python, #747 for Node).
      - "scripts/prepare_python_matrix.sh"
      - "scripts/python_runtime_gate.py"
      - "scripts/prepare_node_matrix.sh"
      - "scripts/node_runtime_gate.py"
      - "sdk/typescript/src/**"
      - "sdk/typescript/test/**"
      - "sdk/typescript/package.json"
      - "sdk/typescript/package-lock.json"
      - "sdk/typescript/tsconfig.json"
      # Stage 5 gave the response-emission cluster its four owners.
      - "mcp-re-proxy/src/delegated_server_signer/**"
      - "mcp-re-proxy/src/delegated_response_signer.rs"
      - "mcp-re-proxy/src/config_state/custody.rs"
      # The serving subtree, read whole: three units now take files out of it — the
      # dispatch commitment, the response-signing authority, and the verification stage the
      # product-provenance gate measures — and a filter enumerating today's members would go
      # stale the next time a region moves.
      - "mcp-re-proxy/src/http_profile_serve/**"
      # #744 D2a: the replay-admission gate and the verdict projection beneath it.
      - "mcp-re-proxy/src/http_profile_dispatch.rs"
      - "mcp-re-proxy/src/http_profile_dispatch/**"
      - "mcp-re-proxy/src/async_serve/**"
      # ADR-MCPRE-069 S-09: joined `proxy.per_request_revocation_serving`'s closure beside
      # `async_serve/`, because the per-request revocation verdict rules live here and the
      # request loop only calls them.
      - "mcp-re-proxy/src/client_revocation.rs"
      - "mcp-re-proxy/src/blocking_mtls_harness/**"
      - "mcp-re-proxy/src/capability_materialization/key_source/**"
      - "mcp-re-proxy/src/signing_plane/**"
      # r11 R11-377: joined `proxy.delegated_signing_credential`'s closure, so a change to it
      # dirties the unit and this lane has to re-measure it.
      - "mcp-re-proxy/src/delegated_wiring.rs"
      # #741 registered the durability owner: WHEN the deployment became answerable, in two
      # durable stages. A subtree, because the split into products is what the unit is about
      # and a filter enumerating today's members would go stale at the next one.
      - "mcp-re-proxy/src/transparency/**"
      # Stage 6: the transparency-service pin, whose provenance THM-0068 states.
      - "mcp-re-http-profile/src/scitt/**"
      # Stage 7: what a record may say, and whether the stream is honest about what reached it.
      - "mcp-re-proxy/src/audit_record/**"
      - "mcp-re-proxy/src/audit_sink/**"
      - "mcp-re-proxy/src/authorization/audit.rs"
      - "mcp-re-proxy/src/authorization/audit/**"
      # Stage 8: the replay five-tuple, found by the missing-edge pass.
      - "mcp-re-http-profile/src/replay.rs"
      # W4: the two request fields that carry credentials and may never be printed as
      # configured. Named individually rather than as `deployment_request/**`: the rest of
      # that subtree is the CLI-neutral request model, which validates nothing and
      # participates in no unit's fingerprint.
      - "mcp-re-proxy/src/deployment_request/secret_string.rs"
      - "mcp-re-proxy/src/deployment_request/inner_backend_display.rs"
      # MCPRE-137: the listener-lifetime TLS security state, its subordinates, and the
      # production wiring that gives a listener a lifetime at all.
      - "mcp-re-proxy/src/tls_listener_state/**"
      - "mcp-re-proxy/src/tls.rs"
      # MCPRE-175 split this into an owner subtree (`client_revocation_posture.rs`,
      # `crl_reload_worker.rs`). A SUBTREE pattern rather than today's children: the
      # authority is the plane, and a filter enumerating its current members would go
      # stale the next time one is added — silently, because a filter that matches
      # nothing fails nothing.
      - "mcp-re-proxy/src/tls_plane/**"
      # ADR-MCPRE-069 S-04: the client-CRL `nextUpdate` gate at the publication site,
      # `proxy.client_crl_next_update_gate`, and the probe that weakens it. The file sits
      # beside the plane rather than inside it, so the subtree pattern above does not
      # reach it.
      - "mcp-re-proxy/src/client_crl_publication.rs"
      # ADR-MCPRE-069 S-08: the peer-identity slice. `transport/mod.rs` carries
      # `proxy.transport_binding_application`; `facades/asserted_identity.rs` holds the two
      # vocabulary conversions that unit's callers go through and owns no check of its own;
      # `transport/identity.rs` and the ingress subtree are in the binding unit's source
      # closure by UC-1, because `transport/mod.rs` declares them.
      - "mcp-re-proxy/src/transport/mod.rs"
      - "mcp-re-proxy/src/transport/identity.rs"
      - "mcp-re-proxy/src/transport/ingress/**"
      - "mcp-re-proxy/src/facades/asserted_identity.rs"
      # ADR-MCPRE-069 S-06: three new fingerprint inputs, each also a probe site.
      # `replay_tier.rs` carries the strict-production minimum
      # (`proxy.replay_tier_production_minimum`, M335), `serving_capabilities.rs` the
      # optional-capability posture (`proxy.serving_capability_posture`, M336), and
      # `async_fleet/mod.rs` the explicit-topology provenance
      # (`proxy.fleet_topology_provenance`, M337). None of the three is under a subtree
      # pattern already listed here.
      - "mcp-re-proxy/src/replay_tier.rs"
      - "mcp-re-proxy/src/serving_capabilities.rs"
      - "mcp-re-proxy/src/async_fleet/**"
      - "mcp-re-proxy/src/delegated_tls.rs"
      # ADR-MCPRE-063 Slice 3: the correspondence gate on delegated resolver construction.
      - "mcp-re-proxy/src/delegated_tls/**"
      # THM-0013 reads the boundary's OCSP clauses, so the lane must re-measure when
      # they move: the theorem is that no validated deployment enables online OCSP.
      - "mcp-re-proxy/src/config_state/validation/residue.rs"
      # THM-0013 is a claim about the legality BOUNDARY, so the clause list that carries
      # the refusal is inside `proxy.online_ocsp_reachability`'s closure too.
      - "mcp-re-proxy/src/config_state/validation/mod.rs"
      # ADR-MCPRE-063 Slice 1: the certificate identity authority and the peer-identity
      # value invariant it constructs. The whole module tree, not the interpreter alone —
      # the selector's claim rests on the representation seam preserving presented order
      # and on the adapter producing that representation, so a change to either dirties
      # the units.
      - "mcp-re-proxy/src/communication_assurance/**"
      # ADR-MCPRE-068 Phase 0D-8: the crate root is a PROBE input, not a fingerprint one.
      # S12 and S13 attack the `communication_assurance` authority boundary from OUTSIDE it,
      # so their insertion parent is `lib.rs` — the lane edits that file in its scratch copy
      # to declare the injected module. A change to it can therefore change what the probes
      # compile against, and the lane must re-run. This is the one filter here that exists
      # for a probe's site rather than for a unit's sources.
      - "mcp-re-proxy/src/lib.rs"
      # The merged plain-library integration binary carries this unit's DER-level
      # controls, and encoding v4 digests those sources, not only their names. The
      # `test_source_patterns` emits BOTH layouts a cargo test target can have, so
      # `tests/integration.rs` is a fingerprint input even though this suite is a
      # directory today: collapsing it back to one file must still re-run the lane. It is
      # therefore a live filter, not a stale one, and the liveness half of
      # `scripts/verification_trigger_gate.py` exempts exactly that case.
      - "mcp-re-proxy/tests/integration/**"
      - "mcp-re-proxy/tests/integration.rs"
      # v0.17: the bounded-drain battery, `proxy.serving_drain`. Its own binary, because it
      # runs under RUST_TEST_THREADS=1 in the Bazel lane — a property of a binary.
      - "mcp-re-proxy/tests/async_drain_test.rs"
      - "mcp-re-proxy/tests/async_drain_test/**"
      # MCPRE-146/148: the three trust units declared with the four theorems — the
      # revocation posture and trust-document state, the plan projected from them, and
      # the composition root that consumes those projections without re-reading trust.
      - "mcp-re-proxy/src/config_state/trust_revocation.rs"
      - "mcp-re-proxy/src/config_state/trust_document.rs"
      # v0.17 / #581 row 2: the connection credential window, `proxy.client_credential_window`.
      - "mcp-re-proxy/src/config_state/client_credential_window.rs"
      # The ADR-MCPRE-068 structural probe S04 injects a sibling module here and
      # requires the parent not to declare it already. A change to this file can
      # make that probe stale, or move the boundary it attacks, so it re-triggers
      # the lane — `verification_trigger_gate.py` derives the requirement from the
      # probe registry rather than trusting this list.
      - "mcp-re-proxy/src/config_state/mod.rs"
      - "mcp-re-proxy/src/config_state/credential_currency_bound.rs"
      # ADR-MCPRE-069 NP-049…NP-060: the layer-A configuration classifiers, each a unit
      # under THM-0077 with a registered `mutation://` falsifier. Their source is a
      # ReviewFingerprint component and the probes read it, so a change here must re-measure.
      - "mcp-re-proxy/src/config_state/replay.rs"
      - "mcp-re-proxy/src/config_state/delegated_signing.rs"
      - "mcp-re-proxy/src/config_state/transport.rs"
      - "mcp-re-proxy/src/config_state/channel_credential_custody.rs"
      - "mcp-re-proxy/src/config_state/channel_key_material.rs"
      - "mcp-re-proxy/src/config_state/freshness.rs"
      - "mcp-re-proxy/src/config_state/server_identity.rs"
      - "mcp-re-proxy/src/config_state/validation/machine_violations.rs"
      - "mcp-re-proxy/src/config_state/validation/recognition.rs"
      # SL-POSTURE-2: the last four unowned classifiers, and the startup planner, which was
      # in no unit's `paths` at all until its three propositions got units.
      - "mcp-re-proxy/src/config_state/evidence.rs"
      - "mcp-re-proxy/src/config_state/in_flight_limit.rs"
      - "mcp-re-proxy/src/config_state/mcp_transport_contract.rs"
      - "mcp-re-proxy/src/config_state/topology.rs"
      - "mcp-re-proxy/src/startup_plan.rs"
      # ADR-MCPRE-067 Phase 5 moved the online-revocation SELECTION out of a flat
      # `DeploymentRequest` field, so `proxy.online_ocsp_reachability`'s closure now names
      # the file holding `is_required()` — the predicate THM-0013's refusal reads.
      - "mcp-re-proxy/src/deployment_request/revocation/**"
      - "mcp-re-proxy/src/trust_plan.rs"
      - "mcp-re-proxy/src/app.rs"
      # ADR-MCPRE-065 Slice 2 (THM-0040): the PDP-decision relation authority, and the
      # three semantic products it compares against — the authorization request and the
      # verified actor and action it is composed from. All four participate in the
      # fingerprint, so all four must re-run the lane.
      - "mcp-re-proxy/src/authorization/pdp/**"
      - "mcp-re-proxy/src/authorization/request.rs"
      - "mcp-re-proxy/src/authorization/verified_actor.rs"
      - "mcp-re-proxy/src/authorization/verified_action.rs"
      # THM-0040 is measured through the serving path, so its battery lives in the async
      # integration target. Same shape as the `integration` pair above.
      - "mcp-re-proxy/tests/integration_async/**"
      - "mcp-re-proxy/tests/integration_async.rs"
      # ADR-MCPRE-069 NP-158. `proxy.aws_web_identity_credential_exchange`'s battery is this
      # target, and the target is `#![cfg(feature = "aws_kms_keysource")]` — so without the
      # feature it compiles to zero tests and exits 0. The lane supplies the feature from the
      # unit's `test_features`; what this pair supplies is the re-run, because the file's
      # BYTES are a fingerprint component and a change to them that did not re-measure would
      # leave an attestation standing over a battery that had moved.
      - "mcp-re-proxy/tests/aws_irsa_web_identity_test/**"
      - "mcp-re-proxy/tests/aws_irsa_web_identity_test.rs"
      # The build inputs every ReviewFingerprint reads. A dependency bump moves
      # Cargo.lock, which dirties every declared unit — so a lane that did not
      # re-run on it would leave `main` carrying attestations over a dependency
      # graph nothing measured. `scripts/verification_trigger_gate.py` fails the
      # build if this set ever narrows below the fingerprint's again.
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "mcp-re-core/Cargo.toml"
      - "mcp-re-http-profile/Cargo.toml"
      - "mcp-re-proxy/Cargo.toml"
  push:
    branches: [main]
    paths:
      - "verification/**"
      - "tools/verification/**"
      - ".github/workflows/verification.yml"
      - "mcp-re-core/src/**"
      - "mcp-re-http-profile/src/**"
      # Encoding v4 digests the INTEGRATION-TEST SOURCES a unit's selectors run, not only
      # their names: a control can keep its declared name and lose its body, and the
      # fingerprint has to see that. `scripts/verification_trigger_gate.py` derives this
      # requirement from the manifest, so a new selected target fails the build until the
      # filter covers it.
      - "mcp-re-http-profile/tests/**"
      - "mcp-re-proxy/src/runtime_state.rs"
      # Issue #744: the two store-materialization owners, sibling authorities that had
      # no unit between them.
      - "mcp-re-proxy/src/replay_plane/**"
      # THM-0129: what the enforcement point may be handed as authoritative admission
      # state, and that a reachable store which answered is never an outage.
      - "mcp-re-proxy/src/admission_source/**"
      #   The shared arm of the same claim. Compiled only under `redis_replay`, so it
      #   does not reach the default lane — and the classification clause is quantified
      #   over every source, so a change here dirties the unit either way.
      - "mcp-re-proxy/src/redis_admission_source/**"
      # The async replay retention account (THM-0105); `l1_fast_reject.rs` is dormant and
      # excluded from the unit, but the glob covers the directory so a fingerprint input
      # cannot land outside every trigger.
      - "mcp-re-proxy/src/async_replay/**"
      # r11 R11-097 / R11-203: the §7 admission gate, the ADR-065 authorization capability
      # and the two configuration-recognition halves. Directory globs rather than file
      # entries, for the reason stated beside `async_replay/**` above — a fingerprint input
      # must not be able to land outside every trigger.
      - "mcp-re-proxy/src/admission_enforcer/**"
      - "mcp-re-proxy/src/authorization/**"
      - "mcp-re-proxy/src/config_state/admission.rs"
      - "mcp-re-proxy/src/config_state/authorization.rs"
      # The deployable replay backends (THM-0106 / THM-0107). Feature-gated, so a plain
      # cargo lane compiles them to zero tests — which is exactly why a change to one must
      # still re-trigger the units that carry them.
      - "mcp-re-proxy/src/redis_store.rs"
      - "mcp-re-proxy/src/async_redis_store.rs"
      - "mcp-re-proxy/src/etcd_store.rs"
      - "mcp-re-proxy/src/async_etcd_store.rs"
      # The provider-agnostic Ed25519 KMS seam (THM-0108). The provider adapters beneath it
      # are unowned and are their own slice.
      - "mcp-re-proxy/src/kms_keysource/**"
      # The client mTLS transport (THM-0109 / THM-0110). Whole crate, sources and the two
      # integration batteries alike: `mtls_client_test.rs` and `dos_hardening_test.rs` ARE
      # the evidence for both units, so a change to either must re-trigger them.
      - "mcp-re-transport/src/**"
      - "mcp-re-transport/tests/**"
      - "mcp-re-transport/Cargo.toml"
      # The v0.17 policy-authority slice (THM-0111). Three units:
      #   - the frozen ADR-MCPS-013 taxonomy, the sole owner of the authorization mapping;
      #   - the client seam's binding-spec refusal and its Core projection;
      #   - the workspace walk that MEASURES how many files decide what a verdict says.
      # The walk reads every crate's source tree, so its own inputs are already covered by
      # the broad filters above; what is enumerated here is the units' declared paths.
      - "mcp-re-policy/src/**"
      - "mcp-re-policy/Cargo.toml"
      - "mcp-re-client-core/src/binding_spec/**"
      - "mcp-re-client-core/src/core_projection.rs"
      - "mcp-re-conformance/tests/audit_vocabulary_guard_test.rs"
      - "mcp-re-conformance/tests/audit_vocabulary_guard_test/**"
      # The scanner the walk rests on. A change to what counts as a brace changes what the
      # control reads, so it is a fingerprint input and must re-trigger the lane.
      - "mcp-re-test-paths/src/**"
      - "mcp-re-test-paths/Cargo.toml"
      # The v0.17 measured-remainder slice.
      #   - THM-0114: the deployable client's two freshness inputs, and the audit #81
      #     boundary that keeps their deterministic fixtures off a production build. The
      #     MANIFEST is a fingerprint input because `default = ["test-fixtures"]` would
      #     satisfy every `#[cfg]` in the crate with no source line changing.
      - "mcp-re-host/src/**"
      - "mcp-re-host/Cargo.toml"
      #   - THM-0115: the remote-signer failure value and the quota rule that reads it.
      #     Compiled under `any(aws_kms_keysource, gcp_kms_keysource)`, so neither of its two
      #     units runs in the default lane and a change here must still re-trigger both.
      - "mcp-re-proxy/src/remote_signer_call/**"
      - "mcp-re-proxy/src/continuation_store/**"
      - "mcp-re-proxy/src/redis_continuation_store.rs"
      # Issue #744, D1b′: the continuation MATERIALIZATION owners — which capability the
      # runtime installs for the plan it was given, and the composition root's half of it.
      # `startup_posture` is here because the declaration conjunct is part of that claim.
      - "mcp-re-proxy/src/serving_capabilities/**"
      - "mcp-re-proxy/src/config_state/continuation_control.rs"
      - "mcp-re-proxy/src/startup_posture.rs"
      - "mcp-re-proxy/src/startup_posture/**"
      # Issue #742: the two outbound authorities. Registered as units because R9's only
      # Critical was a credential-bearing egress reaching an authority the configuration
      # did not select, and both modules were fixed while neither was declared — a fix
      # that maps to no unit is covered by nothing.
      - "mcp-re-proxy/src/outbound_fetch/**"
      - "mcp-re-proxy/src/kms_endpoint_policy/**"
      # The ratified theorem-architecture closure, Stage 1: three authorities that already
      # existed and were simply unmeasured. Enumerated rather than given a subtree pattern
      # because none of them IS a subtree — `exchange_state.rs` and `request_stages.rs` are
      # single files, and the other two units take one file each out of directories whose
      # remaining members belong to other owners.
      - "mcp-re-proxy/src/exchange_state.rs"
      - "mcp-re-proxy/src/request_stages.rs"
      # v0.17 trust-plane ownership slice: the runtime trust plane, `proxy.trust_plane_runtime`.
      # The subtree pattern also matches `window_policy.rs`, which the unit excludes; a
      # filter that over-triggers is the safe direction, one that under-triggers is the
      # defect this gate exists for.
      - "mcp-re-proxy/src/trust_plane/**"
      - "mcp-re-proxy/src/trust_epoch.rs"
      - "mcp-re-proxy/src/reloading_trust.rs"
      # v0.17: the trust-document parser, `proxy.trust_document_interpretation`.
      - "mcp-re-proxy/src/trust_document.rs"
      # #741 put the inner-plane seam inside the dispatch-commitment closure: the capability
      # the ready state carries is produced there, so a change to it dirties the unit and
      # this lane must re-measure it.
      - "mcp-re-proxy/src/async_inner/**"
      - "mcp-re-proxy/src/authorization/dispatch.rs"
      - "mcp-re-proxy/src/http_profile_serve/dispatch_commitment.rs"
      - "mcp-re-proxy/src/refusal/**"
      - "mcp-re-proxy/src/config_state/cross_machine.rs"
      # Stage 3 gave the posture authority its own unit: the one operation that produces an
      # AuthorizationPosture, and the two facts it keeps apart.
      - "mcp-re-proxy/src/authorization/decide.rs"
      - "mcp-re-proxy/src/authorization/posture.rs"
      # Stage 4 gave the client crate its four semantic owners. A subtree pattern: the four
      # units between them name most of the crate, and a filter enumerating today's members
      # would go stale the next time one is added — silently, because a filter that matches
      # nothing reports nothing.
      - "mcp-re-client-core/src/**"
      # The manifest too: the fingerprint reads it, and a dependency change that moves a
      # unit's measurement must reach the lane that re-measures it.
      - "mcp-re-client-core/Cargo.toml"
      # The shipped client PROXY: THM-0084 is the joint between the request it sends and
      # the expectation it verifies against, and it lives here rather than in client-core.
      - "mcp-re-client-proxy/src/**"
      - "mcp-re-client-proxy/Cargo.toml"
      # #743: the sidecar BINARY crate's inner face — where the listener is exposed, which
      # HTTP authority names reach signing, and the head guards that run before a byte is
      # signed. A subtree pattern for the same reason as client-core's.
      - "mcp-re-client/src/**"
      # THM-0120 / THM-0123: the deployable's e2e battery is the witness that the anchor
      # refresh and the local pipeline hold for the LISTENER, not only for the modules.
      - "mcp-re-client/tests/**"
      # v0.17 priority 5, the provider adapters beneath the KMS seam (THM-0116, THM-0117)
      # and the token custody THM-0116 covers. Each exists only under its own non-default
      # feature, so none of their units runs in the default lane and a change here must
      # still re-trigger every one of them.
      - "mcp-re-proxy/src/aws_kms_keysource.rs"
      - "mcp-re-proxy/src/aws_sigv4.rs"
      - "mcp-re-proxy/src/aws_sts.rs"
      - "mcp-re-proxy/src/gcp_kms_keysource.rs"
      - "mcp-re-proxy/src/pkcs11_keysource/**"
      # ADR-MCPRE-069 CO-S3-4: `proxy.pkcs11_adapter` now names a
      # `tests/pkcs11_keysource_e2e_test#` selector, so this file's BYTES are one of the
      # unit's fingerprint inputs — the token adapter's only control taken over a real
      # Cryptoki surface. Without the filter the body could change under the same name
      # and no verification lane would re-run.
      - "mcp-re-proxy/tests/pkcs11_keysource_e2e_test.rs"
      - "mcp-re-proxy/tests/pkcs11_keysource_e2e_test/**"
      - "mcp-re-client/Cargo.toml"
      # #740: the retained-evidence corpus this implementation produced. The ARTIFACTS are in
      # the fingerprint, not just the test that reads them — a frozen vector whose bytes can
      # change without the lane re-running is a vector that proves whatever it currently is.
      - "mcp-re-conformance/Cargo.toml"
      - "mcp-re-conformance/tests/scitt_retained_corpus_test.rs"
      - "mcp-re-conformance/tests/scitt_retained_corpus_test/**"
      - "mcp-re-conformance/tests/vectors/scitt/retained/**"
      # #746: the two SDK exchange paths. Their SOURCE, their tests, and the manifests and
      # lockfiles that decide what their dependencies are — the same closure a crate gets,
      # because the fingerprint measures all three for a non-Rust unit too (#745).
      - "sdk/python/python/**"
      - "sdk/python/tests/**"
      - "sdk/python/pyproject.toml"
      # TRACKED, and therefore in the fingerprint at last: the lock was `.gitignore`d as a
      # maturin by-product, so the Python dependency resolution contributed nothing to any
      # unit while `project_inputs` claimed it did. The matrix environments are built from
      # it, so a re-resolution changes what the batteries ran under (#746).
      - "sdk/python/uv.lock"
      # The matrix preparation and the support-claim gates decide WHICH runtimes the SDK
      # evidence covers, so a change to any of them changes what this lane measures
      # (#746 for Python, #747 for Node).
      - "scripts/prepare_python_matrix.sh"
      - "scripts/python_runtime_gate.py"
      - "scripts/prepare_node_matrix.sh"
      - "scripts/node_runtime_gate.py"
      - "sdk/typescript/src/**"
      - "sdk/typescript/test/**"
      - "sdk/typescript/package.json"
      - "sdk/typescript/package-lock.json"
      - "sdk/typescript/tsconfig.json"
      # Stage 5 gave the response-emission cluster its four owners.
      - "mcp-re-proxy/src/delegated_server_signer/**"
      - "mcp-re-proxy/src/delegated_response_signer.rs"
      - "mcp-re-proxy/src/config_state/custody.rs"
      # The serving subtree, read whole: three units now take files out of it — the
      # dispatch commitment, the response-signing authority, and the verification stage the
      # product-provenance gate measures — and a filter enumerating today's members would go
      # stale the next time a region moves.
      - "mcp-re-proxy/src/http_profile_serve/**"
      # #744 D2a: the replay-admission gate and the verdict projection beneath it.
      - "mcp-re-proxy/src/http_profile_dispatch.rs"
      - "mcp-re-proxy/src/http_profile_dispatch/**"
      - "mcp-re-proxy/src/async_serve/**"
      # ADR-MCPRE-069 S-09: joined `proxy.per_request_revocation_serving`'s closure beside
      # `async_serve/`, because the per-request revocation verdict rules live here and the
      # request loop only calls them.
      - "mcp-re-proxy/src/client_revocation.rs"
      - "mcp-re-proxy/src/blocking_mtls_harness/**"
      - "mcp-re-proxy/src/capability_materialization/key_source/**"
      - "mcp-re-proxy/src/signing_plane/**"
      # r11 R11-377: joined `proxy.delegated_signing_credential`'s closure, so a change to it
      # dirties the unit and this lane has to re-measure it.
      - "mcp-re-proxy/src/delegated_wiring.rs"
      # #741 registered the durability owner: WHEN the deployment became answerable, in two
      # durable stages. A subtree, because the split into products is what the unit is about
      # and a filter enumerating today's members would go stale at the next one.
      - "mcp-re-proxy/src/transparency/**"
      # Stage 6: the transparency-service pin, whose provenance THM-0068 states.
      - "mcp-re-http-profile/src/scitt/**"
      # Stage 7: what a record may say, and whether the stream is honest about what reached it.
      - "mcp-re-proxy/src/audit_record/**"
      - "mcp-re-proxy/src/audit_sink/**"
      - "mcp-re-proxy/src/authorization/audit.rs"
      - "mcp-re-proxy/src/authorization/audit/**"
      # Stage 8: the replay five-tuple, found by the missing-edge pass.
      - "mcp-re-http-profile/src/replay.rs"
      # W4: the two request fields that carry credentials and may never be printed as
      # configured. Named individually rather than as `deployment_request/**`: the rest of
      # that subtree is the CLI-neutral request model, which validates nothing and
      # participates in no unit's fingerprint.
      - "mcp-re-proxy/src/deployment_request/secret_string.rs"
      - "mcp-re-proxy/src/deployment_request/inner_backend_display.rs"
      # MCPRE-137: the listener-lifetime TLS security state, its subordinates, and the
      # production wiring that gives a listener a lifetime at all.
      - "mcp-re-proxy/src/tls_listener_state/**"
      - "mcp-re-proxy/src/tls.rs"
      # MCPRE-175 split this into an owner subtree (`client_revocation_posture.rs`,
      # `crl_reload_worker.rs`). A SUBTREE pattern rather than today's children: the
      # authority is the plane, and a filter enumerating its current members would go
      # stale the next time one is added — silently, because a filter that matches
      # nothing fails nothing.
      - "mcp-re-proxy/src/tls_plane/**"
      # ADR-MCPRE-069 S-04: the client-CRL `nextUpdate` gate at the publication site,
      # `proxy.client_crl_next_update_gate`, and the probe that weakens it. The file sits
      # beside the plane rather than inside it, so the subtree pattern above does not
      # reach it.
      - "mcp-re-proxy/src/client_crl_publication.rs"
      # ADR-MCPRE-069 S-08: the peer-identity slice. `transport/mod.rs` carries
      # `proxy.transport_binding_application`; `facades/asserted_identity.rs` holds the two
      # vocabulary conversions that unit's callers go through and owns no check of its own;
      # `transport/identity.rs` and the ingress subtree are in the binding unit's source
      # closure by UC-1, because `transport/mod.rs` declares them.
      - "mcp-re-proxy/src/transport/mod.rs"
      - "mcp-re-proxy/src/transport/identity.rs"
      - "mcp-re-proxy/src/transport/ingress/**"
      - "mcp-re-proxy/src/facades/asserted_identity.rs"
      # ADR-MCPRE-069 S-06: three new fingerprint inputs, each also a probe site.
      # `replay_tier.rs` carries the strict-production minimum
      # (`proxy.replay_tier_production_minimum`, M335), `serving_capabilities.rs` the
      # optional-capability posture (`proxy.serving_capability_posture`, M336), and
      # `async_fleet/mod.rs` the explicit-topology provenance
      # (`proxy.fleet_topology_provenance`, M337). None of the three is under a subtree
      # pattern already listed here.
      - "mcp-re-proxy/src/replay_tier.rs"
      - "mcp-re-proxy/src/serving_capabilities.rs"
      - "mcp-re-proxy/src/async_fleet/**"
      - "mcp-re-proxy/src/delegated_tls.rs"
      # ADR-MCPRE-063 Slice 3: the correspondence gate on delegated resolver construction.
      - "mcp-re-proxy/src/delegated_tls/**"
      # THM-0013 reads the boundary's OCSP clauses, so the lane must re-measure when
      # they move: the theorem is that no validated deployment enables online OCSP.
      - "mcp-re-proxy/src/config_state/validation/residue.rs"
      # THM-0013 is a claim about the legality BOUNDARY, so the clause list that carries
      # the refusal is inside `proxy.online_ocsp_reachability`'s closure too.
      - "mcp-re-proxy/src/config_state/validation/mod.rs"
      # ADR-MCPRE-063 Slice 1: the certificate identity authority and the peer-identity
      # value invariant it constructs. The whole module tree, not the interpreter alone —
      # the selector's claim rests on the representation seam preserving presented order
      # and on the adapter producing that representation, so a change to either dirties
      # the units.
      - "mcp-re-proxy/src/communication_assurance/**"
      # ADR-MCPRE-068 Phase 0D-8: the crate root is a PROBE input, not a fingerprint one.
      # S12 and S13 attack the `communication_assurance` authority boundary from OUTSIDE it,
      # so their insertion parent is `lib.rs` — the lane edits that file in its scratch copy
      # to declare the injected module. A change to it can therefore change what the probes
      # compile against, and the lane must re-run. This is the one filter here that exists
      # for a probe's site rather than for a unit's sources.
      - "mcp-re-proxy/src/lib.rs"
      # The merged plain-library integration binary carries this unit's DER-level
      # controls, and encoding v4 digests those sources, not only their names. The
      # `test_source_patterns` emits BOTH layouts a cargo test target can have, so
      # `tests/integration.rs` is a fingerprint input even though this suite is a
      # directory today: collapsing it back to one file must still re-run the lane. It is
      # therefore a live filter, not a stale one, and the liveness half of
      # `scripts/verification_trigger_gate.py` exempts exactly that case.
      - "mcp-re-proxy/tests/integration/**"
      - "mcp-re-proxy/tests/integration.rs"
      # v0.17: the bounded-drain battery, `proxy.serving_drain`. Its own binary, because it
      # runs under RUST_TEST_THREADS=1 in the Bazel lane — a property of a binary.
      - "mcp-re-proxy/tests/async_drain_test.rs"
      - "mcp-re-proxy/tests/async_drain_test/**"
      # MCPRE-146/148: the three trust units declared with the four theorems — the
      # revocation posture and trust-document state, the plan projected from them, and
      # the composition root that consumes those projections without re-reading trust.
      - "mcp-re-proxy/src/config_state/trust_revocation.rs"
      - "mcp-re-proxy/src/config_state/trust_document.rs"
      # v0.17 / #581 row 2: the connection credential window, `proxy.client_credential_window`.
      - "mcp-re-proxy/src/config_state/client_credential_window.rs"
      # The ADR-MCPRE-068 structural probe S04 injects a sibling module here and
      # requires the parent not to declare it already. A change to this file can
      # make that probe stale, or move the boundary it attacks, so it re-triggers
      # the lane — `verification_trigger_gate.py` derives the requirement from the
      # probe registry rather than trusting this list.
      - "mcp-re-proxy/src/config_state/mod.rs"
      - "mcp-re-proxy/src/config_state/credential_currency_bound.rs"
      # ADR-MCPRE-069 NP-049…NP-060: the layer-A configuration classifiers, each a unit
      # under THM-0077 with a registered `mutation://` falsifier. Their source is a
      # ReviewFingerprint component and the probes read it, so a change here must re-measure.
      - "mcp-re-proxy/src/config_state/replay.rs"
      - "mcp-re-proxy/src/config_state/delegated_signing.rs"
      - "mcp-re-proxy/src/config_state/transport.rs"
      - "mcp-re-proxy/src/config_state/channel_credential_custody.rs"
      - "mcp-re-proxy/src/config_state/channel_key_material.rs"
      - "mcp-re-proxy/src/config_state/freshness.rs"
      - "mcp-re-proxy/src/config_state/server_identity.rs"
      - "mcp-re-proxy/src/config_state/validation/machine_violations.rs"
      - "mcp-re-proxy/src/config_state/validation/recognition.rs"
      # SL-POSTURE-2: the last four unowned classifiers, and the startup planner, which was
      # in no unit's `paths` at all until its three propositions got units.
      - "mcp-re-proxy/src/config_state/evidence.rs"
      - "mcp-re-proxy/src/config_state/in_flight_limit.rs"
      - "mcp-re-proxy/src/config_state/mcp_transport_contract.rs"
      - "mcp-re-proxy/src/config_state/topology.rs"
      - "mcp-re-proxy/src/startup_plan.rs"
      # ADR-MCPRE-067 Phase 5 moved the online-revocation SELECTION out of a flat
      # `DeploymentRequest` field, so `proxy.online_ocsp_reachability`'s closure now names
      # the file holding `is_required()` — the predicate THM-0013's refusal reads.
      - "mcp-re-proxy/src/deployment_request/revocation/**"
      - "mcp-re-proxy/src/trust_plan.rs"
      - "mcp-re-proxy/src/app.rs"
      # ADR-MCPRE-065 Slice 2 (THM-0040): the PDP-decision relation authority, and the
      # three semantic products it compares against — the authorization request and the
      # verified actor and action it is composed from. All four participate in the
      # fingerprint, so all four must re-run the lane.
      - "mcp-re-proxy/src/authorization/pdp/**"
      - "mcp-re-proxy/src/authorization/request.rs"
      - "mcp-re-proxy/src/authorization/verified_actor.rs"
      - "mcp-re-proxy/src/authorization/verified_action.rs"
      # THM-0040 is measured through the serving path, so its battery lives in the async
      # integration target. Same shape as the `integration` pair above.
      - "mcp-re-proxy/tests/integration_async/**"
      - "mcp-re-proxy/tests/integration_async.rs"
      # ADR-MCPRE-069 NP-158. `proxy.aws_web_identity_credential_exchange`'s battery is this
      # target, and the target is `#![cfg(feature = "aws_kms_keysource")]` — so without the
      # feature it compiles to zero tests and exits 0. The lane supplies the feature from the
      # unit's `test_features`; what this pair supplies is the re-run, because the file's
      # BYTES are a fingerprint component and a change to them that did not re-measure would
      # leave an attestation standing over a battery that had moved.
      - "mcp-re-proxy/tests/aws_irsa_web_identity_test/**"
      - "mcp-re-proxy/tests/aws_irsa_web_identity_test.rs"
      # The build inputs every ReviewFingerprint reads. A dependency bump moves
      # Cargo.lock, which dirties every declared unit — so a lane that did not
      # re-run on it would leave `main` carrying attestations over a dependency
      # graph nothing measured. `scripts/verification_trigger_gate.py` fails the
      # build if this set ever narrows below the fingerprint's again.
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "mcp-re-core/Cargo.toml"
      - "mcp-re-http-profile/Cargo.toml"
      - "mcp-re-proxy/Cargo.toml"
  # THE COMPLETE RUN: every unit, every lane. Weekly, and by dispatch for a release
  # (release-assurance composes a dispatched run on the release commit).
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  # The extraction image lives in GHCR. Read-only: this workflow consumes the pinned
  # image, it never publishes one — publishing is tools/verification/extraction-image,
  # run deliberately when a toolchain pin changes.
  packages: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # ONE ORDERED JOB, and the ordering is the mechanism.
  #
  # The repository's required evidence cannot be produced by one process: Verus and the
  # cargo matrix run on the macOS host, and Charon links the private rustc crates so
  # extraction and the Lean proofs run inside the pinned container. Two JOBS could not
  # state a verdict either — each would be asked for an aggregate over lanes it cannot
  # execute, which is exactly how declaring the first V2 unit made the host gate
  # structurally incapable of PASS.
  #
  # So: a fresh evidence directory, both execution phases writing records into it, and one
  # composer at the end that validates and composes them. The composer executes no formal
  # lane, and neither phase states a repository verdict.
  # ---------------------------------------------------------------------------
  verification:
    # Renamed from `host` with the jobs merged: it is no longer the host half of a pair.
    # Safe to rename because neither verification job is a required status check: the
    # `Protect main` ruleset requires three contexts and this is not one of them.
    name: verification platform
    # Same-repository refs only. This job executes the checked-out tree's own
    # `tools/verification/*` on a persistent self-hosted Mac mini that holds the pinned
    # toolchains under /opt/verification and the operator's cloud credentials, so a fork
    # pull request reaching this runner is arbitrary code execution on the release
    # verification host, not a sandboxed CI job. The runner is not ephemeral: anything a
    # run leaves behind is read by every later run, including the toolchains later
    # attestations resolve from.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    # The test lane compiles and runs each unit's declared battery, including integration
    # targets, so this job now carries a Cargo build rather than only manifest parsing and
    # a prover invocation.
    #
    # The complete run (schedule, dispatch) measured 30-95 minutes in September 2026 and
    # grows with every registered probe. A merge check's work is decided before it runs
    # (scoped or deferred); nothing stops it once started.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 240 || 120 }}
    env:
      # THE ENDPOINT IS DECLARED, NOT INHERITED.
      #
      # Without this the docker CLI resolves through `currentContext` in the runner user's
      # ~/.docker/config.json — one global, mutable, last-writer-wins value that every
      # `colima start` rewrites. The host runs four Colima profiles, so the daemon this job
      # measured was whichever profile started most recently, and on 2026-09-13 that was a
      # stopped one: the context had fallen back to `default`, which on this host is a
      # symlink to a Docker Desktop socket that does not exist.
      #
      # Naming it also makes the failure the right KIND of failure. An absent context is
      # refused outright rather than silently resolving to some other daemon, so a job that
      # cannot reach its declared runtime fails as unavailable infrastructure instead of
      # quietly measuring the wrong one. Repairing it is the host supervisor's job
      # (`~/.local/bin/colima-watchdog.sh` on the runner), never this workflow's.
      DOCKER_CONTEXT: colima
    steps:
      # Depth 2: a pull request checks out its MERGE commit, and `select-units` measures the
      # change against that commit's first parent — the base it merges into.
      #
      # `clean: false`, then a clean that keeps the BUILD CACHES: actions/checkout's own
      # clean deleted target/ and the SDK and Lean build trees on every run, and on the
      # runner's external work disk that delete alone took 11 minutes of a merge check's
      # budget (2026-09-25). They are build caches, not evidence -- every record is bound
      # to a fingerprint of the SOURCES, and the lanes that mutate the tree build in their
      # own scratch copies -- so keeping them changes what is fast, not what is measured.
      #
      # The pinned Node runtimes (sdk/typescript/.node-v<major>) are the same kind of
      # cache. Not keeping them made the preflight re-prepare all four on every run --
      # 17 minutes of a merge check in `prepare_node_matrix.sh` before any unit was
      # measured (2026-09-25). The preflight still checks each runtime's exact version.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          clean: false
      - name: Clean the checkout, keeping the build caches
        run: >-
          git clean -ffdx
          -e /target/
          -e /sdk/typescript/node_modules/
          -e /sdk/typescript/target/
          -e '/sdk/typescript/.node-v*/'
          -e /verification/lean/.lake/

      # A MERGE CHECK MEASURES ONLY WHAT ITS CHANGE AFFECTS, and never everything.
      #
      # Pull requests and pushes to main are merge checks: they answer inside the CI time
      # budget. `select-units` compares every unit's fingerprint at the base with HEAD's
      # and takes the moved units plus their prerequisite consumers. A change to the
      # platform itself, a scope over its cap, or a scope it cannot compute is DEFERRED —
      # measured by the complete run, which is the schedule below and a manual dispatch
      # (release-assurance consumes a dispatched run). A scoped run's bundle is INCOMPLETE,
      # so nothing attests from a merge check.
      - name: Select the units this change affects
        id: scope
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch)
              echo "complete run: a ${{ github.event_name }} event measures every unit"
              { echo "mode=full"; echo "args="; echo "measure=true"; } >> "$GITHUB_OUTPUT"
              exit 0 ;;
            push)
              base='${{ github.event.before }}' ;;
            *)
              if git rev-parse -q --verify HEAD^2 >/dev/null; then
                base=HEAD^1
              else
                base='${{ github.event.pull_request.base.sha }}'
              fi ;;
          esac
          case "$base" in HEAD^1) ;; *) git fetch -q --no-tags --depth=1 origin "$base" || true ;; esac
          mkdir -p .verification/scope
          python3 tools/verification/select-units --base "$base" \
            --out .verification/scope/units --github-output | tee .verification/scope/why
          mode=$(sed -n 's/^mode=//p' "$GITHUB_OUTPUT" | tail -1)
          count=$(sed -n 's/^count=//p' "$GITHUB_OUTPUT" | tail -1)
          echo "args=--units-file .verification/scope/units" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "scoped" ] && [ "$count" != "0" ]; then
            echo "measure=true" >> "$GITHUB_OUTPUT"
          else
            echo "measure=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to measure in this merge check
        if: steps.scope.outputs.measure != 'true'
        run: |
          head -1 .verification/scope/why
          echo "Nothing is measured here. The complete run (weekly, and dispatched for a"
          echo "release) measures every unit."

      # First, because every step below reads the environment this checks. The job
      # PATH comes from the runner service's `.env`, not from the operator's login
      # shell, so a host that verifies by hand can still fail here — and it failed as
      # `ModuleNotFoundError: tomllib`, then as `verus: rustup not found`, neither of
      # which names the runner environment that decided it.
      - name: Runner environment preflight
        if: steps.scope.outputs.measure == 'true'
        run: ./scripts/verification_runner_preflight.sh

      - name: Report the pinned Verus identity
        if: steps.scope.outputs.measure == 'true'
        run: |
          set -euo pipefail
          # Resolved from the lock file, never from PATH: another package manager on this
          # box supplies a same-named cargo, and a proof checked by an unintended tool is
          # not the proof the lock file claims.
          root=$(python3 - <<'PY'
          import tomllib
          d = tomllib.load(open("verification/policy/toolchains.lock.toml", "rb"))
          v = d["verus"]
          print(v.get("install_root", "") if v.get("state") == "resolved" else "")
          PY
          )
          if [ -z "$root" ]; then
            echo "Verus pin unresolved — the lane will report SKIPPED, not PASS."
            exit 0
          fi
          "$root/verus" --version

      # Authoritative from Phase 2 onward. Report-only was the honest posture while the
      # manifest declared no formal evidence; now that a V1 unit exists, a lane that could
      # go red without failing the build would be evidence nobody has to keep green.
      # ADR-MCPRE-059 §28 / issue #746: two registered units' batteries are a pytest and a
      # vitest one, and neither runs against a bare checkout — the Python wheel is a PyO3
      # extension module and the TypeScript package a napi one, so both need building before
      # a single test can import them.
      #
      # Built HERE rather than inside the lane, and the separation is the point: a lane that
      # builds what it measures can report a battery it just made pass. This step prepares an
      # environment; `verify` measures whatever is in it, and a preparation failure stops the
      # job before the lane can report anything at all.
      #
      # `scripts/verification_runner_preflight.sh` has already refused the job if `uv` or
      # `npx` is missing, and it derives that requirement from the registry — so this step
      # exists exactly while some unit's battery needs it.
      #
      # ONLY FOR THE UNITS THIS RUN MEASURES. A merge check measures the units in
      # `.verification/scope/units`; building the Python and Node matrices for a change that
      # affects no SDK unit measured nothing and cost 8-46 minutes per run (September 2026).
      # A complete run (schedule, dispatch) passes no units file and prepares every SDK.
      - name: Prepare the non-Rust SDK batteries
        if: steps.scope.outputs.measure == 'true'
        env:
          UNITS_ARGS: ${{ steps.scope.outputs.args }}
        run: |
          set -euo pipefail
          measures() {
            if [ -z "$UNITS_ARGS" ]; then
              grep -q "^id = \"$1\." verification/policy/verification.toml
            else
              grep -q "^$1\." .verification/scope/units
            fi
          }
          if ! measures sdk_python && ! measures sdk_typescript; then
            echo "No SDK unit is measured in this run; nothing to prepare."
          fi
          if measures sdk_python; then
            # ONE ENVIRONMENT PER PINNED INTERPRETER, and the script owns which ones: the
            # supported CPython minors are `[python].interpreters` in the toolchain lock,
            # and the lane refuses an environment whose interpreter is not exactly one of
            # them. The previous form — `uv sync --extra dev && uv run maturin develop` —
            # prepared ONE environment on whatever CPython the runner happened to offer,
            # and the battery's green was then read as evidence for the whole supported
            # range (#746, packet 6B §9).
            ./scripts/prepare_python_matrix.sh
          fi
          if measures sdk_typescript; then
            # ONE RUNTIME PER PINNED NODE, for the reason the Python side has one per
            # interpreter: `npx vitest` ran under whatever node the runner offered, and the
            # package declared no `engines` at all — so the battery's green described an
            # unnamed runtime and an unstated support claim (#747).
            ./scripts/prepare_node_matrix.sh
          fi

      # A FRESH DIRECTORY PER INVOCATION, created before any lane runs, and named to every
      # step below. Composition is only sound if every record it reads was written by THIS
      # run: a global store would let a run go green on a record an earlier one left
      # behind. `actions/checkout` cleans ignored files, so this starts empty — and it is
      # created explicitly anyway, because "it happened to be empty" is not a control.
      - name: A fresh evidence directory for this run
        if: steps.scope.outputs.measure == 'true'
        id: evidence
        run: |
          set -euo pipefail
          # Both forms, because two environments must name ONE directory: the host uses
          # the absolute path, and the container sees the same bytes under /workspace.
          # Derived from a single relative name rather than by trimming the host path —
          # a substitution that has to guess where the workspace root is would silently
          # point the container at a different directory, and a composer reading an empty
          # one reports INCOMPLETE without ever saying why.
          rel=".verification/run-${{ github.run_id }}-${{ github.run_attempt }}"
          rm -rf "$PWD/$rel"
          mkdir -p "$PWD/$rel"
          echo "dir=$PWD/$rel" >> "$GITHUB_OUTPUT"
          echo "rel=$rel" >> "$GITHUB_OUTPUT"
          echo "MCP_RE_EVIDENCE_DIR=$PWD/$rel" >> "$GITHUB_ENV"
          echo "evidence directory: $PWD/$rel"

      # The two ADR-MCPRE-068 Phase 0B lanes' own false-green catalogues, ahead of the
      # lanes themselves: they are python-and-one-tiny-crate and fail in seconds, and they
      # are what establishes that the runners can go RED. The structural suite compiles a
      # hostile construction that BUILDS and requires FAIL; the measured suite runs a dead,
      # a silent and an irreproducible apparatus. A lane that cannot fail measures nothing,
      # and neither registry is large enough yet for the lane run itself to prove it can.
      - name: Structural and measured lane self-tests
        if: steps.scope.outputs.measure == 'true'
        run: |
          python3 tools/verification/test_structural_lane.py
          python3 tools/verification/test_measured_lane.py

      # PHASE 1 — the lanes this host can execute. It states no repository verdict: it
      # cannot run the extracted-model lanes, so any aggregate here would be a claim about
      # measurements this process did not make.
      - name: Execute the host lanes
        if: steps.scope.outputs.measure == 'true'
        run: ./tools/verification/verify --phase host ${{ steps.scope.outputs.args }}

      # -----------------------------------------------------------------------
      # PHASE 2 — the extracted-model lanes, inside the preserved artifact.
      #
      # Charon is a rustc driver linking the private compiler crates and does not build on
      # macOS, so these lanes run in the pinned container and nowhere else. They write
      # their records into the SAME fresh evidence directory phase 1 wrote into: the
      # workspace is bind-mounted, so `MCP_RE_EVIDENCE_DIR` names one directory that both
      # environments can reach, and the composer at the end reads exactly that one.
      # -----------------------------------------------------------------------
      - name: Resolve the pinned extraction identity
        if: steps.scope.outputs.measure == 'true'
        id: image
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          d = tomllib.load(open("verification/policy/toolchains.lock.toml", "rb"))
          c = d.get("extraction_container", {})
          # The ARTIFACT digest and the ARCHIVE digest: the image is not reproducible from
          # its declared inputs, so the preserved bytes are what the pin identifies, and a
          # digest is identity rather than preservation. Ruling:
          # verification/reviews/rulings/extraction-artifact-storage-2026-09-09.md
          resolved = (
              c.get("state") == "resolved"
              and c.get("artifact_digest")
              and c.get("archive_digest")
          )
          print(f"resolved={'true' if resolved else 'false'}")

          # The pin says the pipeline COULD run; the manifest says whether any unit asks it
          # for evidence. Running it on a pin alone would make the lane permanently red,
          # and a red nobody reads is a lane that reports nothing.
          v = tomllib.load(open("verification/policy/verification.toml", "rb"))
          units = [u for u in v.get("unit", []) if u.get("class") in ("V2", "V3")]
          print(f"required={'true' if units else 'false'}")
          PY

      - name: Container runtime availability
        if: steps.image.outputs.resolved == 'true' && steps.image.outputs.required == 'true' && steps.scope.outputs.measure == 'true'
        run: |
          set -euo pipefail
          # An unavailable runtime is a lane that CANNOT run. On the authoritative runner
          # that is a failure, never a SKIP — silence must not read as evidence. macOS
          # cannot run Linux containers natively, so this is a real host prerequisite.
          #
          # The probe names the endpoint it is asserting about (job-level DOCKER_CONTEXT),
          # so what this step reports reachable is the same daemon every step below runs on.
          echo "asserting the declared endpoint: DOCKER_CONTEXT=${DOCKER_CONTEXT}"
          docker context inspect "${DOCKER_CONTEXT}" --format 'endpoint {{.Endpoints.docker.Host}}'
          docker info --format 'server {{.ServerVersion}} {{.OSType}}/{{.Architecture}}'

      # The environment is LOADED FROM THE PRESERVED ARTIFACT, not taken from Docker's
      # cache. `load` checks that the archive under /opt/verification exists and digests to
      # the pinned value, loads it if the image is not already present, and prints the
      # IMAGE ID — which is what every step below runs. A tag would resolve through the
      # local cache, and the cache is exactly the thing that is not the evidence store.
      #
      # A missing artifact refuses and never rebuilds: a rebuild of this definition is a
      # different instrument under the same declared pins.
      - name: Load the preserved extraction artifact
        id: artifact
        if: steps.image.outputs.resolved == 'true' && steps.image.outputs.required == 'true' && steps.scope.outputs.measure == 'true'
        run: |
          set -euo pipefail
          image="$(./tools/verification/extraction-image load)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "executing $image"

      # Lean builds are memory-hungry: CivilFromDays was OOM-killed (exit 137,
      # "Lean exited with code 137") partway through [1699/1700], which failed the
      # extraction lane and made the verdict INCOMPLETE.
      #
      # The limit below is NOT what fixed it. The Docker VM these runners use --
      # colima's `default` profile -- was on colima's stock 2 CPU / 2 GiB, so `-m 8g`
      # could not have been satisfied at all: the VM had less memory than the flag
      # asks for. It has been resized to 6 CPU / 12 GiB on the host (48 GB physical;
      # ~32 GiB of ceilings now across four profiles, all allocated lazily, so the
      # ceiling is not a reservation). That resize is HOST state and is not in this
      # repository -- see the runner provisioning issue.
      #
      # The flag is still worth having: it bounds a runaway build to a predictable
      # kill instead of letting it exhaust the VM and take the other lanes with it.
      # --oom-kill-disable is deliberately NOT used: a container that cannot be
      # OOM-killed hangs the VM rather than failing the step, trading a legible
      # failure for an illegible one.
      - name: Regenerate the extracted model
        if: steps.image.outputs.resolved == 'true' && steps.image.outputs.required == 'true' && steps.scope.outputs.measure == 'true'
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            -m 8g --memory-swap 10g \
            -v "$PWD:/workspace" -w /workspace \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace \
            -e MCP_RE_EVIDENCE_DIR='/workspace/${{ steps.evidence.outputs.rel }}' \
            '${{ steps.artifact.outputs.image }}' \
            ./tools/verification/regenerate-lean

      # BEFORE the lane reports, and in the same container the lane will run in. Every
      # refusal is conditional on `#print axioms` reporting what the lane expects it to
      # report — so a Lean release that changed the message, a lakefile that stopped
      # building the theorems, or a parser that silently matched nothing would each turn
      # every check into a tautology, and all three look exactly like a clean axiom closure.
      - name: Lean lane activation probe
        if: steps.image.outputs.resolved == 'true' && steps.image.outputs.required == 'true' && steps.scope.outputs.measure == 'true'
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            -m 8g --memory-swap 10g \
            -v "$PWD:/workspace" -w /workspace \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace \
            '${{ steps.artifact.outputs.image }}' \
            ./tools/verification/verify-lean --activation-probe

      - name: Execute the extraction lanes
        if: steps.image.outputs.resolved == 'true' && steps.image.outputs.required == 'true' && steps.scope.outputs.measure == 'true'
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            -m 8g --memory-swap 10g \
            -v "$PWD:/workspace" -w /workspace \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace \
            -e MCP_RE_EVIDENCE_DIR='/workspace/${{ steps.evidence.outputs.rel }}' \
            '${{ steps.artifact.outputs.image }}' \
            ./tools/verification/verify --phase extraction ${{ steps.scope.outputs.args }}

      - name: Extraction lanes unpinned
        if: steps.image.outputs.resolved != 'true' && steps.scope.outputs.measure == 'true'
        run: |
          echo "extraction_container is unresolved in toolchains.lock.toml."
          echo "The Lean lane cannot produce evidence until an artifact identity and its"
          echo "preserved archive are recorded. This is the mechanism, not an unfinished"
          echo "step (ADR-MCPRE-059 §2, §19). The composer below will report the absence"
          echo "as a missing record, which is what INCOMPLETE means."

      # -----------------------------------------------------------------------
      # THE COMPOSER — the one place a repository verdict is stated.
      #
      # It executes the hygiene lanes and no formal one, and derives its requirement set
      # from the MANIFEST rather than from what ran: a lane that silently did not execute
      # leaves no record, and a missing record is INCOMPLETE. Every record must name this
      # unit, this lane, this fingerprint — and, for the extracted-model lanes, the
      # artifact the lock pins.
      # -----------------------------------------------------------------------
      #
      # RUNS EVEN AFTER A PHASE FAILED, and that is the point. A failing step skips the rest
      # of the job by default, so a run whose extraction phase could not start produced NO
      # repository verdict at all — measured on dev1, where the preserved artifact is
      # absent: the job went red with `Compose the repository verdict: skipped`, and the one
      # thing that would have said WHICH evidence was missing never ran.
      #
      # A phase failure is exactly the case the composer exists to describe. It reports
      # INCOMPLETE and names every required lane/unit with no acceptable record, which is a
      # diagnostic; the job stays red either way. `!cancelled()` rather than `always()`: a
      # cancelled run measured nothing and has nothing to compose.
      - name: Compose the repository verdict
        if: ${{ !cancelled() && steps.scope.outputs.measure == 'true' }}
        run: ./tools/verification/verify --aggregate --gate ${{ steps.scope.outputs.args }}

      # The records this verdict was composed from, kept whatever the verdict was. A
      # failing run's evidence is the thing a reader needs most, and it lives in a
      # directory the next run will not reuse.
      - name: The records the verdict was composed from
        if: always() && steps.scope.outputs.measure == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.dir }}
          if-no-files-found: warn
          retention-days: 14
