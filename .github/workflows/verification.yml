# SPDX-License-Identifier: Apache-2.0
#
# ADR-MCPRE-059 verification platform — AUTHORITATIVE.
#
# This workflow GATES. The host job runs `./tools/verification/verify --gate`, so a lane
# that fails, or that could not run and says so, fails the build.
#
# This header read "REPORT-ONLY ... It does not gate merges and must not, until the
# platform has been measured and the pilots exist" long after the pilots landed and the
# step was changed to `--gate`. The posture it described was right for Phase 1 — a gate
# that blocks before it is calibrated teaches people to bypass it — and wrong about the
# tree for as long as it stood. Corrected in the v0.17 Slice B sweep, and recorded rather
# than silently replaced: a workflow whose prose understates what it enforces costs a
# reader the same trust as one that overstates it.
#
# Host split (§19). The two lanes do not run in the same place:
#
#   * Verus runs natively on the macOS host. Its release archive is self-contained
#     (own Z3) and its rustc requirement matches the repository's pinned channel.
#   * Charon/Aeneas/Lean run only inside the pinned Linux container. Charon is a rustc
#     driver, and on aarch64-apple-darwin the rustc-dev component ships the compiler
#     crates as .rmeta with no .rlib, so it cannot link there.
#
# The runner is a self-hosted Mac mini. GitHub's job-level `container:` key is supported
# ONLY on Linux runners, so the extraction steps invoke the image explicitly with
# `docker run` rather than declaring a job container. That also keeps the local and CI
# invocations textually identical.

name: verification

# The declared unit sources are part of the trigger set. A unit's evidence is a claim
# about production Rust, so a change to `mcp-re-core/src/`, `mcp-re-http-profile/src/` or
# `runtime_state.rs` is exactly the change `check-assumptions` exists to catch — a lane
# scoped only to `verification/**` would never see a deleted theorem or a new
# `external_body` in the code the theorem is about.
on:
  pull_request:
    paths:
      - "verification/**"
      - "tools/verification/**"
      - ".github/workflows/verification.yml"
      - "mcp-re-core/src/**"
      - "mcp-re-http-profile/src/**"
      # Encoding v4 digests the INTEGRATION-TEST SOURCES a unit's selectors run, not only
      # their names: a control can keep its declared name and lose its body, and the
      # fingerprint has to see that. `scripts/verification_trigger_gate.py` derives this
      # requirement from the manifest, so a new selected target fails the build until the
      # filter covers it.
      - "mcp-re-http-profile/tests/**"
      - "mcp-re-proxy/src/runtime_state.rs"
      # Issue #744: the two store-materialization owners, sibling authorities that had
      # no unit between them.
      - "mcp-re-proxy/src/replay_plane/**"
      # The async replay retention account (THM-0105); `l1_fast_reject.rs` is dormant and
      # excluded from the unit, but the glob covers the directory so a fingerprint input
      # cannot land outside every trigger.
      - "mcp-re-proxy/src/async_replay/**"
      # The deployable replay backends (THM-0106 / THM-0107). Feature-gated, so a plain
      # cargo lane compiles them to zero tests — which is exactly why a change to one must
      # still re-trigger the units that carry them.
      - "mcp-re-proxy/src/redis_store.rs"
      - "mcp-re-proxy/src/async_redis_store.rs"
      - "mcp-re-proxy/src/etcd_store.rs"
      - "mcp-re-proxy/src/async_etcd_store.rs"
      # The provider-agnostic Ed25519 KMS seam (THM-0108). The provider adapters beneath it
      # are unowned and are their own slice.
      - "mcp-re-proxy/src/kms_keysource/**"
      # The client mTLS transport (THM-0109 / THM-0110). Whole crate, sources and the two
      # integration batteries alike: `mtls_client_test.rs` and `dos_hardening_test.rs` ARE
      # the evidence for both units, so a change to either must re-trigger them.
      - "mcp-re-transport/src/**"
      - "mcp-re-transport/tests/**"
      - "mcp-re-transport/Cargo.toml"
      # The v0.17 policy-authority slice (THM-0111). Three units:
      #   - the frozen ADR-MCPS-013 taxonomy, the sole owner of the authorization mapping;
      #   - the client seam's binding-spec refusal and its Core projection;
      #   - the workspace walk that MEASURES how many files decide what a verdict says.
      # The walk reads every crate's source tree, so its own inputs are already covered by
      # the broad filters above; what is enumerated here is the units' declared paths.
      - "mcp-re-policy/src/**"
      - "mcp-re-policy/Cargo.toml"
      - "mcp-re-client-core/src/binding_spec/**"
      - "mcp-re-client-core/src/core_projection.rs"
      - "mcp-re-conformance/tests/audit_vocabulary_guard_test.rs"
      - "mcp-re-conformance/tests/audit_vocabulary_guard_test/**"
      # The scanner the walk rests on. A change to what counts as a brace changes what the
      # control reads, so it is a fingerprint input and must re-trigger the lane.
      - "mcp-re-test-paths/src/**"
      - "mcp-re-test-paths/Cargo.toml"
      # The v0.17 measured-remainder slice.
      #   - THM-0114: the deployable client's two freshness inputs, and the audit #81
      #     boundary that keeps their deterministic fixtures off a production build. The
      #     MANIFEST is a fingerprint input because `default = ["test-fixtures"]` would
      #     satisfy every `#[cfg]` in the crate with no source line changing.
      - "mcp-re-host/src/**"
      - "mcp-re-host/Cargo.toml"
      #   - THM-0115: the remote-signer failure value and the quota rule that reads it.
      #     Compiled under `any(aws_kms_keysource, gcp_kms_keysource)`, so neither of its two
      #     units runs in the default lane and a change here must still re-trigger both.
      - "mcp-re-proxy/src/remote_signer_call/**"
      - "mcp-re-proxy/src/continuation_store/**"
      - "mcp-re-proxy/src/redis_continuation_store.rs"
      # Issue #744, D1b′: the continuation MATERIALIZATION owners — which capability the
      # runtime installs for the plan it was given, and the composition root's half of it.
      # `startup_posture` is here because the declaration conjunct is part of that claim.
      - "mcp-re-proxy/src/serving_capabilities/**"
      - "mcp-re-proxy/src/config_state/continuation_control.rs"
      - "mcp-re-proxy/src/startup_posture.rs"
      - "mcp-re-proxy/src/startup_posture/**"
      # Issue #742: the two outbound authorities. Registered as units because R9's only
      # Critical was a credential-bearing egress reaching an authority the configuration
      # did not select, and both modules were fixed while neither was declared — a fix
      # that maps to no unit is covered by nothing.
      - "mcp-re-proxy/src/outbound_fetch/**"
      - "mcp-re-proxy/src/kms_endpoint_policy/**"
      # The ratified theorem-architecture closure, Stage 1: three authorities that already
      # existed and were simply unmeasured. Enumerated rather than given a subtree pattern
      # because none of them IS a subtree — `exchange_state.rs` and `request_stages.rs` are
      # single files, and the other two units take one file each out of directories whose
      # remaining members belong to other owners.
      - "mcp-re-proxy/src/exchange_state.rs"
      - "mcp-re-proxy/src/request_stages.rs"
      # v0.17 trust-plane ownership slice: the runtime trust plane, `proxy.trust_plane_runtime`.
      # The subtree pattern also matches `window_policy.rs`, which the unit excludes; a
      # filter that over-triggers is the safe direction, one that under-triggers is the
      # defect this gate exists for.
      - "mcp-re-proxy/src/trust_plane/**"
      - "mcp-re-proxy/src/trust_epoch.rs"
      - "mcp-re-proxy/src/reloading_trust.rs"
      # v0.17: the trust-document parser, `proxy.trust_document_interpretation`.
      - "mcp-re-proxy/src/trust_document.rs"
      # #741 put the inner-plane seam inside the dispatch-commitment closure: the capability
      # the ready state carries is produced there, so a change to it dirties the unit and
      # this lane must re-measure it.
      - "mcp-re-proxy/src/async_inner.rs"
      - "mcp-re-proxy/src/authorization/dispatch.rs"
      - "mcp-re-proxy/src/http_profile_serve/dispatch_commitment.rs"
      - "mcp-re-proxy/src/refusal/**"
      - "mcp-re-proxy/src/config_state/cross_machine.rs"
      # Stage 3 gave the posture authority its own unit: the one operation that produces an
      # AuthorizationPosture, and the two facts it keeps apart.
      - "mcp-re-proxy/src/authorization/decide.rs"
      - "mcp-re-proxy/src/authorization/posture.rs"
      # Stage 4 gave the client crate its four semantic owners. A subtree pattern: the four
      # units between them name most of the crate, and a filter enumerating today's members
      # would go stale the next time one is added — silently, because a filter that matches
      # nothing reports nothing.
      - "mcp-re-client-core/src/**"
      # The manifest too: the fingerprint reads it, and a dependency change that moves a
      # unit's measurement must reach the lane that re-measures it.
      - "mcp-re-client-core/Cargo.toml"
      # The shipped client PROXY: THM-0084 is the joint between the request it sends and
      # the expectation it verifies against, and it lives here rather than in client-core.
      - "mcp-re-client-proxy/src/**"
      - "mcp-re-client-proxy/Cargo.toml"
      # #743: the sidecar BINARY crate's inner face — where the listener is exposed, which
      # HTTP authority names reach signing, and the head guards that run before a byte is
      # signed. A subtree pattern for the same reason as client-core's.
      - "mcp-re-client/src/**"
      # THM-0120 / THM-0123: the deployable's e2e battery is the witness that the anchor
      # refresh and the local pipeline hold for the LISTENER, not only for the modules.
      - "mcp-re-client/tests/**"
      # v0.17 priority 5, the provider adapters beneath the KMS seam (THM-0116, THM-0117)
      # and the token custody THM-0116 covers. Each exists only under its own non-default
      # feature, so none of their units runs in the default lane and a change here must
      # still re-trigger every one of them.
      - "mcp-re-proxy/src/aws_kms_keysource.rs"
      - "mcp-re-proxy/src/aws_sigv4.rs"
      - "mcp-re-proxy/src/aws_sts.rs"
      - "mcp-re-proxy/src/gcp_kms_keysource.rs"
      - "mcp-re-proxy/src/pkcs11_keysource/**"
      - "mcp-re-client/Cargo.toml"
      # #740: the retained-evidence corpus this implementation produced. The ARTIFACTS are in
      # the fingerprint, not just the test that reads them — a frozen vector whose bytes can
      # change without the lane re-running is a vector that proves whatever it currently is.
      - "mcp-re-conformance/Cargo.toml"
      - "mcp-re-conformance/tests/scitt_retained_corpus_test.rs"
      - "mcp-re-conformance/tests/scitt_retained_corpus_test/**"
      - "mcp-re-conformance/tests/vectors/scitt/retained/**"
      # #746: the two SDK exchange paths. Their SOURCE, their tests, and the manifests and
      # lockfiles that decide what their dependencies are — the same closure a crate gets,
      # because the fingerprint measures all three for a non-Rust unit too (#745).
      - "sdk/python/python/**"
      - "sdk/python/tests/**"
      - "sdk/python/pyproject.toml"
      # TRACKED, and therefore in the fingerprint at last: the lock was `.gitignore`d as a
      # maturin by-product, so the Python dependency resolution contributed nothing to any
      # unit while `project_inputs` claimed it did. The matrix environments are built from
      # it, so a re-resolution changes what the batteries ran under (#746).
      - "sdk/python/uv.lock"
      # The matrix preparation and the support-claim gates decide WHICH runtimes the SDK
      # evidence covers, so a change to any of them changes what this lane measures
      # (#746 for Python, #747 for Node).
      - "scripts/prepare_python_matrix.sh"
      - "scripts/python_runtime_gate.py"
      - "scripts/prepare_node_matrix.sh"
      - "scripts/node_runtime_gate.py"
      - "sdk/typescript/src/**"
      - "sdk/typescript/test/**"
      - "sdk/typescript/package.json"
      - "sdk/typescript/package-lock.json"
      - "sdk/typescript/tsconfig.json"
      # Stage 5 gave the response-emission cluster its four owners.
      - "mcp-re-proxy/src/delegated_server_signer/**"
      - "mcp-re-proxy/src/delegated_response_signer.rs"
      - "mcp-re-proxy/src/config_state/custody.rs"
      # The serving subtree, read whole: three units now take files out of it — the
      # dispatch commitment, the response-signing authority, and the verification stage the
      # product-provenance gate measures — and a filter enumerating today's members would go
      # stale the next time a region moves.
      - "mcp-re-proxy/src/http_profile_serve/**"
      # #744 D2a: the replay-admission gate and the verdict projection beneath it.
      - "mcp-re-proxy/src/http_profile_dispatch.rs"
      - "mcp-re-proxy/src/http_profile_dispatch/**"
      - "mcp-re-proxy/src/async_serve/**"
      - "mcp-re-proxy/src/blocking_mtls_harness/**"
      - "mcp-re-proxy/src/capability_materialization/key_source/**"
      - "mcp-re-proxy/src/signing_plane/**"
      # #741 registered the durability owner: WHEN the deployment became answerable, in two
      # durable stages. A subtree, because the split into products is what the unit is about
      # and a filter enumerating today's members would go stale at the next one.
      - "mcp-re-proxy/src/transparency/**"
      # Stage 6: the transparency-service pin, whose provenance THM-0068 states.
      - "mcp-re-http-profile/src/scitt/**"
      # Stage 7: what a record may say, and whether the stream is honest about what reached it.
      - "mcp-re-proxy/src/audit_record.rs"
      - "mcp-re-proxy/src/audit_sink/**"
      - "mcp-re-proxy/src/authorization/audit.rs"
      - "mcp-re-proxy/src/authorization/audit/**"
      # Stage 8: the replay five-tuple, found by the missing-edge pass.
      - "mcp-re-http-profile/src/replay.rs"
      # MCPRE-137: the listener-lifetime TLS security state, its subordinates, and the
      # production wiring that gives a listener a lifetime at all.
      - "mcp-re-proxy/src/tls_listener_state/**"
      - "mcp-re-proxy/src/tls.rs"
      # MCPRE-175 split this into an owner subtree (`client_revocation_posture.rs`,
      # `crl_reload_worker.rs`). A SUBTREE pattern rather than today's children: the
      # authority is the plane, and a filter enumerating its current members would go
      # stale the next time one is added — silently, because a filter that matches
      # nothing fails nothing.
      - "mcp-re-proxy/src/tls_plane/**"
      - "mcp-re-proxy/src/delegated_tls.rs"
      # ADR-MCPRE-063 Slice 3: the correspondence gate on delegated resolver construction.
      - "mcp-re-proxy/src/delegated_tls/**"
      # THM-0013 reads the boundary's OCSP clauses, so the lane must re-measure when
      # they move: the theorem is that no validated deployment enables online OCSP.
      - "mcp-re-proxy/src/config_state/validation/residue.rs"
      # THM-0013 is a claim about the legality BOUNDARY, so the clause list that carries
      # the refusal is inside `proxy.online_ocsp_reachability`'s closure too.
      - "mcp-re-proxy/src/config_state/validation/mod.rs"
      # ADR-MCPRE-063 Slice 1: the certificate identity authority and the peer-identity
      # value invariant it constructs. The whole module tree, not the interpreter alone —
      # the selector's claim rests on the representation seam preserving presented order
      # and on the adapter producing that representation, so a change to either dirties
      # the units.
      - "mcp-re-proxy/src/communication_assurance/**"
      # The merged plain-library integration binary carries this unit's DER-level
      # controls, and encoding v4 digests those sources, not only their names. The
      # `test_source_patterns` emits BOTH layouts a cargo test target can have, so
      # `tests/integration.rs` is a fingerprint input even though this suite is a
      # directory today: collapsing it back to one file must still re-run the lane. It is
      # therefore a live filter, not a stale one, and the liveness half of
      # `scripts/verification_trigger_gate.py` exempts exactly that case.
      - "mcp-re-proxy/tests/integration/**"
      - "mcp-re-proxy/tests/integration.rs"
      # v0.17: the bounded-drain battery, `proxy.serving_drain`. Its own binary, because it
      # runs under RUST_TEST_THREADS=1 in the Bazel lane — a property of a binary.
      - "mcp-re-proxy/tests/async_drain_test.rs"
      - "mcp-re-proxy/tests/async_drain_test/**"
      # MCPRE-146/148: the three trust units declared with the four theorems — the
      # revocation posture and trust-document state, the plan projected from them, and
      # the composition root that consumes those projections without re-reading trust.
      - "mcp-re-proxy/src/config_state/trust_revocation.rs"
      - "mcp-re-proxy/src/config_state/trust_document.rs"
      # v0.17 / #581 row 2: the connection credential window, `proxy.client_credential_window`.
      - "mcp-re-proxy/src/config_state/client_credential_window.rs"
      - "mcp-re-proxy/src/config_state/credential_currency_bound.rs"
      # ADR-MCPRE-067 Phase 5 moved the online-revocation SELECTION out of a flat
      # `DeploymentRequest` field, so `proxy.online_ocsp_reachability`'s closure now names
      # the file holding `is_required()` — the predicate THM-0013's refusal reads.
      - "mcp-re-proxy/src/deployment_request/revocation/**"
      - "mcp-re-proxy/src/trust_plan.rs"
      - "mcp-re-proxy/src/app.rs"
      # ADR-MCPRE-065 Slice 2 (THM-0040): the PDP-decision relation authority, and the
      # three semantic products it compares against — the authorization request and the
      # verified actor and action it is composed from. All four participate in the
      # fingerprint, so all four must re-run the lane.
      - "mcp-re-proxy/src/authorization/pdp/**"
      - "mcp-re-proxy/src/authorization/request.rs"
      - "mcp-re-proxy/src/authorization/verified_actor.rs"
      - "mcp-re-proxy/src/authorization/verified_action.rs"
      # THM-0040 is measured through the serving path, so its battery lives in the async
      # integration target. Same shape as the `integration` pair above.
      - "mcp-re-proxy/tests/integration_async/**"
      - "mcp-re-proxy/tests/integration_async.rs"
      # The build inputs every ReviewFingerprint reads. A dependency bump moves
      # Cargo.lock, which dirties every declared unit — so a lane that did not
      # re-run on it would leave `main` carrying attestations over a dependency
      # graph nothing measured. `scripts/verification_trigger_gate.py` fails the
      # build if this set ever narrows below the fingerprint's again.
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "mcp-re-core/Cargo.toml"
      - "mcp-re-http-profile/Cargo.toml"
      - "mcp-re-proxy/Cargo.toml"
  push:
    branches: [main]
    paths:
      - "verification/**"
      - "tools/verification/**"
