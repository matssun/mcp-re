# SPDX-License-Identifier: Apache-2.0
#
# MCP-RE continuous integration. The Rust toolchain is pinned by the committed
# rust-toolchain.toml (1.97.1, matching the Bazel build), so rustup installs and
# selects it automatically on the first cargo invocation — CI and local dev share
# one toolchain.
#
# Gating policy:
#   - BLOCKING: `cargo build` + `cargo test` over the whole workspace (this
#     includes the mcp-re-conformance suite + the conformance drift guard, which
#     resolve their fixtures via the cargo runfiles fallback in mcp-re-test-paths).
#   - BLOCKING: `cargo test` over mcp-re-proxy with the four NON-DEFAULT feature
#     gates enabled (dev_env_key_source, pkcs11_keysource, redis_replay,
#     online_ocsp). The default `cargo test --workspace` does NOT compile these
#     modules, so without this job the v0.3 hardening that lives behind them
#     (the Redis WAIT-quorum fake-connection harness, the PKCS#11 sign-loop
#     proof, the OCSP AIA-SSRF inet_aton parser, the env-key-source no-mutation
#     contract) would have zero cargo-CI coverage. The PKCS#11 sign+verify e2e
#     runs against a hermetic in-tree mock provider, so it needs no external
#     token. The remaining live-infra e2e tests (real Redis / OCSP responder)
#     self-skip cleanly when their MCP_RE_TEST_* env vars are unset; they hard-fail
#     only when MCP_RE_REQUIRE_LIVE_INFRA is set, which this job leaves unset.
#   - ADVISORY (continue-on-error): `cargo fmt --check` and `cargo clippy`. The
#     repository was not developed under `cargo fmt`/`clippy -D warnings`, so these
#     surface drift without blocking. Promote them to blocking once a one-time
#     repo-wide format + lint cleanup lands (and bump rust-toolchain.toml together).
#   - BLOCKING (ADR-MCPS-048 / MCPS-70): the `bazel` job gates the OTHER build
#     system. Bazel was ungated, which is exactly how #220 (Bazel/cargo drift)
#     happened. Two steps: (1) the semantic-drift gate — gazelle_rust as a drift
#     DETECTOR (not a byte-authority): fails if the Cargo graph has a target/edge
#     the committed BUILD omits, modulo the script's allowlist; (2) `bazel test
#     //...` parity with the cargo suite.
#   - BLOCKING (ADR-MCPS-048 / MCPS-71): the `sdk-python` and `sdk-typescript`
#     jobs make "downloaders skip Bazel" a VERIFIED path, not a rotting side
#     artifact. Each builds the ecosystem-native artifact (maturin wheel / napi
#     package) from the SAME source, installs it into a clean environment
#     (fresh venv / empty npm project — wheel/tarball only, no editable, no
#     workspace on sys.path), and runs the SDK test suite. Neither job installs
#     or invokes Bazel; the e2e suites that need the built Rust binaries
#     self-skip cleanly (their guards check for the target/{debug,release}
#     binaries + cargo), so the clean-env lane exercises the unit surface. The
#     cargo jobs above are the third downloader path (pure `cargo`, no Bazel).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo:
    name: cargo build + test (1.97.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # JCS vocabulary firewall (D1 of the active-profile/legacy-quarantine note):
      # forward-design docs must not frame a live "object profile + HTTP profile"
      # world. Fast, python-only — fails before the slow build.
      - name: JCS vocabulary firewall (deprecated-profile framing gate)
        run: |
          python3 scripts/jcs_vocabulary_gate.py --selftest
          python3 scripts/jcs_vocabulary_gate.py

      # Port-registry staleness gate: config/ports.toml is the single source of
      # truth for every port this repo binds (reserved band 8600-8699). The Helm
      # bindPort mirror must equal it and no registered port may fall outside the
      # band. Fast, python-only — fails before the slow build.
      - name: Port-registry gate (single-source ports, no drift)
        run: python3 scripts/check_port_registry.py

      # SEP-2322 discriminator gate: the conformance suite pins the discriminator's
      # VALUE, but that only protects readers that classify through the shared
      # helper. The literal had been open-coded in five places, three of which read a
      # malformed non-terminal reply as terminal — so a rename would have failed the
      # value guard while leaving those readers silently wrong. This asserts the
      # literal appears in exactly one shipped source file, which is the only way to
      # catch a sixth copy: a type system cannot notice a string nobody imported. It
      # is a script rather than a test because `sdk/` is not Bazel-addressable.
      # Fast, python-only.
      - name: Discriminator gate (one classifier, no open-coded copies)
        run: python3 scripts/discriminator_gate.py

      # Tracked-file leak guard: key material, credential documents, and personal
      # or concrete service-account identifiers must never land in a tracked file
      # (a commit is public history even after a later commit deletes it). The
      # selftest runs first — a detector that silently matches nothing looks
      # exactly like a clean tree. Fast, python-only.
      - name: Tracked-secrets gate (no committed credentials or personal identifiers)
        run: |
          python3 scripts/tracked_secrets_gate.py --selftest
          python3 scripts/tracked_secrets_gate.py

      # Deploy image-tag gate: Cloud Build pushes the image tags, and the k8s
      # manifests, chart and live-validation harnesses reference them. Nothing tied
      # those together, so they drifted a whole release apart — the multi-replica
      # harness deployed `:0.12.1` while Cloud Build published `:0.13.0`. Every pin
      # reads correctly in isolation; the mismatch only shows up as ImagePullBackOff
      # on a cluster that is already billing. Selftest first: a scanner that matches
      # nothing is indistinguishable from a clean tree. Fast, python-only.
      - name: Deploy image-tag gate (every deployed tag == VERSION)
        run: |
          python3 scripts/deploy_image_tag_gate.py --selftest
          python3 scripts/deploy_image_tag_gate.py

      # SLO-harness invocation gate: `tls_load_harness_bench` is NOT an #[ignore]
      # test (the file is gated to the redis_replay feature lane), so a documented
      # `-- --ignored` selects ZERO tests, exits 0 and writes no report — a lane that
      # looks green while measuring nothing. That form had propagated into four
      # places, the bench image's own ENTRYPOINT among them. This keeps every
      # runnable invocation honest. Fast, python-only.
      - name: SLO-harness invocation gate (no command that measures nothing)
        run: |
          python3 scripts/slo_invocation_gate.py --selftest
          python3 scripts/slo_invocation_gate.py

      # Bazel srcs gate: mcp-re-proxy hand-lists its library sources (three feature
      # flavors share one list) while every other crate globs. A hand-list drifts —
      # `src/audit_sink.rs` shipped with the ADR-MCPS-035 audit surface and was never
      # added, so cargo built a module Bazel could not find (E0583) and every Bazel
      # target downstream of the proxy failed. Only a full `bazel test //...` caught
      # it, 30+ minutes in. This is the same check in one second. Fast, python-only.
      - name: Bazel srcs gate (hand-listed srcs matches lib.rs)
        run: |
          python3 scripts/bazel_srcs_gate.py --selftest
          python3 scripts/bazel_srcs_gate.py

      # Helm chart render gate: every fail-closed guard in the chart
      # (`templates/_helpers.tpl`) is a render-time `fail`, and several of them key
      # on values Helm treats as FALSY — so an inverted condition does not error, it
      # omits a flag, and an omitted flag is the permissive default. This renders
      # the chart under a matrix and asserts which value sets MUST be refused, that
      # each refusal names the value at fault, and that the rendered argv omits the
      # flags it must omit (no --signing-key-seed under KMS custody, no
      # --max-in-flight when unset). Fast, python + helm.
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Helm chart render gate (fail-closed guards must refuse)
        run: python3 scripts/helm_render_gate.py

      # cryptoki-sys (declared non-optional for Bazel target exposure) builds its
      # FFI bindings with libclang; install it defensively so the cargo closure
      # links on a clean runner.
      - name: System build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev

      - name: Select pinned toolchain (from rust-toolchain.toml)
        run: rustup show && rustc --version && cargo --version

      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      - name: Test (workspace, incl. conformance suite + drift guard)
        run: cargo test --workspace

      # MCPRE-427 (#415 rev 2 §12.2). The hash/digest checks themselves run inside
      # `cargo test --workspace` above (corpus_pinning_test + the frozen runners,
      # which fail closed before running a vector whose bytes drifted). This step
      # PUBLISHES the resulting digests into the job summary so a release packet —
      # and any reviewer — can quote the exact corpus that was tested, rather than
      # a tag, which §12.2 says is insufficient to prove two parties read the same
      # bytes.
      - name: Publish conformance corpus digests
        run: |
          {
            echo "## Conformance corpus digests (§12.2)"
            echo
            echo '| Corpus | manifest SHA-256 | corpus digest |'
            echo '|---|---|---|'
            for c in http-profile delegation-profile; do
              m="mcp-re-conformance/tests/vectors/$c/manifest.json"
              manifest_sha="$(shasum -a 256 "$m" | cut -d' ' -f1)"
              corpus_dig="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['corpus_digest'])" "$m")"
              echo "| \`$c\` | \`$manifest_sha\` | \`$corpus_dig\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Format check (advisory)
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy (advisory)
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

  rfc9421-cross-verify:
    name: RFC 9421 third-party cross-verification (no-merge gate)
    runs-on: ubuntu-latest
    # ADR-MCPRE-050 / MCPRE-99: the HTTP-profile corpus MUST validate through a
    # pinned, INDEPENDENT RFC 9421 implementation (python-cryptography Ed25519),
    # both ways — our signatures verify externally, and an externally produced
    # signature verifies under the Rust verifier. No external validation, no
    # merge; this gate is required before full-profile parity is declared green.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install pinned external RFC 9421 dependency
        run: pip install -r mcp-re-conformance/tools/requirements-cross-verify.txt

      # Direction 1: our committed vectors verify under the independent impl,
      # and h01's reconstructed signature base is byte-compared to the oracle.
      - name: Cross-verify the HTTP-profile corpus (ours → external)
        run: python3 mcp-re-conformance/tools/rfc9421_cross_verify.py

      # The emitted external vector must match what is committed (drift guard for
      # the external → us direction the Rust test consumes).
      - name: External vector is up to date
        run: |
          python3 mcp-re-conformance/tools/rfc9421_cross_verify.py --emit-external-kat
          git diff --exit-code mcp-re-conformance/tests/vectors/http-profile/external_kat.json

      - name: Select pinned toolchain (from rust-toolchain.toml)
        run: rustup show && rustc --version && cargo --version

      # Direction 2: the externally produced signature verifies under the Rust
      # MCP-RE verifier.
      - name: Cross-verify (external → us) under the Rust verifier
        run: cargo test -p mcp-re-conformance --test rfc9421_cross_verification_test

      # ADR-MCPRE-052 §9 (MCPRE-122): the same two-direction gate for the compact-
      # JWS delegation credential, against an independent JOSE/EdDSA impl.
      # Direction 1: our committed delegation credential verifies under
      # python-cryptography and is byte-identical to its independent build.
      - name: Cross-verify the delegation credential (ours → external)
        run: python3 mcp-re-conformance/tools/jose_cross_verify.py

      - name: External delegation vector is up to date
        run: |
          python3 mcp-re-conformance/tools/jose_cross_verify.py --emit-external-kat
          git diff --exit-code mcp-re-conformance/tests/vectors/delegation-profile/external_delegation_kat.json

      # Direction 2: the externally produced credential verifies under the Rust
      # MCP-RE delegation verifier.
      - name: Cross-verify delegation (external → us) under the Rust verifier
        run: cargo test -p mcp-re-conformance --test delegation_cross_verification_test

  cargo-features:
    name: cargo test (feature-gated backends, 1.97.1)
    runs-on: ubuntu-latest
    # No live infra is provisioned here, so MCP_RE_REQUIRE_LIVE_INFRA is left unset
    # and the *_e2e_test suites self-skip. This job exercises the feature-gated
    # UNIT tests + adapter compilation only.
    steps:
      - uses: actions/checkout@v7

      # cryptoki-sys builds its FFI bindings with libclang (see the `cargo` job).
      - name: System build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev

      - name: Select pinned toolchain (from rust-toolchain.toml)
        run: rustup show && rustc --version && cargo --version

      # Build the WHOLE workspace (not just -p mcp-re-proxy): the proxy's
      # integration tests spawn the cross-crate `echo-inner` fixture binary, which
      # cargo does NOT auto-build for another crate's integration tests.
      # `--workspace` puts it in target/debug for mcp-re-test-paths to find.
      # `async_serve,cpstore_etcd` are included so the async serving-path tests and
      # the async etcd authoritative replay store (MCPRE-117) get per-PR compile
      # coverage here: the replay_race_harness_test async lanes compile, the in-memory
      # async full-serving-path race RUNS, and the live Redis/etcd lanes self-skip
      # (no MCP_RE_REQUIRE_LIVE_INFRA — the nightly live-infra-e2e lane is where they
      # bind). Without cpstore_etcd the async etcd store would have NO per-PR build.
      - name: Build (workspace, all feature gates)
        run: >-
          cargo build --workspace --all-targets
          --features dev_env_key_source,pkcs11_keysource,redis_replay,online_ocsp,aws_kms_keysource,gcp_kms_keysource,async_serve,cpstore_etcd

      - name: Test (mcp-re-proxy, all feature gates; e2e self-skip without live infra)
        run: >-
          cargo test -p mcp-re-proxy
          --features dev_env_key_source,pkcs11_keysource,redis_replay,online_ocsp,aws_kms_keysource,gcp_kms_keysource,async_serve,cpstore_etcd

      # ADR-MCPRE-051 §7 release gates as NAMED, attributable lanes (MCPRE-123).
      # These targets also run inside the whole-suite step above; naming them makes
      # each a required release gate whose failure is unambiguous. Fast (cached build).

      # §4 — cross-core / cross-replica replay race: exactly one Fresh, N-1 Replay,
      # zero Fresh when the store is Unavailable (fail-closed). (#314)
      - name: Release gate — replay race
        run: >-
          cargo test -p mcp-re-proxy --features async_serve
          --test async_replay_test

      # §6 — bounded graceful drain: in-flight requests complete, zero abandoned,
      # a stuck request cannot delay exit past the grace bound. (MCPRE-115)
      - name: Release gate — bounded drain
        run: cargo test -p mcp-re-proxy --features async_serve --test async_drain_test

      # §3 — inner plane: concurrent in-flight (no serial pipe) + pool-exhaustion
      # backpressure fails closed without queuing. (MCPRE-118)
      - name: Release gate — inner-plane concurrency + backpressure
        run: cargo test -p mcp-re-proxy --features async_serve --test http_inner_test

      # §7 — SLO gate mechanism self-check (MCPRE-110/123). Proves the gate logic
      # (correctness floors bite; declared capacity/scaling targets enforce; null
      # targets skip). Representative capacity ENFORCEMENT runs on the declared
      # hardware class per docs/bench/adr-051-slo-targets.md — the one HITL step.
      - name: Release gate — SLO gate mechanism (self-test)
        run: python3 scripts/slo_gate.py --selftest

  bazel:
    name: bazel semantic-drift gate + test parity
    runs-on: ubuntu-latest
    # ADR-MCPS-048 / MCPS-70 — the enforcement that makes generation stick.
    # Runs on Linux so the platform-gated crates (seccompiler, landlock) compile
    # (they are cfg'd out on macOS); this is also the canonical hermetic target.
    steps:
      - uses: actions/checkout@v7

      # The FFI closure (cryptoki-sys) builds bindings with libclang, same as the
      # cargo jobs; install it so the Bazel build links on a clean runner.
      - name: System build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev

      # Cache the Bazel repository + disk cache across runs (crate_universe hub,
      # the gazelle_rust Go binary, rules_go/gazelle). Keyed on the module lock +
      # Cargo lock so a dependency change busts it.
      - name: Cache Bazel
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'Cargo.lock') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Bazel version
        run: bazel version

      # (1) Semantic-drift gate: fails if a `use`/test lacks its BUILD target/edge.
      - name: BUILD semantic-drift gate (gazelle as drift detector)
        run: python3 scripts/bazel_gazelle_gate.py

      # (2) Parity: the Bazel suite must pass like the cargo suite.
      - name: Bazel test parity (//...)
        run: bazel test //... --test_output=errors

  sdk-python:
    name: downloader — Python maturin wheel (no Bazel)
    runs-on: ubuntu-latest
    # ADR-MCPS-048 / MCPS-71 — the pip downloader path. sdk/python is its OWN
    # Cargo workspace (empty [workspace] table) linking the audited
    # mcp-re-client-core / mcp-re-core via path deps; the pyo3 layer is abi3-py39, so
    # ONE wheel serves any CPython >= 3.9. No cryptoki/openssl in the SDK closure,
    # so no libclang is needed. Bazel is neither installed nor invoked.
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The pinned Rust toolchain (rust-toolchain.toml at the repo root) applies
      # here too — rustup walks up to it — so the wheel is built with the same
      # compiler as the cargo/bazel gates.
      - name: Select pinned toolchain (from rust-toolchain.toml)
        run: rustup show && rustc --version && cargo --version

      - name: Install maturin
        run: pip install "maturin>=1.5,<2.0"

      - name: Build the release wheel
        run: maturin build --release --out dist

      - name: Regenerated parity oracle must match the committed one
        # The frozen cross-language oracle (sdk/fixtures/parity_vectors.json) is what
        # pins the Python and TypeScript bindings to the same bytes. If regenerating it
        # changes anything, a binding drifted from the core — fail rather than ship.
        working-directory: ${{ github.workspace }}
        run: |
          python -m venv /tmp/oracle
          /tmp/oracle/bin/pip install --quiet sdk/python/dist/*.whl 2>/dev/null \
            || /tmp/oracle/bin/pip install --quiet sdk/python/dist/*.whl
          /tmp/oracle/bin/python tools/gen_sdk_parity_fixture.py
          git diff --exit-code -- sdk/fixtures/parity_vectors.json

      # Clean-env smoke install: a fresh venv gets ONLY the built wheel plus the
      # upstream MCP SDK + pytest — never an editable install and never the
      # source python/ tree on sys.path, so `import mcp_re_sdk` resolves to the
      # INSTALLED wheel (its native mcp_re_sdk._core), proving the downloader
      # artifact stands on its own.
      # The upstream SDK is installed as the WHEEL'S OWN `mcp` extra, never as a
      # restated `"mcp>=…"` on this line. pyproject declares `mcp>=1.16,<2.0`; naming
      # the package here independently bypassed that cap, and when upstream published
      # mcp 2.0.0 — where `JSONRPCMessage` stopped being a RootModel and became a
      # plain union alias, so it is neither callable nor carries `.root` — this job
      # installed it and 33 SDK tests failed on a branch that had not touched the SDK.
      # One source for the constraint, the same rule VERSION and config/ports.toml get.
      - name: Clean-env install (wheel only) + smoke import
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          WHEEL="$(ls dist/*.whl)"
          /tmp/venv/bin/pip install "${WHEEL}[mcp]" "pytest>=8" "pytest-cov>=5"
          /tmp/venv/bin/python -c "import mcp_re_sdk, mcp_re_sdk._core; print('wheel import OK')"

      # Run the SDK suite against the installed wheel from the repo root so the
      # source package cannot shadow it. Coverage is gated at the repo-wide 90% bar
      # by [tool.coverage.report] fail_under in sdk/python/pyproject.toml.
      - name: pytest + coverage gate (installed wheel)
        working-directory: ${{ github.workspace }}
        run: |
          /tmp/venv/bin/python -m pytest sdk/python/tests -q \
            --cov --cov-config=sdk/python/pyproject.toml --cov-report=term-missing

  sdk-typescript:
    name: downloader — TypeScript napi package (no Bazel)
    runs-on: ubuntu-latest
    # ADR-MCPS-048 / MCPS-71 — the npm downloader path. sdk/typescript is its OWN
    # Cargo workspace (empty [workspace] table) linking mcp-re-client-core via a
    # path dep; @napi-rs/cli builds the Node native addon. Bazel is neither
    # installed nor invoked.
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Select pinned toolchain (from rust-toolchain.toml)
        run: rustup show && rustc --version && cargo --version

      - name: Install JS dependencies
        run: npm ci

      # napi build (native .node) + tsc (dist/). This is the published artifact's
      # exact build.
      - name: Build native addon + TypeScript
        run: npm run build

      # Coverage is gated at the repo-wide 90% bar by the `thresholds` block in
      # sdk/typescript/vitest.config.ts; the run fails below it.
      - name: Test + coverage gate (vitest)
        run: npx vitest run --coverage

      # Clean-env smoke install: pack the tarball exactly as published, install it
      # into an EMPTY project (no dev deps, no workspace), and require it — the
      # bundled native/*.node must load on its own.
      - name: Pack + clean-dir install smoke
        run: |
          npm pack --pack-destination /tmp
          TGZ=$(ls -t /tmp/mcp-re-sdk-*.tgz | head -1)
          mkdir -p /tmp/npm-smoke && cd /tmp/npm-smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$TGZ"
          node -e "const m=require('@mcp-re/sdk'); if(typeof m.signRequest!=='function'){throw new Error('napi package export missing');} console.log('npm package require OK')"
