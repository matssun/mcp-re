# SPDX-License-Identifier: Apache-2.0
#
# MCP-RE continuous integration. The Rust toolchain is pinned by the committed
# rust-toolchain.toml (1.97.1, matching the Bazel build), so rustup installs and
# selects it automatically on the first cargo invocation — CI and local dev share
# one toolchain.
#
# Gating policy:
#   - BLOCKING: `cargo build` + `cargo test` over the whole workspace (this
#     includes the mcp-re-conformance suite + the conformance drift guard, which
#     resolve their fixtures via the cargo runfiles fallback in mcp-re-test-paths).
#   - BLOCKING: `cargo test` over mcp-re-proxy with the four NON-DEFAULT feature
#     gates enabled (dev_env_key_source, pkcs11_keysource, redis_replay,
#     online_ocsp). The default `cargo test --workspace` does NOT compile these
#     modules, so without this job the v0.3 hardening that lives behind them
#     (the Redis WAIT-quorum fake-connection harness, the PKCS#11 sign-loop
#     proof, the OCSP AIA-SSRF inet_aton parser, the env-key-source no-mutation
#     contract) would have zero cargo-CI coverage. The PKCS#11 sign+verify e2e
#     runs against a hermetic in-tree mock provider, so it needs no external
#     token. The remaining live-infra e2e tests (real Redis / OCSP responder)
#     self-skip cleanly when their MCP_RE_TEST_* env vars are unset; they hard-fail
#     only when MCP_RE_REQUIRE_LIVE_INFRA is set, which this job leaves unset.
#   - BLOCKING: `cargo fmt --check` and `cargo clippy -D warnings`. The tree carries
#     zero warnings, so any new one is a build failure rather than a line of scroll-
#     back nobody reads. Both run over EVERY cargo universe (the root workspace, the
#     two SDK crates, the mock-PKCS#11 crate) and clippy additionally runs the
#     non-default feature lane — the advisory form linted only the root default
#     features, which left `etcd_store.rs`, `redis_store.rs` and mock-pkcs11 entirely
#     unlinted and hid 19 of the 60 warnings the cleanup had to fix.
#     A `rust-toolchain.toml` bump ships new lints, so bump it in a commit that
#     re-runs `scripts/local_gate.sh` and clears whatever the new lints find.
#   - BLOCKING (ADR-MCPS-048 / MCPS-70): the `bazel` job gates the OTHER build
#     system. Bazel was ungated, which is exactly how #220 (Bazel/cargo drift)
#     happened. Two steps: (1) the semantic-drift gate — gazelle_rust as a drift
#     DETECTOR (not a byte-authority): fails if the Cargo graph has a target/edge
#     the committed BUILD omits, modulo the script's allowlist; (2) `bazel test
#     //...` parity with the cargo suite.
#   - BLOCKING (ADR-MCPS-048 / MCPS-71): the `sdk-python` and `sdk-typescript`
#     jobs make "downloaders skip Bazel" a VERIFIED path, not a rotting side
#     artifact. Each builds the ecosystem-native artifact (maturin wheel / napi
#     package) from the SAME source, installs it into a clean environment
#     (fresh venv / empty npm project — wheel/tarball only, no editable, no
#     workspace on sys.path), and runs the SDK test suite. Neither job installs
#     or invokes Bazel; the e2e suites that need the built Rust binaries
#     self-skip cleanly (their guards check for the target/{debug,release}
#     binaries + cargo), so the clean-env lane exercises the unit surface. The
#     cargo jobs above are the third downloader path (pure `cargo`, no Bazel).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo:
    name: cargo build + test (1.97.1)
    runs-on: ubuntu-latest
    steps:
      # Full history: the module-size ratchet checks DISPOSITION TRANSITIONS against
      # `origin/main:config/module-size-debt.toml`, and at depth 1 that ref does not
      # exist. The gate prints "no baseline registry at origin/main" rather than
      # silently passing, so a shallow clone would be visible — but a check that
      # announces it could not run is still a check that did not run.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # JCS vocabulary firewall (D1 of the active-profile/legacy-quarantine note):
      # forward-design docs must not frame a live "object profile + HTTP profile"
      # world. Fast, python-only — fails before the slow build.
      - name: JCS vocabulary firewall (deprecated-profile framing gate)
        run: |
          python3 scripts/jcs_vocabulary_gate.py --selftest
          python3 scripts/jcs_vocabulary_gate.py

      # Port-registry staleness gate: config/ports.toml is the single source of
      # truth for every port this repo binds (reserved band 8600-8699). The Helm
      # bindPort mirror must equal it and no registered port may fall outside the
      # band. Fast, python-only — fails before the slow build.
      - name: Port-registry gate (single-source ports, no drift)
        run: python3 scripts/check_port_registry.py

      # SEP-2322 discriminator gate: the conformance suite pins the discriminator's
      # VALUE, but that only protects readers that classify through the shared
      # helper. The literal had been open-coded in five places, three of which read a
      # malformed non-terminal reply as terminal — so a rename would have failed the
      # value guard while leaving those readers silently wrong. This asserts the
      # literal appears in exactly one shipped source file, which is the only way to
      # catch a sixth copy: a type system cannot notice a string nobody imported. It
      # is a script rather than a test because `sdk/` is not Bazel-addressable.
      # Fast, python-only.
      - name: Discriminator gate (one classifier, no open-coded copies)
        run: python3 scripts/discriminator_gate.py

      # Tracked-file leak guard: key material, credential documents, and personal
      # or concrete service-account identifiers must never land in a tracked file
      # (a commit is public history even after a later commit deletes it). The
      # selftest runs first — a detector that silently matches nothing looks
      # exactly like a clean tree. Fast, python-only.
      - name: Tracked-secrets gate (no committed credentials or personal identifiers)
        run: |
          python3 scripts/tracked_secrets_gate.py --selftest
          python3 scripts/tracked_secrets_gate.py

      # The CodeBuild `pre_build` context guard rests on one premise: every path it
      # refuses is one `git archive HEAD` cannot emit. `.claude` is partly TRACKED —
      # eight files — so the guard aborted every correctly produced upload and detected
      # no zipped working tree at all. The premise is a local fact that `git ls-files`
      # decides, so it is checked rather than remembered.
      - name: CodeBuild context-guard gate
        run: |
          python3 scripts/codebuild_guard_gate.py --selftest
          python3 scripts/codebuild_guard_gate.py

      # Deploy image-tag gate: Cloud Build pushes the image tags, and the k8s
      # manifests, chart and live-validation harnesses reference them. Nothing tied
      # those together, so they drifted a whole release apart — the multi-replica
      # harness deployed `:0.12.1` while Cloud Build published `:0.13.0`. Every pin
      # reads correctly in isolation; the mismatch only shows up as ImagePullBackOff
      # on a cluster that is already billing. Selftest first: a scanner that matches
      # nothing is indistinguishable from a clean tree. Fast, python-only.
      - name: Deploy image-tag gate (every deployed tag == VERSION)
        run: |
          python3 scripts/deploy_image_tag_gate.py --selftest
          python3 scripts/deploy_image_tag_gate.py

      # SLO-harness invocation gate: `tls_load_harness_bench` is NOT an #[ignore]
      # test (the file is gated to the redis_replay feature lane), so a documented
      # `-- --ignored` selects ZERO tests, exits 0 and writes no report — a lane that
      # looks green while measuring nothing. That form had propagated into four
      # places, the bench image's own ENTRYPOINT among them. This keeps every
      # runnable invocation honest. Fast, python-only.
      - name: SLO-harness invocation gate (no command that measures nothing)
        run: |
          python3 scripts/slo_invocation_gate.py --selftest
          python3 scripts/slo_invocation_gate.py

      # Bazel srcs gate: mcp-re-proxy hand-lists its library sources (three feature
      # flavors share one list) while every other crate globs. A hand-list drifts —
      # `src/audit_sink.rs` shipped with the ADR-MCPS-035 audit surface and was never
      # added, so cargo built a module Bazel could not find (E0583) and every Bazel
      # target downstream of the proxy failed. Only a full `bazel test //...` caught
      # it, 30+ minutes in. This is the same check in one second. Fast, python-only.
      - name: Bazel srcs gate (hand-listed srcs matches lib.rs)
        run: |
          python3 scripts/bazel_srcs_gate.py --selftest
          python3 scripts/bazel_srcs_gate.py

      # ADR-MCPRE-067 §16.3, §21.2. A new provider adds one typed mechanism payload,
      # one tagged variant and one adapter — never a provider-qualified sibling field
      # beside the selector on `DeploymentRequest`. That shape is what the Phase-2
      # migration removed: 17 siblings whose meaning depended on a `key_source`
      # discriminator, plus a nine-entry table of "belongs to a different custody
      # source" refusals explaining why a request did not mean what it said. The gate
      # reads that one struct and states which families it is NOT yet checking, so a
      # phase that has not run cannot be mistaken for a boundary that is clean.
      - name: Semantic-altitude gate (no provider sibling on DeploymentRequest)
        run: |
          python3 scripts/semantic_altitude_gate.py --selftest
          python3 scripts/semantic_altitude_gate.py

      # Helm chart render gate: every fail-closed guard in the chart
      # (`templates/_helpers.tpl`) is a render-time `fail`, and several of them key
      # on values Helm treats as FALSY — so an inverted condition does not error, it
      # omits a flag, and an omitted flag is the permissive default. This renders
      # the chart under a matrix and asserts which value sets MUST be refused, that
      # each refusal names the value at fault, and that the rendered argv omits the
      # flags it must omit (no --signing-key-seed under KMS custody, no
      # --max-in-flight when unset). Fast, python + helm.
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Helm chart render gate (fail-closed guards must refuse)
        run: python3 scripts/helm_render_gate.py

      # ES256 containment (ADR-MCPRE-054): ECDSA P-256 is admitted for SCITT receipt
      # verification and nowhere else — request and response signing stay Ed25519.
      # This was the one stage-1 structural gate that ran only in `local_gate.sh`, so
      # a PR that never ran the local gate could widen the containment unnoticed.
      - name: ES256 containment gate
        run: |
          python3 scripts/es256_containment_gate.py --selftest
          python3 scripts/es256_containment_gate.py

      # Owned workers (ADR-MCPRE-056 §9): a long-lived thread must belong to a
      # `WorkerSet`. Four detached startup threads shipped before this existed, and the
      # fourth was found by accident after a survey that swept one file and concluded
      # there were three — the invariant does not survive as a habit.
      - name: Owned-worker gate
        run: |
          python3 scripts/owned_worker_gate.py --selftest
          python3 scripts/owned_worker_gate.py

      # Seam posture (ADR-MCPRE-056 §5.4): every optional capability states ON or OFF at
      # startup. `assert_complete` is the runtime backstop but no hermetic config reaches
      # the posture phase, so in the default lanes this gate is the only thing that
      # catches a seam added without a declaration.
      - name: Seam-posture gate
        run: |
          python3 scripts/seam_posture_gate.py --selftest
          python3 scripts/seam_posture_gate.py

      # ADR-MCPRE-064 (#619): direct-TLS serving resolves identity from the AUTHENTICATED
      # peer. The defect this catches reintroduces itself by WIDENING A SIGNATURE — "pass
      # the leaf too, we already have it" — which no existing control notices, because
      # each one still measures a true thing about a correctly-composed value.
      - name: Serving-identity provenance gate
        run: |
          python3 scripts/serving_identity_provenance_gate.py --selftest
          python3 scripts/serving_identity_provenance_gate.py
          python3 scripts/authorization_provenance_gate.py --selftest
          python3 scripts/authorization_provenance_gate.py
          # ADR-MCPRE-066 Slice 0/1: a refusal carries its authority, not a rendered token;
          # PolicyError has no route into the Core taxonomy; and the record states each
          # authority's outcome in its own coordinate.
          python3 scripts/refusal_provenance_gate.py --selftest
          python3 scripts/refusal_provenance_gate.py
          # THM-0051: the serving path verifies once and holds THAT product. The seam is a
          # gate rather than a type because `VerifiedMcpRequest` must keep public fields for
          # the Verus obligation on `prepare_http_dispatch` to read one.
          python3 scripts/serving_product_provenance_gate.py --selftest
          python3 scripts/serving_product_provenance_gate.py

      # A guide that teaches a flag the CLI no longer parses sends an operator to debug
      # their own environment. Only command lines that LAUNCH the proxy are scanned, so
      # prose may still name a removed flag in order to say it was removed.
      - name: Proxy-flag documentation gate
        run: |
          python3 scripts/proxy_flag_doc_gate.py --selftest
          python3 scripts/proxy_flag_doc_gate.py

      # Conformance is executable evidence, not documentation. An advertised category
      # whose corpus or harness has been deleted keeps claiming coverage that exists
      # nowhere, and a corpus with no harness is never executed — neither direction is
      # self-announcing, so both are asserted here.
      - name: Conformance-claims gate
        run: |
          python3 scripts/conformance_claims_gate.py --selftest
          python3 scripts/conformance_claims_gate.py

      # Named release-gate lanes are a table of test-binary names, and consolidating
      # the proxy suites broke 24 of them across four workflows and two example
      # scripts. Only four went red — the cloud-KMS and several live-infra lanes are
      # gated, so their breakage would have surfaced the next time someone ran a
      # billed nightly. This asserts every `--test` names a real target and every
      # `module::` filter names a real module, before either is invoked.
      - name: Cargo test-target gate
        run: |
          python3 scripts/cargo_test_target_gate.py --selftest
          python3 scripts/cargo_test_target_gate.py

      # Lifecycle purity (ADR-MCPRE-056/057): `runtime_state.rs` and `exchange_state.rs`
      # are values, not behaviour. A `use` of a production module would let "is this
      # transition legal?" answer two ways on the same arguments, which is what SL-04
      # (closed transition relation) and SL-09 (monotone exchange consequence) rest on.
      # Wired here as well as in `local_gate.sh` so the merge path enforces it.
      - name: Lifecycle-purity gate
        run: |
          python3 scripts/lifecycle_purity_gate.py --selftest
          python3 scripts/lifecycle_purity_gate.py

      # ADR-MCPRE-061 §5 — THE TWO RATCHETS. Both existed and neither ran on the merge
      # path: `scripts/local_gate.sh` was their only caller, so a PR that did not run the
      # local gate could grow a registered file or a lint baseline and nothing would say
      # so. That is not hypothetical — it happened, and the campaign that found it was the
      # one that had caused it. This is the same repair ci.yml already applied to the ES256
      # containment gate and the lifecycle-purity gate, for the same stated reason: wired
      # here as well as in `local_gate.sh` so the MERGE path enforces it.
      #
      # `--selftest` first in each case: a ratchet that has stopped measuring reports the
      # same "OK" as one that measures and finds nothing.
      #
      # NOTE ON THE BASELINES. `config/clippy-debt.toml` was emitted on a developer's macOS
      # machine, so `#[cfg(target_os = "linux")]` code was never counted into it. Running
      # the gate on this Linux runner is the first time those sites have been measured at
      # all — the first green run here is the real baseline, and a difference on this
      # runner is a MEASUREMENT that was missing, not necessarily a regression.
      - name: Module-size ratchet (ADR-MCPRE-061 §5.1)
        run: |
          python3 scripts/module_size_gate.py --selftest
          python3 scripts/module_size_gate.py

      # ADR-MCPRE-059. The verification workflow is `paths:`-filtered, and its filter list
      # and the units' fingerprint closures are ONE dependency set written down twice. When
      # the closure grows past the filter, the workflow does not go red — it stops running,
      # and every check on the PR stays green while nothing measures the changed unit.
      # `verification_trigger_gate.py` is what refuses that, so it must not live only inside
      # the workflow whose trigger it polices: a PR narrowing the filter would also stop the
      # policeman. It runs here, in the unconditional job, for the same reason the two
      # ratchets above do — the merge path is what has to enforce it.
      - name: Verification trigger gate (fingerprint closure ⊆ workflow trigger set)
        run: |
          python3 scripts/verification_trigger_gate.py --selftest
          python3 scripts/verification_trigger_gate.py
          # The Python support claim may not exceed the Python evidence — #746. Here as
          # well as in the local gate, because a control that lives only in local_gate.sh
          # is a control enforced by remembering to run it.
          python3 scripts/python_runtime_gate.py --selftest
          python3 scripts/python_runtime_gate.py
          # The Node half of the same rule — #747.
          python3 scripts/node_runtime_gate.py --selftest
          python3 scripts/node_runtime_gate.py

      # R9 linkage. `verification/reviews/r9-dispositions.json` is the authoritative
      # per-row ownership map for the 2026-08-31 audit, and the appendix in the packet is a
      # generated view of it. Three properties, all of which drifted at least once:
      # the appendix must match the record; every row that SURVIVED the re-derivation at
      # High or Critical must name the workstream that owns it or the change that closed
      # it; and a `merged_closure` must name a merge commit that is an ancestor of HEAD.
      # The last is why this step is in the `fetch-depth: 0` job — at depth 1 the closure
      # commits are not in the clone, and the check would be measuring the checkout rather
      # than the record. It exists because a green OPEN pull request was recorded here as a
      # merged closure and no lane could tell the difference: the evidence for "merged" was
      # a sentence saying so. No network — PR state is remote and mutable, the commit
      # reachable from HEAD is the durable local fact.
      # THE MERGE-PATH CLASS ITSELF. A security/assurance control the assurance model
      # relies on must be mechanically present on the required merge path; existence in
      # `scripts/local_gate.sh` — an aggregate a developer chooses to run — does not
      # establish enforcement. That class has opened five times in this repository (the
      # two ADR-MCPRE-061 ratchets, the verification-trigger gate, the registry-approval
      # gate, and the ten platform self-test suites below), and each instance was repaired
      # only when someone noticed. This gate is what notices, so it goes first.
      - name: Merge-path gate (a local-only control is not enforced)
        run: |
          python3 scripts/merge_path_gate.py --selftest
          python3 scripts/merge_path_gate.py

      # The assurance platform's own self-tests — the verdict algebra, the invalidation
      # rules, the measured-input closure, the escape-hatch detector, the theorem loader
      # and review model, the test and Verus lane adapters, and the views generator. They
      # are what establishes that a `verify` verdict means what ADR-MCPRE-059 says it
      # means, and every product claim rests on that. They ran in `local_gate.sh` and
      # nowhere else, so nothing on the merge path established it. ~16s, python-only.
      #
      # Spelled out one per line rather than looped over a variable: `merge_path_gate.py`
      # reads literal paths, and a name a workflow assembles at run time is a name it
      # cannot see. A control that is enforced but not legible to the checker is how the
      # next instance of this class would be missed.
      - name: Assurance platform self-tests (ADR-MCPRE-059)
        run: |
          python3 tools/verification/test_verdict_algebra.py
          python3 tools/verification/test_invalidation.py
          python3 tools/verification/test_attest.py
          python3 tools/verification/test_verus_lane.py
          python3 tools/verification/test_test_lane.py
          python3 tools/verification/test_ecosystems.py
          python3 tools/verification/test_measured_inputs.py
          python3 tools/verification/test_escape_hatches.py
          python3 tools/verification/test_theorems.py
          python3 tools/verification/test_theorem_review.py
          python3 tools/verification/test_views.py
          python3 tools/verification/test_evidence_bundle.py
          # Added by the v0.17 Slice B sweep. It was in NEITHER local_gate.sh nor any
          # unconditional workflow: `mutation-probe.yml` names it, and that workflow is
          # `paths:`-filtered, so the mutation lane's verdict semantics were established
          # only on pull requests that happened to trip the filter. `merge_path_gate.py`
          # could not see it, because "named by a workflow" was treated as coverage
          # whatever the trigger. Both halves are fixed.
          python3 tools/verification/test_mutation_lane.py

      # ADR-MCPRE-059 §28 + the ratified security boundary. The registry's `root_theorems`
      # and `docs/spec/security-boundary.md` §2 are ONE fact — what MCP-RE promises —
      # written down twice, and they had diverged: twelve declared roots against nine
      # published claims, three roots simultaneously claimed and disclaimed, three §4 rows
      # duplicated with different dispositions, and a hand-written root-completeness count
      # that disagreed with the tool. Nothing failed, because no control related the two.
      # This is that control. It checks the MAPPING and the review axis only: evidence
      # freshness lives in a gitignored attestation store that no merge-path job can read.
      - name: Claim-surface gate (declared roots ↔ published claims)
        run: |
          python3 scripts/claim_surface_gate.py --selftest
          python3 scripts/claim_surface_gate.py

      # ADR-MCPRE-059 §14.7 — approval is evidence ABOUT a fingerprint, never a bit on the
      # object approved. This gate had `scripts/local_gate.sh` as its only caller, and it
      # was RED on main while every CI check was green: `r9-dispositions.json` landed under
      # verification/reviews/ carrying a `status` key and naming no fingerprint, and nothing
      # on the merge path asked. Same repair, same reason, as the two ratchets above.
      - name: Registry approval gate (ADR-MCPRE-059 §14.7)
        run: |
          python3 scripts/registry_approval_gate.py --selftest
          python3 scripts/registry_approval_gate.py

      - name: R9 linkage controls (merged means merged)
        run: |
          python3 tools/verification/test_r9_linkage.py
          python3 tools/verification/render-r9-dispositions --check

      # The clippy ratchet needs the toolchain, so it runs with the clippy lanes below.

      # ADR-MCPRE-061 Amendment 1 §3. The Group A zero-debt protections live in ONE
      # `[workspace.lints]` table in the root Cargo.toml — thirteen copies of the same
      # deny block grew six files already registered in config/module-size-debt.toml.
      # A workspace table reaches a member only through that member's `[lints]
      # workspace = true`, so a member added without it is silently exempt and nothing
      # else in the build reports it. `--probe` runs after the toolchain is selected
      # (below, with the clippy lanes) because proving the table is ENFORCED needs a
      # build; a table that is merely present is the configuration-enforces-nothing
      # failure this repo has already hit twice.
      - name: Workspace-lints gate (every member opts into the one lint authority)
        run: python3 scripts/workspace_lints_gate.py

      # The SCITT service-key fetcher refuses a plaintext redirect hop. `build_opener`
      # installs the permissive default redirect handler unless it is passed a
      # subclass, so a guard class that exists but is never consulted leaves the
      # downgrade open — the selftest asserts the wiring, not just the class.
      - name: SCITT service-key fetch guards
        run: python3 tools/scitt_fetch_service_key.py --selftest

      # cryptoki-sys (declared non-optional for Bazel target exposure) builds its
      # FFI bindings with libclang; install it defensively so the cargo closure
      # links on a clean runner.
      - name: System build dependencies
        # The bounds on the fallback are not decoration; they are what the two earlier
        # attempts at this step were. With no bound at all, six jobs across four branches
        # sat in `apt-get update` for 28-58 minutes each reporting `pending` — which says
        # strictly less than a red would. With only `update` bounded, the `install` hung
        # instead. `Acquire::http::Timeout` does not help either: it bounds INACTIVITY,
        # and a transfer dribbling at 32 kB/s is never inactive.
        #
        # Nothing here is weakened. If the image ever stops shipping Clang the fallback
        # installs it exactly as before; a package that genuinely cannot be installed
        # still fails the step, and every gate below is untouched.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # cryptoki-sys builds its FFI bindings with bindgen, which needs libclang at
          # RUNTIME — the shared object, not the headers. The ubuntu-24.04 runner image
          # already ships Clang 18.1.3, so `libclang-dev` was re-downloading a library
          # the box already had: 28.8 MB fetched and ~292 MB unpacked, on every one of
          # three jobs, every run.
          #
          # That download is also the single least reliable thing in this workflow.
          # Measured on 2026-08-19 against the same Azure mirror, same file: 64.0 kB/s,
          # then 43.1 kB/s, then 32.1 kB/s — 14min 57s for the fetch alone, with the
          # unpack pushing past a 20-minute cap. Raising the cap is a race against a
          # mirror that keeps getting slower; not needing the file wins it outright.
          #
          # So: find what is already installed and point bindgen at it. apt is the
          # FALLBACK, not the default, and it keeps its bounds for the case where the
          # image stops shipping Clang.
          found=""
          for dir in /usr/lib/llvm-*/lib /usr/lib/x86_64-linux-gnu; do
            if compgen -G "$dir/libclang*.so*" > /dev/null 2>&1; then
              found="$dir"
              break
            fi
          done

          if [ -n "$found" ]; then
            echo "LIBCLANG_PATH=$found" >> "$GITHUB_ENV"
            echo "using the runner image's libclang in $found:"
            ls -1 "$found"/libclang*.so* | sed 's/^/  /'
          else
            echo "no libclang on the image — falling back to apt (bounded)"
            timeout 300 sudo apt-get update \
              || echo "apt-get update did not finish in 300s; using the runner image's package index"
            sudo apt-get install -y --no-install-recommends \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              libclang-dev
          fi

      - name: Select pinned toolchain (from rust-toolchain.toml)
        run: rustup show && rustc --version && cargo --version

      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      - name: Test (workspace, incl. conformance suite + drift guard)
        run: cargo test --workspace

      # MCPRE-427 (#415 rev 2 §12.2). The hash/digest checks themselves run inside
      # `cargo test --workspace` above (corpus_pinning_test + the frozen runners,
      # which fail closed before running a vector whose bytes drifted). This step
      # PUBLISHES the resulting digests into the job summary so a release packet —
      # and any reviewer — can quote the exact corpus that was tested, rather than
      # a tag, which §12.2 says is insufficient to prove two parties read the same
      # bytes.
      - name: Publish conformance corpus digests
        run: |
          {
            echo "## Conformance corpus digests (§12.2)"
            echo
            echo '| Corpus | manifest SHA-256 | corpus digest |'
            echo '|---|---|---|'
            for c in http-profile delegation-profile scitt; do
              m="mcp-re-conformance/tests/vectors/$c/manifest.json"
              manifest_sha="$(shasum -a 256 "$m" | cut -d' ' -f1)"
              corpus_dig="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['corpus_digest'])" "$m")"
              echo "| \`$c\` | \`$manifest_sha\` | \`$corpus_dig\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Every cargo universe, not just the root workspace: the SDK crates and the
      # mock-PKCS#11 crate have their own manifests and are invisible to `--workspace`.
      - name: Format check
        run: |
          cargo fmt --all -- --check
          cargo fmt --all --manifest-path sdk/python/Cargo.toml -- --check
          cargo fmt --all --manifest-path sdk/typescript/Cargo.toml -- --check
          cargo fmt --all --manifest-path mcp-re-proxy/tests/mock-pkcs11/Cargo.toml -- --check

      # The feature lane is not optional: the default features do not compile
      # etcd_store.rs / redis_store.rs at all, so linting only the default set
      # leaves the ADR-051 control-plane backends unlinted.
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets \
            --features dev_env_key_source,pkcs11_keysource,redis_replay,online_ocsp,aws_kms_keysource,gcp_kms_keysource,async_serve,cpstore_etcd \
            -- -D warnings
          cargo clippy --manifest-path sdk/python/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path sdk/typescript/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path mcp-re-proxy/tests/mock-pkcs11/Cargo.toml --all-targets -- -D warnings

      # Default and all-features leave everything BETWEEN them unbuilt, and an item
      # reachable only from one feature's code is unused under a different one. Two
      # such leftovers survived both lanes above (`TEST_ACTOR` under `async_serve`
      # alone, `ReplayInsert` under `redis_replay` alone) because no build ever used
      # exactly one flag. Each feature on its own is the cheap lane that covers it.
      # Proves the `[workspace.lints]` table is enforced, not merely declared: a
      # deliberate `todo!()` is compiled inside a real workspace member and the build
      # must fail with clippy::todo. Runs here because it needs the toolchain.
      - name: Workspace-lints enforcement probe
        run: python3 scripts/workspace_lints_gate.py --probe

      # The ADR-MCPRE-061 §6 lints are ALLOW-BY-DEFAULT, so the `-D warnings` lanes above
      # say nothing about them: `unwrap_used`, `expect_used`, `indexing_slicing`,
      # `too_many_lines`, `excessive_nesting` and `arithmetic_side_effects` are switched on
      # by this gate and nowhere else. `--activation-probe` compiles a deliberately
      # violating file and fails if they stop firing — the repository has twice shipped a
      # threshold that parameterised a lint nobody had enabled.
      - name: Clippy ratchet (ADR-MCPRE-061 §6)
        run: |
          python3 scripts/clippy_ratchet_gate.py --selftest
          python3 scripts/clippy_ratchet_gate.py --activation-probe
          python3 scripts/clippy_ratchet_gate.py

      - name: Clippy — each feature alone
        run: |
          for feature in dev_env_key_source pkcs11_keysource redis_replay online_ocsp \
                         aws_kms_keysource gcp_kms_keysource async_serve cpstore_etcd; do
            echo "::group::clippy --features $feature"
            cargo clippy -p mcp-re-proxy --all-targets --features "$feature" -- -D warnings
            echo "::endgroup::"
          done

  rfc9421-cross-verify:
    name: RFC 9421 third-party cross-verification (no-merge gate)
    runs-on: ubuntu-latest
    # ADR-MCPRE-050 / MCPRE-99: the HTTP-profile corpus MUST validate through a
    # pinned, INDEPENDENT RFC 9421 implementation (python-cryptography Ed25519),
    # both ways — our signatures verify externally, and an externally produced
    # signature verifies under the Rust verifier. No external validation, no
    # merge; this gate is required before full-profile parity is declared green.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install pinned external RFC 9421 dependency
        run: pip install -r mcp-re-conformance/tools/requirements-cross-verify.txt

      # Direction 1: our committed vectors verify under the independent impl,
      # and h01's reconstructed signature base is byte-compared to the oracle.
      - name: Cross-verify the HTTP-profile corpus (ours → external)
        run: python3 mcp-re-conformance/tools/rfc9421_cross_verify.py

      # The emitted external vector must match what is committed (drift guard for
      # the external → us direction the Rust test consumes).
      - name: External vector is up to date
        run: |
          python3 mcp-re-conformance/tools/rfc9421_cross_verify.py --emit-external-kat
          git diff --exit-code mcp-re-conformance/tests/vectors/http-profile/external_kat.json

      - name: Select pinned toolchain (from rust-toolchain.toml)
        run: rustup show && rustc --version && cargo --version

      # Direction 2: the externally produced signature verifies under the Rust
      # MCP-RE verifier.
      - name: Cross-verify (external → us) under the Rust verifier
        run: cargo test -p mcp-re-conformance --test rfc9421_cross_verification_test

      # ADR-MCPRE-052 §9 (MCPRE-122): the same two-direction gate for the compact-
      # JWS delegation credential, against an independent JOSE/EdDSA impl.
      # Direction 1: our committed delegation credential verifies under
      # python-cryptography and is byte-identical to its independent build.
      - name: Cross-verify the delegation credential (ours → external)
        run: python3 mcp-re-conformance/tools/jose_cross_verify.py

      - name: External delegation vector is up to date
        run: |
          python3 mcp-re-conformance/tools/jose_cross_verify.py --emit-external-kat
          git diff --exit-code mcp-re-conformance/tests/vectors/delegation-profile/external_delegation_kat.json

      # Direction 2: the externally produced credential verifies under the Rust
      # MCP-RE delegation verifier.
      - name: Cross-verify delegation (external → us) under the Rust verifier
        run: cargo test -p mcp-re-conformance --test delegation_cross_verification_test

      # MCPRE-501: the same two-direction gate for SCITT, against RFC 9942/9943 AS
      # PUBLISHED. Its absence is why a non-conforming receipt encoding shipped: the
      # receipt used the pre-publication draft labels -111/-222 instead of vds=395 /
      # vdp=396, and every test stayed green, because the suite ran our encoder against
      # our own decoder — which agrees with itself whatever labels it picks.
      # Direction 1: our committed corpus, decoded by cbor2 and verified by
      # python-cryptography, checked against the RFC's literal header labels.
      - name: Cross-verify the SCITT corpus (ours → external)
        run: python3 mcp-re-conformance/tools/scitt_cross_verify.py

      - name: External SCITT vector is up to date
        run: |
          python3 mcp-re-conformance/tools/scitt_cross_verify.py --emit-external-kat
          git diff --exit-code mcp-re-conformance/tests/vectors/scitt/external_kat.json

      # Direction 2: statements and receipts BUILT by the independent implementation
      # must verify under the Rust verifier, and each refusal a conforming verifier owes
      # must be refused — including a draft-labelled receipt, so a regression to those
      # labels fails here instead of shipping.
      - name: Cross-verify SCITT (external → us) under the Rust verifier
        run: cargo test -p mcp-re-conformance --test scitt_cross_verification_test

      # MCPRE-501 slice 4: the frozen third-party interoperability corpus — a receipt
      # produced by @transmute/cose (RFC 9942's editor's implementation: its RFC 9162
      # tree, its proof encoder, its CBOR) verified offline here, plus the mutations of
      # that receipt MCP-RE must refuse. No network and no peer install: the corpus is
      # committed octets, which is what makes the offline claim reproducible.
      - name: Third-party SCITT interoperability corpus (offline verification)
        run: cargo test -p mcp-re-conformance --test scitt_interop_test

  cargo-features:
    name: cargo test (feature-gated backends, 1.97.1)
    runs-on: ubuntu-latest
    # No live infra is provisioned here, so MCP_RE_REQUIRE_LIVE_INFRA is left unset
    # and the *_e2e_test suites self-skip. This job exercises the feature-gated
    # UNIT tests + adapter compilation only.
    steps:
      - uses: actions/checkout@v7

      # cryptoki-sys builds its FFI bindings with libclang (see the `cargo` job).
      - name: System build dependencies
        # The bounds on the fallback are not decoration; they are what the two earlier
        # attempts at this step were. With no bound at all, six jobs across four branches
        # sat in `apt-get update` for 28-58 minutes each reporting `pending` — which says
        # strictly less than a red would. With only `update` bounded, the `install` hung
        # instead. `Acquire::http::Timeout` does not help either: it bounds INACTIVITY,
        # and a transfer dribbling at 32 kB/s is never inactive.
        #
        # Nothing here is weakened. If the image ever stops shipping Clang the fallback
        # installs it exactly as before; a package that genuinely cannot be installed
        # still fails the step, and every gate below is untouched.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # cryptoki-sys builds its FFI bindings with bindgen, which needs libclang at
          # RUNTIME — the shared object, not the headers. The ubuntu-24.04 runner image
          # already ships Clang 18.1.3, so `libclang-dev` was re-downloading a library
          # the box already had: 28.8 MB fetched and ~292 MB unpacked, on every one of
          # three jobs, every run.
          #
          # That download is also the single least reliable thing in this workflow.
          # Measured on 2026-08-19 against the same Azure mirror, same file: 64.0 kB/s,
          # then 43.1 kB/s, then 32.1 kB/s — 14min 57s for the fetch alone, with the
          # unpack pushing past a 20-minute cap. Raising the cap is a race against a
          # mirror that keeps getting slower; not needing the file wins it outright.
          #
          # So: find what is already installed and point bindgen at it. apt is the
          # FALLBACK, not the default, and it keeps its bounds for the case where the
          # image stops shipping Clang.
          found=""
          for dir in /usr/lib/llvm-*/lib /usr/lib/x86_64-linux-gnu; do
            if compgen -G "$dir/libclang*.so*" > /dev/null 2>&1; then
              found="$dir"
              break
            fi
          done

          if [ -n "$found" ]; then
            echo "LIBCLANG_PATH=$found" >> "$GITHUB_ENV"
            echo "using the runner image's libclang in $found:"
            ls -1 "$found"/libclang*.so* | sed 's/^/  /'
          else
            echo "no libclang on the image — falling back to apt (bounded)"
            timeout 300 sudo apt-get update \
              || echo "apt-get update did not finish in 300s; using the runner image's package index"
            sudo apt-get install -y --no-install-recommends \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              libclang-dev
          fi

      - name: Select pinned toolchain (from rust-toolchain.toml)
        run: rustup show && rustc --version && cargo --version

      # Build the WHOLE workspace (not just -p mcp-re-proxy): the proxy's
      # integration tests spawn the cross-crate `echo-inner` fixture binary, which
      # cargo does NOT auto-build for another crate's integration tests.
      # `--workspace` puts it in target/debug for mcp-re-test-paths to find.
      # `async_serve,cpstore_etcd` are included so the async serving-path tests and
      # the async etcd authoritative replay store (MCPRE-117) get per-PR compile
      # coverage here: the replay_race_harness_test async lanes compile, the in-memory
      # async full-serving-path race RUNS, and the live Redis/etcd lanes self-skip
      # (no MCP_RE_REQUIRE_LIVE_INFRA — the nightly live-infra-e2e lane is where they
      # bind). Without cpstore_etcd the async etcd store would have NO per-PR build.
      - name: Build (workspace, all feature gates)
        run: >-
          cargo build --workspace --all-targets
          --features dev_env_key_source,pkcs11_keysource,redis_replay,online_ocsp,aws_kms_keysource,gcp_kms_keysource,async_serve,cpstore_etcd

      - name: Test (mcp-re-proxy, all feature gates; e2e self-skip without live infra)
        run: >-
          cargo test -p mcp-re-proxy
          --features dev_env_key_source,pkcs11_keysource,redis_replay,online_ocsp,aws_kms_keysource,gcp_kms_keysource,async_serve,cpstore_etcd

      # ADR-MCPRE-051 §7 release gates as NAMED, attributable lanes (MCPRE-123).
      # These targets also run inside the whole-suite step above; naming them makes
      # each a required release gate whose failure is unambiguous. Fast (cached build).

      # These suites now share the `integration_async` binary, so each lane selects
      # by module filter. `run_test_lane.sh` refuses a filter that matches nothing:
      # a missing BINARY exits 101, but a missing FILTER prints `0 passed` and exits
      # 0, which would make a release gate green having measured nothing.

      # §4 — cross-core / cross-replica replay race: exactly one Fresh, N-1 Replay,
      # zero Fresh when the store is Unavailable (fail-closed). (#314)
      - name: Release gate — replay race
        run: >-
          scripts/run_test_lane.sh cargo test -p mcp-re-proxy --features async_serve
          --test integration_async -- async_replay_test::

      # §6 — bounded graceful drain: in-flight requests complete, zero abandoned,
      # a stuck request cannot delay exit past the grace bound. (MCPRE-115)
      # Still its own binary: it runs under RUST_TEST_THREADS=1, which is a property
      # of a binary rather than of a test.
      - name: Release gate — bounded drain
        run: >-
          scripts/run_test_lane.sh cargo test -p mcp-re-proxy --features async_serve
          --test async_drain_test

      # §3 — inner plane: concurrent in-flight (no serial pipe) + pool-exhaustion
      # backpressure fails closed without queuing. (MCPRE-118)
      - name: Release gate — inner-plane concurrency + backpressure
        run: >-
          scripts/run_test_lane.sh cargo test -p mcp-re-proxy --features async_serve
          --test integration_async -- http_inner_test::

      # §7 — SLO gate mechanism self-check (MCPRE-110/123). Proves the gate logic
      # (correctness floors bite; declared capacity/scaling targets enforce; null
      # targets skip). Representative capacity ENFORCEMENT runs on the declared
      # hardware class per docs/bench/adr-051-slo-targets.md — the one HITL step.
      - name: Release gate — SLO gate mechanism (self-test)
        run: python3 scripts/slo_gate.py --selftest

      # LIVENESS of the standardized capacity instrument, not a measurement.
      #
      # The saturation rig is a cargo example driven by a script, so no test target
      # reaches it and no gate above can see it. When ADR-MCPRE-064 Slice 4 moved the
      # channel-binding operand to the request SUBJECT, the rig kept minting a client
      # leaf naming the composed actor id: every request it sent was refused
      # `mcp-re.transport_binding_failed` before backend dispatch, for eleven days, with
      # every check on every PR green. Nothing anywhere asked the instrument to send one
      # request.
      #
      # This asks. One core, one generator, 2000 requests, and NO throughput number — it
      # asserts zero failures, a non-zero rate and a backend CPU clock that moved. The
      # full sweep needs a quiet box and stays out of CI.
      - name: Release gate — saturation instrument liveness
        run: scripts/saturation_liveness.sh

  bazel:
    name: bazel semantic-drift gate + test parity
    runs-on: ubuntu-latest
    # ADR-MCPS-048 / MCPS-70 — the enforcement that makes generation stick.
    # Runs on Linux so the platform-gated crates (seccompiler, landlock) compile
    # (they are cfg'd out on macOS); this is also the canonical hermetic target.
    steps:
      - uses: actions/checkout@v7

      # The FFI closure (cryptoki-sys) builds bindings with libclang, same as the
      # cargo jobs; install it so the Bazel build links on a clean runner.
      - name: System build dependencies
        # The bounds on the fallback are not decoration; they are what the two earlier
        # attempts at this step were. With no bound at all, six jobs across four branches
        # sat in `apt-get update` for 28-58 minutes each reporting `pending` — which says
        # strictly less than a red would. With only `update` bounded, the `install` hung
        # instead. `Acquire::http::Timeout` does not help either: it bounds INACTIVITY,
        # and a transfer dribbling at 32 kB/s is never inactive.
        #
        # Nothing here is weakened. If the image ever stops shipping Clang the fallback
        # installs it exactly as before; a package that genuinely cannot be installed
        # still fails the step, and every gate below is untouched.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # cryptoki-sys builds its FFI bindings with bindgen, which needs libclang at
          # RUNTIME — the shared object, not the headers. The ubuntu-24.04 runner image
          # already ships Clang 18.1.3, so `libclang-dev` was re-downloading a library
          # the box already had: 28.8 MB fetched and ~292 MB unpacked, on every one of
          # three jobs, every run.
          #
          # That download is also the single least reliable thing in this workflow.
          # Measured on 2026-08-19 against the same Azure mirror, same file: 64.0 kB/s,
          # then 43.1 kB/s, then 32.1 kB/s — 14min 57s for the fetch alone, with the
          # unpack pushing past a 20-minute cap. Raising the cap is a race against a
          # mirror that keeps getting slower; not needing the file wins it outright.
          #
          # So: find what is already installed and point bindgen at it. apt is the
          # FALLBACK, not the default, and it keeps its bounds for the case where the
          # image stops shipping Clang.
          found=""
          for dir in /usr/lib/llvm-*/lib /usr/lib/x86_64-linux-gnu; do
            if compgen -G "$dir/libclang*.so*" > /dev/null 2>&1; then
              found="$dir"
              break
            fi
          done

          if [ -n "$found" ]; then
            echo "LIBCLANG_PATH=$found" >> "$GITHUB_ENV"
            echo "using the runner image's libclang in $found:"
            ls -1 "$found"/libclang*.so* | sed 's/^/  /'
          else
            echo "no libclang on the image — falling back to apt (bounded)"
            timeout 300 sudo apt-get update \
              || echo "apt-get update did not finish in 300s; using the runner image's package index"
            sudo apt-get install -y --no-install-recommends \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              libclang-dev
          fi

      # Cache the Bazel repository + disk cache across runs (crate_universe hub,
      # the gazelle_rust Go binary, rules_go/gazelle). Keyed on the module lock +
      # Cargo lock so a dependency change busts it.
      - name: Cache Bazel
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'Cargo.lock') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Bazel version
        run: bazel version

      # (1) Semantic-drift gate: fails if a `use`/test lacks its BUILD target/edge.
      - name: BUILD semantic-drift gate (gazelle as drift detector)
        run: python3 scripts/bazel_gazelle_gate.py

      # (2) Parity: the Bazel suite must pass like the cargo suite.
      - name: Bazel test parity (//...)
        run: bazel test //... --test_output=errors

  sdk-python:
    name: downloader — Python maturin wheel (no Bazel)
    runs-on: ubuntu-latest
    # ADR-MCPS-048 / MCPS-71 — the pip downloader path. sdk/python is its OWN
    # Cargo workspace (empty [workspace] table) linking the audited
    # mcp-re-client-core / mcp-re-core via path deps; the pyo3 layer is abi3-py39, so
    # ONE wheel serves any CPython >= 3.9. No cryptoki/openssl in the SDK closure,
    # so no libclang is needed. Bazel is neither installed nor invoked.
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7

      # Inside the package's declared range, and it has to be: this job INSTALLS the built
      # wheel, so an interpreter outside `requires-python` is refused by pip rather than
      # producing a weaker result. It was "3.12" until the 2026-09-05 narrowing to
      # `>=3.14.5,<3.15`, and the failure was the correct one —
      # `Package 'mcp-re-sdk' requires a different Python: 3.12.14 not in '<3.15,>=3.14.5'`.
      #
      # This job stays INDEPENDENT evidence over the installed artifact on a second OS, and
      # that independence is unaffected: what makes it independent is the OS, the installed
      # wheel and the directory-based selection, never the interpreter differing from the
      # one the authoritative matrix pins.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The pinned Rust toolchain (rust-toolchain.toml at the repo root) applies
      # here too — rustup walks up to it — so the wheel is built with the same
      # compiler as the cargo/bazel gates.
      - name: Select pinned toolchain (from rust-toolchain.toml)
        run: rustup show && rustc --version && cargo --version

      - name: Install maturin
        run: pip install "maturin>=1.5,<2.0"

      - name: Build the release wheel
        run: maturin build --release --out dist

      - name: Regenerated parity oracle must match the committed one
        # The frozen cross-language oracle (sdk/fixtures/parity_vectors.json) is what
        # pins the Python and TypeScript bindings to the same bytes. If regenerating it
        # changes anything, a binding drifted from the core — fail rather than ship.
        working-directory: ${{ github.workspace }}
        run: |
          python -m venv /tmp/oracle
          /tmp/oracle/bin/pip install --quiet sdk/python/dist/*.whl 2>/dev/null \
            || /tmp/oracle/bin/pip install --quiet sdk/python/dist/*.whl
          /tmp/oracle/bin/python tools/gen_sdk_parity_fixture.py
          git diff --exit-code -- sdk/fixtures/parity_vectors.json

      # Clean-env smoke install: a fresh venv gets ONLY the built wheel plus the
      # upstream MCP SDK + pytest — never an editable install and never the
      # source python/ tree on sys.path, so `import mcp_re_sdk` resolves to the
      # INSTALLED wheel (its native mcp_re_sdk._core), proving the downloader
      # artifact stands on its own.
      # The upstream SDK is installed as the WHEEL'S OWN `mcp` extra, never as a
      # restated `"mcp>=…"` on this line. pyproject declares `mcp>=1.16,<2.0`; naming
      # the package here independently bypassed that cap, and when upstream published
      # mcp 2.0.0 — where `JSONRPCMessage` stopped being a RootModel and became a
      # plain union alias, so it is neither callable nor carries `.root` — this job
      # installed it and 33 SDK tests failed on a branch that had not touched the SDK.
      # One source for the constraint, the same rule VERSION and config/ports.toml get.
      - name: Clean-env install (wheel only) + smoke import
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          WHEEL="$(ls dist/*.whl)"
          /tmp/venv/bin/pip install "${WHEEL}[mcp]" "pytest>=8" "pytest-cov>=5"
          /tmp/venv/bin/python -c "import mcp_re_sdk, mcp_re_sdk._core; print('wheel import OK')"

      # Run the SDK suite against the installed wheel from the repo root so the
      # source package cannot shadow it. Coverage is gated at the repo-wide 90% bar
      # by [tool.coverage.report] fail_under in sdk/python/pyproject.toml.
      - name: pytest + coverage gate (installed wheel)
        working-directory: ${{ github.workspace }}
        run: |
          /tmp/venv/bin/python -m pytest sdk/python/tests -q \
            --cov --cov-config=sdk/python/pyproject.toml --cov-report=term-missing

  sdk-typescript:
    name: downloader — TypeScript napi package (no Bazel)
    runs-on: ubuntu-latest
    # ADR-MCPS-048 / MCPS-71 — the npm downloader path. sdk/typescript is its OWN
    # Cargo workspace (empty [workspace] table) linking mcp-re-client-core via a
    # path dep; @napi-rs/cli builds the Node native addon. Bazel is neither
    # installed nor invoked.
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Select pinned toolchain (from rust-toolchain.toml)
        run: rustup show && rustc --version && cargo --version

      - name: Install JS dependencies
        run: npm ci

      # napi build (native .node) + tsc (dist/). This is the published artifact's
      # exact build.
      - name: Build native addon + TypeScript
        run: npm run build

      # `napi build` REGENERATES the committed native/binding.js loader. This job
      # already ran it, but nothing checked whether the tree changed — so binding.js
      # sat at @napi-rs/cli 3.8.0's output after the pin moved to 3.8.1, and the loader
      # that shipped documented different NAPI_RS_FORCE_WASI semantics than the pinned
      # generator produces. Generation is deterministic, so any diff here is real drift:
      # run `npm run build:native` and commit the result.
      - name: Generated napi loader is in sync with the pinned CLI
        run: git diff --exit-code -- native/binding.js native/binding.d.ts

      # Coverage is gated at the repo-wide 90% bar by the `thresholds` block in
      # sdk/typescript/vitest.config.ts; the run fails below it.
      - name: Test + coverage gate (vitest)
        run: npx vitest run --coverage

      # Clean-env smoke install: pack the tarball exactly as published, install it
      # into an EMPTY project (no dev deps, no workspace), and require it — the
      # bundled native/*.node must load on its own.
      - name: Pack + clean-dir install smoke
        run: |
          npm pack --pack-destination /tmp
          TGZ=$(ls -t /tmp/mcp-re-sdk-*.tgz | head -1)
          mkdir -p /tmp/npm-smoke && cd /tmp/npm-smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$TGZ"
          node -e "const m=require('@mcp-re/sdk'); if(typeof m.signRequest!=='function'){throw new Error('napi package export missing');} console.log('npm package require OK')"
