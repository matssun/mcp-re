# SPDX-License-Identifier: Apache-2.0
#
# MCP-RE supply-chain gate — enforces //config/supply-chain.toml (audit gap G-4,
# MCPS-077, issue #3980) over the crates the Bazel build graph reaches:
# `scripts/supply_chain_gate.py` checks sources, licenses, duplicate-version bans,
# RustSec advisories and yanked versions.
#
# It is a workflow rather than a Bazel test because the advisory check needs the
# network at check time: the RustSec database and the crates.io index move
# independently of this repository. That is also why it runs on a schedule — a graph
# that passed on merge day can carry a published vulnerability a week later with no
# commit to trigger a re-check.
name: supply chain

on:
  push:
    branches: [main]
  pull_request:
    # The policy, and everything that decides the graph: the crate specs and their
    # lock, and the BUILD files whose dependencies select which crates are built.
    paths:
      - "config/supply-chain.toml"
      - "MODULE.bazel"
      - "bazel/crates.lock"
      - "**/BUILD.bazel"
      - "scripts/supply_chain_gate.py"
      - ".github/workflows/mcp-re-supply-chain.yml"
  schedule:
    # Daily, 04:17 UTC — off the hour to avoid GitHub's scheduling stampede.
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supply-chain:
    name: supply chain (sources, licenses, bans, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Supply-chain gate selftest
        run: python3 scripts/supply_chain_gate.py --selftest

      # The database as of this run: its freshness is the point of the check.
      - name: Fetch the RustSec advisory database
        run: git clone --depth 1 https://github.com/rustsec/advisory-db "$RUNNER_TEMP/advisory-db"

      - name: Supply-chain gate (the Bazel build graph)
        run: python3 scripts/supply_chain_gate.py --advisory-db "$RUNNER_TEMP/advisory-db"
