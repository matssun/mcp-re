# SPDX-License-Identifier: Apache-2.0
#
# Dependabot VERSION updates. Security ALERTS were already on for this repository
# (that is how the postcss advisory surfaced), but alerts only tell you a tree has
# gone bad — nothing was opening the pull request that fixes it, so every bump was
# a manual errand. This closes that loop.
#
# Enforcement is unchanged: `.github/workflows/mcp-re-supply-chain.yml` runs
# cargo-deny over //deny.toml on every lockfile change, so a Dependabot PR that
# pulls a crate with a disallowed license, a RustSec advisory, or a yanked version
# fails the gate like any other change. Dependabot proposes; the gate decides.
#
# Updates are GROUPED per ecosystem: ~250 resolved crates across four lockfiles
# would otherwise generate a PR per crate per week, and a review queue nobody
# reads is the same as no review at all. Security updates stay ungrouped and
# immediate — that is Dependabot's default and is deliberately not overridden.
version: 2

updates:
  # All four Cargo lockfiles. A crate is only watched if the manifest that
  # reaches it is listed, and these are separate crate universes: the root
  # workspace (shipped proxy), the two SDK trees (pyo3 / napi), and the test-only
  # mock PKCS#11 provider that the proxy's PKCS#11 suite links.
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/sdk/python"
      - "/sdk/typescript"
      - "/mcp-re-proxy/tests/mock-pkcs11"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        # Majors stay out of the group: in this tree a major is a semantic
        # change (rustls, redis, pyo3 all move APIs), and it deserves its own PR
        # and its own test run rather than riding along in a bulk bump.
        update-types: ["minor", "patch"]

  # sdk/typescript ships an npm package; demo/video/mcps-intro is the render-only
  # demo where the postcss advisory landed.
  - package-ecosystem: "npm"
    directories:
      - "/sdk/typescript"
      - "/demo/video/mcps-intro"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # The Python SDK's uv.lock (dev/test extras — the published wheel has no hard
  # runtime dependencies).
  - package-ecosystem: "uv"
    directory: "/sdk/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      uv-minor-patch:
        update-types: ["minor", "patch"]

  # Workflow actions. These are currently referenced by moving major tags
  # (actions/checkout@v4, ...), so this is what keeps them current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        update-types: ["minor", "patch"]
