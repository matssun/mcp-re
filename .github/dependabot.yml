# SPDX-License-Identifier: Apache-2.0
#
# Dependabot VERSION updates. Security ALERTS were already on for this repository
# (that is how the postcss advisory surfaced), but alerts only tell you a tree has
# gone bad — nothing was opening the pull request that fixes it, so every bump was
# a manual errand. This closes that loop.
#
# Enforcement is unchanged: `.github/workflows/mcp-re-supply-chain.yml` runs
# cargo-deny over //deny.toml on every lockfile change, so a Dependabot PR that
# pulls a crate with a disallowed license, a RustSec advisory, or a yanked version
# fails the gate like any other change. Dependabot proposes; the gate decides.
#
# Updates are GROUPED per ecosystem: ~250 resolved crates across four lockfiles
# would otherwise generate a PR per crate per week, and a review queue nobody
# reads is the same as no review at all. Security updates stay ungrouped and
# immediate — that is Dependabot's default and is deliberately not overridden.
version: 2

updates:
  # All four Cargo lockfiles. A crate is only watched if the manifest that
  # reaches it is listed, and these are separate crate universes: the root
  # workspace (shipped proxy), the two SDK trees (pyo3 / napi), and the test-only
  # mock PKCS#11 provider that the proxy's PKCS#11 suite links.
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/sdk/python"
      - "/sdk/typescript"
      - "/mcp-re-proxy/tests/mock-pkcs11"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        # Majors stay out of the group: in this tree a major is a semantic
        # change (rustls, redis, pyo3 all move APIs), and it deserves its own PR
        # and its own test run rather than riding along in a bulk bump.
        update-types: ["minor", "patch"]
    ignore:
      # The RustCrypto stack moves as ONE generation or not at all. The tree is on
      # `digest 0.11` (sha2 0.11 / ed25519-dalek 3 / hmac 0.13 / curve25519-dalek 5
      # / signature 3), and a lone bump of any single member does not advance it —
      # it forks it, leaving the signing binary with two independent SHA-256
      # implementations. That is precisely how sha2 0.11 first landed (PR #457,
      # unattended) and forked all four lockfiles with nothing going red.
      #
      # //deny.toml now denies the duplicate outright, so such a PR could only ever
      # be a red one; these entries stop it being opened at all. Bump this set by
      # hand, together, in a single change.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "digest"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "hmac"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "ed25519-dalek"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "curve25519-dalek"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # `asn1-rs` must track whatever `x509-parser` resolves — the BitString built
      # in mcp-re-proxy/src/ocsp.rs is passed straight into x509-parser's
      # `verify_signature`, so a version split there is a hard COMPILE error, not a
      # duplicate warning. The x509-parser 0.18 bump (PR #455) left asn1-rs at 0.6
      # and broke the `online_ocsp` build on main; only the feature-gated CI lane
      # sees it. Bump the two together, by hand.
      - dependency-name: "asn1-rs"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "x509-parser"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # `der`, `spki` and `x509-cert` are PINNED BY x509-ocsp 0.2.1 — the newest
      # release — which requires der 0.7.8 / spki 0.7.2 / x509-cert 0.2.4. ocsp.rs
      # passes values of all three straight into x509_ocsp's OcspRequestBuilder,
      # CertId and BasicOcspResponse, so a split is a hard COMPILE error. There is
      # no version of x509-ocsp on der 0.8, so these cannot move while OCSP exists.
      # Both were merged unattended (PRs #471, #472) and had to be reverted.
      - dependency-name: "der"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "spki"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "x509-cert"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # rcgen 0.14 replaced `signed_by(&key, &cert, &key)` with an `Issuer` type
      # across 26 fixture call sites. Held at 0.13 until that migration lands;
      # tracked in #478. Remove this entry as part of it.
      - dependency-name: "rcgen"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # sdk/typescript ships an npm package; demo/video/mcps-intro is the render-only
  # demo where the postcss advisory landed.
  - package-ecosystem: "npm"
    directories:
      - "/sdk/typescript"
      - "/demo/video/mcps-intro"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Python. Both manifests are `pip`, not `uv`: sdk/python/uv.lock is gitignored
  # (sdk/python/.gitignore) and has never been committed, so Dependabot cannot see a
  # lockfile there — what it can read is the PEP 621 pyproject, whose dev/test extras
  # are the whole Python dependency surface (the published wheel has no hard runtime
  # deps, `dependencies = []`).
  #
  # mcp-re-conformance/tools carries the exactly-pinned `cryptography` that the RFC 9421
  # cross-verification no-merge gate depends on for an Ed25519 implementation independent
  # of ed25519-dalek. Alerts already reach that file; without it listed here nothing
  # opens the PR that bumps the pin, which is the one place a stale pin is load-bearing.
  # An exact pin is updated in place, so the gate stays deterministic.
  - package-ecosystem: "pip"
    directories:
      - "/sdk/python"
      - "/mcp-re-conformance/tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  # Workflow actions. These are currently referenced by moving major tags
  # (actions/checkout@v4, ...), so this is what keeps them current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        update-types: ["minor", "patch"]
