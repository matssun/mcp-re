# MCP Runtime Evidence (MCP-RE) — Cargo workspace root
#
# A clean-room, public Zero Trust security profile for the Model Context Protocol.
# See ADR-MCPS-001..012.
#
# This workspace is self-contained and firewalled from the rest of the monorepo
# (ADR-MCPS-001): it depends on no other in-repo crate and no Python component.
# Canonical hermetic build/test is `bazel test //...`
# (ADR-MCPS-012); these Cargo manifests are authoritative for rust-analyzer,
# local dev, and future standalone extraction to a public repository.

[workspace]
resolver = "2"
members = [
    "mcp-re-core",        # Pure verification crate — no networking/async/fs (ADR-MCPS-011)
    "mcp-re-conformance", # Black-box conformance runner (object + HTTP harnesses)
    "mcp-re-proxy",       # Server-side sidecar (async/HTTP-first PEP; ADR-MCPRE-051)
    "mcp-re-host",        # Client-side ambassador (request signing, response verification)
    "mcp-re-client-core", # Client-side shared seam for proxy + SDK (ADR-MCPS-044) — signed draft-02 requests, response binding
    "mcp-re-client-proxy",# Client-side MCP-RE proxy library (transport-agnostic seam) — plain-MCP -> sign -> forward -> verify (ADR-MCPS-044)
    "mcp-re-transport",   # Client-side mTLS transport (MCPS-053 — verifying rustls client)
    "mcp-re-policy",      # Delegation/authorization profiles (Phase 5 — placeholder)
    "mcp-re-http-profile", # ADR-MCPRE-050 minimal proof path — RFC 9421 + RFC 9530 HTTP standards profile (pure: no networking/async/fs)
    "mcp-re-demo",        # mTLS/fixtures demo surface — host-side HostSession client + DemoFixtures (HTTP-profile only; stdio removed)
    "mcp-re-test-paths",  # Test-only: resolve binaries + data fixtures under Bazel runfiles OR Cargo
]

[workspace.package]
edition = "2021"
version = "0.14.0"
license = "Apache-2.0"
authors = ["Mats Sundvall"]
repository = "https://github.com/matssun/mcp-re"

# Shared dependency versions across the workspace. mcp-re-core uses only the
# pure subset (serde / serde_json / ed25519-dalek / sha2 / base64 / thiserror);
# networking/async crates (tokio/axum/...) are reserved for mcp-re-proxy /
# mcp-re-host / mcp-re-conformance and MUST NOT be referenced by mcp-re-core
# (ADR-MCPS-011/012 purity rule). RustCrypto ecosystem — no custom crypto.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# MCPS-076 (audit gap G-3): enable the `zeroize` feature so dalek's `SigningKey`
# (the in-memory expanded private key) is `ZeroizeOnDrop` — its secret scalar is
# scrubbed when the key drops. `zeroize` is already a transitive dep of dalek;
# this only turns on dalek's own zeroizing wrapper.
# (MCPS-088): `pkcs8` lets the OCSP responder-signature TESTS import an
# rcgen-minted issuer key into a dalek signer to sign a response fixture (the only
# in-tree, Bazel-addressable signer). Production code does not use it.
# `alloc` is required ALONGSIDE `pkcs8` in dalek 3: the `EncodePrivateKey` impl for
# `SigningKey` is gated `all(feature = "alloc", feature = "pkcs8")`, where 2.x
# implied alloc from pkcs8. Without it the OCSP responder-signature test fixture
# cannot serialise its rcgen-minted issuer key.
ed25519-dalek = { version = "3", features = ["zeroize", "pkcs8", "alloc"] }
# The RustCrypto hashing core moves as ONE generation — see the matching
# `deny-multiple-versions` entries in //deny.toml, which fail the build if a
# second one ever enters the graph. sha2 0.11 / ed25519-dalek 3 / hmac 0.13 /
# curve25519-dalek 5 / signature 3 are all the `digest 0.11` generation and are
# bumped together here; taking any one of them alone does not migrate the tree,
# it forks it, leaving the signing binary with two independent SHA-256
# implementations (ours and the one dalek hashes with internally).
sha2 = "0.11"
base64 = "0.23"
thiserror = "2.0"
hex = "0.4"
# MCPS-076 (audit gap G-3): scrub raw-seed-bearing OWNED temporaries (the
# Base64URL-decoded `Vec<u8>`, the `[u8;32]` seed, the env/file seed text) via
# `zeroize::Zeroizing` so the private seed is wiped from the heap/stack the moment
# those temporaries drop. A pure crate (no networking/async) — used only by
# mcp-re-proxy's `key_source`; mcp-re-core relies on the dalek `zeroize` FEATURE only.
zeroize = "1"
# MCPS-033 (ADR-MCPS-015): OS CSPRNG for the host session's production nonce
# source. Used ONLY by mcp-re-host (the injected NonceSource trait keeps tests
# deterministic). A thin OS-entropy wrapper — NO networking/async runtime, so
# mcp-re-host stays transport-free. mcp-re-core MUST NOT reference it.
getrandom = "0.4"
# MCPS-037 (ADR-MCPS-016): Unix setrlimit(2) + RLIMIT_* constants for inner-server
# resource hardening (NOT sandboxing). Used ONLY by mcp-re-proxy's inner-launch
# layer, behind #[cfg(unix)], inside a pre_exec hook (async-signal-safe:
# setrlimit-only). mcp-re-core stays pure and MUST NOT reference it.
libc = "0.2"

# Phase 6 (ADR-MCPS-014) transport hardening — used ONLY by mcp-re-proxy's transport
# layer (blocking std::net + rustls; NO async runtime). mcp-re-core stays pure and
# MUST NOT reference these. `ring` provider (not aws-lc) keeps the isolated
# crates_mcp_re hub lean; x509-parser extracts the verified client identity.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
# (MCPS-088): the `verify` feature pulls x509-parser's
# `ring`-backed, algorithm-agnostic signature verifier (RSA PKCS#1 SHA-256/384/512
# + ECDSA P-256/P-384), used by the OCSP responder-signature trust check. `ring` is
# already in the closure (rustls' provider), so this barely grows it. The verify
# CODE ships in the proxy's `online_ocsp` module (it is no longer behind a
# separate feature); enabling `verify` here makes the API available to it.
x509-parser = { version = "0.18", features = ["verify"] }
# (MCPS-088): asn1-rs BitString type for the OCSP responder-signature verify
# path. This MUST track whatever x509-parser resolves — the BitString built here
# is passed straight into `x509_parser::verify::verify_signature`, so a version
# split is a hard type error, not a duplicate-crate warning. x509-parser 0.18
# moved to asn1-rs 0.7; leaving this at 0.6 broke the `online_ocsp` build.
asn1-rs = "0.7"
# Test-only: mint a CA + server + client certs in-process for the mTLS round-trip
# tests (no committed private-key fixtures, no secret-scanner exposure).
# HELD AT 0.13 pending the 0.14 migration, tracked separately. 0.14 replaced
# `signed_by(&key, &issuer_cert, &issuer_key)` with an `Issuer` type across 26 call
# sites in the demo fixtures and mTLS suites. That migration is a change to the
# fixture helpers in its own right and does not belong in a dependency-policy PR.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Test/demo-only: rcgen's cert validity fields are `time::OffsetDateTime`; the demo
# fixtures need `now`-relative arithmetic to mint a short-lived (< strict 3600s
# ceiling) client cert. Same `time` version rcgen already resolves — no new pin.
time = { version = "0.3", default-features = false, features = ["std"] }

# Phase 7 external backends (ADR-MCPS-019). All used ONLY by mcp-re-proxy, all
# OPTIONAL/feature- or target-gated so the DEFAULT (Mac dev) closure is unchanged
# and stays lean (ADR-MCPS-018). All SYNC — the proxy is a blocking serve loop
# (ADR-MCPS-014), so no async runtime is pulled in.
# HSM/KMS key custody via standard PKCS#11 (vendor-neutral; tested against
# an in-tree mock PKCS#11 provider — never a host security system). We bind the
# RAW FFI crate `cryptoki-sys` (libloading only) and own a small safe wrapper in
# mcp-re-proxy/src/pkcs11_native.rs, rather than the high-level `cryptoki` crate
# which transitively pulls the UNMAINTAINED `paste` (RUSTSEC-2024-0436) and fails
# the cargo-deny gate. Pinned to the exact version already in Cargo.lock.
cryptoki-sys = "0.5.0"
# Shared atomic ReplayCache backend (sync redis; default-features off = no aio/tokio).
# `tls-rustls` is what makes a `rediss://` URL usable at all: the replay tier and the
# trust-epoch counter carry admitted nonces and the epoch that drives response
# signing, so an operator must be able to encrypt and authenticate that hop. It
# resolves to rustls/std + rustls/ring + rustls-native-certs — the SAME rustls-ring
# stack already in the closure (TLS termination, ureq), reading the pod's own trust
# store, so no second TLS implementation enters the build.
redis = { version = "1.4", default-features = false, features = ["tls-rustls"] }
# Online OCSP/CRL revocation: x509-ocsp = pure-Rust ASN.1 OCSP req/resp
# (`builder` for CertId/request construction); ureq = blocking HTTP client (OCSP
# nominal transport is HTTP), no tokio. der/spki/x509-cert/sha2 are the codec +
# SHA-256 CertID companions — ALL already pinned transitively (via x509-parser),
# so declaring them direct pulls ZERO new crates. SHA-256 CertIDs (no SHA-1 dep).
x509-ocsp = { version = "0.2", features = ["builder"] }
ureq = { version = "2", default-features = false }
# ADR-MCPS-028 (AWS KMS Ed25519 signer, feature `aws_kms_keysource`): SigV4 request
# signing uses HMAC-SHA256 over RustCrypto primitives (sha2 is already in-closure),
# NOT the async `aws-sdk-kms`/tokio/Smithy stack — the ADR-MCPS-018 lean-sync firewall
# is a hard constraint. A pure, no-async crate; HTTPS transport reuses the blocking
# `ureq` client (its `tls` feature is enabled only in mcp-re-proxy under that feature).
# 0.13 is the `digest 0.11` generation — moves in lockstep with sha2/dalek above.
hmac = "0.13"
# der/spki/x509-cert are PINNED BY x509-ocsp 0.2.1 (the newest release), which
# requires der 0.7.8 / spki 0.7.2 / x509-cert 0.2.4. ocsp.rs builds der, spki and
# x509-cert values and passes them straight into x509_ocsp's OcspRequestBuilder,
# CertId and BasicOcspResponse, so a version split across that boundary is a hard
# TYPE error, not a duplicate-version warning. der 0.8 / x509-cert 0.3 cannot be
# adopted while OCSP exists; //.github/dependabot.yml ignores both.
der = "0.7"
spki = "0.7"
x509-cert = "0.2"
# (sha2 is already a workspace dependency — reused via `workspace = true`.)
# Linux kernel sandbox (Landlock fs ruleset + seccomp egress). Linux-only;
# referenced ONLY under mcp-re-proxy's [target.'cfg(target_os="linux")'.dependencies]
# so the Mac build excludes them entirely.
landlock = "0.4"
seccompiler = "0.4"

# ADR-MCPRE-051 Phase 2 (§1) — OPT-IN async serving path, behind the mcp-re-proxy
# `async_serve` feature ONLY. The DEFAULT/production proxy closure stays the
# blocking std::net + rustls path (ADR-MCPS-014/018 lean-sync firewall) and links
# NONE of these; only the `:mcp_re_proxy_async` Bazel flavor + its tests do. Per
# ADR-MCPRE-051 §1 a shared runtime is dev scaffolding only (per-core is MCPRE-113).
# `tokio-rustls` reuses the EXACT rustls 0.23 `ServerConfig` the blocking path
# builds (same mTLS verifier + CRL + identity extraction), so verification is
# byte-identical — only the I/O transport becomes async. mcp-re-core stays pure.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# `client` adds the client-side HTTP/1+2 role for the async inner plane
# (ADR-MCPRE-051 §3): the per-core pooled hyper client to stateless
# Streamable-HTTP inner backends. Server role is the ingress data plane.
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
# `client-legacy` is hyper-util's pooled, keep-alive Client (connection reuse to
# the inner backends); `client` its shared client utils. Server/server-auto is the
# ingress side. All roles share one hyper/tokio closure.
hyper-util = { version = "0.1", features = ["server", "server-auto", "client", "client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
