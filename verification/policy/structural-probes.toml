[probe.producer_paths]
module-tree-visibility = "both fields are bare-private to `config_state::client_credential_window`: no `pub(crate)`, no `pub(super)`, and the parent `config_state` module re-exports the TYPE only. A sibling module in the owner's own crate is exactly what this probe injects"
