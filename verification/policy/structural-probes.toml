generated-or-deserialization = "the derives are Debug/Clone/Copy/PartialEq/Eq. No Serialize, no Deserialize, and the deployment request is parsed into `Duration`s that `new` then adjudicates, so no decoder fills the fields positionally"
test-only-construction = "the owner's `#[cfg(test)] mod tests` constructs only through `classify_and_validate`; no test-gated constructor and no test-gated field visibility exists. A `#[cfg(test)]` constructor would be a producer even though it never runs in production, because the compiler would admit the construction"

