# falsify the constructor's runtime refusal of an illegal (connection_age, cert_lifetime)
# pair — a real `tested` proposition with a real falsifier — while the SOLE-PRODUCER fact
# they cannot touch had nothing attacking it. This probe attacks that second proposition,
# and only it: `cargo check` passing over the tree witnesses nothing, because nothing in the
# tree attempts the construction.

[[probe]]
id = "S04"
unit = "proxy.client_credential_window_sole_producer"
kind = "in-crate-source-injection"
package = "mcp-re-proxy"
invariant = "no code outside `config_state::client_credential_window` can assemble a ClientCredentialWindow, so possession means the pair passed `new`"
insertion_path = "mcp-re-proxy/src/config_state/structural_probe_s04.rs"
insertion_parent = "mcp-re-proxy/src/config_state/mod.rs"
insertion_declaration = "mod structural_probe_s04;"
marker = "STRUCTURAL-PROBE-SITE"
error_code = "E0451"
construction = """
// ADR-MCPRE-068 structural probe S04. Injected into a scratch copy by verify-structural;
// this file cannot exist in the working tree, because it would not build — which is the
// proposition it witnesses.
use std::time::Duration;

use crate::config_state::client_credential_window::ClientCredentialWindow;

pub fn hostile() -> ClientCredentialWindow {
    ClientCredentialWindow {
        cert_lifetime: Duration::from_secs(600), // STRUCTURAL-PROBE-SITE
