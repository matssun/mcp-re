[probe.producer_paths]
module-tree-visibility = "integration test: a separate crate against the public surface"
alternate-constructors = "no conversion exists from the unbound receipt to the bound product; the bound proposition carries a request-evidence agreement the unbound one never established"
generated-or-deserialization = "neither product derives Serialize/Deserialize"
test-only-construction = "the probe itself is the downstream test-code route"

