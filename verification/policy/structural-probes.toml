# --- proxy.client_credential_window ----------------------------------------------------
#
# ADR-MCPRE-068 §12.1 measured this unit as COMPOSITE: its M113/M114/M115 mutation probes
# falsify the constructor's runtime refusal of an illegal (connection_age, cert_lifetime)
# pair — a real `tested` proposition with a real falsifier — while the SOLE-PRODUCER fact
# they cannot touch had nothing attacking it. This probe attacks that second proposition,
# and only it: `cargo check` passing over the tree witnesses nothing, because nothing in the
# tree attempts the construction.

[[probe]]
id = "S04"
unit = "proxy.client_credential_window_sole_producer"
kind = "in-crate-source-injection"
package = "mcp-re-proxy"
invariant = "no code outside `config_state::client_credential_window` can assemble a ClientCredentialWindow, so possession means the pair passed `new`"
insertion_path = "mcp-re-proxy/src/config_state/structural_probe_s04.rs"
insertion_parent = "mcp-re-proxy/src/config_state/mod.rs"
insertion_declaration = "mod structural_probe_s04;"
marker = "STRUCTURAL-PROBE-SITE"
error_code = "E0451"
construction = """
// ADR-MCPRE-068 structural probe S04. Injected into a scratch copy by verify-structural;
// this file cannot exist in the working tree, because it would not build — which is the
// proposition it witnesses.
use std::time::Duration;

use crate::config_state::client_credential_window::ClientCredentialWindow;

pub fn hostile() -> ClientCredentialWindow {
    ClientCredentialWindow {
        cert_lifetime: Duration::from_secs(600), // STRUCTURAL-PROBE-SITE
        connection_age: Duration::from_secs(3000),
    }
}
"""
[probe.producer_paths]
module-tree-visibility = "both fields are bare-private to `config_state::client_credential_window`: no `pub(crate)`, no `pub(super)`, and the parent `config_state` module re-exports the TYPE only. A sibling module in the owner's own crate is exactly what this probe injects"
alternate-constructors = "`new` is the only associated function returning Self, and it is fallible; the module's `classify_and_validate` calls it. There is no `From`, no `Default`, no builder, and the three projections return `Duration`, never `&mut` or the representation"
generated-or-deserialization = "the derives are Debug/Clone/Copy/PartialEq/Eq. No Serialize, no Deserialize, and the deployment request is parsed into `Duration`s that `new` then adjudicates, so no decoder fills the fields positionally"
test-only-construction = "the owner's `#[cfg(test)] mod tests` constructs only through `classify_and_validate`; no test-gated constructor and no test-gated field visibility exists. A `#[cfg(test)]` constructor would be a producer even though it never runs in production, because the compiler would admit the construction"

