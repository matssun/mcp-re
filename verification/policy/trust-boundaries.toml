# SPDX-License-Identifier: Apache-2.0
#
# ADR-MCPRE-059 — declared trust boundaries.
#
# A trust boundary is a place where MCP-RE stops being able to prove and starts having to
# trust. Naming them is what keeps a proof's meaning honest: a theorem about code on one
# side of a boundary says nothing about the other side, and a reader who does not know
# where the boundary runs will over-read the proof.
#
# This file is descriptive input to the evidence graph, not a gate on its own. Its effect
# is that a unit whose paths cross a declared boundary cannot be promoted past the
# verification class the boundary permits without an explicit, registered assumption
# covering the crossing.

schema_version = 1

# ---------------------------------------------------------------------------
# Boundaries, from the Phase 0 inventory
# ---------------------------------------------------------------------------

[[boundary]]
id = "boundary.pkcs11"
description = "PKCS#11 hardware token, reached through the raw cryptoki-sys FFI."
kind = "ffi"
paths = [
  "mcp-re-proxy/src/pkcs11_native.rs",
  # MCPRE-175 split the keysource into owner modules. A GLOB rather than today's members:
  # this boundary bounds the class of any unit whose closure reaches the token, and a
  # member added later that starts calling `cryptoki_sys` would otherwise sit outside the
  # boundary silently — narrowing what `boundary_class_violations` can see, which is the
  # direction that produces an over-read.
  "mcp-re-proxy/src/pkcs11_keysource/**/*.rs",
]
beyond = "The token's own implementation of key custody, signing, and object attributes."
max_class_without_assumption = "V0"

[[boundary]]
id = "boundary.libc"
description = "Kernel sockets, signals, and process credentials via libc."
kind = "ffi"
paths = [
  "mcp-re-proxy/src/async_fleet/**/*.rs",
  "mcp-re-proxy/src/app.rs",
  "mcp-re-proxy/src/main.rs",
  "mcp-re-client/src/startup.rs",
]
beyond = "Kernel behaviour, including SO_REUSEPORT connection distribution and signal delivery."
max_class_without_assumption = "V0"

[[boundary]]
id = "boundary.crypto_primitives"
description = "Ed25519 and SHA-256 as implemented by ed25519-dalek and sha2."
kind = "cryptographic"
paths = [
  "mcp-re-core/src/crypto.rs",
  "mcp-re-core/src/hash.rs",
]
beyond = "Collision resistance, unforgeability, and the constant-time properties of the primitives themselves."
max_class_without_assumption = "V0"

[[boundary]]
id = "boundary.external_kms"
description = "AWS KMS, GCP KMS, and the delegated-signing authorities they root."
kind = "external-service"
paths = [
  "mcp-re-proxy/src/aws_kms_keysource.rs",
  "mcp-re-proxy/src/gcp_kms_keysource.rs",
]
beyond = "Whether the service performed the operation it reports having performed, with the key it names."
max_class_without_assumption = "V0"

[[boundary]]
id = "boundary.clock"
description = """
ACQUISITION of wall-clock time from the operating system. The authority this boundary
names is the act of asking the OS what time it is and treating the answer as true — not
the handling of a timestamp that some caller already supplied.
"""
kind = "environment"
# Every production site that calls `std::time::SystemTime::now()` directly, i.e. every
# place the OS clock actually enters the system. Two of these are the wrappers the rest
# of the codebase reads time through — `mcp-re-host/src/clock.rs` (`SystemClock`, the
# injected `Clock` seam) and `mcp-re-proxy/src/clock.rs` (`now_unix()`). Callers of
# those wrappers are NOT listed: they consume an already-acquired value and hold no
# clock authority of their own, so listing them would model the call graph instead of
# the authority.
#
# Each wrapper is a module that owns clock acquisition and nothing else, which is what
# lets this boundary stay narrow: the declared surface is the code that exercises the
# authority, not whatever larger module happens to contain it.
paths = [
  "mcp-re-client/src/startup.rs",
  "mcp-re-demo/src/demo_fixtures.rs",
  "mcp-re-host/src/clock.rs",
  # MCPRE-175: the store's own eviction clock is the only `SystemTime` read left in the
  # replay tier, and it moved to the module that owns what is retained. Named precisely,
  # per the note above: the authority, not the module tree that contains it.
  "mcp-re-proxy/src/async_replay/retained_set.rs",
  "mcp-re-proxy/src/aws_kms_keysource.rs",
  "mcp-re-proxy/src/aws_sts.rs",
  "mcp-re-proxy/src/clock.rs",
  # MCPRE-176: the clock read belongs to the in-memory tier's own expiry, and moved with
  # it. Named precisely, per the note above: the authority, not the module tree.
  "mcp-re-proxy/src/continuation_store/in_memory.rs",
  "mcp-re-proxy/src/etcd_store.rs",
  "mcp-re-proxy/src/gcp_kms_keysource.rs",
  "mcp-re-proxy/src/ocsp.rs",
  "mcp-re-proxy/src/redis_store.rs",
  "mcp-re-proxy/src/retained_evidence.rs",
  "mcp-re-proxy/src/shared_replay.rs",
  "mcp-re-proxy/src/tls.rs",
  "mcp-re-proxy/src/trust_plane/trust_cache.rs",
]
beyond = "Whether wall-clock time is within the skew bound of any peer's."
max_class_without_assumption = "V0"

# --- what this boundary deliberately does NOT cover --------------------------------
#
# CORRECTION, 2026-08-11. This boundary previously declared
# `paths = ["mcp-re-core/src/time.rs"]`, which was wrong in both directions: it named a
# module that holds no clock authority, and it named none of the sixteen that do.
#
# The declaration was inert for as long as it was wrong. `max_class_without_assumption`
# was validated as a string and enforced nowhere; when the enforcement was implemented
# (`boundary_class_violations`), the contradiction surfaced immediately as
# `unit core.time_rfc3339 is class V1 but its paths cross boundary.clock`. The unit was
# never the defect. This entry was.
#
# It is repaired as an assurance-policy correction, not by relaxing the gate: no
# assumption was registered (there was nothing to trust — the parser has no clock
# dependency), and `core.time_rfc3339` remains V1 with its proof intact.
#
# 1. TIMESTAMP TRANSFORMATION IS NOT CLOCK ACQUISITION.
#    `mcp-re-core/src/time.rs` converts between RFC 3339 text and Unix seconds. It reads
#    no clock, and it cannot: `mcp-re-core` contains no `SystemTime`, no `Instant`, and
#    no `UNIX_EPOCH`, which ADR-MCPS-011/012 manifest purity enforces. Per ADR-MCPS-006
#    core pushes timestamps to its callers. Trusting the OS clock and transforming a
#    value someone else supplied are different security responsibilities, and they do not
#    share a boundary merely because both involve time.
#
# 2. MONOTONIC TIME IS A DIFFERENT AUTHORITY.
#    Production files use `std::time::Instant` for local deadlines and elapsed-time
#    measurement: `mcp-re-client/src/serve/` and `mcp-re-transport/src/limits.rs`, and
#    mcp-re-proxy's `async_serve/`, cli.rs, delegated_tls.rs, `http_inner/`,
#    managed_worker.rs, `stage_timers/`, trust_epoch.rs. (MCPRE-175 made three of those
#    owner subtrees; the count is deliberately not restated, because an inventory with a
#    number in it goes stale in a way the reader cannot see.) `Instant` is monotonic and not
#    comparable to any peer's clock, so it cannot participate in the skew question this
#    boundary's `beyond` names. Whether the monotonic clock deserves a boundary of its
#    own is an OPEN QUESTION for the owner; it is recorded here rather than silently
#    folded into this one.
#
# 3. PARAMETER CONVERSION IS NOT ACQUISITION — but a file may do both.
#    `mcp-re-proxy/src/ocsp.rs` converts a supplied instant in
#    `system_time_to_unix(now: SystemTime)`, which on its own would not be acquisition.
#    It is nonetheless LISTED, because it also reads the clock directly at ocsp.rs:322,
#    supplying the reference instant against which an OCSP response's freshness — and so
#    a revocation verdict — is decided.
#
#    This entry was briefly absent. The scan that produced the first list truncated each
#    file at its FIRST `#[cfg(test)]`, which in ocsp.rs is an inline attribute at line
#    248, discarding the production call 74 lines later. Fifteen files in the workspace
#    carry such an early attribute. The lesson is recorded here rather than only in the
#    fix: a boundary derived by scanning is only as sound as the scanner's notion of
#    "production code", and that notion must be tested rather than assumed.
#
# The relationship this entry asserts is regression-tested against the source tree, not
# just against today's manifest — see `test_the_clock_boundary_names_every_acquisition_site`
# in tools/verification/test_measured_inputs.py, which re-derives the acquisition set and
# fails when a new `SystemTime::now()` site appears undeclared.

# ---------------------------------------------------------------------------
# Boundaries declared by the v0.17 TCB slice
# ---------------------------------------------------------------------------
#
# The registry above named five boundaries while `assumptions.toml` registered forty-one
# premises, and exactly ONE of those premises named a boundary in its scope. The relation
# was not missing from the schema — `scope` has always accepted `boundary://<id>`, and that
# is the single canonical direction, with every reverse view derived from it. It was
# unpopulated, which is worse than absent: `boundary_class_violations` consulted a relation
# that almost nothing declared, so the cap it enforces could not fire for the boundaries
# nobody had written down.
#
# The five entries below make the relation TOTAL. Every assumption now names what it
# crosses, `load_assumptions` refuses one that does not, and the reverse view is generated
# rather than stored.

[[boundary]]
id = "boundary.rust_std"
description = "The Rust standard and core libraries, and compiler-derived trait impls, whose behaviour a proof assumes rather than checks."
kind = "language-runtime"
# Where std's behaviour is ASSUMED, not where it is called. `assume_specification` is the
# mechanism, and it lives in the two specification modules — a boundary listing every file
# that calls `saturating_add` would name the whole workspace and bound nothing.
paths = [
  "mcp-re-core/src/verus_std_specs.rs",
  "mcp-re-http-profile/src/verus_std_specs.rs",
]
beyond = "The implementation of std/core, and the semantics the compiler gives a derived trait impl."
# NO CLASS CAP, deliberately, and this is the honest state rather than an oversight.
#
# `semantic_boundary_crossings` attributes a seam to a boundary by LOCATION — the seam must
# sit in a file the boundary declares — and both specification modules hold TWO kinds of
# seam: the `assume_specification` items that are std's behaviour, and the `uninterp` items
# (`labeled_digest`, `skew_of`, `validity_of`) that are MCP-RE's own and belong to
# `boundary.unmodelled_own_behaviour`. A cap here therefore fires on any unit whose cone
# reaches the file at all, which it did: `http_profile.continuation_binding` and
# `http_profile.continuation_unbypassability` were reported as trusting std while the seams
# their proofs actually consume there are the own-code ones, already registered as
# ASM-0024/0025/0026 and already scoped to both units.
#
# The two available answers were both wrong. Registering std premises for those units would
# INVENT two entries naming nothing anyone measured, in a registry whose whole value is
# that every entry names something real. Dropping the boundary would leave the language
# runtime absent from the trust inventory, which is the condition this slice exists to end.
#
# So the boundary is declared — a reader asking what this system trusts now gets std in the
# answer, with its premises listed under it — and the cap is left unset until seam
# attribution can separate two boundaries inside one module. That separation is a change to
# what a boundary declaration MEANS, is named as such in `semantic_boundary_crossings`'s own
# docstring, and is not made here. `check-assumptions` still refuses any UNREGISTERED seam,
# so no seam in these files goes unaccounted for in the meantime; what is not yet forced is
# that a std seam's assumption names this boundary.

[[boundary]]
id = "boundary.unmodelled_own_behaviour"
description = "MCP-RE's own behaviour, where the current proof or evidence lane stops at it and treats it as opaque."
kind = "proof-lane"
# The honest name for the largest class of premise in the registry, and the one §3 of the
# security boundary already names in prose: "MCP-RE's own behaviour, where a proof lane
# stops at it ... A premise being about code this project owns does not make it a result."
#
# It is a real boundary by this file's own definition — the place MCP-RE stops being able
# to prove and starts having to trust — and it is not FOREIGN. Keeping it in the same table
# rather than inventing a second one is the point: a reader asking "what does this system
# trust?" must get one answer, and the answer must include the premises about its own code.
paths = [
  "mcp-re-core/src/verus_proofs.rs",
  "mcp-re-core/src/time/mod.rs",
  "mcp-re-http-profile/src/admission.rs",
  "mcp-re-http-profile/src/artifact.rs",
  "mcp-re-http-profile/src/authoritative_admission.rs",
  "mcp-re-http-profile/src/block.rs",
  "mcp-re-http-profile/src/block/artifact_binding.rs",
  "mcp-re-http-profile/src/policy.rs",
  "mcp-re-http-profile/src/verified_request/floor.rs",
]
beyond = "The behaviour of MCP-RE code that the lane establishing the claim above it does not model."
max_class_without_assumption = "V0"

[[boundary]]
id = "boundary.x509"
description = "X.509 / ASN.1 certificate parsing, as implemented by the `x509-parser` dependency."
kind = "foreign-dependency"
paths = [
  "mcp-re-proxy/src/communication_assurance/**/*.rs",
  "mcp-re-proxy/src/client_revocation.rs",
]
beyond = "Whether the parser faithfully reports what the certificate bytes actually encode — SANs and their order, the subject CN, the SubjectPublicKeyInfo, the validity instants, the issuer and subject Name encodings, and the serial."
max_class_without_assumption = "V0"

[[boundary]]
id = "boundary.tls_mechanism"
description = "The TLS establishment mechanism, as implemented by rustls: what it accepts, what it reports about a relationship, and the trait contracts it imposes on a signer."
kind = "foreign-dependency"
paths = [
  "mcp-re-proxy/src/tls_listener_state/**/*.rs",
  "mcp-re-proxy/src/delegated_tls.rs",
  "mcp-re-proxy/src/delegated_tls/**/*.rs",
]
beyond = "Whether a handshake that reports success proved what the protocol says it proves, whether the reported chain is the peer's in the order claimed, and whether a resumed session continues an earlier authenticated one."
max_class_without_assumption = "V0"

[[boundary]]
id = "boundary.shared_state_store"
description = "The external stores a fleet's cross-replica state is kept in — Redis and etcd — and what an acknowledged write to one durably established."
kind = "external-service"
paths = [
  "mcp-re-proxy/src/redis_store.rs",
  "mcp-re-proxy/src/etcd_store.rs",
  "mcp-re-proxy/src/async_redis_store.rs",
  "mcp-re-proxy/src/async_etcd_store.rs",
  "mcp-re-proxy/src/shared_replay.rs",
  # v0.17 trust-plane ownership slice. The trust-epoch counter is read from the same store
  # class — `RedisEpochReader` holds a Redis connection of its own — and the file was not
  # listed, so a unit reaching it crossed this boundary without the model saying so. Named
  # precisely: the reader, not the cache that reacts to what it read.
  "mcp-re-proxy/src/trust_epoch.rs",
]
beyond = "Whether Redis replication and etcd consensus behave as their premises state. THM-0092's scope says this in as many words, and no umbrella premise stands in for both mechanisms."
max_class_without_assumption = "V0"

[[boundary]]
id = "boundary.monotonic_clock"
description = "MONOTONIC time — `std::time::Instant` — as the basis of every production deadline and elapsed-time measurement."
kind = "environment"
# SETTLED HERE, 2026-09-05. `boundary.clock`'s own note recorded this as "an OPEN QUESTION
# for the owner ... recorded here rather than silently folded into" the wall-clock boundary.
# An open question living in a comment is a fact the model does not hold, so it is answered
# in the model: monotonic time is its OWN authority, separate from `boundary.clock`, because
# the two are trusted for different things. A wall clock is trusted to agree with a peer's
# within a skew bound; a monotonic clock is trusted to advance, and to advance at a rate
# that makes a deadline mean a duration. Neither premise implies the other.
#
# No assumption names it today, and that is the correct state rather than a gap: no unit
# above V0 crosses it, so nothing has yet had to trust it in a claim. The declaration is
# what makes the cap live the moment one does.
paths = [
  "mcp-re-client/src/serve/deadlines.rs",
  "mcp-re-transport/src/limits.rs",
  "mcp-re-proxy/src/stage_timers/**/*.rs",
  "mcp-re-proxy/src/managed_worker/**/*.rs",
]
beyond = "That the monotonic clock advances, and that it advances at a rate which makes an elapsed measurement a duration. It is not comparable to any peer's clock, which is why it is not boundary.clock."
max_class_without_assumption = "V0"

# ---------------------------------------------------------------------------
# What is deliberately NOT a boundary
# ---------------------------------------------------------------------------
#
# `mcp-re-core` and `mcp-re-http-profile` contain no `unsafe`, no FFI, no networking, no
# async, and no filesystem access, enforced by their manifests under ADR-MCPS-011/012.
# Inside those crates there is nothing to trust that is not either declared above or
# ordinary Rust — which is why both pilot candidates for the extracted-model path were
# drawn from there.
