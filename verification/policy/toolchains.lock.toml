note = """
The release's own rustc requirement equals the [rust] channel pinned above, so the
divergence anticipated in that section does not currently exist. A Verus bump that moves
this off 1.97.1 reintroduces it and must be recorded rather than resolved by letting two
Rust toolchains float.

install_root is platform-specific and is the only host-dependent value here; a Linux CI
runner resolves a different source_url/sha256 for the same release, and that lane's
identity must be recorded separately before it may report a PASS.
"""

[verus.binaries]
state = "resolved"
verus = "sha256:72b8b03b8341580500306e9b422360a7361c5a61ffde282874f960e58ed99550"
rust_verify = "sha256:51b413e6160f06d44d6b1fcb05e1f36386f9d0e30c57e2af16d4eff0954e4966"
cargo-verus = "sha256:b9204f01a05d06bbe73fb02af4a76b41c8afa938ac822d044299e9f37a9410a0"
note = """
R9-C083. Every key is a file name under `verus.install_root`, digested. Nothing identified
these before: the lane checked `vstd.vir` and the commit `version.json` DECLARES, and a
substituted `rust_verify` that shipped the pinned vstd beside a truthful version.json
passed both. The two checks established that the pinned SPECIFICATION LIBRARY was present,
which was read as establishing that the pinned PROVER was — and it is the prover that
decides whether an obligation is discharged.

version.json remains checked and is not made redundant by these. A digest says which bytes
are on disk; the declared commit says what those bytes claim to be, and a mismatch between
the two is a different defect from a mismatch with the lock.

Platform-specific, exactly as `verus.install_root` and `verus.source_url` already are: a
Linux runner installs a different build of the same release and must record its identity
here separately before that lane may report a PASS. This is the divergence the [verus]
note already anticipates, now with a second host-dependent value rather than one.
"""

[verus.vstd]
state = "resolved"
identity = "sha256:0970f728e2f537def9a465410df665ea7071c7de0f66d86022390d2876c6df22"
rlib_identity = "sha256:0221751f5a0d2fa91a31a580eea35282b59bff970a6be0eeb19836c716aab3a0"
note = """
`identity` is vstd.vir — the specification library the proofs are STATED against.
`rlib_identity` is libvstd.rlib, the compiled library they LINK against, and the two can
differ: a .vir matching the pin while the .rlib beside it does not is an installation
assembled from two releases.

The rlib digest was recorded in this note (R9-C083) and nowhere else. `note` is the one
field `_toolchain_identity` strips from the fingerprint, so a digest written there is
stripped from every identity that quotes it — a value present for a human reader and
absent from every check and every attestation. A digest belongs in a key, and a key is
what it is now.
"""

[verus.z3]
state = "resolved"
version = "4.16.0"
path = "z3"
identity = "sha256:edae32f9e37ea4b5bb35310d72f0e352d0dc07626cac4e9e30bc1ea9a5bc8efb"
note = """
`identity` was the sentence "bundled in the pinned Verus release archive" (R9-C070). That
is a claim about where the solver comes from, not a statement of which bytes answered the
queries: it could not be compared with anything, and the solver is the component that
DECIDES each proof obligation. A solver that answers `unsat` to everything discharges every
proof in the repository, and a lock that identifies it by provenance prose cannot tell that
one from this one.

`path` is relative to `verus.install_root`. It is recorded rather than assumed because the
lane now sets `VERUS_Z3_PATH` to exactly this file: the process previously inherited that
variable from the environment, so the pinned prover ran with whichever solver the caller
named while the lock read as fully pinned.
"""

# ---------------------------------------------------------------------------
# Aeneas / Lean lane — required before any V2 unit exists
# ---------------------------------------------------------------------------

# ADR-MCPRE-059 §19. Everything in this lane resolves INSIDE the extraction container, not
# on the macOS host. Charon is a rustc driver: on aarch64-apple-darwin the `rustc-dev`
# component ships the compiler crates as .rmeta only (no .rlib for the crates Charon names),
# so Charon cannot link there. On aarch64-unknown-linux-gnu the same component ships the
# .rlib files and Charon builds unmodified. The host is changed rather than the tool.

[extraction_container]
# UNRESOLVED, and that is the mechanism rather than an unfinished step. The image this
# entry used to name was published to a container registry by hand on 2026-08-10, is not a
# build of the definition this tree declares, and cannot run the Lean half at all. Nothing
# is pinned until a build of the CURRENT definition is made and its identity recorded here.
state = "unresolved"
definition = "verification/extraction/Dockerfile"
platform = "linux/arm64"
note = """
WHAT A BUILD MUST RECORD, and why each field exists.

  artifact_digest   the image's own content digest, as `tools/verification/extraction-image
                    identity` reports it — what EXECUTES. REQUIRED: the declared pins do not
                    determine the image. This definition still resolves apt package versions
                    and opam library versions at build time, and the opam libraries build the
                    Aeneas binary — so a different `visitors` or `zarith` can produce a
                    different extracted model from identical Rust. An identity derived from
                    the pins alone would say which toolchain was INTENDED and nothing about
                    which one ran.

  archive_digest    SHA-256 over the PRESERVED ARCHIVE's exact bytes, under
                    /opt/verification/extraction-artifacts/sha256/<artifact_digest>.tar.
                    REQUIRED for the reason above, one step further: because the image
                    cannot be rebuilt, an identity over bytes that live only in Docker's
                    local store is a claim a `docker image prune` turns into a name for an
                    environment nothing can execute again — still identifiable, no longer
                    reproducible. The archive is the copy that survives, and this digest is
                    the independent check that the file in the store is that image's
                    preserved form. `tools/verification/extraction-image load` refuses on a
                    mismatch and reports UNAVAILABLE when the file is absent; it never
                    rebuilds, because a rebuild is a different instrument.

  definition_digest the Dockerfile the image was built from. MCPRE-181: the pin went on
                    naming an image built from a definition that had changed three times,
                    because nothing compared them. `load_toolchains` now refuses a lock whose
                    `tag` does not follow from this plus the pins, so every consumer inherits
                    the refusal instead of one script remembering to ask.

  tag               computed from the declared inputs by `_extraction_identity.content_tag`,
                    never chosen. It is the DECLARED identity; `artifact_digest` is the one
                    that was PRODUCED, and keeping both is what makes the two questions —
                    "does the record follow from its own inputs" and "is the pin a build of
                    what the tree declares" — separately answerable.

  platform          an amd64 build of identical pins is a different instrument.

WHERE THE BYTES ARE KEPT IS NOT PART OF THE IDENTITY, BUT THAT THEY ARE KEPT IS PART OF THE
EVIDENCE. A content digest identifies an image whether it sits in a local image store or a
registry, and the assurance requirement is that Lean evidence names the environment that
produced it and is invalidated when that environment changes — not that the environment is
published anywhere. What that leaves open is preservation: a digest is identity, and identity
over deleted bytes is a claim nobody can re-run. So the artifact is persisted outside
Docker's disposable state under `archive_digest`, and no registry is introduced. The
extraction image is a formal-verification toolchain artifact; it is never a deployable
MCP-RE product image, and its digest is an artifact identity rather than a release or
deployment claim. Ruling:
verification/reviews/rulings/extraction-artifact-storage-2026-09-09.md.

WHAT IS NOT CLAIMED: that this artifact can be reconstructed from the Dockerfile
indefinitely. The unpinned apt and opam inputs above are a measured limitation. What a
preserved artifact establishes is the honest, weaker thing — this theorem was checked
against THIS exact preserved extraction artifact.
"""

[charon]
state = "resolved"
commit = "340b1af4df92608d0911fc2ba26eef3fd3a30ab4"
source_url = "https://github.com/AeneasVerif/charon"
rust_toolchain = "nightly-2026-06-01"
rust_target = "aarch64-unknown-linux-gnu"
rust_components = ["rustc-dev", "llvm-tools-preview", "rust-src", "miri"]
note = """
The commit is not chosen independently: it is the one named in the pinned Aeneas
checkout's `charon-pin`. Charon and Aeneas move as a pair, and pinning them separately
would let an extraction run against a Charon whose LLBC output the pinned Aeneas does not
claim to accept.

The nightly is a THIRD Rust toolchain, distinct from both the [rust] channel and the one
Verus requires. This is the divergence the [rust] note anticipates, recorded rather than
resolved: it is confined to the extraction step and never compiles production code.

Resolved together with [extraction_container]: a commit alone does not identify what a
build of it produces; the pair (commit, image digest) does.
"""

[aeneas]
state = "resolved"
commit = "daa85d7e89400fa978be83fedbc7e475a83f0889"
source_url = "https://github.com/AeneasVerif/aeneas"
ocaml_compiler = "5.3.0"
note = """
Built inside the extraction container. Aeneas' Makefile requires GNU Make; Apple's
bundled Make 3.81 is rejected outright, which the container makes moot.

Resolved together with [extraction_container], for the same reason as [charon].
"""

[lean]
state = "resolved"
toolchain = "leanprover/lean4:v4.31.0"
source = "verification/lean/lean-toolchain"
# The axioms that are the PROVER'S LOGIC rather than this repository's premises. Every other
# name in a theorem's `#print axioms` closure is a proposition MCP-RE is trusting and must be
# an ASM-NNNN scoped to the unit, or `verify-lean` refuses.
#
# Recorded here, against `toolchain`, because the baseline is a property of the pinned Lean:
# these three are what Lean 4's own standard library rests on, and a Lean bump is exactly the
# event that could change the set. A baseline hard-coded in the lane would keep reading as
# correct across such a bump; one declared with no identity beside it would say which axioms
# are fine without saying whose.
#
# `sorryAx` is deliberately not here and is not registrable anywhere. `sorry` is the ABSENCE
# of a proof, not a premise, and Lean elaborates a file full of them and reports success.
kernel_axioms = ["Classical.choice", "Quot.sound", "propext"]
note = """
NOT a free choice: this is the toolchain the pinned Aeneas Lean backend declares in its own
`backends/lean/lean-toolchain`. A generated model is proved against the Aeneas Lean
library, so a repository Lean that differs from the backend's does not type-check the
model — it type-checks nothing.

The extraction image installs elan, whose default stable Lean is NEWER than this. The
default is therefore not the pin, and `verification/lean/lean-toolchain` is what makes the
correct one selected rather than the convenient one.

Resolved together with [extraction_container], for the same reason as [charon].
"""

[aeneas_lean_backend]
state = "resolved"
package_revision = "daa85d7e89400fa978be83fedbc7e475a83f0889"
mathlib_revision = "fabf563a7c95a166b8d7b6efca11c8b4dc9d911f"
note = """
The Aeneas Lean backend/package revision, which moves independently of Aeneas itself. At
the pinned Aeneas commit the backend ships in-tree, so its revision is that commit; the
mathlib revision comes from the backend's own lake-manifest.json and is recorded because a
theorem proved with a different mathlib is a theorem proved in a different environment.
"""

# ---------------------------------------------------------------------------
# The Python RUNTIME set — ADR-MCPRE-059 §28 / issue #746
# ---------------------------------------------------------------------------
#
# ECOSYSTEM-SCOPED, unlike every table above it. `ecosystem = "python"` means this identity
# enters the fingerprint of Python units ONLY. A global entry would make a CPython patch
# bump dirty all 76 units including every Rust one, which states a blast radius that did
# not happen; the interpreter decides the outcome of the Python batteries and nothing else.
#
# WHY THE RUNTIME IS A TOOLCHAIN AT ALL. THM-0094's repaired aggregate read bound rests on
# production `http.client.HTTPResponse.read1` behaviour — stdlib behaviour, which is a
# per-minor fact. Until this entry existed the battery ran on whatever CPython `uv` found
# on the runner, and that interpreter was not a fingerprint input: a runner upgraded from
# 3.14 to 3.15 would have changed the runtime under every control while the unit
# fingerprint stayed put and no review went stale. Measured on 2026-09-03 and recorded in
# packet 6B §9.
#
# EXACT PATCH VERSIONS, not minors. A minor list would let two runs on 3.12.9 and 3.12.20
# record the same identity, which is the "resolved by PATH" failure one level down. The
# lane refuses to run a battery in an environment whose interpreter does not report exactly
# one of these.
#
# THE SET IS THE SUPPORTED SET. `sdk/python/pyproject.toml` declares
# `requires-python = ">=3.14.5,<3.15"`, and every minor in that range is measured here. If
# they diverge the support claim is wider than the evidence, which is the defect this entry
# exists to stop; `scripts/python_runtime_gate.py` fails the build on divergence.
#
# NARROWED 2026-09-05, from five minors to one, by owner ruling. The range was ">=3.10"
# inherited from the upstream MCP SDK's own floor, which is not this package's obligation:
# it cost a battery on five interpreters to hold a claim nobody had decided to make. The
# floor's PATCH component is load-bearing — 3.14.0 through 3.14.4 ship the incremental
# cycle collector upstream reverted in 3.14.5 — and the gate reads the minor, so 3.14.7
# below is the measured representative of the claimed 3.14 line exactly as 3.10.20 was of
# 3.10 before it.
#
# This narrowing invalidated the standing THM-0094 approval rather than merely trimming a
# list: that review record ratifies the supported-runtime boundary conjunct by conjunct,
# naming CPython 3.10 through 3.14. A narrower claim is a different claim and needs its own
# review.
[python]
state = "resolved"
ecosystem = "python"
interpreters = ["3.14.7"]
source = "sdk/python/pyproject.toml requires-python; installed by scripts/prepare_python_matrix.sh"
note = """
Patch versions are the ones `uv python install` resolves for these minors at the pin date.
Bumping one is a security-relevant evidence change exactly like a Rust channel bump: it
moves every Python unit's fingerprint, drops the standing test attestations, and reruns the
batteries.
"""

# ---------------------------------------------------------------------------
# The Node RUNTIME set — ADR-MCPRE-059 §28 / issue #747
# ---------------------------------------------------------------------------
#
# The Python entry's sibling, and it exists for the same measured reason: the TypeScript
# battery ran under `npx vitest`, which resolves whatever node is on PATH, so the result
# described an unnamed runtime. `package.json` declared no `engines` at all, so that SDK
# made no runtime support claim for a gate to compare against — a claim of NOTHING is not
# narrower than the evidence, it is unreadable, and an unreadable claim cannot be exceeded
# or satisfied.
#
# ECOSYSTEM-SCOPED, like `[python]`: this identity enters TypeScript units' fingerprints
# only.
#
# BY MAJOR LINE, because that is how Node support is expressed. `engines.node` admits
# `^20 || ^22 || ^24 || ^26`, so one pin per major answers exactly one question; two pins
# inside one major would be two answers, and `scripts/node_runtime_gate.py` refuses it.
# The odd-numbered lines are deliberately absent: they are never LTS, and a range spelling
# like `>=20 <27` would claim them while nothing measures them.
#
# THE FLOOR IS NOT A PREFERENCE. `@modelcontextprotocol/client` and `…/core` both declare
# `node >= 20`, and vitest admits `^20 || ^22 || >=24`; 20 is the oldest line the shipped
# dependencies themselves support.
[typescript]
state = "resolved"
ecosystem = "typescript"
interpreters = ["20.20.2", "22.23.2", "24.20.0", "26.8.1"]
source = "sdk/typescript/package.json engines.node; installed by scripts/prepare_node_matrix.sh"
note = """
`interpreters` rather than a Node-specific key name: it is the same fact the Python entry
records — the exact runtime a battery is measured on — and one concept with two key names
is how two lanes come to disagree about what a pin means.

The versions are what the registry's `node@<major>` tags resolved to at the pin date.
Bumping one is a security-relevant evidence change: it moves every TypeScript unit's
fingerprint, drops the standing test attestations, and reruns the battery.
"""

# ---------------------------------------------------------------------------
# The verification schema itself
# ---------------------------------------------------------------------------

[verification_schema]
state = "resolved"
revision = 1
note = "Bumping this invalidates every attestation, because the meaning of a fingerprint changed."
