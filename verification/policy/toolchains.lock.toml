note = """
The release's own rustc requirement equals the [rust] channel pinned above, so the
divergence anticipated in that section does not currently exist. A Verus bump that moves
this off 1.97.1 reintroduces it and must be recorded rather than resolved by letting two
Rust toolchains float.

install_root is platform-specific and is the only host-dependent value here; a Linux CI
runner resolves a different source_url/sha256 for the same release, and that lane's
identity must be recorded separately before it may report a PASS.
"""

[verus.vstd]
state = "resolved"
identity = "sha256:0970f728e2f537def9a465410df665ea7071c7de0f66d86022390d2876c6df22"
note = "sha256 of vstd.vir as shipped in the pinned release; libvstd.rlib is 0221751f5a0d2fa91a31a580eea35282b59bff970a6be0eeb19836c716aab3a0."

[verus.z3]
state = "resolved"
version = "4.16.0"
identity = "bundled in the pinned Verus release archive"
note = "As packaged or required by the pinned Verus release, not whatever Z3 is on PATH."

# ---------------------------------------------------------------------------
# Aeneas / Lean lane — required before any V2 unit exists
# ---------------------------------------------------------------------------

# ADR-MCPRE-059 §19. Everything in this lane resolves INSIDE the extraction container, not
# on the macOS host. Charon is a rustc driver: on aarch64-apple-darwin the `rustc-dev`
# component ships the compiler crates as .rmeta only (no .rlib for the crates Charon names),
# so Charon cannot link there. On aarch64-unknown-linux-gnu the same component ships the
# .rlib files and Charon builds unmodified. The host is changed rather than the tool.

[extraction_container]
state = "resolved"
image = "ghcr.io/matssun/mcp-re-verification-extraction"
digest = "sha256:42318bba386ace68eb1b5ff7173259d3e485fc506cab76d6e40970dc987f7dce"
tag = "tc-09eedf0aaf503302"
platform = "linux/arm64"
definition = "verification/extraction/Dockerfile"
note = """
Pinned by DIGEST, never by tag: a tag is a mutable pointer, so a lane pinned to one could
produce two different models from the same declared toolchain. `tag` is recorded for human
navigation only — nothing resolves through it.

The tag is derived from the pinned toolchain contents by tools/verification/extraction-image,
NOT from VERSION. Tying it to the product release would mint a new digest on every release
with an unchanged prover (invalidating all formal evidence for nothing), and would leave
the tag unmoved when a toolchain pin changed — a stale pointer to a different prover.

This digest is the OCI index. It carries the linux/arm64 manifest the Apple Silicon runner
selects; an amd64 build of identical pins is a different image with a different digest,
which is why `platform` is part of the identity rather than an incidental detail.
"""

[charon]
state = "resolved"
commit = "340b1af4df92608d0911fc2ba26eef3fd3a30ab4"
source_url = "https://github.com/AeneasVerif/charon"
rust_toolchain = "nightly-2026-06-01"
rust_target = "aarch64-unknown-linux-gnu"
rust_components = ["rustc-dev", "llvm-tools-preview", "rust-src", "miri"]
note = """
The commit is not chosen independently: it is the one named in the pinned Aeneas
checkout's `charon-pin`. Charon and Aeneas move as a pair, and pinning them separately
would let an extraction run against a Charon whose LLBC output the pinned Aeneas does not
claim to accept.

The nightly is a THIRD Rust toolchain, distinct from both the [rust] channel and the one
Verus requires. This is the divergence the [rust] note anticipates, recorded rather than
resolved: it is confined to the extraction step and never compiles production code.

Resolved together with [extraction_container]: a commit alone does not identify what a
build of it produces; the pair (commit, image digest) does.
"""

[aeneas]
state = "resolved"
commit = "daa85d7e89400fa978be83fedbc7e475a83f0889"
source_url = "https://github.com/AeneasVerif/aeneas"
ocaml_compiler = "5.3.0"
note = """
Built inside the extraction container. Aeneas' Makefile requires GNU Make; Apple's
bundled Make 3.81 is rejected outright, which the container makes moot.

Resolved together with [extraction_container], for the same reason as [charon].
"""

[lean]
state = "resolved"
toolchain = "leanprover/lean4:v4.31.0"
source = "verification/lean/lean-toolchain"
note = """
NOT a free choice: this is the toolchain the pinned Aeneas Lean backend declares in its own
`backends/lean/lean-toolchain`. A generated model is proved against the Aeneas Lean
library, so a repository Lean that differs from the backend's does not type-check the
model — it type-checks nothing.

The extraction image installs elan, whose default stable Lean is NEWER than this. The
default is therefore not the pin, and `verification/lean/lean-toolchain` is what makes the
correct one selected rather than the convenient one.

Resolved together with [extraction_container], for the same reason as [charon].
"""

[aeneas_lean_backend]
state = "resolved"
package_revision = "daa85d7e89400fa978be83fedbc7e475a83f0889"
mathlib_revision = "fabf563a7c95a166b8d7b6efca11c8b4dc9d911f"
note = """
The Aeneas Lean backend/package revision, which moves independently of Aeneas itself. At
the pinned Aeneas commit the backend ships in-tree, so its revision is that commit; the
mathlib revision comes from the backend's own lake-manifest.json and is recorded because a
theorem proved with a different mathlib is a theorem proved in a different environment.
"""

# ---------------------------------------------------------------------------
# The Python RUNTIME set — ADR-MCPRE-059 §28 / issue #746
# ---------------------------------------------------------------------------
#
# ECOSYSTEM-SCOPED, unlike every table above it. `ecosystem = "python"` means this identity
# enters the fingerprint of Python units ONLY. A global entry would make a CPython patch
# bump dirty all 76 units including every Rust one, which states a blast radius that did
# not happen; the interpreter decides the outcome of the Python batteries and nothing else.
#
# WHY THE RUNTIME IS A TOOLCHAIN AT ALL. THM-0094's repaired aggregate read bound rests on
# production `http.client.HTTPResponse.read1` behaviour — stdlib behaviour, which is a
# per-minor fact. Until this entry existed the battery ran on whatever CPython `uv` found
# on the runner, and that interpreter was not a fingerprint input: a runner upgraded from
# 3.14 to 3.15 would have changed the runtime under every control while the unit
# fingerprint stayed put and no review went stale. Measured on 2026-09-03 and recorded in
# packet 6B §9.
#
# EXACT PATCH VERSIONS, not minors. A minor list would let two runs on 3.12.9 and 3.12.20
# record the same identity, which is the "resolved by PATH" failure one level down. The
# lane refuses to run a battery in an environment whose interpreter does not report exactly
# one of these.
#
# THE SET IS THE SUPPORTED SET. `sdk/python/pyproject.toml` declares
# `requires-python = ">=3.10,<3.15"`, and every minor in that range is measured here. If
# they diverge the support claim is wider than the evidence, which is the defect this entry
# exists to stop; `scripts/python_runtime_gate.py` fails the build on divergence.
[python]
state = "resolved"
ecosystem = "python"
interpreters = ["3.10.20", "3.11.15", "3.12.13", "3.13.15", "3.14.7"]
source = "sdk/python/pyproject.toml requires-python; installed by scripts/prepare_python_matrix.sh"
note = """
Patch versions are the ones `uv python install` resolves for these minors at the pin date.
Bumping one is a security-relevant evidence change exactly like a Rust channel bump: it
moves every Python unit's fingerprint, drops the standing test attestations, and reruns the
batteries.
"""

# ---------------------------------------------------------------------------
# The Node RUNTIME set — ADR-MCPRE-059 §28 / issue #747
# ---------------------------------------------------------------------------
#
# The Python entry's sibling, and it exists for the same measured reason: the TypeScript
# battery ran under `npx vitest`, which resolves whatever node is on PATH, so the result
# described an unnamed runtime. `package.json` declared no `engines` at all, so that SDK
# made no runtime support claim for a gate to compare against — a claim of NOTHING is not
# narrower than the evidence, it is unreadable, and an unreadable claim cannot be exceeded
# or satisfied.
#
# ECOSYSTEM-SCOPED, like `[python]`: this identity enters TypeScript units' fingerprints
# only.
#
# BY MAJOR LINE, because that is how Node support is expressed. `engines.node` admits
# `^20 || ^22 || ^24 || ^26`, so one pin per major answers exactly one question; two pins
# inside one major would be two answers, and `scripts/node_runtime_gate.py` refuses it.
# The odd-numbered lines are deliberately absent: they are never LTS, and a range spelling
# like `>=20 <27` would claim them while nothing measures them.
#
# THE FLOOR IS NOT A PREFERENCE. `@modelcontextprotocol/client` and `…/core` both declare
# `node >= 20`, and vitest admits `^20 || ^22 || >=24`; 20 is the oldest line the shipped
# dependencies themselves support.
[typescript]
state = "resolved"
ecosystem = "typescript"
interpreters = ["20.20.2", "22.23.2", "24.20.0", "26.8.1"]
source = "sdk/typescript/package.json engines.node; installed by scripts/prepare_node_matrix.sh"
note = """
`interpreters` rather than a Node-specific key name: it is the same fact the Python entry
records — the exact runtime a battery is measured on — and one concept with two key names
is how two lanes come to disagree about what a pin means.

The versions are what the registry's `node@<major>` tags resolved to at the pin date.
Bumping one is a security-relevant evidence change: it moves every TypeScript unit's
fingerprint, drops the standing test attestations, and reruns the battery.
"""

# ---------------------------------------------------------------------------
# The verification schema itself
# ---------------------------------------------------------------------------

[verification_schema]
state = "resolved"
revision = 1
note = "Bumping this invalidates every attestation, because the meaning of a fingerprint changed."
