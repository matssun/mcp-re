# ---------------------------------------------------------------------------
# The verifier's results — ADR-MCPRE-061 §2 class 9, closed by #570/#571
# ---------------------------------------------------------------------------
#
# Seven public operations produce seven deliberately different propositions, and two of
# those propositions have a genuinely shared half — the authorization-independent
# cryptographic facts, which the trust-seam and delegation-chain paths both establish. One
# review unit carries all of it, and the theorem layer allocates one claim per proposition,
# nine in total: the attacker stories differ, the evidence is shared, and
# `admission_currency` already sets the precedent for several claims over one unit.
#
# One unit rather than nine is the honest granularity. The propositions are separated by
# TYPE, but the source is not: they share `verify.rs`, so a fingerprint per operation would
# make the graph look more precise than the measurement is.
#
# This is class V0. There is no `ensures` over these operations — the prover reaches
# `check_params` (`http_profile.freshness_window`), not the operations that call it — so
# every claim resting here is supported by a test battery and nothing above it may say
# otherwise.
#
# `paths` is the COMPLETE security-relevant implementation closure of those operations,
# not the files whose names read like the claims. The first version named seven files and
# omitted `delegation.rs` — which implements the root signature check, credential
# freshness, audience/profile/scope, key-use, epoch, revocation and `cnf.jwk` consistency,
# i.e. most of what the two delegated claims actually assert. An edit there could
# materially weaken credential verification while this unit's fingerprint stayed put and
# the delegated claims still derived FRESH. That is the false-freshness defect the
# fingerprint exists to prevent, so the closure is now derived from what the operations
# CALL: the module closure of `verifier.rs`/`verify.rs`/`rejection.rs` inside the crate,
# plus the `mcp-re-core` files carrying the primitives (`crypto.rs` — `verify_ed25519_with`
# and the key types — with `error.rs` and `encoding.rs`).
#
# It is deliberately wider than any single claim needs. A narrower closure is legitimate
# only through a SEALED contract-consumption edge, and no unit here exports a contract yet;
# until one does, "this file is not really part of the claim" is a reviewer's belief and
# not a checked fact. Manufacturing fine-grained units to shrink fingerprints would trade a
# measured over-approximation for an unmeasured under-approximation.
#
# `artifact.rs` and `block.rs` also belong to `http_profile.artifact_typing`, and `verify.rs`,
# `policy.rs` and `ids.rs` also to `http_profile.freshness_window`. Overlap is not
# duplication: two units measuring the same file answer two different questions about it.

