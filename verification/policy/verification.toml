# SPDX-License-Identifier: Apache-2.0
#
# ADR-MCPRE-059 — the authoritative manifest for MCP-RE verification coverage and
# security-graph declarations.
#
# This file is source. The freshness attestations derived from it are not; they are
# CI/cache artifacts and must never be committed to make a gate pass.
#
# Validated by `tools/verification/verify --manifests`. Unknown keys are a validation
# FAILURE, not a silently ignored field: a typo in a security declaration must not read
# as an absent declaration.

schema_version = 1
policy_revision = "adr-mcpre-059-r1"

# ADR-MCPRE-059 §2. Missing input, unparsable metadata, an unrecognized edge, or a cache
# whose provenance cannot be established is DIRTY. Setting this false is a policy change
# and is itself security-sensitive.
unknown_is_dirty = true

# The revisions that participate in every ReviewFingerprint. Bumping one invalidates every
# unit scoped to it — that is the point, and it is why they are declared rather than
# implied.
formal_model_revision = "mcpre-model-r0"
threat_model_revision = "mcpre-threat-r0"

# ---------------------------------------------------------------------------
# Review units
# ---------------------------------------------------------------------------
#
# A review unit is the smallest architectural unit for which MCP-RE can make a stable
# statement about its source, contracts, and evidence (§1). It is NOT a file and NOT
# necessarily a crate.
#
# A unit does NOT declare the assumptions it trusts. That relation has one authoritative
# direction — `[[assumption]].scope` in assumptions.toml, §8 — because the assumption owns
# its own trust blast radius and can name a boundary as readily as a unit. `assumptions` is
# not an admissible key here, so the two declarations cannot disagree, which is what they
# did: nine pairs diverged, and three units carried theorems whose stated premises could be
# rewritten without the claim ever deriving DIRTY_ASSUMPTION. What a unit trusts is read
# from the generated owner and assumption-consumer views, which derive it.
#
# Classes (§9):
#   V0  ordinary code                      tests/conformance + Security Review Funnel
#   V1  executable security boundary       Verus contract/proof + existing controls
#   V2  semantic/algorithmic security core Aeneas/Lean theorem + existing controls
#   V3  exceptional high-assurance         complementary independent evidence, with a
#                                          stated reason naming the different failure
#                                          classes each approach closes
#
# The two units below are the Phase 0 pilot candidates named in
# baseline/phase0-assurance-baseline.md §6. They are declared at their CURRENT class
# (V0 — no formal evidence exists yet) and carry no `evidence` entries, because declaring
# evidence that has not been produced would be the exact falsehood this manifest exists to
# prevent. Phase 2 and Phase 3 promote them.

[[unit]]
id = "proxy.runtime_lifecycle"
class = "V0"
description = "The runtime lifecycle relation: 11 states, 10 events, one closed transition relation."
paths = ["mcp-re-proxy/src/runtime_state.rs"]
exported_contracts = []
# TWO evidence classes. THM-0012's scope says plainly that the uniqueness-of-path argument
# is "a match a reviewer reads, not a proof a prover checked" — exactly the situation where
# a passing battery says nothing about whether the relation is load-bearing. The probes
# weaken the relation and the mutator; the controls that notice are the claim's evidence.
evidence = [
  "test://proxy/runtime_lifecycle/transition_relation",
  "mutation://proxy/runtime_lifecycle/transition_relation",
]
# The battery the URI above names, by the path libtest reports each test under. The lane
# selects exactly these with `--exact`; a renamed or deleted member fails the lane rather
# than quietly shrinking the evidence behind a green unit.
tested_symbols = [
  "lib#runtime_state::tests::every_state_event_pair_is_either_explicitly_legal_or_rejected",
  "lib#runtime_state::tests::the_relation_has_exactly_ten_legal_transitions",
  "lib#runtime_state::tests::no_event_moves_a_terminal_state",
  "lib#runtime_state::tests::transitioning_is_reachable_only_from_draining_on_fleet_drained",
  "lib#runtime_state::tests::only_serving_admits_new_requests",
  "lib#runtime_state::tests::a_rejected_event_does_not_advance_the_lifecycle",
  "lib#runtime_state::tests::the_ordinary_lifecycle_runs_from_configured_to_stopped",
  "lib#runtime_state::tests::a_failed_materialization_ends_distinctly_from_a_served_shutdown",
]
pilot = "verus-candidate"

[[unit]]
id = "http_profile.keyid"
class = "V0"
description = "The MCP-RE half of the keyid derivation: the RFC 7638 canonical JWK form, which embeds its operand verbatim between fixed affixes, and the base64url-no-pad encoding of the digest — neither of which introduces a collision of its own."
paths = ["mcp-re-http-profile/src/keyid.rs"]
exported_contracts = []
evidence = [
  "test://http_profile/keyid/rfc8037_a3_known_answer",
  "test://http_profile/keyid/derivation_introduces_no_collisions",
]
# NO primitive assumption, and that is the point of the split. Everything this unit
# measures is a property of code MCP-RE wrote: the form is a fixed prefix, the operand
# verbatim, and a fixed suffix, so distinct operands have distinct forms for ANY operand
# — including one carrying JSON metacharacters — and base64url-no-pad is injective over the
# fixed 32-byte width of a SHA-256 output. THM-0055 rests here and inherits nothing about
# the digest.
tested_symbols = [
  "lib#keyid::tests::rfc8037_a3_known_answer",
  "lib#keyid::tests::canonical_form_is_lexicographic_and_unspaced",
  "lib#keyid::tests::thumbprint_is_deterministic_and_key_bound",
  "lib#keyid::tests::the_canonical_form_embeds_its_operand_verbatim_between_fixed_affixes",
  "lib#keyid::tests::distinct_operands_never_share_a_canonical_form",
  "lib#keyid::tests::the_keyid_encoding_is_injective_over_the_digest_width",
]
pilot = "lean-candidate"

[[unit]]
id = "http_profile.keyid_selector"
class = "V0"
description = "The keyid as a SELECTOR: that two distinct enrolled verification keys cannot feasibly be brought to the same keyid. It is the composition of the MCP-RE derivation with the primitive's collision resistance, and it is a separate unit precisely so the primitive assumption stays off the derivation claim."
# The same file, deliberately. Two units over one file because there are two propositions
# with two different trusted bases, and a single unit would make ASM-0037 a premise of
# THM-0055 — which is exactly backwards: the derivation half is proved without any
# assumption about the digest, and saying so is most of its value.
paths = ["mcp-re-http-profile/src/keyid.rs"]
exported_contracts = []
evidence = ["test://http_profile/keyid/derivation_introduces_no_collisions"]
# The MCP-RE half is measured here too, because the composition rests on it. What is NOT
# measurable is the other half, and nothing here pretends otherwise: no test can establish
# collision resistance, which is why ASM-0037 exists and why it is scoped to this unit and
# not to its sibling.
tested_symbols = [
  "lib#keyid::tests::the_canonical_form_embeds_its_operand_verbatim_between_fixed_affixes",
  "lib#keyid::tests::distinct_operands_never_share_a_canonical_form",
  "lib#keyid::tests::the_keyid_encoding_is_injective_over_the_digest_width",
]

