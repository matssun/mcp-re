]
# WHAT THIS IS AND IS NOT. It is the KMS-specific leaf: an AGREEMENT between two readings
# of one string. It is NOT a reachability claim — a config-time check over a host string
# cannot establish which authority a connection reaches under a rebinding-capable threat
# model, and #742 records that the proof ends at configuration parsing. The unit is
# registered at the width it owns so the fixes are covered; widening it by renaming would
# be the move the issue rules out.
tested_symbols = [
  # The two readings agree, which is the whole claim.
  "lib#kms_endpoint_policy::tests::the_authority_returned_is_the_host_and_port_that_will_be_reached",
