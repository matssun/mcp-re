# is what the index concludes. Each names WHICH refusal, so a weakening that swaps one for
# another goes red instead of staying green.
tested_symbols = [
  "lib#communication_assurance::credential_currency::evaluation::tests::a_deployment_that_configures_nothing_evaluates_nothing",
  "lib#communication_assurance::credential_currency::evaluation::tests::the_public_entrance_reports_an_unexamined_credential_as_unexamined",
