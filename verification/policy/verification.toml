[[edge]]
kind = "PROOF_DEPENDENCY"
from = "http_profile.submitted_hop_identity"
to = "http_profile.scitt_retained_correspondence"
rationale = """
The correspondence authority compares a statement's `submitted_commitment` against a
recomputed one and refuses a statement that identifies no submission. What that value MEANS
— which two retained submissions are the same submission — is not its fact, and it is the
half that was wrong: the comparison was correct while the identity omitted `signature-input`,
so two substitutable tail hops compared equal and correspondence reported a binding it did
not have. Neither half states the claim alone, and putting the identity under the comparison
would let a future curation of the digest pass as a property of the comparison.
"""
