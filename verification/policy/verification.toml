# ---------------------------------------------------------------------------
# The artifact verification boundary
# ---------------------------------------------------------------------------
#
# One proposition: the relation between an `ArtifactType` and what full-request
# verification can conclude about a binding of that type.
#
#     ArtifactType
#            |
#     closed full-request verification selection
#            |-- supported typed verification path -> may establish verified
#            +-- no supported typed verification path -> refuses
#
# Its own unit, and not a widening of `http_profile.artifact_typing`, because the two are
# different quantifiers. THM-0007 quantifies over ONE function's returns and is proved
# there; this quantifies over the DISPATCH — over every branch the enforcement loop can
# take — and its closure is therefore the vocabulary, the selection, and every typed
# verifier the selection can reach. ADR-MCPRE-065 Slice 2 added the second such verifier
# and deliberately did not route it through the first; the boundary proposition is what
# has to be re-measured when that happens, and having no unit that owned it is why
# THM-0008 became false without any lane going red.
#
# Class V0: the relation is established by a battery plus mutation probes, not by a proof.
# It CONSUMES THM-0007's proved postcondition for the OAuth branch rather than restating
# it — see `depends_on` on THM-0008.
#
# Both directions are evidence obligations, and the probes below are what make each one
# load-bearing rather than merely green:
#
#   1. every supported type reaches its intended typed verifier and cannot be accepted
#      through another one;
#   2. every unsupported registry type is refused rather than skipped or reported
#      verified.

[[unit]]
id = "http_profile.artifact_verification_boundary"
class = "V0"
description = "The closed artifact-type dispatch of full-request verification: a binding reported verified matched one explicitly supported typed verification branch and satisfied that branch's required binding form; every other artifact type is refused."
paths = [
  # The vocabulary the relation is over, and the structural validity every branch demands.
  "mcp-re-http-profile/src/block/artifact_binding.rs",
  # The block rules that decide whether the carried-decision evidence form is even
  # presentable: both halves or neither, exactly one applicable binding, never the
  # reference form.
  "mcp-re-http-profile/src/block.rs",
  # The selection itself — `enforce_full_profile_bindings`, and the credential resolution
  # that decides whether an OAuth branch is reachable at all.
  "mcp-re-http-profile/src/verify/full/request.rs",
