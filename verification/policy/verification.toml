# ---------------------------------------------------------------------------
# Contract-consumption edges
# ---------------------------------------------------------------------------
#
# `sealed = true` is an assurance obligation, not an optimization switch (§6, §"Contract
# sealing"). Before an edge may be sealed, a review must establish that the consumer's
# security reasoning about the dependency is FULLY represented by the named exported
# contract. If that sentence is not defensible, the edge is unsealed.
#
# The engine must never infer sealing after the fact. An edge is sealed by an explicit,
# reviewed commit to this file, before the change whose propagation it stops.
#
# No edges are declared yet: no unit exports a contract yet.

