# ---------------------------------------------------------------------------
# The verifier's results — ADR-MCPRE-061 §2 class 9, closed by #570/#571
# ---------------------------------------------------------------------------
#
# Seven public operations produce seven deliberately different propositions. One review
# unit carries them, and the theorem layer allocates one claim per proposition: the
# attacker stories differ, the evidence is shared, and `admission_currency` already sets
# the precedent for several claims over one unit.
#
# One unit rather than seven is the honest granularity. The propositions are separated by
# TYPE, but the source is not: they share `verify.rs`, so a fingerprint per operation would
# make the graph look more precise than the measurement is.
#
# This is class V0. There is no `ensures` over these operations — the prover reaches
# `check_params` (`http_profile.freshness_window`), not the operations that call it — so
