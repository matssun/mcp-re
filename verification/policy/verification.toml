evidence = [
  "test://http_profile/verify/freshness_window_vectors",
  "verus://http_profile/verify/check_params_admission_implies_fresh",
]
assumptions = ["ASM-0005", "ASM-0006", "ASM-0007", "ASM-0008", "ASM-0009", "ASM-0010"]
# The window battery spans two targets, and says so. `policy.rs` pins what a legal window
# and skew may be; the wire vectors in `tests/proof_path_test` exercise the admission
# decision over stale and degenerate windows. `verify.rs`'s own unit tests are structured-
