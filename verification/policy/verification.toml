# ---------------------------------------------------------------------------
# WP2 — the §7 admission currency decision
# ---------------------------------------------------------------------------
#
# The anti-rollback gate. Where http_profile.freshness_window proves a property of the
# window a message declares, this one proves a property of the verdict a PEP acts on: a
# live-confirmed admission implies the call's bound generation IS the authoritative one,
# and a degraded verdict implies the deployment opted in.
#
# Its trusted frontier is deliberately small and is the concrete case for Operational
# Rule 17: the proved function calls JWS decoding, Ed25519 verification, base64 and
# SHA-256, and NONE of them is in the theorem's dependency cone, because the property is
# established by the function's own comparisons. ASM-0012 records that this is a limit on
# what the theorem SAYS, not a hole in what it proves.

[[unit]]
id = "http_profile.admission_currency"
class = "V1"
description = "#415 §7 admission currency: an Ok verdict is Admitted at the bound generation; the admitted actor is the presenter of the call; a live verdict implies generation equality with the authoritative state; a degraded verdict implies explicit deployment opt-in."
paths = [
  "mcp-re-http-profile/src/admission.rs",
  "mcp-re-http-profile/src/verus_std_specs.rs",
]
exported_contracts = ["contract://http_profile/admission/check_admission"]
evidence = [
  "test://http_profile/admission/currency_and_degraded_battery",
  "verus://http_profile/admission/check_admission_currency",
]
assumptions = ["ASM-0011", "ASM-0012", "ASM-0013", "ASM-0014"]
# Two batteries over one owner. Currency and the degraded window are the cases the §7
# theorem is stated over all inputs of; assertion validity is the ASM-0012 surface the
# theorems explicitly disclaim, carried here as test evidence rather than as a proof.
tested_symbols = [
  "lib#admission::tests::a_current_admitted_workload_passes",
  "lib#admission::tests::an_assertion_issued_to_another_actor_does_not_admit_this_caller",
  "lib#admission::tests::a_stale_generation_is_rejected_even_though_the_assertion_is_valid",
  "lib#admission::tests::a_workload_revoked_after_issuance_is_refused",
  "lib#admission::tests::a_suspended_assertion_never_permits_a_call",
  "lib#admission::tests::an_untrusted_issuer_is_rejected",
  "lib#admission::tests::a_binding_committing_to_the_wrong_state_is_rejected",
  "lib#admission::tests::unreachable_state_fails_closed_by_default",
  "lib#admission::tests::degraded_mode_serves_within_p_but_not_beyond",
  "lib#admission::tests::a_zero_p_still_leaves_a_degraded_window_the_width_of_the_clock_skew",
  "lib#admission::tests::an_assertion_the_authority_did_not_sign_is_rejected",
  "lib#admission::tests::an_assertion_carrying_another_credentials_type_or_algorithm_is_rejected",
  "lib#admission::tests::an_assertion_for_another_profile_or_audience_is_rejected",
  "lib#admission::tests::an_assertion_outside_its_validity_window_is_rejected",
  "lib#admission::tests::an_assertion_older_than_the_verifiers_own_budget_is_rejected",
  "lib#admission::tests::an_assertion_dated_ahead_of_the_verifier_is_rejected",
  "lib#admission::tests::the_verdict_names_the_workload_the_binding_committed_to",
]
proved_symbols = ["mcp_re_http_profile::admission::check_admission"]
features = ["verify"]
pilot = "verus-wp2"

# ---------------------------------------------------------------------------
