# it is why the controls drive real handshakes rather than synthesising a chain.
assumptions = ["ASM-0033"]
# The four handshake controls are the characterization, kept: each names a state a
# production relationship can actually be in, and one of them —
# `a_peer_with_no_credential_never_reaches_an_established_relationship` — is what decides
# that an absent credential is a mechanism-boundary inconsistency rather than a domain
# state. If client auth ever became optional it goes red at exactly that measurement.
tested_symbols = [
  "lib#communication_assurance::channel_associated_credential::tests::an_associated_chain_is_carried_leaf_first",
  "lib#communication_assurance::channel_associated_credential::tests::an_empty_chain_is_not_a_credential",
  "lib#communication_assurance::channel_associated_credential::rustls_adapter::establishment::an_established_relationship_associates_the_credential_the_peer_presented",
  "lib#communication_assurance::channel_associated_credential::rustls_adapter::establishment::a_resumed_relationship_associates_the_same_credential_as_the_full_handshake",
  "lib#communication_assurance::channel_associated_credential::rustls_adapter::establishment::a_connection_that_has_not_established_associates_nothing",
  "lib#communication_assurance::channel_associated_credential::rustls_adapter::establishment::a_peer_with_no_credential_never_reaches_an_established_relationship",
]
