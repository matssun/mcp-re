  "test://proxy/ed25519_public_key/canonical_encoding",
  "mutation://proxy/ed25519_public_key/canonical_encoding",
]
# The battery has to answer two questions that pull in opposite directions: does the owner
# REFUSE everything it should, and does adding a parser on the refusal path quietly widen
# what it ACCEPTS? `classification_never_widens_acceptance` is the second one, and it is
# listed as a control rather than trusted to the first: a classifier that started returning
# a repaired key would leave every refusal test green.
tested_symbols = [
  "lib#communication_assurance::ed25519_public_key::tests::a_canonical_key_is_accepted_and_projects_its_point",
