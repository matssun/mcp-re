# The structural half: the products are not interchangeable, and that is checked by the
# compiler rather than asserted in prose. The controls were landed and PROBED in #570/#571
# — each was rewritten so it SHOULD compile and the test then failed — so this unit records
# them where they are, rather than growing a second copy.
#
# A FOURTH control was added when the delegated products stopped nesting the seam-authorized
# ones: there is now no field, projection or conversion from a `VerifiedDelegatedMcpResponse`
# to a `VerifiedMcpResponse`, so a consumer whose reasoning needs a trust-store entry for the
# SIGNING key cannot be handed a credential-authorized value. It sits on the same item as
# the bound/unbound control, which the lane matches as a battery, and it was probed the same
# way: rewritten so it should compile, and the doctest then failed.
#
# Their lane is `cargo test --doc`. Bazel runs no doctests, and this manifest does not
# pretend otherwise.

[[unit]]
id = "http_profile.verifier_result_separation"
class = "V0"
description = "The verifier's assurance products are not substitutable: a weaker product cannot be passed where a stronger one is required."
paths = [
  "mcp-re-http-profile/src/verified_request/mod.rs",
  "mcp-re-http-profile/src/verified_request/floor.rs",
  "mcp-re-http-profile/src/verified_response/mod.rs",
  "mcp-re-http-profile/src/verified_response/facts.rs",
  "mcp-re-http-profile/src/verified_response/bound.rs",
  "mcp-re-http-profile/src/verified_response/unbound.rs",
]
exported_contracts = []
evidence = ["test://http_profile/verifier/assurance_type_separation"]
# The symbols follow the ITEM, so the module split moved them: the response products live in
# `verified_response::bound` now. Their reported names would have changed silently and the
# lane would have reported "no doctest for this item" — which is the declaration doing its
# job, not churn.
tested_symbols = [
  "doc#verified_request::VerifiedMcpRequest",
  "doc#verified_response::bound::VerifiedMcpResponse",
  "doc#verified_response::bound::VerifiedDelegatedMcpResponse",
]

# ---------------------------------------------------------------------------
# The TLS listener's security state — ADR-MCPRE-061 §2, MCPRE-137, census EX-004
# ---------------------------------------------------------------------------
#
# One authority: the anchors, the epoch they digest to, the session cache tagged with it,
# and the handshake-signature budget belong to ONE listener and are established together.
#
# THE CLAIM IS ABOUT THE CONSTRUCTION PATH, and the qualification is not hedging — it is
# what the evidence supports:
#
#   Every MCP-RE production construction/rebuild path obtains the anchors, the epoch-bound
#   session store and the signing budget through one `TlsListenerSecurityState`, and those
#   terms cannot be independently supplied to that path. A caller that subsequently mutates
#   a public field of the foreign `rustls::ServerConfig` — `session_storage` is one — lies
#   OUTSIDE this guarantee.
#
# An unqualified "unsplittable" would overclaim by exactly that residual. MCP-RE owns the
# construction path; it does not own the mutability semantics of a foreign Rust type. #581
# will attach theorem language to this evidence, and the scope is easier to state correctly
# now than to rediscover during theorem review.
#
# The unit exists because the EX-004 census found the relationship held only through call
# ordering — a rebuild passed the anchors and the store as two arguments that had to agree,
# and a second builder family created its own state per build. The claim worth measuring is
# not "the code compiles" but "the construction path does not permit the pairing terms to be
# supplied independently", and the probe below is what distinguishes those.
#
# Class V0: there is no `ensures` here. The battery is what the claim rests on, so it
# carries `mutation://` for the same reason `http_profile.verifier_results` does.
#
# NOT claimed by this unit, and the distinction is the whole point of the census: the STORE
# refuses a session whose epoch no longer matches (`tls_listener_state::auth_epoch`, and the
# real-handshake acceptance in `tls_listener_state::resumption_acceptance`), while a production
# listener's anchors are immutable, so its epoch does not advance. What protects an
# anchor-set change is that a new anchor set is a new listener with a new empty store. Two
# propositions, two batteries; neither is evidence for the other.

[[unit]]
id = "proxy.tls_listener_state"
class = "V0"
description = "Every MCP-RE construction path obtains a listener's anchors, epoch-bound session store and signing budget through one TlsListenerSecurityState; those terms cannot be supplied to it independently."
