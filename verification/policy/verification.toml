# ---------------------------------------------------------------------------
# WP2 — continuation unbypassability
# ---------------------------------------------------------------------------
#
# The largest proof cone attempted so far, and the experiment that measured what a rich
# production model costs: TWELVE datatype transparency declarations, all of them class A
# (structure only — no view, no equality, no arithmetic specification), and TWO assumptions,
# both without an `ensures`. The trusted surface did not grow with the model.
#
# What it proves is unbypassability, NOT correctness: a request carrying a continuation
# cannot leave `prepare_http_dispatch` as Ok with `continuation_verified == false`. Whether
# the three handle comparisons inside `HttpContinuation::verify` are the RIGHT comparisons
# is ASM-0022 and remains a separate obligation.

[[unit]]
id = "http_profile.continuation_unbypassability"
class = "V1"
description = "MCPRE-102 dispatch preparation: a request whose evidence block carries an MRTR continuation can never be prepared successfully with continuation_verified == false."
paths = [
  "mcp-re-http-profile/src/dispatch.rs",
  "mcp-re-http-profile/src/block.rs",
  # The product this postcondition is about is built by the full-profile request stage,
  # over the floor stage's result. Both, not the whole `verify/` subtree: the delegated and
  # response stages cannot reach a `VerifiedMcpRequest`.
  "mcp-re-http-profile/src/verify/full/request.rs",
  "mcp-re-http-profile/src/verify/floor/request.rs",
  # The postcondition reads `verified.request_block` on the product type, so the type's
  # own module is part of what the proof depends on. A path set narrower than the
  # dependency set does not go red when the gap matters — it stops asking.
  "mcp-re-http-profile/src/verified_request/mod.rs",
  "mcp-re-http-profile/src/verified_request/floor.rs",
  "mcp-re-http-profile/src/verus_std_specs.rs",
]
exported_contracts = ["contract://http_profile/dispatch/prepare_http_dispatch"]
evidence = [
  "test://http_profile/dispatch/continuation_binding_battery",
  "verus://http_profile/dispatch/continuation_present_implies_verified",
]
# ASM-0024/25/26 are the uninterpreted verus declarations this unit's proof is stated over
# — the labelled digest as a function of its arguments, and the two policy getters. They
# are premises of this unit and are named here for the same reason they are scoped to it:
# one relation, declared in both manifests, and the two must agree.
# Unbypassability is a property of `prepare_http_dispatch`, so the battery is the dispatch
# integration target rather than any unit test: `dispatch.rs` carries no test module, and a
# battery declared over the lib alone would run zero of the cases that matter.
tested_symbols = [
  "tests/dispatch_test#continuation_round_trips_through_dispatch",
  "tests/dispatch_test#continuation_changed_request_state_fails",
  "tests/dispatch_test#continuation_wrong_previous_request_evidence_fails",
  "tests/dispatch_test#continuation_wrong_input_required_response_evidence_fails",
  "tests/dispatch_test#continuation_without_retained_context_fails_closed",
  "tests/dispatch_test#failed_continuation_does_not_burn_the_nonce",
]
proved_symbols = ["mcp_re_http_profile::dispatch::prepare_http_dispatch"]
features = ["verify"]
pilot = "verus-wp2"


# ---------------------------------------------------------------------------
# WP3 — composition: discharging an assumption into a proved contract
# ---------------------------------------------------------------------------
#
# `continuation_unbypassability` proved that the binding check cannot be SKIPPED while
# assuming nothing about whether it is the RIGHT check (the withdrawn ASM-0022). This unit
# proves the check, and the PROOF_DEPENDENCY edge below composes the two: the upper claim
# now reaches the lower theorem instead of a trusted seam.
#
# The claim is stated at exactly its strength, which is worth reading twice:
#
#   PROVED      the verifier checks each handle under the correct role label
#   NOT PROVED  distinct role-labelled inputs cannot collide
#
# The second needs domain separation from the digest construction — a cryptographic
# property absent from the model on purpose, since `labeled_digest` is uninterpreted. So
# this unit proves binding DISCIPLINE, not separation, and cross-role collision resistance
# stays visibly at boundary.crypto_primitives rather than being assumed away.

[[unit]]
id = "http_profile.continuation_binding"
class = "V1"
description = "MCPRE-97 continuation role-labeled binding discipline: an accepted continuation's three handles are the modeled digests of the three presented inputs, each under its OWN required role label. Collision-resistant separation BETWEEN roles is not proved and remains at boundary.crypto_primitives."
paths = [
  "mcp-re-http-profile/src/block.rs",
  "mcp-re-http-profile/src/ids.rs",
  "mcp-re-http-profile/src/verus_std_specs.rs",
]
exported_contracts = ["contract://http_profile/block/continuation_verify"]
evidence = [
  "test://http_profile/block/continuation_role_battery",
  "verus://http_profile/block/continuation_handles_match_in_role",
]
# ASM-0024/25/26 are the uninterpreted verus declarations this unit's proof is stated over
# — the labelled digest as a function of its arguments, and the two policy getters. They
# are premises of this unit and are named here for the same reason they are scoped to it:
# one relation, declared in both manifests, and the two must agree.
# The role-labelled binding discipline at the block layer: a continuation that verifies, and
# the three ways a handle presented under the wrong input or the wrong role must not.
tested_symbols = [
  "lib#block::tests::continuation_round_trips_and_verifies",
  "lib#block::tests::tampered_request_state_breaks_the_digest",
  "lib#block::tests::splice_across_continuation_boundary_fails",
  "lib#block::tests::wrong_continuation_type_is_malformed",
]
proved_symbols = ["mcp_re_http_profile::block::HttpContinuation::verify"]
features = ["verify"]
pilot = "verus-wp3"

# The composition edge. Breaking, weakening or dirtying the lower theorem must propagate
# to the upper claim rather than leaving it standing on a green badge of its own — that
# propagation, demonstrated on real units, is what distinguishes an evidence graph from a
# list of passing checks.
[[edge]]
kind = "PROOF_DEPENDENCY"
# Producer -> consumer: dirtiness flows along this arrow, so the LOWER theorem is `from`.
# The role-separation contract produces the fact; the unbypassability claim consumes it.
from = "http_profile.continuation_binding"
to = "http_profile.continuation_unbypassability"
rationale = "Unbypassability establishes that the binding check runs on every successful path; the role-separation contract establishes what that check guarantees. The end-to-end continuation claim is the composition, and neither half states it alone."

[[unit]]
id = "proxy.online_ocsp_reachability"
class = "V0"
description = "The legality model admits no online-OCSP deployment: OnlineRevocationEvidenceRequest::Required is refused on the only route to a ValidatedDeployment."
paths = [
  "mcp-re-proxy/src/config_state/validation/residue.rs",
  # THM-0013 says the refusal happens ON THE BOUNDARY, so the clause list that carries it
  # is part of what decides the claim. A closure holding only the predicate would
  # fingerprint a correct rule and miss its removal from the only route that runs it.
  "mcp-re-proxy/src/config_state/validation/mod.rs",
  # The refusal is `online.is_required()`, and that predicate — with the variant set it
  # ranges over — lives here after ADR-MCPRE-067 Phase 5 replaced the flat `client_ocsp`
  # field. A closure that named only the caller would fingerprint the clause while the
  # selection it decides moved outside its provenance.
  "mcp-re-proxy/src/deployment_request/revocation/mod.rs",
  "mcp-re-proxy/src/deployment_request/revocation/online_evidence.rs",
]
exported_contracts = []
# The second class exists for the second half of the claim. "Refused by the legality
# boundary" is not established by a battery that calls the refusal predicate directly: that
# battery stays green with the boundary's clause deleted. M62 is what asks.
evidence = [
  "test://proxy/online_ocsp_reachability/legality",
  "mutation://proxy/online_ocsp_reachability/legality",
]
# Two halves, because a correct predicate that nothing calls establishes nothing: the
# first states the rule over BOTH modes, the second states that the boundary's clause list
# is what carries it.
tested_symbols = [
  "lib#config_state::validation::residue::tests::no_build_admits_the_online_ocsp_mode",
  "lib#config_state::validation::residue::tests::the_boundary_clause_carries_the_online_ocsp_refusal",
  # The END-TO-END control, and the only member that drives the actual boundary: it builds
  # a `DeploymentRequest` in code — the shape `parse_args` cannot produce — and requires
  # `app::run` to refuse it. Without this member the "on the only route to a
  # ValidatedDeployment" half of THM-0013 has no witness.
  "tests/integration#app_startup_characterization_test::a_programmatic_config_cannot_claim_an_ocsp_check_the_serving_path_never_makes",
  # The third half, added with the selection's own file: `is_required()` is what the rule
  # reads, and both variants must answer it as the theorem assumes. A file in the closure
  # whose conjunct nothing tested is provenance without evidence.
  "lib#deployment_request::revocation::online_evidence::tests::a_responder_cannot_be_named_where_nothing_would_ask_it",
  "lib#deployment_request::revocation::online_evidence::tests::requiring_evidence_without_an_override_is_a_complete_selection",
]

# ---------------------------------------------------------------------------
# Communication assurance — ADR-MCPRE-063 Slice 1
# ---------------------------------------------------------------------------
#
# Two units, because the slice establishes two propositions with two different sets of
# consumers. The value invariant is consumed by every identity provenance the proxy has —
# certificate evidence and trusted-ingress assertion alike — and the interpretation is
# consumed only by the certificate path. Folding them into one unit would make a claim
# about the ingress path rest on evidence about X.509, which is the confusion the slice
# exists to end.

[[unit]]
id = "proxy.peer_identity_value"
class = "V0"
description = "The generic peer-identity value invariant: every inhabitant is non-empty after trimming, length-bounded, and free of control characters, whatever evidence produced it."
paths = ["mcp-re-proxy/src/communication_assurance/peer_identity_value.rs"]
exported_contracts = []
evidence = [
  "test://proxy/peer_identity_value/invariant",
  "mutation://proxy/peer_identity_value/invariant",
]
# The battery is over the OWNER and stops there.
#
# The trusted-ingress facade (`transport::validate_asserted_identity_value`) delegates to
# this owner, and its own tests go red when the owner's rules are weakened — but they are
# NOT listed here. THM-0023 is a claim about inhabitants of the type, and a caller that
# stopped constructing the type would leave every inhabitant well-formed while leaving the
# ingress path unprotected. Listing those tests would make this unit's evidence closure
# wider than its claim, and the manifest gate refuses it for the sharper reason that this
# unit does not measure `transport.rs`: an in-crate test whose source is not measured can
# be rewritten under the same name without moving the fingerprint.
#
# What pins the delegation is therefore an OPEN item, not a silent one: it belongs to the
# trusted-ingress authority, which this slice deliberately did not build.
tested_symbols = [
  "lib#communication_assurance::peer_identity_value::tests::a_well_formed_value_is_accepted_and_trimmed",
  "lib#communication_assurance::peer_identity_value::tests::whitespace_only_is_empty_not_a_value",
  "lib#communication_assurance::peer_identity_value::tests::the_length_bound_is_inclusive_and_refuses_one_byte_past_it",
  "lib#communication_assurance::peer_identity_value::tests::every_control_character_shape_is_refused_for_the_same_reason",
  "lib#communication_assurance::peer_identity_value::tests::refusal_precedence_reports_the_first_failing_rule",
]
pilot = "verus-candidate"

[[unit]]
id = "proxy.certificate_identity"
class = "V0"
description = "Certificate identity interpretation: under an explicit selection policy, the configured field of the presented leaf denotes this peer-identity evidence with this provenance, or interpretation refuses."
paths = [
  "mcp-re-proxy/src/communication_assurance/certificate_identity_interpreter.rs",
