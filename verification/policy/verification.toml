# ---------------------------------------------------------------------------
# The trust subtree — MCPRE-146 / #582
# ---------------------------------------------------------------------------
#
# Three units, not one, because the evidence provenance differs and the graph must not
# look more precise than the measurement. The classifier's witnesses and the epoch pairing
# are proved by the lib battery in `config_state`; the plan's reload projection by the lib
# battery that moved with the type in MCPRE-148; the composition root's trust consumption
# by a source-text guard that runs in the `integration` target and nowhere else.
#
# All three are class V0. There is no `ensures` over any of them: the properties are held
# structurally — by sealed construction, by a paired projection, and by the absence of a
# field — and by test batteries. Nothing above them may say otherwise.

[[unit]]
id = "proxy.trust_configuration_state"
class = "V0"
description = "The trust-revocation classifier and the trust-document locator: which revocation posture a deployment requests, which witnesses each state requires, and where the request-signer document is read from. Claims nothing about the document's existence, readability, contents, or the keys it holds — those are materialization's, not layer A's."
paths = [
  "mcp-re-proxy/src/config_state/trust_revocation.rs",
  "mcp-re-proxy/src/config_state/trust_document.rs",
]
exported_contracts = []
evidence = [
  "test://proxy/trust/revocation_state_witnesses",
  "test://proxy/trust/epoch_source_pairing",
  # A cadence ceiling, a zero-cadence refusal and a two-way push split are all conjuncts a
  # green battery can hold while none of them is load-bearing. M63-M65 ask.
  "mutation://proxy/trust/revocation_state_witnesses",
]
# Both directions of each witness rule: the states that REQUIRE a cadence carry one and are
# refused without it, and the one state whose cadence is OPTIONAL keeps both postures — so
# a green lane cannot mean the witness rule was over-applied.
#
# THREE witnesses left this unit rather than this list, and each left because its
# proposition became stronger than a test of this classifier could state:
#
#   * the epoch KEY beside no epoch store (CF-04) — ADR-MCPRE-067 Phase 4 moved the
#     coordinate inside `TrustEpochSource`, so a key with no store cannot be constructed;
#   * an epoch SOURCE under a tier that consumes none (X8) — Phase 6 gave only the pushing
#     posture a field for one;
#   * `live|push` given no re-read cadence — Phase 6 made the cadence a member of the two
#     tiers that need one.
#
# None is restated here. Their evidence lives with the types that made them unbuildable, in
# `deployment_request::request_signer_currency` and
# `deployment_request::storage::trust_epoch_storage`, and with the CLI adapter that still
# sees the argv forms — all outside this unit's paths, which is why this list shrank rather
# than being repointed.
tested_symbols = [
  "lib#config_state::trust_revocation::tests::bounded_cache_does_not_require_a_cadence",
  "lib#config_state::trust_revocation::tests::each_state_holds_the_cadence_to_the_window_it_claims",
