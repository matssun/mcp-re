# ADR-MCPRE-059 §28 / issue #744. Two sibling authorities, neither owning the other's
# facts. `replay_plane` establishes the authoritative replay tier; `continuation_store`
# carries a multi-round-trip continuation across a replica switch. A parent root may
# quantify over both; a leaf may not, and putting the joint on whichever plane happened to
# be registered first is the shallow boundary the twelve questions exist to catch.
#
# Neither had a unit. The claim they carry is a CONFIGURATION PROJECTION — the store the
# serving path uses is the one the validated configuration selected — and it deliberately
# needs no premise about what a backend's acknowledgement establishes. That is a different
# claim (D2), it is per mechanism, and it is registered only where a root consumes it.
[[unit]]
id = "proxy.replay_materialization"
class = "V0"
description = "The replay tier handed to the serving path is the one the plan selected, and a tier that self-declares the volatile single-process posture is never handed over."
paths = [
  "mcp-re-proxy/src/replay_plane/mod.rs",
  "mcp-re-proxy/src/replay_plane/backends.rs",
]
exported_contracts = []
evidence = [
