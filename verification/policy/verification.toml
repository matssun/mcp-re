# ---------------------------------------------------------------------------
# Communication assurance — ADR-MCPRE-064 Slice 3, the composition
# ---------------------------------------------------------------------------

[[edge]]
kind = "CONTRACT_CONSUMES"
from = "proxy.authenticated_relationship_peer"
to = "proxy.current_authenticated_peer"
rationale = "The authentication half is carried whole and its acceptance is the credential the currency half evaluates. If authentication became manufacturable this product would still be built, and its controls — which vary the RELATIONSHIP and the policy — would still pass."

[[edge]]
kind = "CONTRACT_CONSUMES"
from = "proxy.credential_currency"
to = "proxy.current_authenticated_peer"
rationale = "The currency half IS the currency authority's verdict on the peer's own acceptance, and its refusal is carried unchanged rather than re-decided. A currency authority that stopped distinguishing its five facts would collapse this product's refusal algebra with no control here going red."

[[unit]]
id = "proxy.current_authenticated_peer"
class = "V0"
description = "An authenticated relationship peer whose own accepted credential the deployment's controls found acceptable at a named instant, composed inside one construction closure — refusing where currency was never evaluated, and claiming nothing about admission, authorization, binding, or the next request."
paths = [
  "mcp-re-proxy/src/communication_assurance/current_authenticated_peer.rs",
]
exported_contracts = []
evidence = [
  "test://proxy/current_authenticated_peer/one_relationship",
  "mutation://proxy/current_authenticated_peer/one_relationship",
]
# No new premise. Both halves are registered products and this unit adds only the fact that
# they are about one relationship — which is structural, not assumed.
assumptions = []
# The controls drive REAL handshakes, including a genuine resumption and two relationships
# with different peers. A control asserting only that a current peer was produced would stay
# green while the composition reached past its own authentication.
tested_symbols = [
  "lib#communication_assurance::current_authenticated_peer::tests::an_authenticated_peer_with_a_current_credential_is_a_current_authenticated_peer",
  "lib#communication_assurance::current_authenticated_peer::tests::a_deployment_that_evaluates_nothing_yields_no_current_peer",
  "lib#communication_assurance::current_authenticated_peer::tests::an_expired_credential_refuses_and_carries_the_authoritys_own_reason",
  "lib#communication_assurance::current_authenticated_peer::tests::a_ceiling_below_the_credentials_span_refuses_as_a_lifetime_breach",
  "lib#communication_assurance::current_authenticated_peer::tests::each_relationships_currency_is_evaluated_against_its_own_credential",
  "lib#communication_assurance::current_authenticated_peer::tests::a_resumed_relationship_stays_resumed_after_the_currency_evaluation",
]
pilot = "verus-candidate"
