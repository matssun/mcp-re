title = "The artifact that ships implements the profile"
carrier = "the built napi addon and PyO3 wheel, not the source tree the unit paths name"
likely_owner = ""
consequence = "high"
root_relationship = "under THM-0094/THM-0095; the same shape as NP-001"
record = "docs/architecture/control-dispositions.md#np-012"

[[proposition]]
