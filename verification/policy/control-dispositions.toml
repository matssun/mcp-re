# ---------------------------------------------------------------------------
# Batch 2 — the gate lane, 2026-09-19
# ---------------------------------------------------------------------------
#
# Sixty gates, dispositioned one at a time against the criterion recorded in
# docs/architecture/control-dispositions.md: a gate carries a proposition when a violation
# of it changes what the SHIPPED SYSTEM admits, emits, signs or exposes. Eight propositions
# the graph does not state; fifty-one controls whose subject is the repository's own
# machinery, in six families. Control-scoped throughout: a gate is one file and one rule, so
# the carrier and the control are the same thing and a carrier row would buy nothing.

[[proposition]]
id = "NP-001"
title = "The SDK runtime support claim"
carrier = "sdk/python/pyproject.toml, sdk/typescript/package.json, the prepared runtime matrices and the deploy Dockerfiles"
likely_owner = ""
consequence = "critical"
root_relationship = "THM-0094 and THM-0095 name these gates in their own text"
record = "docs/architecture/control-dispositions.md#np-001"

[[proposition]]
id = "NP-002"
title = "P-256 is confined to receipt verification"
carrier = "the p256 dependency edge, the SCITT receipt verifier's modules, and mcp-re-core's ensure_ed25519_alg"
likely_owner = ""
consequence = "critical"
root_relationship = "THM-0072 states the verification direction; the containment direction is stated nowhere"
record = "docs/architecture/control-dispositions.md#np-002"

[[proposition]]
id = "NP-003"
title = "Every long-lived worker's lifetime is an owned value"
carrier = "mcp-re-proxy/src/managed_worker/mod.rs and every library source in the workspace"
likely_owner = ""
consequence = "high"
root_relationship = "bears on THM-0012 without being what it states"
record = "docs/architecture/control-dispositions.md#np-003"

[[proposition]]
id = "NP-004"
title = "Every optional capability states ON or OFF, in every lane"
carrier = "mcp-re-proxy/src/startup_posture.rs and the posture.declare calls in app.rs"
likely_owner = "proxy.continuation_installation owns ONE seam's conjunct and says so"
consequence = "medium"
root_relationship = "the per-seam conjunct is claimed; the proposition over all eight is not"
record = "docs/architecture/control-dispositions.md#np-004"

[[proposition]]
id = "NP-005"
title = "The input_required discriminator is open-coded in one place"
carrier = "the client core, chain reconstruction, the proxy's open-leg recorder and both SDK bindings"
likely_owner = ""
consequence = "high"
root_relationship = "THM-0061 owns the discriminator itself and is silent on how many places open-code it"
record = "docs/architecture/control-dispositions.md#np-005"

[[proposition]]
id = "NP-006"
title = "A deployment runs the artifact that was qualified"
carrier = "VERSION, deploy/cloudbuild/*.yaml, deploy/k8s/*.yaml, the Helm chart and the deploying runbooks"
likely_owner = ""
consequence = "high"
root_relationship = "bears on the transparency and release-evidence roots"
record = "docs/architecture/control-dispositions.md#np-006"

[[proposition]]
id = "NP-007"
title = "The shipped chart's fail-closed guards refuse"
carrier = "deploy/helm/mcp-re-proxy/templates/_helpers.tpl"
likely_owner = ""
consequence = "critical"
root_relationship = "THM-0077 is the proposition one layer up"
record = "docs/architecture/control-dispositions.md#np-007"

[[proposition]]
id = "NP-008"
title = "No advertised conformance category lacks an executable witness"
carrier = "docs/conformance-guide.md, mcp-re-conformance/tests/vectors/ and the nt_rust_test targets that reach them"
likely_owner = "conformance.retained_corpus is nearest and is about retention"
consequence = "high"
root_relationship = "a claim-surface proposition for a product-facing document"
record = "docs/architecture/control-dispositions.md#np-008"

