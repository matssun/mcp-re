# `custody.py` is in `sdk_python.signer_policy`'s paths and `test_custody.py` was in no
# unit's battery: ADR-MCPRE-069 §3's shape, at the owner rather than at the store. Six
# controls REGISTER against clauses the unit's statement already makes (they land in
# verification.toml, not here). The other twelve say four things the statement does not,
# and each is a proposition rather than a widening.

