# ---------------------------------------------------------------------------
# Batch 18 — the small crates, 2026-09-19
# ---------------------------------------------------------------------------
#
# 76 controls outside mcp-re-proxy. Fourteen REGISTER (verification.toml); five are demo
# fixture material (ND-013); the Core's purity firewall is ND-007; the rest are the
# propositions below, among them three premises of everything above them: the encoding, the
# inverse of the time parser, and the accepting direction of the Ed25519 primitive.
#
# NP-106 is the split RR-002 C5 required. THM-0014 is a soundness conditional and contains
# the FIVE refusals of `mcp-re-core/src/crypto.rs`; the other eight controls of the original
# record state four further propositions, and each carries its own entry and packet rather
# than riding into a theorem that does not claim it.

