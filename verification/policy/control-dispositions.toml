# ---------------------------------------------------------------------------
# Batch 3 — the SDK lanes, 2026-09-19
# ---------------------------------------------------------------------------
#
# Fifty controls across both shipped SDKs, in six propositions. Both SDKs are carried
# together because the propositions are TWINS: the parity oracle is one fixed point the two
# are compared against, and the concurrency file says in its own comment that the two 'must
# agree on how many exchanges may be in flight, not just on the bytes they emit'. Splitting
# them by language would have produced two halves of one claim and no place to say so.
#
# NP-014 is the exception and is recorded separately for the reason its record gives: it is
# an asymmetry, not a twin.

[[proposition]]
id = "NP-009"
title = "The shipped adapter's end-to-end composition"
carrier = "McpReHttpTransport and the Python transport adapter against the real proxy and a real MCP SDK backend"
likely_owner = ""
consequence = "critical"
root_relationship = "THM-0094 and THM-0095 directly: this is their headline demonstration"
record = "docs/architecture/control-dispositions.md#np-009"

[[proposition]]
id = "NP-010"
title = "The shipped SDKs reproduce the frozen oracle byte for byte"
carrier = "each SDK's signing path and tools/gen_sdk_parity_fixture.py's frozen oracle"
likely_owner = ""
consequence = "critical"
root_relationship = "under THM-0094 and THM-0095 jointly; the only proposition about BOTH"
record = "docs/architecture/control-dispositions.md#np-010"

[[proposition]]
id = "NP-011"
title = "Custody class does not change the bytes"
carrier = "each SDK's signer abstraction over software and non-exporting custody"
likely_owner = "*.signer_policy owns the policy and not the indistinguishability"
consequence = "high"
root_relationship = "beside NP-010 under THM-0094/THM-0095"
record = "docs/architecture/control-dispositions.md#np-011"

[[proposition]]
