# SPDX-License-Identifier: Apache-2.0
#
# The ADR-MCPRE-069 disposition registry — what a control that no proposition claims IS.
#
# ADR-069 D1 gives four dispositions. Two of them discharge somewhere else and are
# deliberately absent here:
#
#   register      the symbol joins a unit's `tested_symbols` in verification.toml
#   reattribute   the symbol joins ANOTHER unit's battery, same file
#
# A registered control leaves the census by construction (D4), so a row here about one
# would be a second place the same fact is written, and the two could then disagree. The
# gate refuses such a row as an orphan rather than ignoring it.
#
# The two that DO live here are the residue — the controls that run and that no proposition
# will ever claim, or that establish something the graph does not yet state:
#
#   not-evidence      a useful control that is not evidence for a security proposition.
#                     D3: it carries a REASON, and the reason is checked for SHAPE, not for
#                     truth. `reason_family` names a record in
#                     docs/architecture/control-dispositions.md, which is what makes a large
#                     not-evidence population distinguishable from a campaign that gave up —
#                     ADR-069 §8 question 1, answered with the mechanism ADR-MCPRE-061 §14
#                     already uses rather than with a second debt authority.
#
#   new-proposition   the control establishes something real that no unit claims. Step 1 of
#                     ADR-069 §5: it is IDENTIFIED here, in prose, with its production
#                     carrier and likely owner, and it is visible unresolved assurance debt
#                     until the ordinary theorem-architecture route ratifies it. Widening an
#                     existing unit to swallow it is what §5 forbids in terms.
#
# Validated by `tools/verification/control-census --gate`. Unknown keys are a validation
# failure: a typo in a disposition must not read as an absent one.

schema_version = 1
policy_revision = "adr-mcpre-069-r1"

# ---------------------------------------------------------------------------
# [[proposition]] — a `new-proposition` cluster, identified but not yet ratified
# ---------------------------------------------------------------------------
#
# ADR-069 §8 question 3 asks what the UNIT of a new-proposition disposition is. It is the
# PROPOSITION, not the control: §3's worked instance is five controls establishing one
# statement about single-writer establishment semantics, and recording five separate
# dispositions would lose the only thing that makes them worth ratifying together.
#
# Fields:
#   id                     NP-nnn, stable identity
#   title                  the proposition in one line
#   statement              the proposition in precise prose — what would be false if it
#                          failed, not what the tests do
#   carrier                the production path the proposition is about
#   likely_owner           the unit that would hold it, or "" where none exists yet
#   consequence            what a violation causes, in the ADR-068 severity vocabulary
#   root_relationship      which declared root it would sit under, and why
#   ratified_as            the theorem or unit id, once ADR-069 §5 step 2 has happened.
#                          ABSENT means identified and unresolved — there is no `status`
#                          field, because a `status = "ratified"` bit would be precisely the
#                          stored approval ADR-MCPRE-059 §14.7 forbids: it would survive
#                          every edit to the proposition it approved. A reference to what
#                          the proposition BECAME is a fact about the graph, not a bit on
#                          this record.

# ---------------------------------------------------------------------------
# [[disposition]] — one row per unclaimed control
# ---------------------------------------------------------------------------
#
# Fields:
#   id                 ND-nnnn (not-evidence) or NP-nnnn-nn (a proposition's control)
#   project            the control's project, exactly as the census reports it
#   control            the control's identity, exactly as the census reports it
#   decision           not-evidence | new-proposition — the ADR-069 disposition. NOT named
#                      `verdict`: scripts/registry_approval_gate.py refuses an approval word
#                      stored on a policy record, and it is right to. A disposition says what
#                      a control IS rather than approving anything, and a registry that
#                      needed an exemption to hold an approval-shaped key would be arguing
#                      with a rule it agrees with.
#   reason_family      for not-evidence: the ## record in the register document
#   proposition        for new-proposition: the [[proposition]] id
#   recorded           the date the disposition was reached

