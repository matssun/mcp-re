# returning a well-formed credential for a stale key — publishes a snapshot whose RFC 9421
# `keyid` names a key this process does not hold, and every response it signs is rejected
# fleet-wide, discovered at the next request rather than at the issuance.
path = "mcp-re-http-profile/src/custody/active_key.rs"
