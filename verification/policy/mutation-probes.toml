[[probe]]
id = "M37-materialization-installs-the-listeners-budget"
unit = "proxy.delegated_resolver_materialization"
theorem = "THM-0027"
conjunct = "the listener's handshake-signature budget is installed unchanged"
# Slice 3 gates a construction that also carries #597's budget invariant, and the risk of
# adding a gate to a constructor is that the constructor's other obligations get rewritten
# around it. The weakening is the exact regression #597 exists to prevent: a fresh full
# bucket per build, which turns a sustained rate limit into a per-interval window.
path = "mcp-re-proxy/src/delegated_tls/resolver.rs"
anchor = """
        let key = Arc::new(DelegatedEd25519SigningKey::with_budget(
            signer,
            Arc::clone(&budget),
        ));
"""
weakening = """
        let budget = Arc::new(TlsHandshakeSignBudget::default());
        let key = Arc::new(DelegatedEd25519SigningKey::with_budget(
            signer,
            Arc::clone(&budget),
        ));
"""
expect_red = [
  "lib#delegated_tls::resolver::correspondence_gate::corresponding_material_materializes_and_installs_the_listener_budget",
  "lib#delegated_tls::resolver::budget_continuity::resolvers_sharing_a_budget_share_one_bucket",
]
