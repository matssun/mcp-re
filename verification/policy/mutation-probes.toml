# ---------------------------------------------------------------------------
# Communication assurance — ADR-MCPRE-063 Slice 3
# ---------------------------------------------------------------------------
#
# There is deliberately no probe that removes the gate from `materialize` itself, and the
# reason is the result: it cannot be written. The assembling constructor is private and
# demands a `CredentialKeyCorrespondenceFacts` value, which nothing outside the authority
# can produce — so "skip the check and construct anyway" does not compile. Per L-4 that is
# a statement about the MECHANISM, not evidence: what is stronger is a construction the
# type system refuses to represent, while the evidence for it is the visibility boundary
# plus successful compilation of the crate. Being unable to write the mutation is a fact
# about the mutation.
#
# What CAN be weakened is the relation the gate consults. M36 makes correspondence vacuous
# and shows the resolver's guarantee collapsing with it — which is what the CONTRACT_CONSUMES
# edge between the two units asserts, measured rather than declared.

[[probe]]
id = "M36-materialization-gate-consumes-a-real-relation"
unit = "proxy.delegated_resolver_materialization"
theorem = "THM-0027"
conjunct = "the resolver's existence proves correspondence, not merely that a function was called"
