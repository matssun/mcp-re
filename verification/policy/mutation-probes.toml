    check_currentness(&claims, currentness, now)?;
"""
weakening = """
    let _ = (currentness, now);
"""
expect_red = [
  "lib#authoritative_admission::record::verified::tests::a_restored_admitted_record_is_refused_past_the_authorized_window",
]

