conjunct = "The operand supplied to the continuation key is the actor projection of the verified product this exchange carries"
# The weakening keeps the carried product's key material and swaps only the identity for the
# one the body names, which is what the regression would look like: a leg trusting a caller's
# own account of who it is because the caller stated it in members the leg was already
# parsing. Every store-side control stays green under it — they compare two actors supplied
# the same way — so this probe is the only thing between that change and a green battery.
path = "mcp-re-proxy/src/http_profile_serve/continuation/answer_leg.rs"
