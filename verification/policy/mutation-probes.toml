note = """
BEFORE ANY FOLD is the load-bearing half, and the split MEASURED where that refusal lives. The
first draft of this probe attacked the identical guard at the top of
`rfc9162_root_from_inclusion_proof`, and the control stayed GREEN: by then the PARSER has
already refused, so the fold's copy is defence in depth rather than the check this conjunct
