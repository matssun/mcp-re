# The fixture's client leaf is refused for a BAD SIGNATURE before any revocation decision is
# reached, so the control has never exercised the property it names — its own comment says the
# CRL is there "to switch revocation checking ON, so the second CA's leaf reaches the
# unknown-status decision", and the leaf does not reach it. Recorded as P2-C1 in
# `remaining-splits-2026-09-18.md`; the fixture is a product question, not an assurance one.
#
# `no_production_code_relaxes_the_unknown_status_policy` IS load-bearing for exactly this
# weakening, because the weakening is the thing it scans for: a call to
# `allow_unknown_revocation_status()` in production code. That is a source-text inventory
# rather than a handshake, and the claim it establishes — no configuration or argument can
# relax the policy — is a source-text claim.
expect_red = [
  "tests/integration#client_verifier_posture_test::no_production_code_relaxes_the_unknown_status_policy",
