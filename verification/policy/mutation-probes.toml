# ---------------------------------------------------------------------------
# THM-0129 — the authoritative record's own authentication and currentness
# ---------------------------------------------------------------------------
#
# The r11 critical's two conjuncts, each with the weakening that would restore the
# situation it removed. They are separate probes because the two failures are separate:
# delete the signature check and a store writer MINTS; delete the currentness check and a
# store writer REPLAYS. A single probe covering both would be satisfied by either.

[[probe]]
id = "M133-admission-record-must-be-authenticated"
unit = "http_profile.admission_state_provenance"
theorem = "THM-0129"
conjunct = "the state is authenticated as issued by the configured admission authority"
# Deleting this restores the pre-r11 situation exactly: the record still parses, still
# names a subject, a generation and a status, and still answers the gate — and anyone who
# can write the store can say whatever they like in it. The subject and currentness checks
# survive the weakening, which is the point: neither of them notices a forgery, so if this
# probe does not turn a control red the authentication conjunct rests on nothing.
path = "mcp-re-http-profile/src/authoritative_admission/record/verified.rs"
anchor = """
    verify_ed25519_with(
        signing_input.as_bytes(),
        &normalize_signature(s_seg)?,
        &authority,
        McpReError::InvalidSignature,
    )
    .map_err(|_| AdmissionRecordRefusal::SignatureInvalid)?;
"""
weakening = """
    let _ = (&signing_input, &authority);
"""
expect_red = [
  "lib#authoritative_admission::record::verified::tests::a_changed_status_in_the_stored_bytes_is_refused",
  "lib#authoritative_admission::record::verified::tests::a_changed_generation_is_refused",
  "lib#authoritative_admission::record::verified::tests::a_store_writer_cannot_mint_a_high_generation",
  "lib#authoritative_admission::record::verified::tests::a_record_signed_by_an_unconfigured_key_is_refused",
]

