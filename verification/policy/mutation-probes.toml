# ADR-MCPRE-068 Phase 1 — the two source-text propositions that ARE about the source text.
#
# `verification/reviews/packets/residue-units-2026-09-18.md` concluded that a source-text
# control cannot be falsified by a source-text mutation probe. That argument is sound where
# the control is a source-text PROXY for a behavioural proposition: the probe then edits the
# very text the rule reads, and redness measures the matcher rather than the behaviour.
#
# It does not apply to these two, because here the proposition IS the source-text fact.
# THM-0067 claims a property OF `app.rs`'s production text (which request fields the root
# reads); the seam's composition half claims a property OF `app.rs`'s production text (that
# the builder is called once, on the materialized operands, and holds no frozen map). For a
# claim about the text, a text weakening is the honest falsifier and redness is exactly the
# fact wanted.
#
# What these probes do NOT establish is that the pattern is a faithful proxy for the
# behavioural property behind it. That is a separate premise, registered as such — never
# smuggled in as a second thing a green probe is taken to have shown.

