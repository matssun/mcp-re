# SPDX-License-Identifier: Apache-2.0
#
# ADR-MCPRE-059 — the V0 evidence self-test.
#
# A class-V0 claim rests on a test battery, and "the battery passed" is not evidence that a
# production check is LOAD-BEARING. A conjunct nobody can break is a conjunct the evidence
# does not establish, however many tests are green. This registry names, per conjunct, a
# deliberate weakening of exactly that check and the declared control(s) that must go red
# when it is applied.
#
# It is the same argument as `clippy_ratchet_gate.py --activation-probe`: a gate that says
# a rule is enforced is much stronger when deliberately breaking the rule turns the gate
# red. Here the "gate" is a theorem's negative battery.
#
# WHAT THIS FILE IS NOT
# ---------------------
#
# It is NOT a freeze on the implementation. `tools/verification/verify-mutations` mutates a
# COPY of the tree, never the working tree, and a probe whose `anchor` no longer matches
# exactly once is reported STALE — a demand to RE-ADJUDICATE the probe against the new
# implementation, never a demand to restore the old code. Refactoring is expected; what is
# not acceptable is a refactor that silently leaves a claimed conjunct unprotected.
#
# It also creates no new authority over units, theorems or evidence. `unit`, `theorem` and
# `expect_red` resolve into `verification.toml` and `theorems.toml`; nothing here restates
# what those own.
#
# IT IS, HOWEVER, REQUIRED EVIDENCE
# ---------------------------------
#
# `http_profile.verifier_results` declares `mutation://http_profile/verifier/result_propositions`
# beside its `test://` URI, so `attest` REFUSES it without a mutation PASS measured at its
# exact ReviewFingerprint. Each probe entry below is itself a fingerprint input (encoding
# v5), which is what stops the suite from being shrunk under a standing attestation:
# deleting a probe, softening its weakening or widening its `expect_red` all move the
# fingerprint and invalidate the PASS.
#
# FIELDS
# ------
#
#   id           stable, never reused
#   unit         the review unit whose battery is being self-tested
#   theorem      the THM-NNNN whose conjunct this probe is about
#   conjunct     the conjunct, in the theorem's own words
#   path         repo-relative file the weakening is applied to
#   anchor       the exact text to replace. It MUST match exactly once; zero matches or two
#                are both STALE, because a probe that cannot identify its site is not
#                testing what it claims to.
#   weakening    the replacement — the check deleted, or made non-load-bearing
#   expect_red   declared `tested_symbols` members, VERBATIM — `tests/<target>#<symbol>` or
#                `lib#<symbol>`. Test identity is TARGET plus symbol, never the symbol
#                alone: two targets may hold a test of the same name, and a probe that
#                matched on the bare name could be satisfied by a failure in a target it
#                never intended to touch.
#
#                Every named control must be OBSERVED EXECUTING, and at least one must
#                FAIL. A control that never reported is a MEASUREMENT FAILURE, not a red
#                one — the lane cannot say the weakening did anything if the test it names
#                did not run — and it fails the probe with its own message.
#
#                A `doc#` member may not appear here: those are compile-fail controls and
#                no runtime weakening can move them.
#   note         optional; used where a probe is deliberately coarse

schema_version = 1

[[probe]]
id = "M01-request-signature"
unit = "http_profile.verifier_results"
theorem = "THM-0014"
conjunct = "the RFC 9421 signature verifies over the reconstructed base"
path = "mcp-re-http-profile/src/verify.rs"
anchor = """
    let sig = signature_value_b64url(&request.headers, "signature", REQUEST_LABEL)?;
    verify_under(
        algorithm,
        &base,
        &sig,
        &resolved_actor.verification_key,
        McpReError::InvalidSignature,
    )?;
"""
weakening = """
    let sig = signature_value_b64url(&request.headers, "signature", REQUEST_LABEL)?;
    let _ = verify_under(
        algorithm,
        &base,
        &sig,
        &resolved_actor.verification_key,
        McpReError::InvalidSignature,
    );
"""
expect_red = [
  "tests/proof_path_test#authorization_header_is_covered_when_present",
  "tests/proof_path_test#keyid_swap_to_another_trusted_key_fails_the_signature",
]

