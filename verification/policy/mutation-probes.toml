  "lib#communication_assurance::certificate_identity_interpreter::tests::an_absent_selected_field_refuses_while_the_other_fields_are_populated",
  "tests/integration#certificate_identity_no_fallback_test::uri_selected_and_absent_does_not_fall_back_to_a_present_dns_san",
]

[[probe]]
id = "M26-certificate-identity-later-value-fallback"
unit = "proxy.certificate_identity"
theorem = "THM-0024"
conjunct = "the value is the FIRST value the leaf presents in the configured field"
path = "mcp-re-proxy/src/communication_assurance/certificate_identity_fields.rs"
# Applied at the representation seam rather than in the selector: this is the shape the
# defect actually takes in the wild — a projection that helpfully skips values the caller
# would reject — and the selector has no loop to weaken.
