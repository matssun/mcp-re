  "lib#authorization::decide::tests::a_request_with_no_readable_action_is_refused_before_any_policy_is_consulted",
  "lib#authorization::decide::tests::a_denial_and_a_missing_coordinate_project_to_different_authorities",
]
note = """
THE COORDINATE IS READ WHETHER OR NOT A POLICY IS CONFIGURED, which is what makes this a
refusal rather than a lookup failure: a request whose ACTION cannot be established is not a
