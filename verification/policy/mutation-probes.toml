# The half a signature cannot establish. With this deleted every record above remains
# genuinely signed and genuinely about its own workload, and a party that can write the
# store restores the bytes from before a revocation and keeps a revoked workload in service
# indefinitely — which is the attack the ruling names, and which no other check here sees.
path = "mcp-re-http-profile/src/authoritative_admission/record/verified.rs"
