# THM-0129 — the authoritative record's own authentication and currentness
# ---------------------------------------------------------------------------
#
# The r11 critical's two conjuncts, each with the weakening that would restore the
# situation it removed. They are separate probes because the two failures are separate:
# delete the signature check and a store writer MINTS; delete the currentness check and a
# store writer REPLAYS. A single probe covering both would be satisfied by either.

[[probe]]
