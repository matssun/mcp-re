note = """
THE ISSUER'S TTL IS NOT A SECOND CARRIER, and §5.2 says why: `[nbf, exp]` is the ISSUER's
choice about how long its snapshot may be acted on, and N is the VERIFIER's own cap. An
authority that issues year-long assertions is not misbehaving; an enforcement point that acts
