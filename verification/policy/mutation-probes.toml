# ADR-MCPRE-068 Phase 1 — THM-0017's FIRST falsifier, and the reason the split was worth
# doing on its own.
#
# THM-0017 is `high`, it is in THM-0075's closure, and until the ten-way split of
# `http_profile.verifier_results` NOTHING attacked it: the wide unit carried thirty probes,
# every one of them named a different theorem, and N1 — which accounts per UNIT — read the
# proposition as falsified on the strength of its neighbours. The split made the gap
# merge-fatal instead of invisible, which is what a falsifier boundary is for.
#
# It is M26's twin on the UNBOUND arm, and the twinning is the argument: the same slot
# resolution, the same weakening, one function lower in the same file. That the bound arm had
# a probe and the unbound arm did not was never a decision — it is what a shared unit makes
# impossible to notice.

