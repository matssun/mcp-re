# ---------------------------------------------------------------------------
# Communication assurance — ADR-MCPRE-063 Slice 4
# ---------------------------------------------------------------------------
#
# There is deliberately no probe for the SEAL — for "construct the evidence without a
# mechanism report". The representation and the constructor are private to the owning
# module and the mechanism adapter is a CHILD of it, so no sibling can express that
# weakening and it does not compile; adding a seam through which a probe could reach it
# would be building the manufacture route the slice exists to remove (L-4).
#
# Per L-4 the mechanism and the evidence are kept apart: the ENFORCEMENT is the
# compiler-enforced visibility boundary, and the EVIDENCE for it is that boundary plus
# successful compilation of the crate. Being unable to write the mutation is a fact about
# the mutation, not about the code.
#
# What IS probed is what the adapter reads from the mechanism, because that is where a
# weakening changes which relationships get to speak.

[[probe]]
id = "M38-association-requires-a-completed-establishment"
unit = "proxy.channel_associated_credential"
theorem = "THM-0028"
conjunct = "the mechanism reported the connection as no longer handshaking"
# A `ServerConnection` exists before its handshake, so without this the authority would
# read a chain out of a relationship that does not exist yet — and, on a handshake the
# verifier REFUSED, would report the absence of a credential as though a relationship had
# been established and merely presented none. The two states must not collapse.
path = "mcp-re-proxy/src/communication_assurance/channel_associated_credential/rustls_adapter.rs"
anchor = """
    if conn.is_handshaking() {
        return Err(ChannelCredentialAssociationRefusal::EstablishmentIncomplete);
    }
"""
weakening = """
    if false && conn.is_handshaking() {
        return Err(ChannelCredentialAssociationRefusal::EstablishmentIncomplete);
    }
"""
expect_red = [
  "lib#communication_assurance::channel_associated_credential::rustls_adapter::establishment::a_connection_that_has_not_established_associates_nothing",
  "lib#communication_assurance::channel_associated_credential::rustls_adapter::establishment::a_peer_with_no_credential_never_reaches_an_established_relationship",
]

[[probe]]
id = "M39-possession-means-a-credential-was-associated"
unit = "proxy.channel_associated_credential"
theorem = "THM-0028"
conjunct = "the carried credential chain is non-empty"
# The whole content of the product is that a credential was associated. An empty chain
# admitted here would be evidence of nothing wearing the name of evidence, and every
# consumer projecting the chain would receive the same empty slice a refusal produces —
# so the distinction would be invisible downstream rather than loud.
path = "mcp-re-proxy/src/communication_assurance/channel_associated_credential/mod.rs"
anchor = """
        if chain_der.is_empty() {
            return Err(ChannelCredentialAssociationRefusal::NoCredentialAssociated);
        }
"""
weakening = """
        if false && chain_der.is_empty() {
            return Err(ChannelCredentialAssociationRefusal::NoCredentialAssociated);
        }
"""
expect_red = [
  "lib#communication_assurance::channel_associated_credential::tests::an_empty_chain_is_not_a_credential",
]

# ---------------------------------------------------------------------------
# ADR-MCPRE-063 Slice 5 — the provenance linkage
# ---------------------------------------------------------------------------
#
# What is probed is WHICH certificate the identity is read from, because that is the only
# thing this authority decides. The seal itself — that no caller can supply a second
# certificate or a foreign identity product — is not probed, and per L-4 that is not an
# omission: the enforcement mechanism is the absence of a parameter and a private
# constructor, so the weakening cannot be expressed as an edit to a check. Its evidence is
# the boundary plus successful compilation, and the sibling probe that fails with E0603 and
# E0451.

[[probe]]
id = "M40-identity-comes-from-the-peers-own-leaf"
unit = "proxy.channel_associated_identity"
theorem = "THM-0029"
conjunct = "the interpreted certificate is the FIRST of the associated chain"
# Reading any other position hands the identity decision to a certificate that signed the
# peer rather than to the peer. The controls establish a relationship whose chain carries a
# rival identity in the same field at position 1, so this weakening returns the intermediate's
# identity — a successful interpretation of the wrong peer, which is exactly the failure a
# control asserting only "interpretation succeeded" would not see.
path = "mcp-re-proxy/src/communication_assurance/channel_associated_credential/mod.rs"
anchor = """
        self.chain_der.first().map_or(&[], Vec::as_slice)
"""
weakening = """
        self.chain_der.last().map_or(&[], Vec::as_slice)
"""
expect_red = [
  "lib#communication_assurance::channel_associated_identity::tests::the_identity_is_read_from_the_leaf_of_the_relationships_own_credential",
  "lib#communication_assurance::channel_associated_identity::tests::an_intermediate_carrying_a_rival_identity_is_never_the_answer",
  "lib#communication_assurance::channel_associated_identity::tests::the_derivation_reads_the_first_certificate_of_the_associated_chain",
]

# ---------------------------------------------------------------------------
# ADR-MCPRE-064 Slice 1 — the establishment path
# ---------------------------------------------------------------------------
#
# What is probed is the one thing this authority decides: which path it reports. The seal —
# that no caller can pair a credential with another relationship's path — is not probed, and
# per L-4 that is not an omission: the weakening cannot be expressed as an edit to a check,
# because the derivation takes a connection and there is no parameter to corrupt.

[[probe]]
id = "M41-a-resumed-acceptance-is-not-reported-as-a-full-handshake"
unit = "proxy.mechanism_verified_credential"
theorem = "THM-0030"
conjunct = "the reported path is the mechanism's own, never inferred"
# The weakening every consumer of this product is exposed to: reporting that the configured
# verifier ran when the mechanism restored a stored session instead. Nothing else goes red —
# the credential is byte-identical on both paths (Slice 4's measurement), so a control
# asserting a successful acceptance would stay green while the verification fact behind it
# was silently upgraded.
path = "mcp-re-proxy/src/communication_assurance/mechanism_verified_credential/rustls_adapter.rs"
anchor = """
        Some(HandshakeKind::Resumed) => EstablishmentPath::ResumedSession,
"""
weakening = """
        Some(HandshakeKind::Resumed) => EstablishmentPath::FullHandshake,
"""
expect_red = [
  "lib#communication_assurance::mechanism_verified_credential::rustls_adapter::acceptance::a_resumed_relationship_reports_a_resumed_path_not_a_full_one",
]

# ---------------------------------------------------------------------------
# ADR-MCPRE-064 Slice 2 — the authenticated peer
# ---------------------------------------------------------------------------
#
# What is probed is the one thing that survives the composition and could be lost in it: the
# establishment path. The same-credential conjunct — that the identity and the acceptance are
# about ONE credential — is not probed, and per L-4 that is not an omission: the enforcement
# mechanism is the absence of a parameter through which a foreign identity could enter, plus a
# private representation, so the weakening cannot be expressed as an edit to a check. Its
# evidence is the boundary plus successful compilation, and the sibling probe that fails with
# E0451.

[[probe]]
id = "M42-authentication-inherited-across-a-resumption-is-not-reported-as-fresh"
unit = "proxy.authenticated_relationship_peer"
theorem = "THM-0031"
conjunct = "the establishment path is projected from the acceptance, not chosen by the composition"
# The weakening a composition invites: having established the peer's identity, report the
# strongest verification fact for every peer. Nothing else goes red — the identity is the same
# on both paths, so a control asserting only that the right peer authenticated stays green
# while a resumed authentication is upgraded to one whose configured verifier had just run.
path = "mcp-re-proxy/src/communication_assurance/authenticated_relationship_peer.rs"
anchor = """
        self.accepted.establishment_path()
"""
weakening = """
        EstablishmentPath::FullHandshake
"""
expect_red = [
  "lib#communication_assurance::authenticated_relationship_peer::tests::a_resumed_authentication_is_not_reported_as_a_freshly_verified_one",
]

