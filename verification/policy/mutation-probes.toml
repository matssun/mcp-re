# Communication assurance — ADR-MCPRE-063 Slice 1
# ---------------------------------------------------------------------------
#
# THM-0024 has two halves that fail differently, and each gets its own probe. Reading
# another FIELD silently downgrades a URI-SAN deployment to a DNS or CN one. Reading a
# later VALUE of the configured field lets an issuer that can mint two SANs choose which
# identity the proxy binds to, by making the first one unusable. A battery that catches one
# and not the other is the ordinary outcome — before this slice, the tree caught the first
# and nothing at all caught the second.

