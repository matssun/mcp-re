# ---------------------------------------------------------------------------
# Communication assurance — ADR-MCPRE-063 Slice 1
# ---------------------------------------------------------------------------
#
# THM-0024 has two halves that fail differently, and each gets its own probe. Reading
# another FIELD silently downgrades a URI-SAN deployment to a DNS or CN one. Reading a
# later VALUE of the configured field lets an issuer that can mint two SANs choose which
# identity the proxy binds to, by making the first one unusable. A battery that catches one
# and not the other is the ordinary outcome — before this slice, the tree caught the first
# and nothing at all caught the second.

[[probe]]
id = "M25-certificate-identity-source-fallback"
unit = "proxy.certificate_identity"
theorem = "THM-0024"
conjunct = "no field other than the configured one is read"
path = "mcp-re-proxy/src/communication_assurance/certificate_identity_interpreter.rs"
# Re-adjudicated when the seam gained `FieldReadout`: the weakening is the same defect —
# an absent configured field falls through to a present weaker one — restated in the types
# the projection now returns. It is not a restoration of any earlier implementation.
anchor = """
        CertificateIdentityPolicy::UriSan => fields.first_uri_san(),
"""
weakening = """
        CertificateIdentityPolicy::UriSan => match fields.first_uri_san() {
            FieldReadout::Read(None) => fields.first_dns_san(),
            found => found,
        },
"""
expect_red = [
  "lib#communication_assurance::certificate_identity_interpreter::tests::an_absent_selected_field_refuses_while_the_other_fields_are_populated",
  "tests/integration#certificate_identity_no_fallback_test::uri_selected_and_absent_does_not_fall_back_to_a_present_dns_san",
]

[[probe]]
id = "M26-certificate-identity-later-value-fallback"
unit = "proxy.certificate_identity"
theorem = "THM-0024"
conjunct = "the value is the FIRST value the leaf presents in the configured field"
path = "mcp-re-proxy/src/communication_assurance/certificate_identity_fields.rs"
# Applied at the representation seam rather than in the selector: this is the shape the
# defect actually takes in the wild — a projection that helpfully skips values the caller
# would reject — and the selector has no loop to weaken.
anchor = """
    pub(super) fn first_uri_san(&self) -> FieldReadout<Option<&str>> {
        first_of(&self.uri_sans)
