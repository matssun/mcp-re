# an absent configured field falls through to a present weaker one — restated in the types
# the projection now returns. It is not a restoration of any earlier implementation.
anchor = """
        CertificateIdentityPolicy::UriSan => fields.first_uri_san(),
"""
weakening = """
        CertificateIdentityPolicy::UriSan => match fields.first_uri_san() {
            FieldReadout::Read(None) => fields.first_dns_san(),
            found => found,
        },
"""
