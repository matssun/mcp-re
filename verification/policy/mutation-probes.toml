# `proxy.exchange_lifecycle` — Stage 1 of the ratified closure.
#
# Three conjuncts, chosen because each is a NEGATIVE property whose control a green battery
# says nothing about: the anomaly latch, the derived backend projection, and the monotone
# continuation observation. No `theorem` key yet — the propositions are registered in
# Stage 2, and a probe defending an unstated proposition is better than an unstated
# proposition defended by nothing.
# ---------------------------------------------------------------------------------------

[[probe]]
id = "M94-an-illegal-key-window-has-no-inhabitant"
unit = "http_profile.delegated_signing_custody"
conjunct = "0 < overlap < ttl is true of every DelegatedKeyWindow that exists"
# R11-307 and R11-036 are the two ends of ONE seam, and this is the falsifier for the fix
# that closed both. `0 < O < T` is a RELATION between two fields, so no owner outside the
# struct can hold it: while `CustodyConfig` carried `pub ttl: i64` and `pub overlap: i64`,
# `CustodyConfig { ttl: 60, overlap: 60 }` was an ordinary expression, and with
# `overlap >= ttl` the rotor finds the credential due on every pass — the root/KMS issuer on
# the per-request path, which delegated custody exists to prevent.
#
# The seal has two halves and only one is mutable here. Private fields plus `of` as the sole
# producer is a COMPILE-time property no runtime weakening can move. `of`'s refusal is the
# runtime half, and deleting it restores the exact pre-fix legality: the type still exists,
# every call site still compiles, and an illegal pair is once again constructible.
path = "mcp-re-http-profile/src/custody/key_window.rs"
anchor = """
        if overlap >= ttl {
            return Err(KeyWindowError::OverlapNotInsideTtl);
        }
"""
weakening = """
"""
expect_red = [
  "lib#custody::key_window::tests::an_overlap_outside_the_ttl_is_not_a_window",
]

