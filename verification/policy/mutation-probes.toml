"""
weakening = """
    pub(super) fn first_uri_san(&self) -> FieldReadout<Option<&str>> {
        match &self.uri_sans {
            FieldReadout::Read(values) => FieldReadout::Read(
                values
                    .iter()
                    .find(|candidate| {
                        let trimmed = candidate.trim();
                        !trimmed.is_empty() && !trimmed.chars().any(char::is_control)
                    })
                    .map(String::as_str),
            ),
            FieldReadout::Uninterpretable => FieldReadout::Uninterpretable,
        }
