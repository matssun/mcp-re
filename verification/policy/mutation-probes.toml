unit = "proxy.continuation_materialization"
theorem = "THM-0096"
conjunct = "A plan naming no continuation store installs no store at all, and never a node-local substitute"
# THE DANGEROUS WEAKENING. It looks like a strict improvement — a deployment that would have
# had nothing now has something, single-replica flows start working, and no refusal appears
# anywhere. What it actually does is give the transcript's OFF line a scope it does not
# describe and hand the answer leg a store whose correlation cannot survive a replica switch,
# so a fleet answer lands on a replica whose map is empty and reads as a splice. Every leg
# control stays green under it: they measure what a plane does with the store it was given.
# ANCHORED ON THE `not(redis_replay)` ARM, and the choice is a lane fact rather than a
# preference: the mutation lane builds the DEFAULT feature set, so a weakening inside the
# `redis_replay` arm compiles to nothing and reads as "the controls held" while having
# measured nothing at all. Both arms reach the same OFF branch and the same control covers
# both; this is the one the lane can actually make the change in.
path = "mcp-re-proxy/src/serving_capabilities/continuation.rs"
anchor = """
    Ok(Established::off(CONTINUATION_STORE_OFF))
}
"""
weakening = """
    Ok(Established::on(
        Arc::new(crate::continuation_store::InMemoryContinuationStore::new())
            as Arc<dyn crate::continuation_store::AsyncContinuationStore>,
        "MRTR continuation store = node-local",
    ))
}
"""
