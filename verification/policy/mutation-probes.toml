path = "mcp-re-http-profile/src/scitt/offline.rs"
note = """
STRIPPING THE PARAMETER IS THE ATTACK. The comment above this match says it: accepting a
receipt with no position commitment because it did not carry one "would let an attacker strip
the parameter and make pinning the stronger profile worth nothing". The fold still verifies —
a true receipt at a position nobody signed is exactly what remains — so nothing else in the
composition refuses it.
"""
anchor = """        (ReceiptPositionProfile::Bound, None) => {
            return Err(HttpProfileError::ReceiptPositionUnbound)
        }
"""
weakening = """        (ReceiptPositionProfile::Bound, None) => {}
"""
expect_red = [
  "lib#scitt::offline::tests::a_bound_service_refuses_a_receipt_that_carries_no_position_commitment",
]

[[probe]]
id = "M75-an-algorithm-that-disagrees-with-the-resolved-key-is-refused"
unit = "http_profile.scitt_algorithm_agreement"
theorem = "THM-0041"
conjunct = "the protected `alg` and the resolved key must agree; a disagreement is refused rather than resolved in the key's favour"
path = "mcp-re-http-profile/src/scitt/cose_key/verify.rs"
note = """
THE PAIR IS THE CHECK, and the module says so: `(protected alg, resolved key)` is exhaustive,
which is the point. Weakening the mismatch arm to fall through to the key's own algorithm
would make the protected header advisory — a signer could declare one algorithm and be
verified under another, which is the confusion this exhaustive match exists to remove.
"""
anchor = """        (iana::Algorithm::EdDSA | iana::Algorithm::ES256, _) => Err(
            HttpProfileError::MalformedEvidence("scitt cose algorithm key mismatch"),
        ),
"""
weakening = """        (iana::Algorithm::EdDSA | iana::Algorithm::ES256, _) => Ok(()),
"""
expect_red = [
  "lib#scitt::cose_key::tests::an_algorithm_that_disagrees_with_the_resolved_key_is_refused",
]

