whose eight probes all attack the listener state and the epoch store — one of the 22
theorems `theorem-falsifier-coverage-2026-09-18.md` counts as covered by nothing that names
them, and the split is what made it merge-fatal rather than invisible.

The weakening is the one the builder's own doc says is not reachable:
`allow_unknown_revocation_status()` is NOT called, and there is no parameter that could cause
it to be. Calling it is therefore the exact counterexample the claim excludes, and rustls'
`UnknownStatusPolicy::Deny` default is what the claim rests on.
