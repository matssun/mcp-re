THE TWO RESIDUE CHECKS ARE THE WHOLE OF RFC 9162's POSITION BINDING. Without the `snode != 0`
refusal a short path stops folding early and returns an intermediate node as if it were the
root — which is exactly how a receipt for one position is restated at another, and is what
`restating_the_log_position_at_a_different_path_length_does_not_verify` exists to catch.
