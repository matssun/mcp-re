# SPDX-License-Identifier: Apache-2.0
#
# The `measured://` registry — ADR-MCPRE-068 §4.1, §12.2, Phase 0B.
#
# A MEASURED proposition is scoped and existential: over THIS corpus, in THIS environment,
# the observed value was X. It takes no mutation falsifier — deleting a production property
# does not make a measurement false, it makes it a measurement of a different tree — and
# what it owes instead is an APPARATUS CONTROL: the demonstration that its number can still
# MOVE. `tools/verification/verify-measured` executes these; `_measured.py` adjudicates them.
#
# EMPTY AT PHASE 0B, AND THAT IS THE PHASE ORDER RATHER THAN AN OVERSIGHT. 0B builds the
# lane and changes no unit's class; a unit may not declare `measured://` before the lane
# exists and fail-closes on zero execution, because `_evidence.required_lanes` binds every
# declared scheme and `decide_issuance` refuses a claimed lane with no record. The lane's
# liveness at 0B is `test_measured_lane.py`, which runs the runner end to end over a live,
# a dead, a silent and an irreproducible fixture apparatus on every gate run.
#
# The first real corpus arrives at 0D: ADR-MCPRE-068 §12.2 measured
# `conformance.verdict_vocabulary_scope` as a measurement already written — its battery
# holds the observation, a scope-identity control and a non-empty-input sensitivity control
# — filed under `tested` because `tested` was the only word available.

schema_version = 1

# Each record names the unit whose proposition it measures, an executable protocol, the scope
# that bounds it, the artifact it produces, and one of the two control kinds:
# `reproducibility` (the protocol run twice must agree) or `sensitivity` (a perturbation that
# must report `APPARATUS-MOVED: <n>`, n >= 1).

[[measurement]]
id = "MSR-0001"
unit = "conformance.verdict_vocabulary_scope"
protocol = [
  "cargo",
  "test",
  "-p",
  "mcp-re-conformance",
  "--test",
  "audit_vocabulary_guard_test",
  "--",
  "--exact",
  "exactly_two_files_decide_what_a_verdict_token_says",
  # The SCOPE IDENTITY control runs WITH the measurement rather than beside it: it derives
  # the scanned crate set from the workspace manifest, which is what makes the number a
  # statement about the workspace instead of about a hand-list someone last edited.
  "the_scanned_crate_set_is_the_workspace",
  # Without this the `MEASURED:` lines never reach the lane and the artifact is empty —
  # which the lane refuses as an apparatus that did not run, rather than reporting a green
  # measurement of nothing.
  "--nocapture",
]
scope = """
Every crate in the workspace with a source tree, derived from the root Cargo.toml at compile
time; production halves only, with test regions excluded by `rust_source::production_half`.
Measured on whatever host runs the lane, which does not bound the result: the corpus is the
tree, not the machine.
"""
artifact = "verdict-vocabulary-scope.txt"
artifact_pattern = "^MEASURED: "
control_kind = "sensitivity"
control = [
  "cargo",
  "test",
  "-p",
  "mcp-re-conformance",
  "--test",
  "audit_vocabulary_guard_test",
  "--",
  "--exact",
  "the_measurement_moves_when_the_scanned_set_shrinks",
  "--nocapture",
]
note = """
ADR-MCPRE-068 §12.2. The apparatus was already written and filed under `tested`, because
`tested` was the only word available. The sensitivity control removes `mcp-re-core` from the
scanned set and requires exactly one observation to change — chosen rather than arbitrary,
since that crate holds one of the two frozen vocabularies, and a crate whose absence changed
nothing would let the control pass over a walk that had stopped reading anything at all.
"""
