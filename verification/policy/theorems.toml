# SPDX-License-Identifier: Apache-2.0
#
# ADR-MCPRE-059 §6.3 — the security theorem registry.
#
# The human security claim layer. A theorem is the proposition a reviewer cares about
# ("a request cannot be admitted on stale freshness evidence alone"), stated once, with a
# permanent identifier, above the evidence that supports it.
#
# It sits ON TOP OF the existing authorities and duplicates none of them:
#
#   this file                 the claim, its consequence, its scope, and two edges —
#                             which review units support it, which theorems it rests on
#   verification.toml         [[unit]]: source paths, contracts, evidence URIs, symbols,
#                             features — everything below the claim
#   assumptions.toml          ASM-NNNN: what is trusted, and where
#   the attestations          what actually ran, and over which fingerprint
#
# A theorem therefore names NO path, symbol, feature, assumption, provider kind, or
# evidence target. It resolves downward through `unit://`, and the evidence closure is
# derived, never written here. Reverse edges (`consumed_by`, unit → theorems it
# guarantees, dependents) are likewise derived and MUST NOT be stored (§8.2).
#
# Validated by `tools/verification/verify --manifests`, strictly: an unknown key is a
# validation FAILURE, not a silently ignored field. A mistyped security declaration must
# not read as an absent one.

schema_version = 1

# The system security promises — ADR-MCPRE-059 §28.1, §28.8.
#
# The claims MCP-RE makes at its boundary, from which proof-tree COMPLETENESS is derived:
# every proposition a declared root requires has a closed path to an established claim, a
# structural fact, or an accepted assumption, with no unresolved GAP.
#
# Completeness is not freshness. Freshness asks whether the registry still describes the
# tree; every theorem here can be FRESH while the system argument is wide open. The two are
# reported separately by `tools/verification/review`, and only `--require-root-complete`
# makes this set binding — an honest unresolved gap must not fail ordinary CI, or the
# incentive becomes to leave the obligation unrecorded.
#
# Roots are DECLARED, never inferred. "A theorem with no dependents" is a different
# property: an isolated local claim nobody has composed yet has no dependents and is not a
# system promise, so inferring roots from graph shape would declare the registry complete
# the moment it held leaves.
#
# EMPTY, deliberately, and it reports UNDECLARED rather than PASS. The root set is
# populated by the theorem-architecture ratification (§28, ADR-MCPRE-059 rev. 3 → T6):
# a root enters here after its statement and decomposition have been owner-ratified, never
# because a claim looked important. Adding or removing an entry is a security-sensitive
# change under §21.1.
root_theorems = [
  # R1 / R6 — the two halves of the request pipeline, kept apart because one constrains what
  # a successful dispatch implies and the other what a failure does. A biconditional would
  # make the pair a liveness claim.
  "THM-0074",
  "THM-0078",
  # R2 / R3 — the same exchange from two sides. MCP-RE ships both, and a deployment may run
  # either alone, so producer attribution and consumer acceptance stay separate promises.
  "THM-0075",
  "THM-0076",
  # R4 — the configuration lattice.
  "THM-0077",
  # R5 — a FAMILY, not one umbrella. No authority owns the conjunction of these, and none is
  # invented to make an elegant single claim possible: lifecycle/state-record correspondence,
  # registration on the pinned transparency service, retained-evidence correspondence, and
  # audit-vocabulary totality are independently owned promises.
  "THM-0012",
  "THM-0072",
  "THM-0042",
  "THM-0071",
]

# Required fields on every entry:
#
#   id                    stable, never reused: THM-NNNN
#   title                 one line, the claim as a reviewer would name it
#   statement             the proposition itself, precise enough to be reviewed
#   security_consequence  what an attacker cannot do if it holds
#   scope                 what it does NOT establish — the boundary of the claim
#   owner                 the review unit that is the semantic authority for it,
#                         as a `[[unit]]` id declared in verification.toml
#   review_requirement    who must review a change to the statement
#   supported_by          `unit://<id>` entries whose evidence supports the claim
#   depends_on            THM-NNNN entries this claim rests on
#
# A resolving `supported_by` is a STRUCTURAL fact, not assurance: it says the closure
# reaches real units and real premises, never that their evidence ran, is fresh, or is
# unblocked. "Established" is the later conjunction — structural support AND fresh unit
# evidence AND established dependencies AND fresh specification review AND fresh
# assumption review — and no tooling at this layer may claim it.
#
# Optional:
#
#   replaced_by           THM-NNNN. Its PRESENCE is what marks a theorem deprecated;
#                         there is no status string to go stale, and no field a reviewer
#                         has to remember to flip.
#
# There is deliberately no review or approval field. An approval is evidence ABOUT a
# fingerprint, recorded with the other attestations and keyed by the fingerprint it
# reviewed (§14.7). A stored `review = "approved"` would not say which proposition was
# approved, and would make a self-approving edit a one-file operation.
#
# ID allocation
# -------------
#
#   * `THM-NNNN`, allocated in ascending order, four digits.
#   * An ID is PERMANENT. It is never recycled, never renumbered, and never reassigned to
#     a different proposition — the review history refers to it.
#   * A theorem may be renamed, restated, decomposed, or deprecated under the same ID. The
#     fingerprint, not the ID, carries the version: restating a claim changes
#     `theorem_claim` and takes specification review DIRTY by derivation.
#   * If a proposition changes so fundamentally that continuity would mislead a reviewer,
#     allocate a NEW ID and deprecate the old one with `replaced_by`. The deprecated entry
#     STAYS in this file so historical evidence remains resolvable.
#   * Removing an entry outright is the one thing the loader cannot catch — it frees the
#     ID for reuse and severs the history. Deprecate; do not delete.
#
# The registry, populated by Phase T4.
#
# Twenty-one claims over nine review units. The mapping is one-to-one in neither direction,
# and that is the T4 result rather than an untidy outcome:
#
#   * `http_profile.admission_currency` yields THREE claims. One prover run, one `ensures`
#     with four conjuncts, three different attacker stories — and they are separated so a
#     future rollback claim can rest on THM-0004 alone, and so changing degraded behaviour
#     cannot invalidate a consumer that only needs generation equality.
#   * `http_profile.keyid` yields NONE. Its evidence is one RFC 8037 known-answer test,
#     which is conformance; the property that would matter is selector injectivity, and a
#     known-answer test does not reach it. Recording that is the honest outcome, and the
#     absent row is visible in the owner view.
#   * Presenter binding (THM-0006) was NOT claimable when this file was first populated.
#     The check was enforced on every path in `admission.rs`, absent from the `ensures`, and
#     unexercised by all nine of its unit's tests — every one passed the same actor as both
#     the assertion's actor and the presenter, so deleting the check left them all green.
#     It is now proved: the verdict carries the admitted actor and the postcondition states
#     the comparison. Measured, not assumed — with the check removed the prover reports
#     14 verified / 1 error while the unit tests reported 9 passed / 0 failed, which is the
#     difference the claim exists to record.
#
# Every `scope` states what the claim does NOT establish. Four of those sentences existed
# only as Rust or TOML comments before this file: read by no tooling, attached to no review,
# invalidated by nothing.
#

[[theorem]]
id = "THM-0001"
title = "Admitted request parameters imply a current freshness window"
statement = """
Every signature-parameter set the verifier admits satisfies created - skew <= now,
now < expires + skew, created < expires, and a lifetime within the policy maximum, for
the skew the verifier policy yields.
"""
security_consequence = """
A request cannot be admitted on freshness evidence that has expired, that is dated ahead
of the verifier, or that declares a lifetime longer than the policy permits.
"""
scope = """
Establishes freshness admission only. It does not establish signature validity, issuer
authority, admission currency, or replay uniqueness. The window is stated relative to
skew_of(policy), an opaque accessor: the theorem holds for whatever skew the deployment
configures and does not establish that the configured skew is bounded or sane.
"""
owner = "http_profile.freshness_window"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.freshness_window"]
depends_on = []

[[theorem]]
id = "THM-0002"
title = "RFC 3339 parsing is total and range-bounded"
statement = """
parse_rfc3339_utc terminates without panicking on arbitrary input, and every timestamp it
accepts denotes an instant within the parser's ADMITTED four-digit civil range
0000-01-01T00:00:00Z through 9999-12-31T23:59:59Z, that is [-62167219200, 253402300799].

Both bounds are TIGHT: each is attained by an accepted timestamp, so neither can be
narrowed. RFC 3339 defines the era as 0000AD through 9999AD; MCP-RE admits a stricter
UTC-only four-digit-year subset of it, and the grammar's four-digit year together with the
refusal of leap seconds is what makes 9999-12-31T23:59:59Z the maximum value the function
can return.
"""
security_consequence = """
A timestamp in an evidence artifact can neither crash the verifier nor denote an instant
the rest of the system cannot represent.
"""
scope = """
The two halves are established differently and a reviewer must not look for one conjunct.
The range half is the postcondition. Totality is discharged by the absence of a
precondition together with the prover's panic-freedom obligation, not by an ensures
clause. The theorem says nothing about which grammar variants are accepted beyond that
what is accepted is in range.

It does not establish that every instant in the range is REACHABLE by some accepted
timestamp — only that nothing outside it is. The two endpoints specifically are reachable,
and are pinned by boundary controls at their exact Unix seconds, but the claim is
containment.

It says nothing about the inverse direction: that unix_to_rfc3339_utc round-trips a value in
this range is a different proposition with its own evidence.
"""
owner = "core.time_rfc3339"
review_requirement = "Owner security-specification review"
supported_by = ["unit://core.time_rfc3339"]
depends_on = []

[[theorem]]
id = "THM-0003"
title = "Admission verdict integrity"
statement = """
Every admission verdict returned as Ok has status Admitted and carries the generation of
the binding that was checked.
"""
security_consequence = """
A policy enforcement point cannot act on a verdict that describes a different call than
the one it checked.
"""
scope = """
Does not establish authenticity, issuer trust, audience validity, assertion freshness, or
validity of the assertion's [nbf, exp] window; verify_admission_assertion is outside this
proof cone under ASM-0012. Does not establish that the admitted actor is the presenter of
the call (see the presenter-binding claim, which this contract does not state).
"""
owner = "http_profile.admission_currency"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.admission_currency"]
depends_on = []

[[theorem]]
id = "THM-0004"
title = "Admission anti-rollback"
statement = """
A non-degraded Ok verdict implies the authoritative admission state was reachable, that
state is ABOUT the workload the call is bound to — its `admission_id` equals the binding's,
which the earlier binding/assertion comparison has already equated with the verified
assertion's — and at that workload its generation equals the binding's generation and its
status is Admitted.

The three conjuncts are ordered, and the order is the claim. Generation equality and
`Admitted` are properties OF a subject; asserted about an unnamed record they are satisfied
by any workload that happens to sit at the same number, and a generation is a per-workload
counter, so that is the ordinary case rather than a contrived one.
"""
security_consequence = """
A workload whose admission has been superseded or revoked cannot buy a call with an
assertion that has not yet expired, and cannot buy one with ANOTHER WORKLOAD'S
authoritative state either — not even a state at the same generation, still admitted, and
in every other respect a well-formed answer.
"""
scope = """
Says nothing about the degraded path, and nothing about the assertion's authenticity or
freshness (ASM-0012). Currency is generation equality against the state the enforcement
point holds; the theorem does not establish that that state is itself current, nor that the
authority behind it is the right authority to trust.

The subject conjunct is a claim about the VERDICT, not a caller obligation. It was one: the
state carried a generation and a status and no workload identity, so the proof quantified
over whatever record the caller supplied, and the security consequence rested on every
enforcement point remembering to look the record up under the `binding.admission_id` it had
just checked. Every one of them did. That is what a remembered convention looks like, and
the R-SEAL test asks whether the check could be deleted and still leave an invalid value
unconstructible: it could not, because there was no check — there was nothing to compare.

`AuthoritativeAdmission` now carries its subject, and `AuthoritativeAdmission::new` — which
cannot be called without naming the workload — is its only construction anywhere the value
is consumed. The seal is `#[non_exhaustive]` rather than private fields, and here that binds
every actual consumer: all of them are in `mcp-re-proxy`, where the struct literal is
refused outright. The fields stay public because Verus does not accept an
`external_type_specification` over a datatype with non-public ones, and the postcondition
carrying the subject conjunct is this theorem's primary evidence; reading a field cannot
produce an illegal value, and construction is what is closed. So the id in the value is the
id the adapter looked up: the
Redis source builds it from the key it read the record under and files a published record
under the record's own subject, and the in-memory source keys its map by the same. There is
no longer a pair of operands that could disagree.

The claim remains about ONE enforcement decision. It does not establish that the store's
key is the workload's true name, nor that a compromised authority publishes true records —
those are the authority's propositions, not this one's.
"""
owner = "http_profile.admission_currency"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.admission_currency"]
depends_on = []

[[theorem]]
id = "THM-0005"
title = "Degraded admission requires deployment opt-in"
statement = """
A degraded Ok verdict implies the authoritative admission state was unreachable and the
deployment policy explicitly allows degraded mode.
"""
security_consequence = """
No default deployment can reach a degraded admission; serving on a last-known snapshot is
always a choice someone made.
"""
scope = """
Establishes the opt-in, not the bound. That a degraded verdict is confined to the
propagation window P is enforced in the body and is not a conjunct of this contract.
Says nothing about assertion authenticity or freshness (ASM-0012).
"""
owner = "http_profile.admission_currency"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.admission_currency"]
depends_on = []

[[theorem]]
id = "THM-0006"
title = "Presenter binding"
statement = """
A successful admission implies the admitted actor named by the assertion is the presenter
of this call — the actor the verifier resolved from the request signature.
"""
security_consequence = """
An assertion describing some admitted workload cannot authorize a different presenter
merely because the workload itself is admissible. Without it the assertion is a bearer
token: anyone whose key the enforcement point resolves could copy an admitted peer's
assertion into their own evidence block, derive the matching binding, and pass the gate.
"""
scope = """
Establishes that the actor named in the assertion equals the presenter argument. It does
not establish that the presenter argument is itself correctly resolved from the request
signature, which is the caller's obligation. Does not establish authenticity, issuer trust,
audience validity, assertion freshness, or validity of the assertion's [nbf, exp] window;
verify_admission_assertion is outside this proof cone under ASM-0012.
"""
owner = "http_profile.admission_currency"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.admission_currency"]
depends_on = []

[[theorem]]
id = "THM-0007"
title = "A typed artifact verifier admits only its own type"
statement = """
Each typed OAuth verifier returns Ok only for a binding whose artifact_type is the one
that verifier is for and whose binding_type is the opaque-digest form.
"""
security_consequence = """
A binding of one artifact type cannot be verified by the verifier for another, so a
credential form cannot be laundered through the wrong check.
"""
scope = """
Does not establish that the digest matches the presented credential: the comparison's
meaning is a statement about SHA-256 and is outside this proof cone under ASM-0018.
"Verified" here means correctly typed and in opaque-digest form.
"""
owner = "http_profile.artifact_typing"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.artifact_typing"]
depends_on = []

[[theorem]]
id = "THM-0008"
title = "No untyped artifact binding leaves the verifier as verified"
statement = """
If `enforce_full_profile_bindings` returns Ok for an `HttpRequestEvidenceBlock`, then every
`ArtifactBinding` that block declared matched one of MCP-RE's explicitly supported typed
verification branches and satisfied that branch's required binding form.

The supported branches are exactly two:

  * the OAuth typed-verifier family, reached through
    `artifact::verify_artifact_binding` for `OauthDpop`, `OauthMtls` and `OauthRar`, each
    in the `OpaqueDigest` form and against resolved credential material;
  * `PdpDecision` in the `OpaqueDigest` form, reached through
    `pdp_decision::verify_pdp_decision_binding` and only when the block carries the
    decision document the binding commits to.

Every other `ArtifactType`, and every binding form outside the branch that admits it — a
`ReferenceDigest` entry included — is refused. A `PdpDecision` binding whose block carries
no decision has no supported branch and is refused with the rest.
"""
security_consequence = """
An artifact type that nothing supports cannot be laundered into a verified result: it is
refused, not skipped, and not reported verified by a branch built for a different type. A
caller therefore cannot silently treat an unsupported artifact type as though it had been
verified, and adding a registry type does not quietly widen what verification concludes.
"""
scope = """
Structural over the dispatch relation, and inherits THM-0007's exclusion: it does not
establish that any digest matched its credential (ASM-0018), nor that the supplied material
is the credential the peer actually holds.

It says which branch a verified binding took; it says nothing about what a decision
document AUTHORIZES. Digest correspondence is one link — authority trust, actor and action
relation, validity and an explicit Allow are separate propositions with their own owner
(ADR-MCPRE-065), and none of them is claimed here.

The cardinality of the supported set is a fact of the current implementation, not the
spine of the claim: the proposition is the closed selection, so adding a typed verifier
obliges a re-measurement rather than making the sentence false by arithmetic.
"""
owner = "http_profile.artifact_verification_boundary"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.artifact_verification_boundary"]
depends_on = ["THM-0007"]

[[theorem]]
id = "THM-0009"
title = "A presented continuation cannot bypass verification"
statement = """
If dispatch preparation returns Ok for a request whose evidence block carries a
continuation, the returned continuation-verified flag is true: the pair (continuation
present, not verified) is not a state any successful preparation can produce.
"""
security_consequence = """
A continuation cannot be carried through dispatch on the strength of being present in the
request.
"""
scope = """
Establishes that the check ran, not what it guarantees; what a verified continuation binds
is THM-0010, which this claim consumes. continuation_verified is an informational WITNESS
propagated in DispatchOutcome, not a control value: downstream consumption is not required
for enforcement, because the unsafe combination is unreachable on a successful preparation
path. The authority is the successful return under this postcondition, not the boolean,
which merely exposes part of that fact. A reader who greps for consumers, finds none, and
concludes the check is unwired has read it backwards.
"""
owner = "http_profile.continuation_unbypassability"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.continuation_unbypassability"]
depends_on = ["THM-0010"]

[[theorem]]
id = "THM-0010"
title = "Continuation handles match their presented inputs in role"
statement = """
An accepted continuation's three handles are the labeled digests of the three presented
inputs, each under its own role label.
"""
security_consequence = """
A response-role evidence handle cannot be presented in the request role, so the three
positions of a continuation cannot be permuted.
"""
scope = """
Assumes only that the labeled digest IS A FUNCTION of (label, bytes) — ASM-0023. It does
NOT establish collision-resistant separation between roles; that obligation stays at
boundary.crypto_primitives and is not discharged here.
"""
owner = "http_profile.continuation_binding"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.continuation_binding"]
depends_on = []

[[theorem]]
id = "THM-0012"
title = "The lifecycle record cannot claim a shutdown that did not happen"
statement = """
Every state has a unique predecessor under the transition relation and apply is the only
mutator, leaving the state unchanged on an illegal event. So a recorded terminal Stopped
implies every event of the path Configured -> Validated -> Planned -> Materializing ->
Materialized -> Serving -> Draining -> Transitioning -> Reclaiming -> Stopped was applied,
in order.
"""
security_consequence = """
A runtime that never bound a listener cannot be recorded as a clean drained shutdown, so
the two terminal states remain distinguishable in an audit record.
"""
scope = """
Establishes what the RECORD can say. It does not establish that any request was refused.
RuntimeState::admits_requests is a DESCRIPTIVE value, not a control: no production path
consumes it, and the recorded state is never Serving while a request is in flight, because
the serving events are applied only after serve_fleet returns Ok — so a consumer reading it
during serving would read Materialized and refuse everything. What actually confines
requests to the serving interval is resource ownership: the listener exists only inside the
serve_fleet call. That the events are applied only on a proven Ok is the materialized-runtime
owner's obligation, not this unit's. FailedToStart is currently
unreachable from Materialized, so a serve that never bound is recorded as Materialized —
the record is silent about the failure rather than wrong about it. Evidence is test://
only: the uniqueness-of-path argument is a match a reviewer reads, not a proof a prover
checked.
"""
owner = "proxy.runtime_lifecycle"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.runtime_lifecycle"]
depends_on = []

[[theorem]]
id = "THM-0013"
title = "No validated deployment enables online OCSP client-certificate revocation"
statement = """
Every DeploymentRequest whose `peer_revocation.online` is
`OnlineRevocationEvidenceRequest::Required` is refused by the legality boundary, in every
build and independently of the online_ocsp feature. Every ValidatedDeployment therefore
carries `peer_revocation.online == OnlineRevocationEvidenceRequest::NotRequired`, and the
serving path is handed no OCSP checker.

The refusal is over the SELECTION, not over any responder parameter it carries: an
`OcspResponderRequest` travels inside `Required`, so every deployment that names a
responder is already refused by the selection that holds it.
"""
security_consequence = """
A successfully validated MCP-RE deployment cannot advertise or rely upon online OCSP
enforcement on the production async serving path. An operator who asks for it is refused at
startup rather than served by a plane that performs no responder round trip.
"""
scope = """
Establishes reachability and legality only. It does NOT establish the correctness of the
retained RFC 6960 implementation in ocsp.rs, of the blocking-path OCSP checker, of responder
trust-chain validation, of the endpoint/SSRF network policy, or of any future async OCSP
implementation. It says what no deployment can turn on, not that what is turned off would
be correct if turned on.
"""
owner = "proxy.online_ocsp_reachability"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.online_ocsp_reachability"]
depends_on = []

# ---------------------------------------------------------------------------
# The verifier's result claims — ADR-MCPRE-061 §12, MCPRE-136
# ---------------------------------------------------------------------------
#
# Nine claims over one unit: seven public verifier operations, plus the two propositions
# that two operations each genuinely SHARE. MCPRE-136 was written when the verifier
# returned two product types and asked for two composition theorems; after #570/#571 there
# are seven deliberately different propositions, and collapsing them into two buckets would
# flatten exactly the graph the type split created.
#
# Two things are deliberately true of every entry below.
#
# **They are claims about a SUCCESSFUL RETURN, not about possession of a Rust value.** Both
# product modules record that their fields stay `pub` because a Verus-proved postcondition
# outranks a seal, so nothing prevents a caller from assembling a product by hand. The type
# split proves NON-SUBSTITUTABILITY between assurance levels; it does not prove provenance.
# Every scope sentence says so, and it is not boilerplate — it is the exact boundary that
# trade created.
#
# **They rest on tests, and the statements are bounded by what those tests reach.** The unit
# is class V0: the prover reaches `check_params`, not the operations that call it. So each
# conjunct carries a NEGATIVE control that goes red when the production check it names is
# deleted, and the manifest records the probe. Where a conjunct IS proved, the claim depends
# on the theorem that proves it rather than restating it here.
#
# THE GRAPH, AND THE EDGE THAT IS NOT THERE
# -----------------------------------------
#
#   request floor (0014) ─────────> full request (0015)
#
#                     ┌──> seam-authorized bound floor (0016) ──> full bound response (0018)
#   bound facts (0021)┤
#                     └──> delegation-authorized bound response (0019)
#
#                       ┌──> seam-authorized unbound floor (0017)
#   unbound facts (0022)┤
#                       └──> delegation-authorized unbound response (0020)
#
# The first version of this family had 0019 depend on 0018 and 0020 on 0017, because the
# Rust structs nested that way. **That inheritance was false.** THM-0016 says the presented
# keyid was resolved through the trust seam for the Response slot; on the delegated path it
# was not, and no trust map contains the signing key. The seam is queried for the
# credential's ROOT ISSUER, and the credential chain is what authorizes the key that signs.
# Two different authorization propositions were being read as one because one struct
# contained the other.
#
# So the products were rebuilt around what the two paths actually share — the digest,
# parameter, signature and `;req` facts, and an `AcceptedResponseSigner` that says WHO
# signed and never WHY that signer is acceptable — and the theorem layer follows:
#
#   * 0021 / 0022 are the shared propositions. They are still claims about a successful
#     return; they simply quantify over the three (respectively two) operations that
#     establish them, which is exactly the set the shared product type has.
#   * 0016 / 0017 add trust-seam authorization. 0019 / 0020 add credential-chain
#     authorization. Neither branch implies the other in either direction, and both scopes
#     say so explicitly rather than leaving the absence of an edge to be noticed.
#
# The alternative — keeping seven entries and restating the shared conjuncts inside each
# delegated claim — was rejected because it leaves a reviewer diffing two long statements to
# discover that the shared part is the same proposition, and leaves the shared product type
# a witness with no claim.
#
# `http_profile.verifier_result_separation` supports NONE of them. Its controls establish
# that the products are not interchangeable, which is a different proposition from what any
# successful return establishes; recording the absent edge is the honest outcome, as it was
# for `http_profile.keyid`.

[[theorem]]
id = "THM-0014"
title = "A successful request-floor verification establishes the cryptographic floor"
statement = """
If `Verifier::verify_request_floor` returns Ok, then for the request supplied: the covered
`Content-Digest` agreed with the body, the RFC 9421 signature verified over the
reconstructed signature base under an algorithm the verifier's policy accepts, the
signature parameters were admitted as current, and the presented keyid was resolved through
the trust seam for the Request slot.
"""
security_consequence = """
An attacker cannot obtain a floor-verified request by tampering with the body, by
presenting a signature under an algorithm the deployment does not accept, by replaying
expired parameters, or by presenting a key the seam vouches for only in the Response slot.
"""
scope = """
This theorem characterizes values successfully returned by `verify_request_floor`. It does
not establish that an arbitrary externally constructed `CryptographicFloorVerifiedRequest`
was produced by that operation.

It establishes NOTHING about audience or target equality, artifact binding, replay,
admission, continuation semantics, or dispatch authorization: those are the full-profile
and dispatch claims. It says the seam ANSWERED for the Request slot, not that the
deployment was right to trust that actor (ASM-0029). It rests on a test battery, not on a
postcondition over this operation.
"""
owner = "http_profile.verifier_results"
review_requirement = "Owner security-specification review"
supported_by = [
  "unit://http_profile.verifier_results",
  "unit://http_profile.freshness_window",
]
depends_on = ["THM-0001"]

[[theorem]]
id = "THM-0015"
title = "A successful full-profile request verification establishes audience and artifact binding"
statement = """
If `Verifier::verify_request` returns Ok, then the request-floor proposition holds for the
same request, and in addition: the request evidence block parsed and validated under the
profile tag, its audience tuple equalled the verifier's own and agreed with the request's
`@target-uri`, and every artifact binding the block declared was verified through the
supported typed verification branch for its artifact type (THM-0008) — against the
credential material resolved for that binding, or, for the carried authorization-decision
form, against the decision document the block itself carried.
"""
security_consequence = """
A request signed for a different audience, route or target cannot be successfully returned
as a full-profile verified request, and a declared artifact binding cannot be skipped by
withholding the evidence it commits to — an unobtainable credential, and an artifact type
with no supported typed verification branch, both fail closed rather than being ignored.
"""
scope = """
This theorem characterizes values successfully returned by `verify_request`. It does not
establish that an arbitrary externally constructed `VerifiedMcpRequest` was produced by
that operation.

It establishes nothing about replay admission, admission-assertion currency, continuation
binding or dispatch authorization; a full-profile request is not an admitted one — which is
why the consequence above is phrased over what this operation returns rather than over what
a deployment admits. It does not establish that the artifact material the caller supplied is
the credential the peer actually holds — only that the binding verified against what was
supplied.

A verified `pdp-decision` binding establishes that the block carried the exact decision
document its digest committed to. It establishes nothing about what that document
AUTHORIZES: authority trust, the actor and action relations, validity and an explicit
Allow are the authorization owner's propositions (ADR-MCPRE-065), not this one's.
"""
owner = "http_profile.verifier_results"
review_requirement = "Owner security-specification review"
supported_by = [
  "unit://http_profile.verifier_results",
  # The artifact conjunct's evidence closure is the DISPATCH, not one typed verifier:
  # THM-0007's proved postcondition reaches this claim through THM-0008's `depends_on`.
  "unit://http_profile.artifact_verification_boundary",
]
depends_on = ["THM-0014", "THM-0007", "THM-0008"]

[[theorem]]
id = "THM-0021"
title = "A successful bound-response verification establishes the shared cryptographic and request-binding facts"
statement = """
If any of `Verifier::verify_bound_response_floor`, `Verifier::verify_bound_response` or
`Verifier::verify_delegated_bound_response` returns Ok, then for the response supplied: the
covered `Content-Digest` agreed with the body, the signature parameters were admitted as
current under an algorithm the verifier's policy accepts, and the RFC 9421 signature
verified over a base whose `;req` components were resolved against the concrete request
supplied to the call, under the verification key of the accepted signer the operation
returns.
"""
security_consequence = """
A response signed for a different request cannot be presented as the answer to this one:
splicing changes the signature base, so no valid signature covers it. A tampered body
breaks the covered digest. Both hold on EITHER authorization path, so a deployment moving
from trust-store to delegated response signing does not have to re-establish them.
"""
scope = """
It says WHO the signature was accepted under and never WHY that signer is acceptable.
`AcceptedResponseSigner` deliberately carries no slot resolution and no credential: trust-seam
authorization (THM-0016) and delegation-chain authorization (THM-0019) are different
propositions, and neither may be inferred from this one.

It reads no response evidence block, so it establishes no `server_signer` correspondence and
no request-evidence comparison. It says the response is bound to the request the CALLER
SUPPLIED; it establishes nothing about that request — not that it was authenticated, not
that it was full-profile verified, not that it is the request this peer sent.

It characterizes values successfully returned by those three operations. It does not
establish that an arbitrary externally constructed `BoundResponseSignatureFacts` was
produced by one of them.
"""
owner = "http_profile.verifier_results"
review_requirement = "Owner security-specification review"
supported_by = [
  "unit://http_profile.verifier_results",
  "unit://http_profile.freshness_window",
]
depends_on = ["THM-0001"]

[[theorem]]
id = "THM-0022"
title = "A successful unbound-response verification establishes the shared facts and no request binding at all"
statement = """
If either `Verifier::verify_unbound_response_floor` or
`Verifier::verify_delegated_unbound_response` returns Ok, then for the response supplied:
the covered `Content-Digest` agreed with the body, the signature parameters were admitted
as current under an algorithm the verifier's policy accepts, and the signature verified
over a base covering ONLY response components under the verification key of the accepted
signer the operation returns — a `;req` component is refused as malformed, because no
request exists to resolve it against.
"""
security_consequence = """
A receipt emitted before a request could be parsed can still be attributed to a signer, and
it cannot smuggle in a request binding: a `;req` component makes the message malformed
rather than admitting an unresolvable reference.
"""
scope = """
As with THM-0021, it says WHO the signature was accepted under and never WHY. Trust-seam
authorization is THM-0017 and delegation-chain authorization is THM-0020.

It establishes NO relationship to any request, and must never be read as a weaker form of
THM-0021. A caller that needs an answer to a specific request gets nothing from it. Any
`request_evidence` the response body carries is diagnostic and is outside this claim
entirely. It reads no response evidence block.

It characterizes values successfully returned by those two operations, not arbitrary
externally constructed `UnboundResponseSignatureFacts`.
"""
owner = "http_profile.verifier_results"
review_requirement = "Owner security-specification review"
supported_by = [
  "unit://http_profile.verifier_results",
  "unit://http_profile.freshness_window",
]
depends_on = ["THM-0001"]

[[theorem]]
id = "THM-0016"
title = "A successful bound response-floor verification establishes trust-seam authorization of the signer"
statement = """
If `Verifier::verify_bound_response_floor` returns Ok, then the shared bound-response
proposition holds for the same response and request, and in addition: the presented keyid
was resolved through the trust seam for the Response slot, and the actor the seam returned
IS the accepted signer — the signature verified under the key the seam supplied.
"""
security_consequence = """
A response cannot be attributed to a server signer this deployment's trust store does not
vouch for in the Response slot, and a request-signer key presented on a response is refused
rather than silently accepted in the wrong role.
"""
scope = """
This theorem characterizes values successfully returned by `verify_bound_response_floor`.
It does not establish that an arbitrary externally constructed
`CryptographicFloorVerifiedBoundResponse` was produced by that operation.

It says the seam ANSWERED for this keyid in the Response slot, not that the deployment was
right to trust that actor, and not that the key the seam returned is the key it should have
returned (ASM-0029). It reads no response evidence block, so it establishes no
`server_signer` correspondence and no request-evidence comparison.

It makes NO delegation claim, and the delegated products do not carry this proposition: on
that path the seam is queried for the credential's ROOT ISSUER and the signing key appears
in no trust map at all.
"""
owner = "http_profile.verifier_results"
review_requirement = "Owner security-specification review"
supported_by = [
  "unit://http_profile.verifier_results",
  "unit://http_profile.freshness_window",
]
depends_on = ["THM-0021"]

[[theorem]]
id = "THM-0017"
title = "A successful unbound response-floor verification establishes trust-seam authorization and no request binding"
statement = """
If `Verifier::verify_unbound_response_floor` returns Ok, then the shared unbound-response
proposition holds for the same response, and in addition: the presented keyid was resolved
through the trust seam for the Response slot, and the actor the seam returned IS the
accepted signer.
"""
security_consequence = """
A receipt emitted before a request could be parsed can still be attributed to a trusted
server signer — and only to one the seam vouches for in the Response slot.
"""
scope = """
This theorem characterizes values successfully returned by
`verify_unbound_response_floor`. It does not establish that an arbitrary externally
constructed `CryptographicFloorVerifiedUnboundResponse` was produced by that operation.

It inherits every exclusion of THM-0022 — no request relationship of any kind — and the
ASM-0029 boundary of THM-0016. It makes no delegation claim: a delegated receipt is
authorized by a credential and never reaches this type.
"""
owner = "http_profile.verifier_results"
review_requirement = "Owner security-specification review"
supported_by = [
  "unit://http_profile.verifier_results",
  "unit://http_profile.freshness_window",
]
depends_on = ["THM-0022"]

[[theorem]]
id = "THM-0018"
title = "A successful full bound response verification establishes block agreement with the expected handle"
statement = """
If `Verifier::verify_bound_response` returns Ok, then the trust-seam-authorized bound
response-floor proposition holds for the same response and request, and in addition: the
response evidence block parsed and validated under the profile tag, the `server_signer`
identity it declared carries the keyid the signature was accepted under, and the
`request_evidence` handle it carried equals the handle OF THAT SAME REQUEST — the digest of
the signature base the request's own `Signature-Input` describes, derived here from the
request the `;req` components were resolved against.
"""
security_consequence = """
A response cannot declare a server signer it did not sign as, and cannot claim to answer a
request other than the one it is being verified against. The handle it advertises and the
request the `;req` binding covers are the same exchange by construction rather than by an
agreement between two operands — a semantic check on top of the cryptographic `;req`
binding, reported as its own refusal.
"""
scope = """
This theorem characterizes values successfully returned by `verify_bound_response`. It does
not establish that an arbitrary externally constructed `VerifiedMcpResponse` was produced
by that operation.

**There is ONE request input.** The operation used to receive two — a concrete request,
against which the `;req` components are resolved, and separately a `RequestEvidence`
handle, against which the block's handle is compared — with nothing relating them. A caller
could supply request A and handle B, and a success then established cryptographic binding
to A and semantic equality with B and NOT that A and B denote the same exchange. Both
callers did relate them, and that was the problem: a convention held at two call sites,
which a third would not have violated visibly.

The handle is a function of the request, so it is DERIVED at the boundary and the second
operand is gone. `request A + handle B` is not refused; it is unconstructible, because
there is nowhere to put B. What the derivation reconstructs is the signature base the
request's `Signature-Input` describes — no signature is checked and no trust resolved there,
because the handle of a request is a fact about its bytes; a request whose signature does
not verify is refused by the floor above.

Only the KEYID of the declared `server_signer` was compared. The block's `role`,
`trust_domain` and `subject` are its own claim, checked against nothing here.

It makes no delegation claim. The signer was resolved through the trust seam, and whether a
credential chain authorized one is THM-0019 — a different proposition over a different
product, not a strengthening of this one.
"""
owner = "http_profile.verifier_results"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.verifier_results"]
depends_on = ["THM-0016"]

[[theorem]]
id = "THM-0019"
title = "A successful delegated bound response verification establishes an accepted credential chain"
statement = """
If `Verifier::verify_delegated_bound_response` returns Ok, then the shared bound-response
proposition holds for the same response and request, and in addition: the response evidence
block parsed and validated under the profile tag; it carried an inline delegation
credential; that credential verified as a chain to a root issuer key the trust seam
resolved for the Response slot and was accepted under the supplied expectations; the keyid
the signature was accepted under is the delegated kid that the credential confirms and the
block declares; and the `request_evidence` handle the block carried equals the handle OF
THE SAME REQUEST the `;req` components were resolved against, derived from it here.
"""
security_consequence = """
A response signed directly by the root, or by a key with no chain to a trusted issuer,
cannot be accepted where delegation is required; a credential cannot be lifted onto a
response signed by a different key, because the delegated kid must match on three sides;
and the response cannot claim to answer a request other than the one it is being verified
against.
"""
scope = """
This theorem characterizes values successfully returned by
`verify_delegated_bound_response`. It does not establish that an arbitrary externally
constructed `VerifiedDelegatedMcpResponse` was produced by that operation.

**It does NOT establish THM-0016 or THM-0018, and does not depend on them.** Those claims
say the presented signing keyid was resolved through the trust seam; on this path it was
not, and no trust map contains it. The seam was queried for the credential's ROOT ISSUER
kid, and what authorizes the signing key is the chain. That is why the product carries the
shared `BoundResponseSignatureFacts` rather than a `CryptographicFloorVerifiedBoundResponse`:
a nested seam-authorized product here would be a value whose documented meaning is false.

Reading upward is likewise blocked: `AcceptedResponseSigner` records who signed, not that
anyone vouched for the key directly. A consumer whose reasoning needs a trust-store entry
for the SIGNING key gets nothing from this claim.

The expectations are SUPPLIED, not proved current or sane by this unit: the accepted epoch
set, the verifier audiences, the expected audience-scope hash and the credential clock-skew
tolerance all come from the caller, and this claim says the credential satisfied them, not
that they were the right ones. Revocation is likewise a caller-supplied predicate.

There is ONE request input, in exactly the sense THM-0018 states: the `;req` binding and the
handle comparison are both about the request supplied, because the handle is derived from it
rather than accepted beside it.
"""
owner = "http_profile.verifier_results"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.verifier_results"]
depends_on = ["THM-0021"]

[[theorem]]
id = "THM-0020"
title = "A successful delegated unbound response verification establishes a chain and never a binding"
statement = """
If `Verifier::verify_delegated_unbound_response` returns Ok, then the shared
unbound-response proposition holds for the same response, and in addition: the response
evidence block parsed and validated under the profile tag; it carried an inline delegation
credential; that credential verified as a chain to a root issuer key the trust seam
resolved for the Response slot and was accepted under the supplied expectations; and the
keyid the signature was accepted under is the delegated kid that the credential confirms
and the block declares.
"""
security_consequence = """
A preflight or pre-parse rejection receipt cannot be forged by an unsigned or
directly root-signed response: delegation stays required on the path where there is no
request to bind to, which is the path with the least other evidence.
"""
scope = """
This theorem characterizes values successfully returned by
`verify_delegated_unbound_response`. It does not establish that an arbitrary externally
constructed `VerifiedDelegatedUnboundResponse` was produced by that operation.

It NEVER implies request binding and must not inherit THM-0018 or THM-0019 by analogy: a
receipt that satisfies this claim is not an answer to any particular request, and a
consumer that needs one must obtain it elsewhere. The block's `request_evidence`, if
present, is diagnostic and outside this claim.

**It does NOT establish THM-0017, and does not depend on it**, for the reason THM-0019 does
not establish THM-0016: the seam answered for the credential's root issuer, not for the
signing key. As in THM-0019 the expectations are supplied rather than proved current.
"""
owner = "http_profile.verifier_results"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.verifier_results"]
depends_on = ["THM-0022"]

# ---------------------------------------------------------------------------
# Communication assurance — ADR-MCPRE-063 Slice 1
# ---------------------------------------------------------------------------

[[theorem]]
id = "THM-0023"
title = "Every peer identity value is well-formed, whatever evidence produced it"
statement = """
Every inhabitant of PeerIdentityValue is a non-empty, length-bounded string free of
control characters, and equals the trimmed form of the candidate it was interpreted from.
The type's representation is private and its only constructor is fallible, so this is a
property of the type rather than of any call site: no sequence of operations available to
a caller produces an inhabitant that violates it.
"""
security_consequence = """
An issuer that mints a SAN holding a CR/LF or a megabyte of padding, and a downstream that
injects the same shape into a trusted-ingress header, are refused by the same rule. Neither
can put a log-injection or header-smuggling payload into the value a transport binding
compares or an audit record carries, and neither provenance can drift into a weaker
definition of well-formed than the other.
"""
scope = """
Well-formedness only. It says nothing about who the identity denotes, whether the identity
was authenticated, trusted, admitted, or authorized, or which evidence produced it —
provenance is carried by the evidence product that wraps the value, not by the value.

It bounds LENGTH, not content: a well-formed value may be an attacker-chosen string, and
the theorem is not a claim that the value is meaningful, resolvable, or issued to anyone.

The claim is over inhabitants of the type. Callers that reimplement the rules instead of
constructing the type are outside it — which is why the trusted-ingress facade delegating
rather than reimplementing is part of this unit's battery.
"""
owner = "proxy.peer_identity_value"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.peer_identity_value"]
depends_on = []

[[theorem]]
id = "THM-0024"
title = "Certificate identity interpretation reads the configured field and refuses rather than falling back"
statement = """
If interpreting certificate-chain evidence under an identity-selection policy returns Ok,
then: the returned source equals the field the policy configures; the returned value is the
PeerIdentityValue interpretation of the FIRST value the leaf presents in that field; and the
value satisfies THM-0023.

If it returns Err, no other field and no later value of the configured field was read. The
five refusals are distinguishable: no leaf was presented, the leaf could not be interpreted
as a certificate, the representation carrying the configured field could not be interpreted,
the configured field was absent, or the configured field's first value was not a well-formed
identity — the last carrying which value rule it broke. Present-but-uninterpretable is never
reported as absent, and the refusal names the first rule that failed under the precedence
readability -> presence -> identity-value validity.

Interpretation is total and deterministic over the interpreted field set and the policy.
"""
security_consequence = """
An issuer or peer cannot choose which identity the proxy binds to by controlling a field
the deployment did not configure, and cannot choose it by making the authoritative value
unusable: neither a present DNS SAN under a URI-SAN policy nor a valid second URI SAN
behind a malformed first one is ever read. A deployment that configured URI SANs cannot be
silently downgraded to a legacy Common Name.
"""
scope = """
It establishes IDENTITY EVIDENCE and nothing above it. It does not establish that the
certificate chain is trusted, that it is unrevoked, that it is fresh, that the peer is
authenticated, that the relationship is admitted, that any action is authorized, or that a
channel to that peer exists. Holding the product is not a weaker form of any of those, and
none of them may be inferred from it.

The claim divides at the parser boundary. The selector half is over an interpreted field
set — an ordinary Rust value — and is what the battery and any future proof reach. That the
field set faithfully reports what the DER encodes is ASM-0030, an assumed foreign
dependency, NOT part of this claim: a wrong parser yields a faithful interpretation of the
wrong fields and this theorem still holds.

It characterizes values successfully returned by the interpretation operation. It says
nothing about arbitrary possession of a CertificatePeerIdentityEvidence value, whose
construction closure is the module boundary rather than a proved postcondition.

"First value" is a property of the presented order. The claim assumes the field set
preserves that order and does not establish it of any other producer.

The refusals are distinguishable but not equally consequential: every one of them refuses,
so nothing is admitted on any of them. What the distinction establishes is which fact a
refusal RECORDS — an operator, an audit trail and a test can tell a peer that presented
nothing from one whose issuer minted a broken field. It is a claim about faithful reporting,
not about admission.
"""
owner = "proxy.certificate_identity"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.certificate_identity"]
depends_on = ["THM-0023"]

[[theorem]]
id = "THM-0025"
title = "Every canonical Ed25519 public key value is the canonical RFC 8410 encoding of its own point"
statement = """
Every inhabitant of Ed25519PublicKeyValue was interpreted from bytes that are exactly the
canonical RFC 8410 Ed25519 SubjectPublicKeyInfo encoding — the fixed twelve-byte
id-Ed25519 header followed by exactly thirty-two key bytes — and its projected point is
those thirty-two bytes.

Acceptance is decided by that exact match alone. The general SubjectPublicKeyInfo parse
runs only after the match has already failed, and only to choose which of three refusals to
report, so no parser behaviour can turn a refusal into an acceptance.

The encoding direction is the inverse of the interpreting one: interpreting the encoding of
a point yields a value whose point is that point.
"""
security_consequence = """
A provider configured with a key of another algorithm — an RSA or NIST P-curve KMS key, a
token key of the wrong type — cannot be used as an Ed25519 key anywhere in the proxy, and
cannot become one by being re-encoded. Every provider that writes a SubjectPublicKeyInfo
and every consumer that reads one is held to a single definition of the encoding, so a
mismatch between two providers' idea of it cannot arise.
"""
scope = """
It is about the ENCODING, not about the key. It does not establish that the thirty-two
bytes are a valid curve point, that anyone holds the private half, that the key is trusted,
current, or authorized, or that any signature made with it verifies.

The refusal taxonomy is a claim about faithful reporting, not about admission: all three
refusals refuse. Which one is reported rests on ASM-0031, an assumed foreign parser, and
that assumption is contained to reporting precisely because acceptance never consults it.

It says nothing about non-canonical encodings other than that they are refused — in
particular it does not claim they are invalid keys, only that this system does not accept
them.
"""
owner = "proxy.ed25519_public_key"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.ed25519_public_key"]
depends_on = []

[[theorem]]
id = "THM-0026"
title = "Credential/key correspondence relates two independently interpreted keys and attributes every refusal to the side that failed"
statement = """
If establishing credential/key correspondence returns Ok, then: the credential's leaf
presented a public key satisfying THM-0025; the signer exported a public key satisfying
THM-0025; those two keys are equal; and the returned facts carry that one key.

If it returns Err, the refusal names which authority failed — the credential side, the
signing-key side, or the relation. The relation itself can refuse only with a mismatch: an
absent credential, an unreadable credential, an unreachable signer and a key of the wrong
profile are all refused by the adapter that owns them, before the relation is reached, and
the relation is never handed a key that failed the profile rule.
"""
security_consequence = """
A delegated TLS listener cannot be built whose signer signs for a key other than the one
its certificate presents, and cannot be built on a signer or a credential whose key is of
another algorithm — including the algorithm-confusion case where a key of another algorithm
carries the credential's public point in its trailing bytes. The failure is refused before
any server starts rather than surfacing as an opaque handshake failure, and an operator is
told which half of the deployment to look at.
"""
scope = """
Correspondence only. It does not establish that the credential chain is trusted, valid now,
or unrevoked; that the signer may serve; that the signer holds the private half of the key
it exported; that a listener has signing budget; or that any channel exists. A signer whose
key corresponds to an untrusted, expired, revoked certificate satisfies this theorem.

It characterizes a successful return of the named operation, not possession of the facts
value.

Equality of keys is equality of the thirty-two interpreted bytes. It is not a claim that
two equal points are the same KEY MATERIAL in any custody sense, and it establishes nothing
about the private halves.

The two sides rest on foreign parsing differently, and a reviewer must not read one
containment onto the other. That the credential's leaf presented THIS SubjectPublicKeyInfo
is ASM-0032, an assumed premise on the ACCEPTING path: a certificate parser reporting the
wrong bytes would let correspondence hold against a key the credential does not present.
Which refusal is reported, on either side, rests on ASM-0031 through THM-0025, and that one
cannot affect acceptance because acceptance never consults it.

The signing side needs no equivalent assumption, because the claim is deliberately about the
key the signer EXPORTED. It does not establish that the signer holds the private half, so
nothing here depends on the export being an honest report of what the device can sign with.
"""
owner = "proxy.credential_key_correspondence"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.credential_key_correspondence"]
depends_on = ["THM-0025"]

[[theorem]]
id = "THM-0027"
title = "A delegated resolver's existence proves its credential and signer corresponded"
statement = """
Every DelegatedCertResolver produced by MCP-RE was produced by
DelegatedCertResolver::materialize, which establishes credential/key correspondence
(THM-0026) over the very credential chain and signer it then moves into the resolver, and
retains the resulting facts as a private construction witness.

The construction closure is what carries the claim. The assembling constructor is private
and requires a CredentialKeyCorrespondenceFacts value that no caller can produce, so there
is no path from independently supplied credential and signer material to a resolver that
skips the relation — and no window in which a caller holds facts about one pair and
material from another, because the facts are never returned to a caller at all.

The listener's handshake-signature budget is installed unchanged and is not derived from
the credential.
"""
security_consequence = """
An embedder cannot construct MCP-RE's correspondence-assured delegated resolver from a
certificate and a signer whose exported public key differs from the certificate's leaf
public key. Such a mismatch is refused before the resolver exists, rather than surfacing as
an opaque handshake failure after the server has already started. Before this, that pairing
was enforced only by the function MCP-RE happened to call first, while a public constructor
took the two operands independently — so the unsafe combination was reachable.

This theorem makes NO claim that future signing operations use the private key
corresponding to that exported public key. A signer that exports one key and later signs
with another is not excluded by it: correspondence relates two public keys at construction
time, and nothing here constrains what the device does afterwards.
"""
scope = """
It is a claim about CONSTRUCTION, and only about resolvers this crate produces. It does not
establish that the certificate is trusted, current or unrevoked, that the signer is
authorized or holds the private half of the key it exported, that any handshake will
succeed, that the peer is admitted, or that a channel exists.

It says nothing whatsoever about an arbitrary `ResolvesServerCert` supplied to
`TlsListenerSecurityState::build_delegated_resolver_config`. That escape hatch exists for
custody arrangements MCP-RE does not model, validates no credential of its own, and is
deliberately outside this claim — a resolver reaching the serving path through it carries
no correspondence guarantee, and the two operations must not be read as making the same
promise.

The witness is not projected, so no consumer can read the facts back out; the claim is that
the value could not exist without them, not that it exposes them.
"""
owner = "proxy.delegated_resolver_materialization"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.delegated_resolver_materialization"]
depends_on = ["THM-0026"]

[[theorem]]
id = "THM-0028"
title = "Channel-associated certificate credential evidence originates only from an established relationship's mechanism report"
statement = """
This is a claim about ORIGIN, not about simultaneous lifetime. The value owns its credential
bytes and is `Clone`, so it may outlive the relationship it came from; what cannot happen is
that it came from anywhere else.

Every ChannelAssociatedCertificateCredentialEvidence inhabitant produced by this crate's
production configuration originates from an inhabitant produced by
communication_assurance::channel_associated_credential::rustls_adapter::associated_credential
for a connection the establishment mechanism reported as established — that is, as no longer
handshaking. Cloning preserves that provenance and cannot introduce a new credential or
relationship origin. The originating inhabitant carries the non-empty credential chain the
mechanism reported for that same connection.

The producer boundary is a CALL-SITE fact, and privacy alone does not establish it. The
constructor is private to the owning module, and the mechanism adapter is a CHILD of that
module rather than a sibling of it. But Rust privacy is the defining module and its
descendants, so what privacy bounds is a SET of modules that could call the constructor, not
a single one. What makes this claim true is the narrower fact that in the production
configuration the only production call site is the descendant mechanism adapter
rustls_adapter::associated_credential. Privacy bounds who could; the call sites say who does,
and only the conjunction is the claim.

The owner's `#[cfg(test)]` module deliberately constructs synthetic inhabitants directly,
from chains no connection ever reported, because the refusal at construction has to be
exercised. Those test-only inhabitants are outside this theorem's scope, and they are why it
is scoped to the production configuration rather than quantified over every inhabitant the
crate can build. An earlier draft said the adapter reaches the constructor and nothing else
in the crate does; those two constructions are counterexamples to it.

A `pub(super)` constructor would still not do, for the reason the call-site framing makes
plain: it widens the set privacy admits to every module of `communication_assurance`, present
and future, at exactly the point where this product's whole semantic content is provenance —
and a future production call site added inside that set would falsify the claim without
touching this file. The historical `TransportIdentity` — public fields, a total constructor —
is the shape at the other end of that scale.

Establishment is a predecessor, not a decision made here. Each serving path calls the
adapter after its own successful-establishment boundary: the async path after
`TlsAcceptor::accept` has succeeded, the blocking path after the request read that drives
the rustls handshake to completion. Because a `ServerConnection` exists before its handshake
and therefore proves nothing, the adapter asks the mechanism rather than trusting the type,
and declines to speak while the mechanism says establishment has not completed.
"""
security_consequence = """
Possession of this evidence is a fact about a relationship that existed, not a string
someone chose. Downstream authorities that consume a peer credential can be given a value
whose provenance is structural, instead of the historical situation in which the
supposedly-verified transport identity could be manufactured by any caller and nothing
downstream could tell a manufactured one from a channel-derived one.

The claim is deliberately weaker than the sentence the old control flow implied. It does NOT
say the credential was freshly verified during this establishment: a resumed relationship
restores its stored chain verbatim and re-runs neither chain building, nor the CRL
consultation, nor the validity window, and resumed relationships are legal here. Both paths
were measured to associate byte-identical evidence, so the association proposition is the
same one on each; the verification facts they do not share are recovered per request by
other authorities, which is why this product must not appear to carry them.
"""
scope = """
It is a claim about CONSTRUCTION, and only about values this crate produces. It does not
establish that the credential is trusted, current, unrevoked, or issued by a configured
anchor; that it has been interpreted as any identity; that the peer is admitted or
authorized; or that the credential is bound to the actor that signed any request.

Nor does it say the relationship still exists. Holding the evidence proves where it came
from, not that anything is still connected — a value may be cloned and outlive its
connection, and a consumer needing currency must establish that separately.

It says nothing about what the establishment mechanism did internally. That the mechanism
reports establishment honestly, and reports the credential it actually associated, is
ASM-0033 — a premise, not a result, and the reason the controls drive real handshakes
instead of synthesising a chain.

Two refusals exist and neither is a legal domain state: an incomplete establishment and an
established relationship carrying no credential are mechanism-boundary inconsistencies.
Characterization measured that a peer presenting no certificate is refused DURING
establishment by the mandatory client-certificate verifier every serving config is built
with, so there is no established relationship for a credential to be missing from. The
`fault_accept_any_client` fault-injection build deliberately breaks that verifier; the
refusal keeps that build failing closed at this authority too.
"""
owner = "proxy.channel_associated_credential"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.channel_associated_credential"]
depends_on = []

# ---------------------------------------------------------------------------
# ADR-MCPRE-063 Slice 5 — the provenance linkage
# ---------------------------------------------------------------------------

[[theorem]]
id = "THM-0029"
title = "A channel-associated peer identity is interpreted from the leaf of that relationship's own credential"
statement = """
This is a claim about the COMPOSITION, not about either half of it. Both premises are stated
elsewhere and neither is strengthened here: THM-0024 says what interpreting a certificate's
configured identity field yields, and THM-0028 says where a channel-associated credential
comes from.

Every ChannelAssociatedCertificatePeerIdentityEvidence inhabitant originates from an
inhabitant produced by
communication_assurance::channel_associated_identity::interpret_associated_identity — a free
function taking a &ChannelAssociatedCertificateCredentialEvidence and a
CertificateIdentityPolicy, and nothing else — from some channel-associated certificate
credential evidence C and some identity-selection policy P, and its value and source are
exactly what interpreting the FIRST certificate of C's associated chain under P returned.
Cloning preserves that provenance and cannot introduce a new credential or identity origin.

No other certificate can be the source of that identity. The derivation's whole parameter
list is a credential and a policy: there is no parameter through which a separately obtained
certificate, or a separately obtained identity product, could enter, so pairing credential A
with an identity read from certificate B is unconstructible rather than merely untaken. The
representation is private to the deriving module, and the owning authority exposes only the
free interpret_associated_identity operation taking the predecessor credential and
identity-selection policy, so that operation is the only producer; a sibling authority
attempting the struct literal fails with E0451.

The deriving module is communication_assurance::channel_associated_identity, a SIBLING of the
credential authority rather than a module inside it, and that placement is load-bearing in
the other direction: inside, it would be a descendant of the credential's module and would
therefore reach the private constructor THM-0028 claims only the mechanism adapter can reach
— measured, that layout compiled a call to it. It consumes the owner's named `pub(super)`
leaf projection instead. A consumer's placement is part of its predecessor's seal.

The refusal algebra is the leaf-level one, which has no absence state. The predecessor
guarantees a non-empty chain, so *no certificate was presented* is not a state this
derivation's input can be in, and the type does not advertise it.
"""
security_consequence = """
An identity that a consumer receives with a relationship cannot have been read out of a
different peer's certificate. The composition this replaces — a caller holding relationship
credential A and, separately, identity evidence interpreted from certificate B, and pairing
them — is the shape in which two individually true facts state a false relation, and nothing
downstream could detect it, because the only record of which certificate an identity came
from is the pairing itself.

It also refuses the intermediate. A chain carries certificates that signed the peer as well
as the peer's own; reading identity from anything but the leaf would let an issuer choose
the identity the proxy binds to.
"""
scope = """
It is NOT authentication, and the type is deliberately not named as though it were. THM-0028
establishes no trust, currency, revocation status, or anchor membership for the credential,
and THM-0024 establishes only what a certificate representation denotes. Two deliberately
weaker facts do not compose into a stronger one: nothing here establishes that the peer is
authenticated, that the relationship is admitted, that any action is authorized, or that the
identity is bound to the actor that signed any request. Naming the product Authenticated
would require a premise that does not exist.

Nor does it say the relationship still exists. The product may be cloned and outlive the
connection its credential came from — it inherits that limit from THM-0028 rather than
repairing it.

It says nothing about the establishment mechanism or the X.509 parser. Those premises are
ASM-0033 and ASM-0030, and they stay under the theorems that own them: this claim consumes
semantic products, so a wrong parser yields a faithful linkage of the wrong fields and this
theorem still holds.

One premise IS this claim's own. That element 0 of the reported chain is the peer's own
credential rather than an issuer's is ASM-0034, a documented and measured property of the
mechanism's reporting order — and not something ASM-0033 supplies, since *the mechanism
reports the credential it associated* is true under any ordering. Reading the FIRST
certificate is what this theorem says; that the first certificate is the PEER'S is what
ASM-0034 assumes.
"""
owner = "proxy.channel_associated_identity"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.channel_associated_identity"]
depends_on = ["THM-0024", "THM-0028"]

# ---------------------------------------------------------------------------
# ADR-MCPRE-064 Slice 1 — mechanism-verified credential evidence
# ---------------------------------------------------------------------------

[[theorem]]
id = "THM-0030"
title = "Verified-credential evidence records the mechanism's own acceptance and the path it was reached on"
statement = """
This is a claim about RELAY and ORIGIN. It does not say the credential is trusted, current,
or unrevoked; it says the mechanism accepted it, and on which path.

Every MechanismVerifiedCredentialEvidence inhabitant produced by this crate's production
configuration originates from an inhabitant produced by
communication_assurance::mechanism_verified_credential::rustls_adapter::verified_credential
from ONE connection, carrying that connection's channel-associated credential evidence
(THM-0028) and the establishment path the mechanism reported for that same connection.
Cloning preserves that provenance.

The two components cannot be mismatched, because there is no operation that accepts them
separately: the derivation's whole parameter list is a connection, and both facts are read
from it in one call. A caller cannot pair a credential with another relationship's path.

The path is reported, never inferred. `Full` and `FullWithHelloRetryRequest` are a full
handshake; `Resumed` is a resumed session; a relationship for which the mechanism reports no
path at all is refused rather than defaulted, because guessing the full-handshake reading
would invent the strongest verification fact from a report the mechanism declined to make.

The producer boundary is a call-site fact scoped to the production configuration, as in
THM-0028: the representation and constructor are private to the owning module, its one
production call site is the descendant mechanism adapter, and the owner's test module is the
other member of the set privacy admits.
"""
security_consequence = """
A consumer that needs *the configured verifier ran during THIS establishment* can tell,
instead of inferring it from the existence of a connection. That inference is currently
unavoidable and silently wrong on every resumed session: rustls re-runs neither chain
building, nor CRL consultation, nor the validity window when it restores a stored session,
so a consumer treating every established relationship as freshly verified believes work
happened that did not.

Equally, a consumer that does NOT need freshness cannot be misled into thinking a resumed
acceptance is defective. It rests on an earlier full handshake plus an unchanged anchor set,
which is a different fact, not a weaker one.
"""
scope = """
It is NOT authentication, and nothing here may be read as trust. It does not establish that
the credential is currently valid, unrevoked, within a configured lifetime, or issued under a
policy — those are recovered per request by a different authority, and only where a ceiling
or CRLs are configured. It does not establish any identity, admission, or authorization, and
it does not say the relationship still exists.

It deliberately does NOT carry the anchor epoch. The epoch does not reach the serving path;
the only one an adapter could read there is the listener's current epoch, while the
acceptance described happened at an earlier handshake, so carrying it would be the L-5
pairing this architecture forbids. What makes a resumed acceptance admissible is the
ADR-MCPRE-055 epoch gate inside the session store, owned and measured by
tls_listener_state::resumption_acceptance — this claim consumes that conclusion and does not
restate it.

The mechanism premises stay where they are owned: that the reported credential is the one
associated is ASM-0033 under THM-0028, and that the reported PATH is faithful, with the store
honouring its own refusal, is ASM-0035 here.

Acceptance itself is a predecessor, not a decision. Every supported production build refuses
an unverified peer during establishment, so the refusals this authority carries are
mechanism-boundary inconsistencies rather than legal domain states.
"""
owner = "proxy.mechanism_verified_credential"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.mechanism_verified_credential"]
depends_on = ["THM-0028"]

[[theorem]]
id = "THM-0031"
title = "An authenticated relationship peer's identity is read from the leaf of the very credential the mechanism accepted for that relationship"
statement = """
This is a claim about the COMPOSITION, and about the ONE word it adds. Neither premise is
strengthened: THM-0030 says the mechanism accepted a credential for a relationship and on
which path, and THM-0029 says which identity a channel-associated credential's leaf denotes
under a configured policy.

Every AuthenticatedRelationshipPeerFacts inhabitant originates from an inhabitant produced by
communication_assurance::authenticated_relationship_peer::authenticate_relationship_peer — a
free function taking a MechanismVerifiedCredentialEvidence by value and a
CertificateIdentityPolicy, and nothing else — from some acceptance V and some policy P. Its
identity and source are exactly what interpreting the leaf of V's OWN channel-associated
credential under P returned, and its establishment path is exactly V's. Cloning preserves that
provenance.

The two facts cannot be about different credentials. The derivation's whole parameter list is
an acceptance and a policy: there is no parameter through which a separately obtained identity
product, credential, or certificate could enter, so pairing the acceptance of relationship A
with an identity read from relationship B's credential is unconstructible rather than merely
untaken. That both predecessors ultimately arose from *a* connection establishes nothing —
the defect this excludes is precisely two honest products of two DIFFERENT connections, and a
runtime fingerprint comparison would have left the caller doing the pairing.

The representation is private to the deriving module, so the derivation is the only producer;
a sibling authority attempting the struct literal fails with E0451 — measured.

The deriving module is a SIBLING of both predecessors rather than a module inside either, and
that placement is load-bearing in the other direction: inside mechanism_verified_credential it
would be a descendant and would reach the private `accept` constructor THM-0030 claims only
the mechanism adapter reaches; inside channel_associated_credential it would reach `associate`
and falsify THM-0028 the same way. A consumer's placement is part of its predecessor's seal.

The refusal algebra is the leaf interpreter's, unchanged. Nothing new can fail: the acceptance
is already in hand and is not re-decided, and the only fallible step is reading the configured
field from the accepted credential's leaf.
"""
security_consequence = """
This is the first product a consumer may read as *the peer of this relationship is this
identity*, and the first whose name says so. Before it, a consumer wanting that sentence had
to write it itself by holding an acceptance and an identity side by side — which is the
composition this authority makes unconstructible, and whose failure mode is a request bound to
an identity that authenticated on some other connection.

The establishment path survives the composition. A consumer that needs *the configured
verifier ran during THIS establishment* can still tell, so authentication inherited across a
resumption is not silently reported as freshly verified.
"""
scope = """
It does NOT establish currency. Whether the accepted credential is still within its validity
window, still unrevoked, and within a configured lifetime ceiling is a different authority
answering *is it still good now* — recovered per request, and only where a ceiling or CRLs are
configured.

It does not establish admission, authorization, channel binding, or that this peer is the
actor that signed any particular request. It does not say the relationship still exists.

The word *authenticated* rests on ASM-0036: that mechanism acceptance entailed a proof binding
the peer to the credential — current control of its private key via CertificateVerify on a
full handshake, and possession of resumption secret material derived from an earlier
authenticated handshake on a resumed one, which is continuity rather than a fresh key proof. That premise is this unit's own and is not
supplied by ASM-0033 or ASM-0035, which speak to what the mechanism REPORTS rather than to
what acceptance required of the peer.

The mechanism and parser premises stay where they are owned, and the chain-ordering premise
stays under THM-0029: this claim consumes those conclusions and restates none of them.
"""
owner = "proxy.authenticated_relationship_peer"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.authenticated_relationship_peer"]
depends_on = ["THM-0029", "THM-0030"]

[[theorem]]
id = "THM-0032"
title = "Per-request credential currency is decided from the credential the mechanism accepted, and reports which of its five facts refused"
statement = """
This is a claim about a PREDICATE AT AN INSTANT and about the ALGEBRA of its refusal. It does
not say the credential is trusted or that the peer is authenticated; it says what the
deployment's configured controls concluded about that credential at a named moment.

Every CurrentCredentialFacts inhabitant originates from an inhabitant produced by
communication_assurance::credential_currency::evaluation::evaluate_credential_currency — a
free function taking an Option<&MechanismVerifiedCredentialEvidence>, a
CredentialCurrencyPolicy and an instant, and nothing else — and carries that acceptance, that
instant, and the controls the policy actually applied. There is no chain parameter and no
certificate parameter: the chain evaluated is projected from the acceptance inside the
operation, so the facts reported cannot be about another relationship's certificates. The
chain-form worker is private to the authority, and publishing it would be a second entrance
letting a caller evaluate certificates no relationship ever presented.

The ADMITTED SET IS UNCHANGED from the implementation this replaces. What is new is that the
five facts production computed and discarded are now distinguishable, and that the
STRENGTH ASYMMETRY between them is preserved rather than repaired:

  leaf validity window   runs whenever ANY control is configured — never fused to the ceiling
  leaf span ceiling      only where a ceiling is configured
  leaf revocation        `admits`: an empty index admits, otherwise Revoked AND Unknown refuse
  issuer validity window self-issued certificates exempt; unparseable refused
  issuer revocation      EXPLICIT `Revoked` only — `Unknown` admits

The issuer/leaf revocation asymmetry is deliberate and is carried, not corrected: whether a
chain reaches a CRL-covered issuer is a path-building question the handshake settled, and
re-deciding it from the certificates a peer chose to send would refuse chains a full
handshake admitted.

The outcome has THREE states, not two. A deployment configuring neither a ceiling nor CRLs
evaluates nothing — production returns before parsing — so `NotEvaluated` is distinct from
`Current`. A two-state answer would report an unexamined credential as unobjectionable, which
is the same sentence as *checked, and fine*, and the credential of a peer holding a keep-alive
connection open past its notAfter is exactly the credential that reaches that state.

The policy is a TOTAL classification of deployment state with no `Option` and four variants,
so *evaluating with nothing configured* cannot be written. The revocation index it carries is
the SNAPSHOT in force for the request, not the atomic cell: the leaf check and the issuer
check therefore cannot read two different indexes across a reload.
"""
security_consequence = """
A revocation published after a handshake, and an expiry that falls during one, reach a peer
that already holds a connection — rustls runs client authentication on a full handshake only,
and the ADR-MCPRE-055 trust epoch digests the anchor set rather than the CRLs, so nothing else
does. That property is production's and is preserved; what this adds is that the reason is no
longer discarded.

Before it, all seven refusals arrived as one `mcp-re.transport_binding_failed`, so an
operator could not tell an expired credential from a revoked one from an absent one, and no
downstream authority could branch on the difference. A weakening that swapped one refusal for
another — reporting an expired credential as over-long, or an unreadable issuer as an
unreadable credential — was invisible to every control that could only assert *something
refused*.
"""
scope = """
It establishes NO identity and NO authentication: it consumes the acceptance, not the
authenticated peer, precisely so that a deployment deriving no transport identity at all
(`IdentityStrategy::LbAssertion`) keeps having its credential examined. An authority gated on
authentication would silently stop checking currency in exactly that deployment.

It does not establish admission, authorization, or binding to a request actor. It says nothing
about online OCSP, which is a separate existing path over the same chain and is deliberately
unmigrated — the last raw-chain projection in the serving path is its consumer.

It is a claim about an INSTANT. The product carries the instant it was evaluated at, and says
nothing about the next request on the same connection.

The parser premise is ASM-0030 under the adapter that owns it; the mechanism premises stay
under THM-0028 and THM-0030. This claim consumes their conclusions and restates none of them.
"""
owner = "proxy.credential_currency"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.credential_currency"]
depends_on = ["THM-0028", "THM-0030"]

[[theorem]]
id = "THM-0033"
title = "A current authenticated peer's currency is evaluated against the credential that same peer authenticated with"
statement = """
This is a claim about the COMPOSITION, the third application of the ADR-MCPRE-063 L-5 rule.
Neither premise is strengthened: THM-0031 says what an authenticated relationship peer is, and
THM-0032 says what a currency evaluation concluded about an accepted credential.

Every CurrentAuthenticatedRelationshipPeerFacts inhabitant originates from an inhabitant
produced by communication_assurance::current_authenticated_peer::current_authenticated_peer —
a free function taking an AuthenticatedRelationshipPeerFacts by value, a
CredentialCurrencyPolicy and an instant, and nothing else. Its identity, identity source and
establishment path are exactly that peer's, and its evaluated instant and applied controls are
exactly what evaluating the currency of THAT PEER'S OWN acceptance returned.

The two facts cannot be about different credentials. The derivation's whole parameter list is
a peer, a policy and an instant: there is no parameter through which a separately obtained
currency product, credential, chain or certificate could enter, so pairing the authentication
of relationship A with the currency of relationship B is unconstructible rather than merely
untaken. That both facts concern *a* relationship establishes nothing, because it does not
establish the same one, and a proxy holds many at once. No fingerprint and no linkage token
were introduced: the relation is structural, so there is nothing to compare.

The peer's own acceptance is reached through a named `pub(super)` projection on the
predecessor. Projecting is not constructing — the predecessor's constructor stays private to
its module, so THM-0031's producer boundary is untouched.

`NotEvaluated` is a REFUSAL here and a legitimate outcome one level down. This type's
proposition contains the words *still acceptable*, and an unexamined credential has not earned
them; the currency authority's proposition is *what did the configured controls conclude*, for
which the truthful answer in that deployment is that none was reached. That difference is
between the two TYPES and says nothing about what a deployment may serve: the serving path
consumes the currency authority directly and keeps admitting an unexamined credential exactly
as before.

The establishment path is projected through and never flattened. A resumed relationship whose
credential is current is authenticated earlier, carried forward, and acceptable now — three
facts, and reporting the first as fresh is the sentence ADR-MCPRE-055 forbids.
"""
security_consequence = """
This is the first product a consumer may read as *the peer of this relationship is this
identity, and its credential is still good*. Before it, a consumer wanting that sentence had
to hold an authentication and a currency verdict side by side and assert the relation itself —
the composition this authority makes unconstructible, and whose failure mode is a request
served under a peer whose credential was revoked on another connection.
"""
scope = """
It does not establish admission, authorization, channel binding, or that this peer is the
actor that signed any request. It does not say the relationship still exists, and it is a
claim about the instant it carries rather than about the next request.

It is a claim about the COMPOSITION PRODUCT, not about serving. `tls::resolve_channel_peer`
is the production caller: it applies this authority on the channel-credential serving path,
propagates a currency refusal out as the transport-boundary refusal, and carries a successful
product on as `AuthenticatedChannelPeer::Current`. So the derivation is a CONTROL — refusing
here refuses the request — and the successful facts are the WITNESS, the earned product a
consumer may read.

What the consumer then does with that product is outside this claim. Whether a request is
admitted, authorized, or bound to this peer is decided by other authorities with their own
propositions; this theorem establishes only that the product, where one exists, is about one
credential and one peer. The serving path also consumes the currency authority DIRECTLY on
the arm where no transport identity is derived at all — currency must still be evaluated
there — and that arm produces no inhabitant of this type and is outside the claim.
"""
owner = "proxy.current_authenticated_peer"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.current_authenticated_peer"]
depends_on = ["THM-0031", "THM-0032"]

[[theorem]]
id = "THM-0034"
title = "A request is bound to its relationship by relating the authenticated peer to the resolved actor's SUBJECT, never to the composite actor id"
statement = """
This is a claim about a BINARY RELATION and about the COORDINATE it is taken over. Neither
operand is strengthened: THM-0031/THM-0033 say what an authenticated channel peer is, and the
request verifier and trust seam say what a resolved actor is.

Every RequestPeerBindingFacts inhabitant originates from an inhabitant produced by
communication_assurance::request_peer_binding::bind_request_to_peer — a free function taking
an AuthenticatedChannelPeer and a VerifiedRequestSubject, and nothing else — whose two
operands compared EQUAL on the peer's identity value and the subject. Cloning preserves that.

The coordinate is `ActorIdentity.subject`, and NOT `ActorIdentity::actor_id()`. The composite
is the injective `role:trust_domain:subject:keyid` join, and it is the canonical coordinate for
replay keys, audit records and trusted-key identity. Binding over it is a category error with
two measurable costs, and both are controls: requiring `keyid` couples TLS certificate issuance
to every signing-key rotation, and requiring `trust_domain` asserts a channel-side fact the
channel never established.

Nothing is weakened by taking the subject alone. The role, the trust domain, the signing key
and the signer slot are established by the request verifier and the trust seam BEFORE this
relation runs, and remain facts owned by those authorities. A key not trusted for a subject
fails at request verification and is never rescued here; a key the resolver DOES trust for that
subject is not overturned here because the credential rotated.

Neither operand can be fabricated, which is what makes the relation worth taking. The channel
peer descends from a mechanism adapter's acceptance over a real handshake (THM-0028, THM-0030,
THM-0031). The subject's representation and constructor are private to the binding module and
its one producer is the request adapter, a CHILD of that module — so a caller cannot assert a
subject any more than it can assert a peer. The historical operand, `TransportIdentity`, was a
public struct with public fields and a total constructor, and the one control where the old
comparison passed built its input from `actor_id()` so the comparison could not fail.

An ABSENT channel peer refuses. A configured binding claims every served request is bound, and
an absence does not satisfy that claim.

This is a BINARY COMPOSITION, not an ADR-MCPRE-063 L-5 substitution. The two operands are
genuinely independent — one from a TLS relationship, one from a request signature — and their
concerning the same principal is the CONCLUSION rather than a premise, as in the Slice-2
credential/key correspondence.
"""
security_consequence = """
This is the fact a deployment means by *end-to-end mTLS*: the party that signed the request is
the party that authenticated the channel it arrived over. Before it, the comparison could not
succeed for a certificate naming the principal, and the only way to make it pass was to mint
the escaped composite into the SAN — which is what the demo fixtures did, so the tests were
green while the model was wrong.

Its failure mode under the old coordinate was not an open door but a closed one plus a
distorted provisioning scheme: certificates had to serialize the request verifier's internal
trust record, and every signing-key rotation invalidated the fleet's certificates.
"""
scope = """
It is NOT admission and NOT authorization: that a request and a channel are the same principal
says nothing about what that principal may do.

It is not a cross-namespace mapping. Exact-subject equality is the only relation here. A
deployment needing `(trust-domain X, subject Y) <-> SPIFFE Z` gets an explicit mapped-binding
authority producing its own fact — not a looser reading of this one, and not the removed
`MappedBinding`, which could not honestly produce a same-principal fact.

It is not RFC 8705 `x5t#S256`. That binds a request artifact to certificate BYTES; a signer can
commit to the thumbprint of a certificate whose key it does not hold, so it does not establish
principal equality. Production supplies no mTLS artifact material to the verifier today.

It says nothing about the credential's currency beyond what the channel operand carries, and
the binding reports which of the two assurances that was rather than flattening them.
"""
owner = "proxy.request_peer_binding"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.request_peer_binding"]
depends_on = ["THM-0031", "THM-0033"]

# ---------------------------------------------------------------------------
# MCPRE-146 / #582 — the four unstated trust properties
# ---------------------------------------------------------------------------
#
# Four propositions that were TRUE and UNSTATED. Three hold by construction; the fourth by
# a source-text guard. What these entries add is not the truth of the properties — the
# sealing already gives that — but the SCOPE sentence: what each does not establish. That
# is where this project has previously over-claimed.
#
# None of them establishes that a trust document exists, is readable, parses, or holds a
# key this deployment trusts. Layer A establishes legal trust CONFIGURATION; materialization
# establishes environmental facts. These four stop at the boundary.
#
# The fifth proposition the census listed — "verification resolves actors only through the
# materialized trust authority" — is NOT here. It remains a GAP: nothing in the tree
# establishes it, and a theorem whose evidence does not exist is the thing this registry
# was built to prevent. It is recorded as an obligation in
# `docs/architecture/components/trust-and-revocation.md` §8 and is not closed by the four
# local entries below.

[[theorem]]
id = "THM-0035"
title = "A successfully classified trust-revocation state carries the witnesses its own state form requires"
statement = """
If `config_state::trust_revocation::classify_and_validate` returns a state, then for the
deployment supplied: the state form was reachable under the request, and every witness that
form's Required column names is HELD BY THE STATE rather than left in the request beside it.

Three of the four forms require a reload cadence, so those three cannot be constructed
without one. `BoundedCache` carries the cadence as an `Option` because its column makes the
cadence optional, and the ABSENCE is itself a sub-posture rather than a missing value.

The state is the only route to these facts. There is no public constructor that takes the
witnesses directly, so possessing the state means the classification ran.
"""
security_consequence = """
Planning cannot project "read the document once at startup" from a tier whose whole claim is
that the store is re-read. That projection would silently contradict the revocation posture
an operator selected: a key removed from the trust document would keep resolving until every
replica restarted, while the deployment reported the tier that promises otherwise.

A zero cadence — a spinning reloader — is refused in every state form rather than in the
parser alone, so a programmatically built request cannot reach it either.
"""
scope = """
It says NOTHING about the trust document itself: not that the locator names an existing
file, not that the file is readable, not that it parses, and not that it holds any key this
deployment would trust. Those are observations, and they belong to materialization.

It does not establish that the cadence is HONOURED at runtime — only that the state carries
one and that the value is legal. Whether a reloader actually re-reads on that cadence is the
trust plane's, and is outside this claim.

It is not a claim about revocation REACHING a peer. A cadence bounds how stale the local
document may be; it says nothing about propagation to other replicas, which is the epoch
mechanism's concern (THM-0036) and is separately unproved end to end.
"""
owner = "proxy.trust_configuration_state"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.trust_configuration_state"]
depends_on = []

[[theorem]]
id = "THM-0036"
title = "A networked trust-epoch source is handed over as a paired locator and key, or not at all"
statement = """
If `TrustRevocationState::epoch_source` returns a source, then for the state supplied: both
the counter's locator and the key holding it are present, both were validated together, and
both are projected together by `EpochSource`.

Neither half is separately reachable. `EpochSource` borrows the state and exposes `url()`
and `key()`; there is no path that yields one without the other, and no public constructor
that assembles one from parts.

The key is resolved against its default HERE, once. Two consumers — the trust cache and
delegated signing — read the same resolved value rather than each defaulting for itself.
"""
security_consequence = """
A counter read from the right store under the wrong key reports an epoch that never advances:
a revocation channel that silently stops revoking while reporting itself configured. Pairing
the two makes that combination unconstructible rather than merely unlikely.

Two consumers defaulting the key independently agreed only because they happened to spell the
same fallback. Nothing made them, and a deployment could have had its trust cache watching one
key while delegated signing minted under another.
"""
scope = """
It does not establish that the counter EXISTS at that locator, that the store is reachable,
that the key holds a number, or that anything ever increments it. The source is a validated
request fact, not an observation.

It does not establish that a build can USE the source. A configured Redis epoch source in a
build without the `redis_replay` feature is refused at planning by
`TrustEpochPlan::unsupported_by_build`, which is a layer-B fact and outside this claim.

It says nothing about propagation LATENCY, nor that an operator's increment reaches every
replica within any bound.
"""
owner = "proxy.trust_configuration_state"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.trust_configuration_state"]
depends_on = ["THM-0035"]

[[theorem]]
id = "THM-0037"
title = "A trust plan's reload cadence is a projection of the revocation posture, never a second value"
statement = """
For every `TrustPlan`, `reload()` is DERIVED from the plan's own revocation state on demand.

This is a structural claim about the representation, and the operative fact is an ABSENCE:
`TrustPlan` has no reload field. There is nothing to set, nothing to copy, and no
constructor, builder or projection through which a caller could supply a cadence beside a
state that disagrees with it. Deleting a check elsewhere cannot bring a contradictory
inhabitant into existence, because the contradictory inhabitant is not representable.

The plan likewise cannot become the authority for the two values it is HANDED — the response
issuer kid and the shared epoch mechanism. Both are constructor arguments, and a plan built
with a value the configuration does not name carries that value, which is only possible
because nothing inside re-derives them (CF-09).
"""
security_consequence = """
A stored copy is a second value that can disagree with the first, and this one had already
drifted: a test fixture named a 30-second reload beside a state carrying 5. A consumer
reading the copy would act on a cadence the revocation posture never authorized — reporting a
tier that promises frequent re-reads while re-reading on someone else's schedule.

Because the plan cannot re-derive the issuer kid, a deployment cannot be told it is chaining
to one issuer while another is excluded from the request-signer set.
"""
scope = """
It does not establish that any reload HAPPENS, on that cadence or at all. `reload()` reports
what the posture decided; performing it is the trust plane's, and a plane that never re-reads
would not violate this claim.

It does not establish anything about the trust document — see THM-0035's scope. A plan holds
a locator; it does not know whether the locator names a file.

It does not establish that the epoch mechanism it carries WORKS, only that the plan did not
invent it.
"""
owner = "proxy.trust_plan"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.trust_plan"]
depends_on = ["THM-0035"]

[[theorem]]
id = "THM-0038"
title = "The composition root consumes trust as owner projections and re-reads no trust field from the request"
statement = """
After layer A has classified a deployment, the composition root reads from
`ValidatedDeployment::config()` only fields on a pinned inventory of ORDINARY validated
parameters — ones whose value, changing while every owner state stays unchanged, cannot
change a security-sensitive decision or effect.

No trust field is on that inventory. The trust locator, the revocation tier, the reload
cadence and the epoch coordinates all left it when they acquired owners, so trust reaches
materialization only as `TrustDocumentSource`, `TrustRevocationState` and the `TrustPlan`
that composes them.

The evidence is a source-text inventory checked against the file it describes, and its own
detection is part of what is measured: the guard includes a control that a NEW raw read would
fail it. A rule that cannot detect the thing it forbids passes vacuously.
"""
security_consequence = """
The original request stops being a semantic authority once it has been classified. Without
this, a consumer could re-derive a trust posture from the raw request and reach a different
answer than the one layer A established — the same fact with two authorities, which is what
CF-09 exists to prevent — and the disagreement would be invisible because both readings would
look principled.
"""
scope = """
It is narrow in three ways, and each matters.

It claims nothing else about `app.rs`. The composition root has other responsibilities and
this theorem reaches none of them; it is a statement about trust consumption only.

It is a SOURCE-TEXT property, not a runtime one. It establishes which fields the root reads
in the code as written, not that any particular execution took a particular value. A raw read
introduced through an alias, a helper in another file, or a macro is outside what the guard
measures.

It does not establish that PLANES do not reach back — that is a different failure with its
own control (`plane_config_reachback_test`), because the root is entitled to read the request
and a plane is not.

And it establishes nothing about the trust document's existence or contents.
"""
owner = "proxy.trust_composition_root"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.trust_composition_root"]
depends_on = ["THM-0035", "THM-0037"]

[[theorem]]
id = "THM-0039"
title = "An accepted PDP decision was authenticated under a key the trust seam resolved"
statement = """
If `verify_authorization_decision` returns Ok, then the presented document is a well-formed
compact JWS; its protected header carries the profile's `typ` and `alg` and no others; the
header's kid and the claims' issuer kid are the same kid; the signature verified under the
key the AUTHORIZATION trust seam resolved for that kid; the claims name this evidence
profile; the claims' audience contains one of this enforcement point's own audiences; `now`
lies inside `[nbf - skew, exp + skew)` with `exp` strictly after `nbf`; the decision was not
issued in the future beyond the skew; and its age does not exceed this deployment's own
decision-age cap.

A `Deny` decision satisfies all of this and returns Ok. It is a statement the authority
made, and refusing it here would make *the authority denied* indistinguishable from *the
evidence was unusable*.
"""
security_consequence = """
A kid never introduces trust: a decision signed by an issuer this deployment did not
configure for AUTHORIZATION is refused rather than resolved, so a workload credential
cannot become a policy authority by naming itself one. A decision issued for another
evidence profile or another enforcement point cannot be replayed here. And the staleness
bound is the VERIFIER'S: how long a decision lives is the issuer's choice, how long this
PEP will act on one is not.
"""
scope = """
It establishes nothing whatsoever about the request in hand. A decision may be perfectly
authentic and be about a different actor, a different operation or a different target;
relevance is THM-0040 and is a separate proposition over a separate authority, exactly as
`verify_admission_assertion` is separate from `check_admission`.

It does not establish that the authority SHOULD be trusted — only that the seam answered
for that kid, which is the deployment's configuration speaking rather than this claim. It
says nothing about the decision's correspondence to the signed request evidence: that the
carried document is the one the binding committed to is THM-0008's dispatch relation and
THM-0015's artifact conjunct, established before this function is reached.

Ed25519 verification is taken as an opaque decision procedure, and this claim says nothing
about what a valid signature means cryptographically.
"""
owner = "http_profile.pdp_decision_authentication"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.pdp_decision_authentication"]
depends_on = []

[[theorem]]
id = "THM-0040"
title = "An authorized request was permitted by a decision about that very request"
statement = """
If `PdpDecisionEvaluator::evaluate` returns Ok for an `AuthorizationRequest`, then THM-0039
holds for the decision it consumed, and in addition: the decision's declared actor scope
equals the scope this deployment accepts; the decided actor's trust domain and subject equal
the request's VERIFIED actor's, and under credential scope its keyid does too; the decided
operation equals the operation the SIGNED BODY named; the decided target and the signed
target agree as typed values, where a decision naming no target matches only a
not-applicable one and an absent signed target matches neither; and the decision's own
outcome is `Permit`.

The Permit conjunct is LAST and is not implied by the others. Everything before it
establishes that this decision is ABOUT this request; only the decision itself says whether
the request may proceed.
"""
security_consequence = """
**A decision is not a bearer token.** Without the actor relation, anyone whose key the
enforcement point resolves — a lower-privilege tenant, a compromised sibling workload,
anything that read one authorized request body or one request log — could copy an authorized
peer's decision into their own signed evidence block and be authorized by it. The gate would
then establish *some principal was permitted this action*, never *this caller was*.

The action relation is the same argument one axis over: a decision for `tools/list` cannot
authorize `tools/call`, and a decision naming no tool cannot authorize a call that names
one. Both operands are VERIFIED facts — the actor the request verification resolved and the
operation the signed body named — rather than strings reconstructed from a header, a session
field or a log.
"""
scope = """
It is authorization, and not admission, authentication, channel binding or transport
identity. It does not establish that the actor coordinates on the request were correctly
resolved: that is the verified-request family's claim, and this one consumes it.

It says nothing about what happens after the grant, nor about whether the policy the
authority applied was the right policy — an authority that permits everything satisfies this
theorem completely. Nor does it establish that a refusal is reported faithfully to an
operator; the refusal algebra is tested and deliberately carries no theorem, because its
vocabulary has no production reader today.

The reference binding form produces no authorization at all and is outside this claim: it is
never a candidate, so it cannot be selected and then rejected.
"""
owner = "proxy.pdp_decision_relation"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.pdp_decision_relation"]
depends_on = ["THM-0039"]

[[theorem]]
id = "THM-0041"
title = "An offline-verified receipt proves registration, and its root was never supplied"
statement = """
If `verify_receipt_offline` returns Ok, then: the Signed Statement's own COSE
`Sig_structure` verified under a key resolved for its issuer kid, so the statement is
attributed to the party that actually signed it and to no other; the statement carries the
RFC 9943 §6.1 CWT claims in its PROTECTED header, with `iss` equal to the signing kid, `sub`
equal to the MCP-RE statement subject and the MCP-RE statement content type, so no other
`COSE_Sign1` the same key produces can be read as MCP-RE call evidence; the receipt parsed
as an RFC 9942 §5.2.1 receipt; running the RFC 9162 §2.1.3.2 inclusion algorithm over the
statement's leaf hash at the receipt's leaf index and tree size produced a root that, for an
ATTACHED receipt, equals the root the receipt commits to and, for a DETACHED one, IS the
payload the transparency-service signature was checked against; the transparency service's
signature verified under a key resolved for its kid; where the pinned profile binds the
position, the commitment the service SIGNED equals the one recomputed over that derived
root; and both signatures were attempted only under an algorithm the protected header names
and the resolved key agrees with, out of EdDSA and ES256 and nothing else. No network was
contacted.
"""
security_consequence = """
The root is DERIVED from the statement under verification and never supplied by the caller,
on either payload form. A receipt cannot be made to verify by handing in a convenient root,
and on the detached form a wrong fold produces a different `Sig_structure`, so the signature
simply fails rather than being compared against something the caller chose.

An auditor can therefore check that a record existed without trusting the log to replay
honestly and without contacting it. Attribution is part of that: possession of a parsed
`SignedStatement` proves nothing — `SignedStatement::from_cose` deliberately parses without
verifying — and it is THIS operation, over the exact signed bytes, that makes the issuer
claim true. Algorithm confusion is refused rather than attempted.
"""
scope = """
It establishes registration on A SERVICE whose key was resolved. It does NOT establish that
the service is honest, that its log is append-only, that the entry is unique, or anything
about the log's current state — this is offline verification, and none of those properties
is checkable without the log.

It says nothing about the CALL the statement describes: that the retained evidence is the
evidence the statement was made about is THM-0042, a separate proposition over a separate
authority.

The two RFC 9162 implementations in this tree stay two on purpose. `prototype` builds a
tree and `merkle` verifies a path, and they are an independent cross-check; this claim is
over the verification side alone and must not be read as a claim about the builder.
`PrototypeTransparencyService` is a public compatibility surface, test/conformance support
and a build-side oracle, and is NOT a production security product — no consequence here
depends on it.

`ReceiptPositionProfile::Bound` is exercised as conformance evidence and is NOT a selectable
production configuration. A theorem about code this claim covers does not make a deployment
posture supported.
"""
owner = "http_profile.scitt_receipt_offline"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.scitt_receipt_offline"]
depends_on = []

[[theorem]]
id = "THM-0042"
title = "Retained evidence is the evidence the statement was made about"
statement = """
If `verify_retained_evidence` returns Ok, then the commitment carried by the statement
equals the commitment recomputed from the presented reconstruction together with its
optional binding and verified-context commitments. So the presented reconstruction is the
one that statement committed to, and the `ChainLabel` the commitment embeds is the label of
THAT reconstruction — including, when it is incomplete, which hop was missing and why.
"""
security_consequence = """
Retained evidence cannot be swapped under a receipt, and a truncated call cannot become
COMPLETE: the label is inside what the commitment covers, so a record that says complete and
a record that says incomplete-because-hop-3-was-unverifiable are different commitments, and
presenting the first for the second fails here.

This theorem establishes NO CONFIDENTIALITY. The receipt does not itself carry the retained
call bytes, and that is all: it is not unlinkability, not resistance to inference from the
digests, and not resistance to guessing a low-entropy reconstruction and confirming it
against the commitment.
"""
scope = """
Correspondence only. It does not establish that the retained bytes are THEMSELVES valid
evidence, that the call described ever happened, or that the reconstruction is complete —
only that whatever was reconstructed is what was committed to.

It does not establish registration: whether any transparency service ever saw the statement
is THM-0041. Nor does it establish that the commitment function is collision-resistant; the
digest is an opaque primitive here.
"""
owner = "http_profile.scitt_retained_correspondence"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.scitt_retained_correspondence"]
depends_on = []

# =======================================================================================
# Stage 2 of the ratified theorem-architecture closure
# (verification/reviews/packets/theorem-architecture-ratification-2026-08-31.md §8).
#
# The child propositions the ratified roots require, registered at the altitude the
# ratification assigned them — never at the altitude of a unit that merely mentions one of
# the values. Four are supported by the Stage 1 units; five are ratified claims with a real
# owner and no support closure, which is the §28.5 `GAP` terminal and is DERIVED from the
# empty `supported_by`, never stored.
#
# `root_theorems` stays empty. It is declared once, when the COMPLETE ratified root set has
# resolvable identities — R2's emission composition, R3's client composition, R4's
# materialized-runtime composition and R5c's audit totality have no honest owner yet, and a
# root whose blocking child cannot be registered would report COMPLETE while its argument is
# open. Declaring three of six roots early would buy a number at the cost of the one
# property the root set exists to have.
# =======================================================================================

[[theorem]]
id = "THM-0043"
title = "The exchange relation is decided everywhere and the execution threshold partitions it"
statement = """
Every (ExchangeState, ExchangeEvent) pair is either explicitly legal or explicitly rejected
by `transition`; no event moves a terminal state; the pipeline order is a directed path
whose only branches are the notification arm and the open-leg/terminal split; and no state
at or past the execution threshold can reach a pre-dispatch terminal. An advance the
relation does not admit latches an anomaly in every build, release included, rather than
being ignored or panicking.
"""
security_consequence = """
A serving path cannot reach the backend from a state the relation does not admit, cannot
reach a pre-dispatch refusal terminal after the backend has been handed the request, and
cannot silently drive the machine off the legal path — a disagreement between the model and
the code is recorded, and every consequence derived afterwards is derived from a machine
that says so.
"""
scope = """
Establishes the relation and the latch. It does not establish that the serving path drives
this machine, that a given stage advances it, or that any particular refusal site is inside
the lifecycle — those are propositions about the caller and are registered against the
serving composition, not here. It establishes nothing about what any stage verified.
"""
owner = "proxy.exchange_lifecycle"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.exchange_lifecycle"]
depends_on = []

[[theorem]]
id = "THM-0044"
title = "An exchange's retry consequence never under-reports what may have happened"
statement = """
`ExchangeProgress::retry_semantics` is monotone along every legal path and reports
`NotRetrySafe` whenever an anomaly is latched or the backend was dispatched, and
`RequiresNewElicitation` whenever a continuation approval was consumed and the backend was
not. `Consumed` latches, so no later observation can report a spent approval as unspent;
the backend projection is derived from the exchange state rather than asserted beside it,
so the two cannot disagree.
"""
security_consequence = """
A client cannot be told that nothing executed when the backend may have run, and cannot be
told an ordinary retry is available after a human's one-shot approval was destroyed — the
combination that leaves the retry's fresh nonce admitted and the answer refused as
already-answered, with the approval gone.
"""
scope = """
A claim about the machine's derivation, not about the wire. It does not establish that the
serving path maps a consequence onto a particular HTTP status, that a client acts on it, or
that any effect was in fact performed. It establishes nothing about the truth of the
observations fed to it — only that no observation can move the consequence backward.
"""
owner = "proxy.exchange_lifecycle"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.exchange_lifecycle"]
depends_on = ["THM-0043"]

[[theorem]]
id = "THM-0045"
title = "The backend is reached only by consuming a fully assembled pre-dispatch commitment"
statement = """
The inner dispatch consumes a `ReadyForDispatch`, whose representation and constructor take
each pre-dispatch prerequisite by value: an `AuthorizedRequestBody`, a `SigningWindow`
snapshotted before the backend runs, and a `RetentionDisposition` that is either
`NotConfigured` or a taken `Reserved`. `AuthorizedRequestBody` is sealed with exactly one
producer, `AuthorizationPosture::release`. Crossing is one-way: `dispatched` consumes the
ready state and yields a `DispatchedExchange`, so no caller holds both.
"""
security_consequence = """
A serving path that skipped the authorization decision, the signing-window snapshot or the
retention reservation has nothing to hand the dispatch — the failure is a compile error at
the dispatch line, not a proxy that quietly serves unjudged requests or discovers a missing
credential after the tool has already run. And a post-dispatch failure cannot be answered as
though the backend had not run, because the value that would say so is gone.
"""
scope = """
It establishes that the decision was TAKEN, never that a policy permitted:
`NoPolicyConfigured` releases a body too, because a deployment with no policy is entitled to
serve while claiming nothing. It does not establish that the posture released was the one a
configured policy produced — that proposition is registered separately and is open. It says
nothing about what the verifier established, and nothing about the retention record's
contents.
"""
owner = "proxy.dispatch_commitment"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.dispatch_commitment"]
depends_on = ["THM-0040"]

[[theorem]]
id = "THM-0046"
title = "A refusal carries which authority reached it, over a closed set, unrendered"
statement = """
Every `Refusal` carries a `RefusalCause` rather than a rendered token, and `RefusalCause` is
closed over exactly the two authorities on this path — a Core verification verdict, in
whichever of Core's own producers reached it, and the ADR-MCPRE-065 authorization boundary,
held whole so its two arms stay distinguishable. `PolicyError` has no route into the Core
taxonomy anywhere in the workspace. Rendering to a wire code happens only at the
presentation boundary, and the signing posture is independent of the cause.
"""
security_consequence = """
An authorization refusal cannot arrive at the audit boundary wearing Core's provenance, a
foreign taxonomy cannot reach a record's reason field unnoticed, and "no policy verdict was
reached" cannot be recorded as "a policy denied" — the three collapses a pre-rendered token
made unrecoverable.
"""
scope = """
Establishes the vocabulary and its provenance. It does not establish that every production
refusal site is inside the exchange lifecycle, that the audit record is written, or that the
refusal is signed — those are propositions about the serving path and the response-emission
authority. It does not establish that Core's own verdicts are correct.
"""
owner = "proxy.refusal_provenance"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.refusal_provenance"]
depends_on = []

[[theorem]]
id = "THM-0047"
title = "The verifier's assurance products are not substitutable"
statement = """
The products the verifier operations return are distinct types whose representations are
private to their own modules, so a product that establishes a weaker proposition cannot be
passed where a stronger one is required: a floor-verified request is not a full-profile
verified request, a bound response is not an unbound one, and a delegated response is not a
trust-seam one.
"""
security_consequence = """
A serving path cannot satisfy a consumer that requires a full-profile verification by
handing it a value that only cleared the cryptographic floor, and the substitution is a
compile error rather than a silently weaker check.
"""
scope = """
Type separation only. It does not establish that the value a consumer holds was produced by
the operation whose type it has for THAT consumer's exchange — possession provenance is a
proposition about the caller and is registered against the serving composition. It
establishes nothing about what any of the operations verify.
"""
owner = "http_profile.verifier_result_separation"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.verifier_result_separation"]
depends_on = []

[[theorem]]
id = "THM-0048"
title = "Every listener obtains its whole security posture through one listener state"
statement = """
Every MCP-RE construction path obtains a listener's trust anchors, epoch-bound session
store, signing budget and client-certificate verifier through one
`TlsListenerSecurityState`; the terms cannot be supplied to it independently. The epoch is a
function of the anchor set alone, a rebuild that republishes the same trust keeps the
resumption cache while a rebuild with withdrawn trust advances the epoch and stops
resumption, and no configuration this owner builds can resume outside the store.
"""
security_consequence = """
A withdrawn trust anchor cannot be survived by a resumed session, and a listener cannot be
assembled with anchors from one source and a session store or signing budget from another —
the pairing that lets a session outlive the trust that admitted it.
"""
scope = """
Establishes that the terms travel together and that the epoch tracks the anchors. It does
not establish that the client-certificate verifier denies unknown revocation status: that is
a property of one construction site over a foreign trait object, not of any type this owner
holds, and it is registered separately as an open proposition. It says nothing about the
handshake's own correctness.
"""
owner = "proxy.tls_listener_state"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.tls_listener_state"]
depends_on = []

[[theorem]]
id = "THM-0049"
title = "Every illegal cross-owner configuration combination is refused at layer A"
statement = """
The cross-machine pass reads classified owner states and validated request selections, never
raw fields a machine already classified, and refuses every relation it declares —
the channel key object living in a backend the deployment does not reach, a revocation deny
list no configured profile will read, and a trust-epoch posture incompatible with delegated
signing. Each refusal is unconditional in the classifier rather than conditional on a caller
having asked.
"""
security_consequence = """
An operator cannot obtain a weaker posture by supplying a combination of individually legal
selections that no machine alone can refuse — a PKCS#11 channel key under a KMS signing
source, silently doing nothing while the operator believes the handshake key is
device-resident.
"""
scope = """
Establishes refusal by the classifier. It does not establish that the illegal combination is
unrepresentable — `DeploymentRequest` can hold one, which is why the refusal is a check the
classifier performs and not a structural fact. It does not establish that the classifier is
consulted on every startup path.
"""
owner = "proxy.cross_machine_legality"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.cross_machine_legality"]
depends_on = []

# --- The §28.5 GAP terminals: a real owner, a ratified proposition, no support closure. ---
#
# Each of these was a branch the proof tree required and nothing established. Registering
# them is what makes the obligation visible; the empty `supported_by` is what makes the
# gap DERIVED rather than a status field somebody must remember to flip.

[[theorem]]
id = "THM-0050"
title = "Distinct verification keys have distinct keyids"
statement = """
The RFC 7638 thumbprint selector is injective over the keys a deployment can enrol: two
distinct verification keys cannot present the same keyid, so resolving a keyid through the
trust seam selects at most one key.
"""
security_consequence = """
A signer cannot be accepted under a keyid that resolves to another party's key, which is
what would let one enrolled actor's signature be attributed to another.
"""
scope = """
Selector injectivity only. It does not establish that the seam answers for any particular
keyid, that the key it returns is trusted, or that the enrolment set is correct.

The encoding half is THM-0055 and is established. What remains between THM-0055 and this
claim is exactly one property, and it is a property of the primitive rather than of this
code: that SHA-256 does not map two distinct canonical JWK forms to one digest. No test can
establish it, and no assumption in this registry currently states it — ASM-0028 states
second-preimage resistance, which is weaker and differently scoped, and ASM-0023's own
justification records that this project has deliberately DECLINED to assume the separation
properties of the digest construction. Allocating a collision-resistance assumption is
therefore an owner TCB decision, not a registry edit, and this claim stays a gap until it is
taken.
"""
owner = "http_profile.keyid"
review_requirement = "Owner security-specification review"
supported_by = []
depends_on = ["THM-0055"]

[[theorem]]
id = "THM-0051"
title = "The pipeline holds, at dispatch, the verification product of this very exchange"
statement = """
The verified request the serving path carries from the verification stage to the dispatch,
and to every stage between them, is the product that stage's verification of THIS inbound
message returned — not a product of another exchange, not one reconstructed downstream, and
not one a caller supplied.
"""
security_consequence = """
A caller cannot reach the backend by having some other exchange's verification succeed, and
no stage between verification and dispatch can substitute a value for the one the verifier
produced.
"""
scope = """
Possession provenance across the serving pipeline. It does not restate what the verification
established (THM-0015) or that the products are type-separated (THM-0047); it is the joint
those two explicitly exclude.

The mechanism is a self-tested source-text gate,
`scripts/serving_product_provenance_gate.py`: the assembly calls the verification stage
exactly once and builds exactly one carrier, the stage hands its product to
`ExchangeProgress::establish` so the machine learns it ran, the carrier has no public field,
and no production module of `mcp-re-proxy` constructs the product. That is EVIDENCE and not
unconstructibility, and the reason it cannot be a type is recorded rather than worked around:
`VerifiedMcpRequest` keeps PUBLIC fields because the Verus obligation on
`prepare_http_dispatch` reads `verified.request_block` as a field so the prover can relate
the obligation to the value, and `#[verifier::external_type_specification]` refuses a
non-public field. A proved postcondition outranks a seal. So this claim holds for the serving
path of this crate and says nothing about a product another crate fabricates.
"""
owner = "proxy.dispatch_commitment"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.dispatch_commitment", "unit://http_profile.verifier_result_separation"]
depends_on = ["THM-0015", "THM-0047"]

[[theorem]]
id = "THM-0052"
title = "A dispatched body was released by the decision a configured policy produced"
statement = """
On a deployment where an authorization policy is configured, the `AuthorizationPosture` that
released the body reaching the backend was produced by that policy's evaluation of this
request's verified facts — `NoPolicyConfigured` is reachable at the dispatch only on a
deployment that configured no policy.
"""
security_consequence = """
A serving path cannot bypass a configured policy by releasing the body under the posture
that claims nothing, which is the one gap the sealed body type leaves open: possession
proves a decision was taken, and this proves it was the one the deployment selected.
"""
scope = """
It does not restate the seal (THM-0045), the decision relation (THM-0040) or the operation's
own selection (THM-0056). It establishes nothing about the policy's own correctness, and
nothing about deployments that configure no policy, which are entitled to serve while
claiming nothing.

The structural half — that the serving path names no `AuthorizationPosture` variant, that the
authority builds them in exactly one operation, and that the assembly calls `release` exactly
once — is held by `scripts/authorization_provenance_gate.py` clauses 4, 7 and 10, a
self-tested source-text gate. That is EVIDENCE, not unconstructibility: `NoPolicyConfigured`
is a public variant, and a body released under a synthesized one is byte-for-byte the body a
real decision would have released, so no type can refuse it. Deleting the gate leaves the
bypass constructible.
"""
owner = "proxy.dispatch_commitment"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.dispatch_commitment", "unit://proxy.pdp_decision_relation"]
depends_on = ["THM-0045", "THM-0040", "THM-0056"]

[[theorem]]
id = "THM-0053"
title = "A presented admission assertion is authentic, in its window, and for this audience"
statement = """
The admission assertion an enforcement point acts on verified under a key resolved for its
issuer, the instant of the call lies within the assertion's [nbf, exp] window, and its
audience names this enforcement point.
"""
security_consequence = """
An admission verdict cannot rest on an assertion another party minted, on one whose validity
window has passed, or on one issued to a different enforcement point and replayed here.
"""
scope = """
Assertion authenticity only. It does not restate verdict integrity (THM-0003), anti-rollback
(THM-0004), presenter binding (THM-0006) or the degraded-admission opt-in (THM-0005), all of
which characterize what the verdict says once the assertion is believed. ASM-0012 currently
stands in place of this proposition inside the Verus proof cone; an assumption over MCP-RE's
own verifier is a legitimate proof-cone device and is not an acceptable terminal for a
load-bearing system obligation.
"""
owner = "http_profile.admission_currency"
review_requirement = "Owner security-specification review"
supported_by = []
depends_on = []

[[theorem]]
id = "THM-0054"
title = "Every production listener denies unknown client revocation status"
statement = """
Every client-certificate verifier a production MCP-RE listener uses denies unknown
revocation status, enforces revocation over the full chain, and enforces CRL expiration, with
no configuration or argument that can relax any of the three.
"""
security_consequence = """
A client whose revocation status cannot be determined — because the CRL is stale, absent for
its issuer, or does not cover its position in the chain — cannot complete a handshake, so a
revoked credential cannot be admitted by the checking silently failing open.
"""
scope = """
The verifier value is a foreign trait object that plainly admits permissive
implementations, so this is a proposition about every production construction site, not a
property of a type this project owns. It does not establish that the CRLs a deployment
loads are current or complete, and it establishes nothing about the per-request revocation
check, which is a separate authority holding the same invariant.

Two halves are needed and neither exists yet, which is why this is a gap rather than a
scoped claim. The SOURCE half — that `build_client_verifier` is the only production producer
of a `ClientCertVerifier`, that it takes no argument that could relax the posture, and that
it calls `enforce_revocation_expiration` — is measurable by a self-tested gate of the same
kind as the four this repository already runs, and is not written. The BEHAVIOURAL half — a
handshake driven against a chain whose revocation status cannot be determined, refused — is
not in `proxy.tls_listener_state`'s battery, which measures the anchor epoch and resumption
and says nothing about revocation admission. Declaring this supported by that battery would
attach the claim to controls that do not reach it.
"""
owner = "proxy.tls_listener_state"
review_requirement = "Owner security-specification review"
supported_by = []
depends_on = ["THM-0048"]

[[theorem]]
id = "THM-0055"
title = "The keyid derivation introduces no collisions of its own"
statement = """
`canonical_ed25519_jwk` embeds its operand verbatim between a fixed prefix and a fixed
suffix, so the operand is recoverable from the form and distinct operands never share one —
for any operand, including one carrying JSON metacharacters. The keyid's base64url-no-pad
encoding is injective over the fixed 32-byte width of a SHA-256 output.
"""
security_consequence = """
Two distinct verification keys cannot be given the same keyid by anything this project
wrote: not by a canonicalization that reorders or drops a member, not by an operand chosen
to nest structure inside the JWK, and not by an encoding that merges digests.
"""
scope = """
Everything except the digest. It says nothing about whether SHA-256 maps two distinct
canonical forms to one value, which is the remaining premise of selector injectivity
(THM-0050) and is a property of the primitive. It establishes nothing about the trust seam,
about which keys are enrolled, or about whether a resolved key is trusted for its slot.
"""
owner = "http_profile.keyid"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.keyid"]
depends_on = []

[[theorem]]
id = "THM-0056"
title = "The posture that claims nothing is produced only where no policy is configured"
statement = """
`authorize` returns `AuthorizationPosture::NoPolicyConfigured` exactly when the deployment
attached no evaluator, and `AuthorizationPosture::Authorized` only from a grant an evaluator
actually returned, carrying the request the decision was taken over and that decision whole.
An evaluator that denies, and one that could not complete, are the `Err` half and never a
posture. The action coordinate is read whether or not a policy is configured, so enabling one
cannot change which requests are well-formed enough to serve.
"""
security_consequence = """
A record cannot report *no policy is deployed* as *a policy permitted this*, and an
authorized posture cannot be assembled from an attribution taken from one decision and
evidence taken from another — the pairing this type exists to be evidence of.
"""
scope = """
A claim about the operation, not about the serving path: it does not establish that the
posture the dispatch consumed is the one this operation returned, which is THM-0052. It
establishes nothing about the policy mechanism's own correctness, and nothing about which
evaluator a deployment attached.
"""
owner = "proxy.authorization_posture"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.authorization_posture"]
depends_on = []

# =======================================================================================
# Stage 4 — the client-side propositions.
#
# The six the client-response-verification blueprint recorded as gaps, placed under R3 and
# partitioned by the four semantic owners that actually hold them. The seventh — that a
# response expectation was derived from the request this client sent — is NOT registered:
# `ResponseExpectation::new` is public because the FFI bindings rebuild the request from
# scalars, and any caller that can reach it is the caller whose bug a wrong pairing is.
# Sealing past that seam is theatre (`docs/dev/sealed-owners.md`), so the proposition is a
# caller obligation and stays OUT_OF_SCOPE — the same disposition O-4 already gave the FFI
# half, applied honestly to the in-process half rather than claimed away.
# =======================================================================================

[[theorem]]
id = "THM-0057"
title = "A client's trust anchors are the ones the current signed manifest published"
statement = """
Anchors are released only from a manifest whose signature verified under a trusted signer
kid that the signature itself covers, whose profile is this one, and whose version is not
below the monotone floor — a floor that rises on load and cannot be read as zero when it
cannot be read at all. The manifest's own deadline travels with the anchors it published and
outranks every root inside it, so an expired document resolves nothing, and the revocation
half is carried by the same authority as the resolution half.
"""
security_consequence = """
A client cannot be moved back onto a superseded trust picture by replaying an older signed
manifest, cannot be given anchors by a document nobody trusted signed, and cannot keep
resolving roots from a document whose lifetime has passed — including when the floor's own
storage fails, where anchors are withheld rather than released against an unknown floor.
"""
scope = """
Establishes what the document says and for how long. It does not establish that a response
verified under one of these anchors is an answer to this request (THM-0058, THM-0059), that
the publisher's key management is sound, or that a revocation list is complete — only that
an identifier it names cannot resolve.
"""
owner = "client.trust_manifest_lifecycle"
review_requirement = "Owner security-specification review"
supported_by = ["unit://client.trust_manifest_lifecycle"]
depends_on = []

[[theorem]]
id = "THM-0058"
title = "A client accepts a response only under a signer its trust configuration authorizes"
statement = """
A response this client reports as verified was signed under a credential chaining to a root
issuer the current trust picture resolves for the Response slot; where the route pins an
issuer, a credential chaining to any other trusted anchor fails closed; and a credential
whose issuer kid, delegated kid or jti the trust authority reports revoked resolves nothing,
on both the success and the rejection path. A response carrying no credential is refused
rather than read as a direct-root answer.
"""
security_consequence = """
An application cannot be handed a response signed by a party this deployment never
authorized for the Response slot, by one whose authorization has been retired, or by the
trust root directly — the mode this project does not support and therefore must not accept.
"""
scope = """
Signer authorization only. It does not establish that the response answers THIS request,
which is the binding disposition (THM-0059), and it does not restate the underlying
signature and `;req` facts, which are stated over the profile verifier (THM-0016, THM-0019,
THM-0021). It says nothing about whether the deployment was right to trust the anchor.
"""
owner = "client.response_acceptance"
review_requirement = "Owner security-specification review"
supported_by = ["unit://client.response_acceptance", "unit://client.trust_manifest_lifecycle"]
depends_on = ["THM-0016", "THM-0019", "THM-0057"]

[[theorem]]
id = "THM-0059"
title = "An unbound receipt is never a success and never another request's answer"
statement = """
A response verified without a request binding is reported as unbound and is never classified
as a success, and there is no path on which a failed bound verification is retried as an
unbound one. A preflight receipt is accepted as being about this call only when it commits to
the digest of the bytes this client sent; one about another request, and one about no request
at all, answer nothing.
"""
security_consequence = """
A pre-parse receipt cannot be replayed as the answer to a request, and a response that could
not be bound cannot be presented to an application as this call's result by falling back to
the weaker check.
"""
scope = """
The disposition, not the signer (THM-0058). The unbound receipt's binding is a BYTE binding:
two transmissions of identical request bytes share it, so it is not an instance binding, and
the client discloses it to the caller as unbound rather than claiming otherwise.
"""
owner = "client.response_acceptance"
review_requirement = "Owner security-specification review"
supported_by = ["unit://client.response_acceptance"]
depends_on = ["THM-0020", "THM-0022"]

[[theorem]]
id = "THM-0060"
title = "The client's clock skew is bounded at construction and read once"
statement = """
`DelegationPolicy` clamps the configured clock skew to the profile's bound when it is
constructed and keeps the result in a private field, so no inhabitant carries an unbounded
tolerance; a negative configured skew narrows to zero rather than moving the window
backwards; and both freshness windows read that one bounded number through the policy's
single projection.
"""
security_consequence = """
An operator cannot widen a client's acceptance window past the profile bound by
configuration, and the credential window and the signature window cannot disagree about the
tolerance they applied — the disagreement that lets a credential be accepted outside the
window its own signature was admitted under.
"""
scope = """
The bound and its single reading. It does not establish that the profile's bound is itself
appropriate, and it establishes nothing about what either window checks beyond the tolerance
it applies.
"""
owner = "client.delegation_policy_seal"
review_requirement = "Owner security-specification review"
supported_by = ["unit://client.delegation_policy_seal"]
depends_on = []

[[theorem]]
id = "THM-0061"
title = "A receipt that says nothing is not a receipt that says nothing ran"
statement = """
`ExecutionStatus::Unstated` and `ExecutionStatus::NotExecuted` are distinct inhabitants, and
a rejection body carrying no execution contract yields the silent one rather than a guess. An
unrecognized value is carried as unrecognized and never read as a known one, a spent
elicitation is reported as requiring a new one rather than as an ordinary failure, and a
failed retention obligation survives beside whatever the execution status says. The wire code
and the contract are read in one parse.
"""
security_consequence = """
A client cannot repeat a side effect by reading the server's silence as *it did not run*,
cannot retry an exchange whose human approval was already spent, and cannot be told a call is
recorded when the deployment's audit store has no record of it.
"""
scope = """
What the receipt SAYS, and what a client may conclude from it. It does not establish that the
server's statement is true — that is the serving path's exchange machine (THM-0044) — and it
establishes nothing about the transport failures on which no receipt arrives at all.
"""
owner = "client.execution_contract"
review_requirement = "Owner security-specification review"
supported_by = ["unit://client.execution_contract"]
depends_on = []

# =======================================================================================
# Stage 5 — the response-emission cluster.
#
# R2 was the weakest root in the proposal packet: every response theorem in the registry
# was stated over the VERIFIER, and verifying is what a client does. These four are stated
# over the emission side. Custody stays owned by custody, request binding stays its own
# relation, and the non-exporting guarantee is CONDITIONAL on a deployment selecting
# non-exporting custody — the ratification's ruling, and the vocabulary is the one
# ADR-MCPRE-067 already gave the tree rather than a redesign of `KeySource`.
# =======================================================================================

[[theorem]]
id = "THM-0062"
title = "A response-signing credential exists only while a valid delegated key does"
statement = """
The response signer publishes a credential snapshot only from a successful rotation, and
yields none before the first rotation, past the published key's expiry, after a fail-closed
issuance has retired the snapshot, after a terminal retirement — including for a mint that
lands afterwards — and when its snapshot lock is poisoned. An issuance failure serves the
still-valid key and then fails closed at its expiry rather than extending it, and the
retry schedule never sleeps past a still-valid key.
"""
security_consequence = """
A response cannot be signed under a credential the deployment no longer holds, under one
whose window has closed, or after the signer has been retired — and there is no longer-lived
or root credential to fall back to, because no such mode exists. What a caller gets instead
is an unsigned last-resort receipt, which it can tell from a signature.
"""
scope = """
The credential's existence, not its content: it does not establish that the credential
chains to the deployment's root, that its scope is right, or that a verifier will accept it.
It says nothing about what is signed under it, which is THM-0063 and THM-0065.
"""
owner = "proxy.delegated_signing_credential"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.delegated_signing_credential"]
depends_on = []

[[theorem]]
id = "THM-0063"
title = "A signed response never advertises validity its credential does not authorize"
statement = """
`SigningWindow` keeps `expires` private and no constructor accepts one: every window is
derived as the earlier of the configured TTL from `now` and the credential's own `exp`, with
saturating arithmetic so an absurd configured TTL cannot wrap past it. A credential already
past its bound yields a window claiming no future validity rather than one running backwards.
The same owner opens every window this deployment signs under, reply and refusal alike, and
a refusal signs under the snapshot its own exchange took.
"""
security_consequence = """
A client cannot be given a receipt asserting validity beyond the moment its credential stops
authorizing signatures — a window the verifier refuses as soon as the credential's own closes,
which the client would learn about only by failing. And a refusal minted late in an exchange
cannot advertise more validity for having been reached by a different path.
"""
scope = """
The advertised window, not the signature. It does not establish that a credential existed
(THM-0062) or what the signature covers (THM-0065). Where no valid credential exists the
receipt is UNSIGNED, and what such a receipt may still state is a separate conjunct of this
unit rather than part of this claim.
"""
owner = "proxy.response_signing"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.response_signing", "unit://proxy.delegated_signing_credential"]
depends_on = ["THM-0062"]

[[theorem]]
id = "THM-0064"
title = "A non-exporting custody selection keeps the private key off this process"
statement = """
The custody owner classifies each legal selection into exactly one state carrying the
material that made it inhabitable, and projects a single semantic fact —
`PrivateKeyExposure` — that is `NonExporting` for the device- and service-held states and
`ProcessReadable` only for the state that loads a seed. A state missing a parameter it
cannot start without is not built, and a state carries no neighbour's material.
"""
security_consequence = """
Where a deployment selects non-exporting custody, nothing that can read this process's
memory or its seed file can obtain the signing key — the process can ask for a signature and
never for the key. And a consumer asking whether the key may be read here cannot get a
different answer by asking which mechanism it is, because the projection names none.
"""
scope = """
CONDITIONAL on the deployment's own selection: it establishes nothing about a deployment
that selects file custody, which is `ProcessReadable` and honestly says so. It establishes
what the classified STATE asserts, not that the remote signer implementation honours it —
that a KMS does not export a key is the provider's property, outside this boundary. It does
not establish that response signing and channel signing use different keys.
"""
owner = "proxy.custody_exposure"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.custody_exposure"]
depends_on = []

[[theorem]]
id = "THM-0065"
title = "An emitted bound response signature binds the request it answers"
statement = """
A response this proxy signs in the bound form carries a signature whose `;req` components
resolved against the request being answered, and a response evidence block whose
request-evidence handle is over that same request. Signing and verification agree end to
end: a response minted for one exchange does not verify as the answer to another, at the
evidence block or at the cryptographic floor, and two requests differing only in one signed
parameter have different handles.
"""
security_consequence = """
A response cannot be lifted from one exchange and presented as the answer to another, and a
`;req` splice cannot be repaired by reconstructing the block — the floor refuses it
independently.
"""
scope = """
The bound form only: an unbound emission carries no binding by construction, and that a
verifier can never read one as bound is THM-0022 on the verification side. It does not
establish which credential the signature was made under (THM-0062, THM-0063), and it says
nothing about responses this proxy does not sign.
"""
owner = "http_profile.response_emission_binding"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.response_emission_binding", "unit://http_profile.verifier_results"]
depends_on = ["THM-0021", "THM-0022"]

# =======================================================================================
# Stage 6 — the deployment-composition propositions.
#
# A-1 was the oldest recorded architecture gap and the one whose owner "does not exist".
# Measurement disagrees, in the same way it did for the exchange machine: the composition
# exists, its behaviour is measured, and what was missing was the composition half — that
# the seam the serving path runs is the one built from the materialized authority.
# =======================================================================================

[[theorem]]
id = "THM-0066"
title = "The serving PEP resolves actors through the deployment's materialized trust authority"
statement = """
The composition root builds the serving actor resolver exactly once, from the reloading
signer directory's snapshot and the deployment's revocation-tier resolver. That seam
resolves every Request-slot keyid through the tier on every request rather than through a
map captured at process start; an unknown kid is a definitive negative, a store outage is
reported as unavailable rather than as a binding failure, and every non-active outcome —
revoked, not found, malformed, unavailable — yields no actor. The Response slot answers only
for this deployment's own issuer kid.
"""
security_consequence = """
A key revoked in the trust store stops verifying at the instant the tier says so rather than
at the next restart, and an operational failure of the tier is never softened into an allow.
A deployment cannot announce one revocation tier at startup and run another on the data
plane — the defect ADR-MCPS-021 recorded, in which the resolver chain was constructed, its
guarantee printed, and then dropped.
"""
scope = """
Where the seam comes from and what it consults. It does not establish that the tier's own
answer is correct, that the trust document is authentic, or that the resolved key is the
right one for the signer — those are the tier's and the trust owner's. The composition half
is held by source controls over `app.rs`, because `ActorResolver` is a closure seam: anything
producing that signature is an inhabitant, so privacy buys nothing and the controls are
EVIDENCE rather than unconstructibility.
"""
owner = "proxy.serving_trust_seam"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.serving_trust_seam", "unit://proxy.trust_plan"]
depends_on = ["THM-0037"]

[[theorem]]
id = "THM-0067"
title = "The composition root re-reads no owner's security semantics from the request"
statement = """
Every field the composition root still reads directly from the validated deployment request
is a pinned ordinary parameter — one whose value changing, with every owner state unchanged,
cannot change a security-sensitive decision or effect — and each is recorded with the
sentence saying why. The inventory is checked against the file it describes in both
directions, so a new raw read fails and a field that acquired an owner must leave the list.
"""
security_consequence = """
After layer A classifies a deployment, no post-validation consumer can reach back past an
owner for a security decision the owner already made — which is how two components come to
disagree about what was configured, with neither of them wrong locally.
"""
scope = """
The general claim over ALL owners; THM-0038 is its trust specialization and states in
addition that the root passes trust as owner projections. It does not establish that the
owners' own classifications are right, and it says nothing about consumers other than the
root — a plane reaching back for a posture is a different failure with its own control.

It is a source-text inventory, not a type: `ValidatedDeployment::config()` is legitimately
readable, because the root builds things out of it. What is decidable is WHICH fields, and
the list only means anything while adding to it costs a written reason.
"""
owner = "proxy.trust_composition_root"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.trust_composition_root"]
depends_on = []

[[theorem]]
id = "THM-0068"
title = "A pinned transparency service is one operator-reviewed document, or it is not a pin"
statement = """
`ResolvedTransparencyService::pinned` takes its verification key, leaf profile and position
profile from a single `ScittServiceTrustPin`, so all three came from one document an operator
wrote and reviewed. A malformed pin document never becomes a pin, and an illegal one is
refused at deserialization rather than carried into a resolver that would answer from it.
"""
security_consequence = """
A receipt cannot be verified against a service whose key came from one place and whose
profile expectations came from another — the pairing that lets a receipt satisfy a position
profile the pinned service never declared.
"""
scope = """
It establishes the PROVENANCE of a pinned service, not that a deployment pinned one.
`verify_receipt_offline` takes the service as a `Fn(&str) -> Option<ResolvedTransparencyService>`
seam, and `stated` is a legitimate second provenance — the in-process prototype log is one,
with no pin to resolve from. Against a seam a private field only forces a constructor taking
the same arguments with the same absence of checking, so what these fields buy is that every
producer is NAMED, not that the illegal pairing is unconstructible. Whether a given
deployment's resolver is backed by a pin is deployment wiring and is not established here.
"""
owner = "http_profile.scitt_service_pin"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.scitt_service_pin"]
depends_on = []

# =======================================================================================
# Stage 7 — accountability, up to the exception channel.
#
# ADR-MCPS-035 freezes the refusal vocabulary. The ratification is explicit that it is not
# bypassed to close the theorem tree, so what is registered here is everything BELOW the
# frozen vocabulary — what a record may say and in whose coordinate, and whether the record
# stream is honest about what reached it. Totality over the outcomes that can occur stays a
# gap, and its residue is an ADR decision rather than a registry edit.
# =======================================================================================

[[theorem]]
id = "THM-0069"
title = "A security record states each authority's outcome in that authority's own coordinate"
statement = """
Every request record states an authorization outcome — not configured, authorized, or
refused — and a response record carries none, because there is nothing after the dispatch for
a policy to have decided. The Core verdict and the authorization verdict occupy separate
coordinates on one record and neither can be read as the other: an unconfigured deployment
is not rendered as an authorized one, a policy denial's token goes in the authorization
coordinate, the two authorization refusal arms stay distinguishable, and the arm reached
before any policy ran imports no policy vocabulary at all.
"""
security_consequence = """
A reader of the record cannot be shown *a policy permitted this* where none was deployed,
cannot mistake a request that reached no policy verdict for one a policy denied, and cannot
be left unable to tell whether a policy was consulted — the collapse a single rendered
`reason` string produced, and which the type system prevented while the record restored.
"""
scope = """
What a record MAY say, not that the vocabulary is total over the outcomes that occur — that
is the open proposition below, and it is an ADR-MCPS-035 decision rather than a registry
edit. It does not establish that the record was delivered (THM-0070), and it establishes
nothing about the truth of either authority's verdict.
"""
owner = "proxy.audit_record_coordinates"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.audit_record_coordinates", "unit://proxy.refusal_provenance"]
depends_on = ["THM-0046"]

[[theorem]]
id = "THM-0070"
title = "The record stream is honest about what reached it"
statement = """
Every emitted record carries a sequence number and the collector preserves emission order.
A full queue drops rather than blocking the caller, the drop count is reported without a
following record to carry it, an unattributed flood cannot consume the headroom an
attributed record needs, and concurrent offers at the ceiling admit only the remaining
slots. A drain that timed out is a distinct outcome from one that completed, and the
outcome that is unknown is its own case.
"""
security_consequence = """
An auditor cannot be shown a record stream that silently lost entries: a gap is visible in
the sequence and a drop is counted and reported. An unattributed caller cannot suppress the
records of an attributed one by flooding the queue. And a shutdown whose drain timed out
cannot be read as one that emptied the queue — the difference between *these are all the
records* and *these are the records that got out*.
"""
scope = """
Delivery integrity, not content (THM-0069) and not durability: the sink is in-process, so a
record that was emitted may still be lost with the process. It establishes nothing about
whether a record SHOULD have been written for a given outcome, which is the totality
proposition below.
"""
owner = "proxy.audit_delivery"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.audit_delivery"]
depends_on = []

[[theorem]]
id = "THM-0071"
title = "The refusal vocabulary is total over the outcomes that can occur"
statement = """
Every outcome a served exchange can reach is nameable in the recorded vocabulary, and no
outcome is recorded under a token belonging to an authority that did not reach it.
"""
security_consequence = """
An auditor reading the record cannot be shown silence where a refusal occurred, and cannot
be shown a token that attributes a refusal to an authority that never ran.
"""
scope = """
A GAP, and deliberately not closed here. `McpReError` is one frozen taxonomy and
`PolicyError` is a second owned by another crate; the record now keeps their coordinates
apart (THM-0069), which is what makes the remaining question answerable at all, and it does
not make the union total. Closing this needs an ADR-MCPS-035 decision — a new category, new
`McpReError` variants, or a rule that the authorization stage renders only Core tokens — and
the ratification is explicit that the frozen vocabulary is not bypassed to close a theorem
tree. There is also no single owner to assign: the taxonomies live in two crates and the
totality relation is between them. Its owner is provisional, and the claim stays
unestablished until the decision is taken.
"""
owner = "proxy.audit_record_coordinates"
review_requirement = "Owner security-specification review; ADR-MCPS-035 vocabulary decision"
supported_by = []
depends_on = ["THM-0069", "THM-0046"]

# =======================================================================================
# Stage 8 — the system roots, composed.
#
# Each root is stated in the safety direction and quantified over the obligations the
# VALIDATED DEPLOYMENT selected, in the wording the ratification fixed. Each is owned by a
# real composition review unit; none is owned by a synthetic "system" unit, and R5 is a
# FAMILY of independently owned promises rather than one umbrella claim, because no
# authority owns that conjunction.
#
# Three roots report INCOMPLETE, and that is the truthful state of a campaign in progress
# rather than a shortfall to hide: R1 through THM-0050 and THM-0053, R4 through THM-0054 and
# THM-0073, and R5c through THM-0071 itself. `review` reports it under its own heading and
# stays report-only.
# =======================================================================================

[[theorem]]
id = "THM-0072"
title = "A verified receipt proves registration on the service this deployment pinned"
statement = """
A receipt this deployment verifies offline proves the Signed Statement was registered on the
transparency service whose key, leaf profile and position profile came from the pin document
the deployment resolved — not merely on some service whose key was supplied to the call.
"""
security_consequence = """
An auditor cannot be shown a receipt from a log this deployment never pinned, and cannot be
shown one that satisfies a position profile the pinned service never declared.
"""
scope = """
It composes the two facts and adds nothing: offline verification against a resolved service
(THM-0041) and the provenance of a pinned one (THM-0068). It carries both scopes forward
unchanged — nothing about the service being honest, its log append-only, or an entry unique,
and nothing about whether the retained evidence is what the statement describes, which is
THM-0042 and is a separate promise because no authority owns the conjunction.
"""
owner = "http_profile.scitt_receipt_offline"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.scitt_receipt_offline", "unit://http_profile.scitt_service_pin"]
depends_on = ["THM-0041", "THM-0068"]

[[theorem]]
id = "THM-0073"
title = "A validated deployment cannot collapse signing roles policy requires distinct"
statement = """
Where the selected roles and mechanisms require the response-signing key and the channel
handshake key to be distinct, no validated deployment obtains a posture in which one key
serves both.
"""
security_consequence = """
A party able to obtain a TLS handshake signature cannot thereby obtain a response
attribution, and vice versa — the two roles stay separately attributable.
"""
scope = """
A GAP, and relocated here deliberately. The KMS blueprint records that the separation is held
by a CONSTRUCTION SITE — `cli.rs::build_key_source` — rather than by any value, so it does not
survive the deletion test and is not structural. It was recorded under response attribution;
it does not belong there, because attribution does not logically require it. It is
deployment/capability-role integrity, and it is CONDITIONAL: a deployment whose selected roles
and mechanisms do not require distinctness is not in scope.

The cross-machine relation X2a (THM-0049) states the adjacent fact — that the channel key
object must live in a backend the deployment already reaches — and is not this claim.
"""
owner = "proxy.cross_machine_legality"
review_requirement = "Owner security-specification review"
supported_by = []
depends_on = ["THM-0049"]

# --- The roots. ---

[[theorem]]
id = "THM-0074"
title = "No unearned dispatch"
statement = """
If the serving path invokes the backend for an inbound request, every pre-dispatch security
obligation selected by the validated deployment was first established by its owning authority
from the inputs that obligation is defined to consult — request and exchange evidence and,
where required, authoritative validated or materialized state — and the downstream pipeline
consumed the earned product of that establishment for the same relevant request, actor,
subject and exchange.
"""
security_consequence = """
A caller cannot reach the backend by omitting evidence, by presenting evidence for a
different exchange, by presenting a fact the deployment did not select the authority for, by
handing the pipeline a security value it constructed itself, or by having some other
exchange's establishment succeed.
"""
scope = """
It ends at the invocation: what the backend does once dispatched is the application's.
Obligations a deployment did NOT select are outside it by construction — this is a claim
about the selected set, not a claim that the set is right. It says nothing about liveness:
that a valid request IS served is not claimed, and the complement of this implication is
THM-0078, not "some other path".

Request-carried evidence does not stand in for authoritative state. Admission currency is
stated against the state the enforcement point holds, and actor resolution against the
MATERIALIZED trust authority (THM-0066), because an obligation defined over validated state
is not discharged by anything the request carries.
"""
owner = "proxy.dispatch_commitment"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.dispatch_commitment", "unit://proxy.exchange_lifecycle"]
depends_on = [
  "THM-0015",
  "THM-0051",
  "THM-0050",
  "THM-0034",
  "THM-0003",
  "THM-0004",
  "THM-0005",
  "THM-0006",
  "THM-0053",
  "THM-0040",
  "THM-0052",
  "THM-0009",
  "THM-0043",
  "THM-0045",
  "THM-0066",
  "THM-0079",
  "THM-0080",
]

[[theorem]]
id = "THM-0075"
title = "No unearned response attribution"
statement = """
Whenever MCP-RE emits signed response or refusal evidence, the signature is produced by the
response-signing capability materialized for that deployment under the supported delegation
model; bound evidence is bound to the exact request it answers, and evidence produced before
a request can be established is explicitly unbound and cannot be interpreted as bound.
"""
security_consequence = """
A response cannot be attributed to the trust root directly, cannot be signed by a credential
the deployment does not hold or no longer holds, cannot advertise validity its credential
does not authorize, and a pre-parse receipt cannot be replayed as an answer to a request.
"""
scope = """
SECURITY-BEARING SIGNED evidence only. Unsigned transport and error responses exist — a
last-resort receipt is emitted when no valid credential does — and they are outside this
claim, which is why it does not say every response carries evidence. It does not establish
that a client accepts the response, which is THM-0076 and a different proposition on the
other side of the same exchange.
"""
owner = "proxy.response_signing"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.response_signing", "unit://http_profile.response_emission_binding"]
depends_on = ["THM-0062", "THM-0063", "THM-0065", "THM-0022", "THM-0082"]

[[theorem]]
id = "THM-0076"
title = "A client accepts only an answer to its own request, under a signer it trusts"
statement = """
If `mcp-re-client-core` returns a response as verified, then that response was signed under a
signer this client's current trust configuration authorizes in the Response slot, over a
signature base that resolved against the request this client sent; a response that could not
be bound is never reported as a success; and what the client may conclude about whether the
work ran is what the receipt states, never what its silence might be read as.
"""
security_consequence = """
An application cannot be handed, as this call's answer, a response from another exchange,
from another signer, from a signer whose authorization has been retired, or one that verified
only in the unbound form — and cannot be led to repeat a side effect by reading silence as
*it did not run*.
"""
scope = """
The consumer side, kept apart from THM-0075 because a deployment may run either side alone
and producer attribution and consumer acceptance are different propositions. It does not
establish that the deployment was right to trust an anchor, and it does not establish that
the expectation was built from the request this client sent: `ResponseExpectation::new` is
public for the FFI bindings, so that pairing is a caller obligation and sealing past the seam
would be theatre.
"""
owner = "client.response_acceptance"
review_requirement = "Owner security-specification review"
supported_by = ["unit://client.response_acceptance"]
depends_on = ["THM-0058", "THM-0059", "THM-0057", "THM-0060", "THM-0061"]

[[theorem]]
id = "THM-0077"
title = "No deployment serves a posture nobody selected"
statement = """
Every security capability held by the serving runtime is derived from validated semantic
owner state. Illegal, unsupported or internally contradictory deployment postures cannot be
silently reinterpreted into a weaker posture during materialization or serving.
"""
security_consequence = """
An operator cannot obtain a weaker security posture by supplying a combination nobody
validated, and a serving component cannot disagree with the owner about what was configured.
"""
scope = """
SECURITY POSTURE, not liveness and not permanent runtime availability. A runtime dependency
may later fail and cause refusal or loss of availability; that does not violate this claim.
What it forbids is a SILENT weakening of the selected policy — an unavailable tier failing
closed is inside the claim, an unavailable tier being softened into an allow is not.
"""
owner = "proxy.trust_composition_root"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.trust_composition_root", "unit://proxy.cross_machine_legality"]
depends_on = [
  "THM-0067",
  "THM-0038",
  "THM-0036",
  "THM-0005",
  "THM-0013",
  "THM-0048",
  "THM-0049",
  "THM-0054",
  "THM-0073",
  "THM-0064",
  "THM-0066",
]

[[theorem]]
id = "THM-0078"
title = "Refusal is terminal, and no refusal-side effect reads as success"
statement = """
If an inbound exchange fails to establish a required pre-dispatch obligation, it reaches a
declared refusal terminal — or a declared pre-exchange transport refusal — before backend
dispatch. It cannot fall through into a success-path dispatch or a success response. Any
refusal-side effect, including signed refusal evidence, audit and retention records, cleanup
and continuation retirement, is authorized by the refusal and lifecycle state it was reached
from, and none of them can be read as success.
"""
security_consequence = """
The complement of THM-0074 is not "some other path": it is a refusal that is recorded, that
cannot reach the dispatch, and whose own effects cannot be mistaken for the effects of a
served request — including the case that motivated the exchange machine, where an approval is
spent and the refusal must not read as an ordinary retry.
"""
scope = """
It forbids a SUCCESS-PATH effect, not any effect at all. The serving architecture emits
signed refusal evidence and performs audit, retention, cleanup and continuation retirement on
the refusal side, and those are legitimate. This and THM-0074 are two separate safety
implications and never a biconditional: stating them as one would make this a liveness claim,
which it is not.
"""
owner = "proxy.exchange_lifecycle"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.exchange_lifecycle", "unit://proxy.refusal_provenance"]
depends_on = ["THM-0043", "THM-0044", "THM-0046", "THM-0045", "THM-0063", "THM-0069", "THM-0081"]

# --- Found by the Stage 8 whole-system missing-edge pass. ---

[[theorem]]
id = "THM-0079"
title = "Distinct signed exchanges have distinct replay keys"
statement = """
The replay five-tuple — profile id, signature label, actor id, audience hash, nonce — is
pre-serialized onto the core cache's three slots with a separator that cannot appear in any
component, so equality of the composite slots holds exactly when the full five-tuple is
equal; every component discriminates; and a key admitted once is reported as a replay
thereafter.
"""
security_consequence = """
Evidence produced under a different profile, a different signature role, a different actor or
a different audience can never satisfy a replay check meant for another, and the same signed
exchange cannot be admitted twice against the same cache.
"""
scope = """
The KEY and the cache's decision over it. It does not establish that the cache is consulted
on every path reaching dispatch, that a distributed backend's insert is atomic, or that the
retention window outlives the signature's own validity — those are the replay plane's and are
not stated here. Freshness admission itself is THM-0001.
"""
owner = "http_profile.replay_key"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.replay_key"]
depends_on = []

[[theorem]]
id = "THM-0080"
title = "Serving derives peer identity only from the credential the mechanism accepted"
statement = """
Neither direct-TLS serving path reconstructs peer identity or credential currency from
certificate representation: each asks its authority once, through a resolver whose signature
admits its predecessor and the options and nothing else, so an acceptance from one
relationship cannot be paired with an identity derived from another credential.
"""
security_consequence = """
A served request cannot be attributed to an identity read out of a certificate the
communication mechanism did not accept for THIS relationship — the composition ADR-MCPRE-064
Slice 2 forbids, and the one no behavioural control notices, because each still measures a
true thing about a correctly-composed value.
"""
scope = """
A GAP, and the reason is a measurement correction rather than an absence of evidence. The
proposal packet recorded this as STRUCTURAL; under the deletion test it is not, because the
enforcement is `scripts/serving_identity_provenance_gate.py`, a gate over source text — delete
it and a second identity route compiles. The gate is self-tested and runs in CI, and the
behavioural half is real handshakes against a chain carrying a rival identity; what does not
exist is a `[[unit]]` binding them to this proposition, and the controls sit in a
feature-gated lane whose selection has to be established before they can be declared. It does
not restate THM-0031, which says the resolved identity is right.
"""
owner = "proxy.authenticated_relationship_peer"
review_requirement = "Owner security-specification review"
supported_by = []
depends_on = ["THM-0031", "THM-0033"]

[[theorem]]
id = "THM-0081"
title = "Every production refusal is inside the exchange lifecycle"
statement = """
Every refusal a production serving path can reach is minted from a `Refusal` a stage named
and served through the exchange machine's disposition, or is a declared pre-exchange transport
refusal reached before an exchange exists — there is no third kind, and no exit answers from
source position.
"""
security_consequence = """
No refusal can state a retry contract the exchange machine did not derive, which is how an
exit reached after a human's approval was spent came to report an ordinary retry — the defect
the machine exists to remove, closed at the sites the machine cannot see.
"""
scope = """
A GAP. THM-0043 establishes that the relation is decided everywhere and THM-0046 that a
refusal carries which authority reached it; neither says that every SITE is inside the
lifecycle, and THM-0046's scope says so explicitly. The decidable form is a source-text
property over the serving subtree — the shape `scripts/refusal_provenance_gate.py` already
measures for provenance — and the clause that would measure site totality is not written.
"""
owner = "proxy.refusal_provenance"
review_requirement = "Owner security-specification review"
supported_by = []
depends_on = ["THM-0043", "THM-0046"]

[[theorem]]
id = "THM-0082"
title = "The serving path signs under the credential source materialization produced"
statement = """
The response-signing authority the serving path holds was built by the composition root from
the custody state the deployment validated, so a response is signed under the capability that
deployment materialized and not under one assembled beside it.
"""
security_consequence = """
A deployment cannot announce one signing custody at startup and sign with another on the data
plane — the same shape as the resolver defect ADR-MCPS-021 recorded on the trust side, where
the chain was constructed, its guarantee printed, and then dropped.
"""
scope = """
A GAP, and the counterpart of THM-0066 on the signing side. THM-0062 establishes what the
credential source yields and when it yields nothing; THM-0064 establishes what a custody
selection asserts about exposure. Neither says the source the serving path holds came from
that selection, and the composition controls that would say it — the shape
`serving_trust_seam_test` uses for the resolver — are not written for the signer.
"""
owner = "proxy.response_signing"
review_requirement = "Owner security-specification review"
supported_by = []
depends_on = ["THM-0062", "THM-0064"]
