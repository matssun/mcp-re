# SPDX-License-Identifier: Apache-2.0
#
# ADR-MCPRE-059 §6.3 — the security theorem registry.
#
# The human security claim layer. A theorem is the proposition a reviewer cares about
# ("a request cannot be admitted on stale freshness evidence alone"), stated once, with a
# permanent identifier, above the evidence that supports it.
#
# It sits ON TOP OF the existing authorities and duplicates none of them:
#
#   this file                 the claim, its consequence, its scope, and two edges —
#                             which review units support it, which theorems it rests on
#   verification.toml         [[unit]]: source paths, contracts, evidence URIs, symbols,
#                             features — everything below the claim
#   assumptions.toml          ASM-NNNN: what is trusted, and where
#   the attestations          what actually ran, and over which fingerprint
#
# A theorem therefore names NO path, symbol, feature, assumption, provider kind, or
# evidence target. It resolves downward through `unit://`, and the evidence closure is
# derived, never written here. Reverse edges (`consumed_by`, unit → theorems it
# guarantees, dependents) are likewise derived and MUST NOT be stored (§8.2).
#
# Validated by `tools/verification/verify --manifests`, strictly: an unknown key is a
# validation FAILURE, not a silently ignored field. A mistyped security declaration must
# not read as an absent one.

schema_version = 1

# Required fields on every entry:
#
#   id                    stable, never reused: THM-NNNN
#   title                 one line, the claim as a reviewer would name it
#   statement             the proposition itself, precise enough to be reviewed
#   security_consequence  what an attacker cannot do if it holds
#   scope                 what it does NOT establish — the boundary of the claim
#   owner                 the review unit that is the semantic authority for it,
#                         as a `[[unit]]` id declared in verification.toml
#   review_requirement    who must review a change to the statement
#   supported_by          `unit://<id>` entries whose evidence supports the claim
#   depends_on            THM-NNNN entries this claim rests on
#
# A resolving `supported_by` is a STRUCTURAL fact, not assurance: it says the closure
# reaches real units and real premises, never that their evidence ran, is fresh, or is
# unblocked. "Established" is the later conjunction — structural support AND fresh unit
# evidence AND established dependencies AND fresh specification review AND fresh
# assumption review — and no tooling at this layer may claim it.
#
# Optional:
#
#   replaced_by           THM-NNNN. Its PRESENCE is what marks a theorem deprecated;
#                         there is no status string to go stale, and no field a reviewer
#                         has to remember to flip.
#
# There is deliberately no review or approval field. An approval is evidence ABOUT a
# fingerprint, recorded with the other attestations and keyed by the fingerprint it
# reviewed (§14.7). A stored `review = "approved"` would not say which proposition was
# approved, and would make a self-approving edit a one-file operation.
#
# ID allocation
# -------------
#
#   * `THM-NNNN`, allocated in ascending order, four digits.
#   * An ID is PERMANENT. It is never recycled, never renumbered, and never reassigned to
#     a different proposition — the review history refers to it.
#   * A theorem may be renamed, restated, decomposed, or deprecated under the same ID. The
#     fingerprint, not the ID, carries the version: restating a claim changes
#     `theorem_claim` and takes specification review DIRTY by derivation.
#   * If a proposition changes so fundamentally that continuity would mislead a reviewer,
#     allocate a NEW ID and deprecate the old one with `replaced_by`. The deprecated entry
#     STAYS in this file so historical evidence remains resolvable.
#   * Removing an entry outright is the one thing the loader cannot catch — it frees the
#     ID for reuse and severs the history. Deprecate; do not delete.
#
# The registry, populated by Phase T4.
#
# Ten claims over eight review units. The mapping is one-to-one in neither direction, and
# that is the T4 result rather than an untidy outcome:
#
#   * `http_profile.admission_currency` yields THREE claims. One prover run, one `ensures`
#     with four conjuncts, three different attacker stories — and they are separated so a
#     future rollback claim can rest on THM-0004 alone, and so changing degraded behaviour
#     cannot invalidate a consumer that only needs generation equality.
#   * `http_profile.keyid` yields NONE. Its evidence is one RFC 8037 known-answer test,
#     which is conformance; the property that would matter is selector injectivity, and a
#     known-answer test does not reach it. Recording that is the honest outcome, and the
#     absent row is visible in the owner view.
#   * Presenter binding (THM-0006) was NOT claimable when this file was first populated.
#     The check was enforced on every path in `admission.rs`, absent from the `ensures`, and
#     unexercised by all nine of its unit's tests — every one passed the same actor as both
#     the assertion's actor and the presenter, so deleting the check left them all green.
#     It is now proved: the verdict carries the admitted actor and the postcondition states
#     the comparison. Measured, not assumed — with the check removed the prover reports
#     14 verified / 1 error while the unit tests reported 9 passed / 0 failed, which is the
#     difference the claim exists to record.
#
# Every `scope` states what the claim does NOT establish. Four of those sentences existed
# only as Rust or TOML comments before this file: read by no tooling, attached to no review,
# invalidated by nothing.
#

[[theorem]]
id = "THM-0001"
title = "Admitted request parameters imply a current freshness window"
statement = """
Every signature-parameter set the verifier admits satisfies created - skew <= now,
now < expires + skew, created < expires, and a lifetime within the policy maximum, for
the skew the verifier policy yields.
"""
security_consequence = """
A request cannot be admitted on freshness evidence that has expired, that is dated ahead
of the verifier, or that declares a lifetime longer than the policy permits.
"""
scope = """
Establishes freshness admission only. It does not establish signature validity, issuer
authority, admission currency, or replay uniqueness. The window is stated relative to
skew_of(policy), an opaque accessor: the theorem holds for whatever skew the deployment
configures and does not establish that the configured skew is bounded or sane.
"""
owner = "http_profile.freshness_window"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.freshness_window"]
depends_on = []

[[theorem]]
id = "THM-0002"
title = "RFC 3339 parsing is total and range-bounded"
statement = """
parse_rfc3339_utc terminates without panicking on arbitrary input, and every timestamp it
accepts denotes an instant within the representable civil range
[-62167219200, 253402387199].
"""
security_consequence = """
A timestamp in an evidence artifact can neither crash the verifier nor denote an instant
the rest of the system cannot represent.
"""
scope = """
The two halves are established differently and a reviewer must not look for one conjunct.
The range half is the postcondition. Totality is discharged by the absence of a
precondition together with the prover's panic-freedom obligation, not by an ensures
clause. The theorem says nothing about which grammar variants are accepted beyond that
what is accepted is in range.
"""
owner = "core.time_rfc3339"
review_requirement = "Owner security-specification review"
supported_by = ["unit://core.time_rfc3339"]
depends_on = []

[[theorem]]
id = "THM-0003"
title = "Admission verdict integrity"
statement = """
Every admission verdict returned as Ok has status Admitted and carries the generation of
the binding that was checked.
"""
security_consequence = """
A policy enforcement point cannot act on a verdict that describes a different call than
the one it checked.
"""
scope = """
Does not establish authenticity, issuer trust, audience validity, assertion freshness, or
validity of the assertion's [nbf, exp] window; verify_admission_assertion is outside this
proof cone under ASM-0012. Does not establish that the admitted actor is the presenter of
the call (see the presenter-binding claim, which this contract does not state).
"""
owner = "http_profile.admission_currency"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.admission_currency"]
depends_on = []

[[theorem]]
id = "THM-0004"
title = "Admission anti-rollback"
statement = """
A non-degraded Ok verdict implies the authoritative admission state was reachable, its
generation equals the binding's generation, and its status is Admitted.
"""
security_consequence = """
A workload whose admission has been superseded or revoked cannot buy a call with an
assertion that has not yet expired.
"""
scope = """
Says nothing about the degraded path, and nothing about the assertion's authenticity or
freshness (ASM-0012). Currency is generation equality against the state the enforcement
point holds; the theorem does not establish that that state is itself current.

It also does not establish that the state handed in is the state FOR THIS WORKLOAD.
`AuthoritativeAdmission` carries a generation and a status and no workload identity, so
the proof quantifies over whatever record the caller supplied. Generations are small
integers and collide across workloads by construction. The security consequence above
therefore rests on a caller obligation this claim does not discharge: the enforcement
point must look the record up under the very `binding.admission_id` that was checked. The
serving path satisfies it today at `http_profile_serve.rs:600`, which passes
`&binding.admission_id` to `AsyncAdmissionSource::current`; nothing in the type forbids a
future caller from deriving that id from a header, a session field, or a cache instead.
"""
owner = "http_profile.admission_currency"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.admission_currency"]
depends_on = []

[[theorem]]
id = "THM-0005"
title = "Degraded admission requires deployment opt-in"
statement = """
A degraded Ok verdict implies the authoritative admission state was unreachable and the
deployment policy explicitly allows degraded mode.
"""
security_consequence = """
No default deployment can reach a degraded admission; serving on a last-known snapshot is
always a choice someone made.
"""
scope = """
Establishes the opt-in, not the bound. That a degraded verdict is confined to the
propagation window P is enforced in the body and is not a conjunct of this contract.
Says nothing about assertion authenticity or freshness (ASM-0012).
"""
owner = "http_profile.admission_currency"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.admission_currency"]
depends_on = []

[[theorem]]
id = "THM-0006"
title = "Presenter binding"
statement = """
A successful admission implies the admitted actor named by the assertion is the presenter
of this call — the actor the verifier resolved from the request signature.
"""
security_consequence = """
An assertion describing some admitted workload cannot authorize a different presenter
merely because the workload itself is admissible. Without it the assertion is a bearer
token: anyone whose key the enforcement point resolves could copy an admitted peer's
assertion into their own evidence block, derive the matching binding, and pass the gate.
"""
scope = """
Establishes that the actor named in the assertion equals the presenter argument. It does
not establish that the presenter argument is itself correctly resolved from the request
signature, which is the caller's obligation. Does not establish authenticity, issuer trust,
audience validity, assertion freshness, or validity of the assertion's [nbf, exp] window;
verify_admission_assertion is outside this proof cone under ASM-0012.
"""
owner = "http_profile.admission_currency"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.admission_currency"]
depends_on = []

[[theorem]]
id = "THM-0007"
title = "A typed artifact verifier admits only its own type"
statement = """
Each typed OAuth verifier returns Ok only for a binding whose artifact_type is the one
that verifier is for and whose binding_type is the opaque-digest form.
"""
security_consequence = """
A binding of one artifact type cannot be verified by the verifier for another, so a
credential form cannot be laundered through the wrong check.
"""
scope = """
Does not establish that the digest matches the presented credential: the comparison's
meaning is a statement about SHA-256 and is outside this proof cone under ASM-0018.
"Verified" here means correctly typed and in opaque-digest form.
"""
owner = "http_profile.artifact_typing"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.artifact_typing"]
depends_on = []

[[theorem]]
id = "THM-0008"
title = "No untyped artifact binding leaves the verifier as verified"
statement = """
A binding reported verified is in the opaque-digest form and is one of the three OAuth
artifact types. The four registry types with no typed verifier can never be reported
verified.
"""
security_consequence = """
A caller cannot silently treat an artifact type nothing can verify as though it had been
verified.
"""
scope = """
Structural over the type dispatch, and inherits THM-0007's exclusion: it does not
establish that any digest matched its credential (ASM-0018).
"""
owner = "http_profile.artifact_typing"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.artifact_typing"]
depends_on = ["THM-0007"]

[[theorem]]
id = "THM-0009"
title = "A presented continuation cannot bypass verification"
statement = """
If dispatch preparation returns Ok for a request whose evidence block carries a
continuation, the returned continuation-verified flag is true: the pair (continuation
present, not verified) is not a state any successful preparation can produce.
"""
security_consequence = """
A continuation cannot be carried through dispatch on the strength of being present in the
request.
"""
scope = """
Establishes that the check ran, not what it guarantees; what a verified continuation binds
is THM-0010, which this claim consumes. continuation_verified is an informational WITNESS
propagated in DispatchOutcome, not a control value: downstream consumption is not required
for enforcement, because the unsafe combination is unreachable on a successful preparation
path. The authority is the successful return under this postcondition, not the boolean,
which merely exposes part of that fact. A reader who greps for consumers, finds none, and
concludes the check is unwired has read it backwards.
"""
owner = "http_profile.continuation_unbypassability"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.continuation_unbypassability"]
depends_on = ["THM-0010"]

[[theorem]]
id = "THM-0010"
title = "Continuation handles match their presented inputs in role"
statement = """
An accepted continuation's three handles are the labeled digests of the three presented
inputs, each under its own role label.
"""
security_consequence = """
A response-role evidence handle cannot be presented in the request role, so the three
positions of a continuation cannot be permuted.
"""
scope = """
Assumes only that the labeled digest IS A FUNCTION of (label, bytes) — ASM-0023. It does
NOT establish collision-resistant separation between roles; that obligation stays at
boundary.crypto_primitives and is not discharged here.
"""
owner = "http_profile.continuation_binding"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.continuation_binding"]
depends_on = []

[[theorem]]
id = "THM-0012"
title = "The lifecycle record cannot claim a shutdown that did not happen"
statement = """
Every state has a unique predecessor under the transition relation and apply is the only
mutator, leaving the state unchanged on an illegal event. So a recorded terminal Stopped
implies every event of the path Configured -> Validated -> Planned -> Materializing ->
Materialized -> Serving -> Draining -> Transitioning -> Reclaiming -> Stopped was applied,
in order.
"""
security_consequence = """
A runtime that never bound a listener cannot be recorded as a clean drained shutdown, so
the two terminal states remain distinguishable in an audit record.
"""
scope = """
Establishes what the RECORD can say. It does not establish that any request was refused.
RuntimeState::admits_requests is a DESCRIPTIVE value, not a control: no production path
consumes it, and the recorded state is never Serving while a request is in flight, because
the serving events are applied only after serve_fleet returns Ok — so a consumer reading it
during serving would read Materialized and refuse everything. What actually confines
requests to the serving interval is resource ownership: the listener exists only inside the
serve_fleet call. That the events are applied only on a proven Ok is the materialized-runtime
owner's obligation, not this unit's. FailedToStart is currently
unreachable from Materialized, so a serve that never bound is recorded as Materialized —
the record is silent about the failure rather than wrong about it. Evidence is test://
only: the uniqueness-of-path argument is a match a reviewer reads, not a proof a prover
checked.
"""
owner = "proxy.runtime_lifecycle"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.runtime_lifecycle"]
depends_on = []

[[theorem]]
id = "THM-0013"
title = "No validated deployment enables online OCSP client-certificate revocation"
statement = """
Every DeploymentRequest whose client_ocsp is Require is refused by the legality boundary,
in every build and independently of the online_ocsp feature. Every ValidatedDeployment
therefore carries client_ocsp = Off, and the serving path is handed no OCSP checker.
"""
security_consequence = """
A successfully validated MCP-RE deployment cannot advertise or rely upon online OCSP
enforcement on the production async serving path. An operator who asks for it is refused at
startup rather than served by a plane that performs no responder round trip.
"""
scope = """
Establishes reachability and legality only. It does NOT establish the correctness of the
retained RFC 6960 implementation in ocsp.rs, of the blocking-path OCSP checker, of responder
trust-chain validation, of the endpoint/SSRF network policy, or of any future async OCSP
implementation. It says what no deployment can turn on, not that what is turned off would
be correct if turned on.
"""
owner = "proxy.online_ocsp_reachability"
review_requirement = "Owner security-specification review"
supported_by = ["unit://proxy.online_ocsp_reachability"]
depends_on = []

# ---------------------------------------------------------------------------
# The verifier's result claims — ADR-MCPRE-061 §12, MCPRE-136
# ---------------------------------------------------------------------------
#
# Seven claims over one unit, one per public verifier operation. MCPRE-136 was written
# when the verifier returned two product types and asked for two composition theorems;
# after #570/#571 there are seven deliberately different propositions, and collapsing them
# into two buckets would flatten exactly the graph the type split created.
#
# Two things are deliberately true of every entry below.
#
# **They are claims about a SUCCESSFUL RETURN, not about possession of a Rust value.** Both
# product modules record that their fields stay `pub` because a Verus-proved postcondition
# outranks a seal, so nothing prevents a caller from assembling a product by hand. The type
# split proves NON-SUBSTITUTABILITY between assurance levels; it does not prove provenance.
# Every scope sentence says so, and it is not boilerplate — it is the exact boundary that
# trade created.
#
# **They rest on tests, and the statements are bounded by what those tests reach.** The unit
# is class V0: the prover reaches `check_params`, not the operations that call it. Where a
# conjunct IS proved, the claim depends on the theorem that proves it rather than restating
# it here.
#
# The dependency graph mirrors the type graph:
#
#   request floor ────────────────> full request
#   bound response floor ─────────> full bound response ──> delegated bound response
#   unbound response floor ───────────────────────────────> delegated unbound response
#
# `http_profile.verifier_result_separation` supports NONE of them. Its controls establish
# that the products are not interchangeable, which is a different proposition from what any
# successful return establishes; recording the absent edge is the honest outcome, as it was
# for `http_profile.keyid`.

[[theorem]]
id = "THM-0014"
title = "A successful request-floor verification establishes the cryptographic floor"
statement = """
If `Verifier::verify_request_floor` returns Ok, then for the request supplied: the covered
`Content-Digest` agreed with the body, the RFC 9421 signature verified over the
reconstructed signature base under an algorithm the verifier's policy accepts, the
signature parameters were admitted as current, and the presented keyid was resolved through
the trust seam for the Request slot.
"""
security_consequence = """
An attacker cannot obtain a floor-verified request by tampering with the body, by
presenting a signature under an algorithm the deployment does not accept, by replaying
expired parameters, or by presenting a key the seam vouches for only in the Response slot.
"""
scope = """
This theorem characterizes values successfully returned by `verify_request_floor`. It does
not establish that an arbitrary externally constructed `CryptographicFloorVerifiedRequest`
was produced by that operation.

It establishes NOTHING about audience or target equality, artifact binding, replay,
admission, continuation semantics, or dispatch authorization: those are the full-profile
and dispatch claims. It says the seam ANSWERED for the Request slot, not that the
deployment was right to trust that actor (ASM-0029). It rests on a test battery, not on a
postcondition over this operation.
"""
owner = "http_profile.verifier_results"
review_requirement = "Owner security-specification review"
supported_by = [
  "unit://http_profile.verifier_results",
  "unit://http_profile.freshness_window",
]
depends_on = ["THM-0001"]

[[theorem]]
id = "THM-0015"
title = "A successful full-profile request verification establishes audience and artifact binding"
statement = """
If `Verifier::verify_request` returns Ok, then the request-floor proposition holds for the
same request, and in addition: the request evidence block parsed and validated under the
profile tag, its audience tuple equalled the verifier's own and agreed with the request's
`@target-uri`, and every artifact binding the block declared was resolved to credential
material and verified.
"""
security_consequence = """
A request signed for a different audience, route or target cannot be admitted at this
boundary, and a declared artifact binding cannot be skipped by withholding the material it
commits to — an unobtainable credential fails closed rather than being ignored.
"""
scope = """
This theorem characterizes values successfully returned by `verify_request`. It does not
establish that an arbitrary externally constructed `VerifiedMcpRequest` was produced by
that operation.

It establishes nothing about replay admission, admission-assertion currency, continuation
binding or dispatch authorization; a full-profile request is not an admitted one. It does
not establish that the artifact material the caller supplied is the credential the peer
actually holds — only that the binding verified against what was supplied.
"""
owner = "http_profile.verifier_results"
review_requirement = "Owner security-specification review"
supported_by = [
  "unit://http_profile.verifier_results",
  "unit://http_profile.artifact_typing",
]
depends_on = ["THM-0014", "THM-0007", "THM-0008"]

[[theorem]]
id = "THM-0016"
title = "A successful bound response-floor verification establishes binding to the supplied request"
statement = """
If `Verifier::verify_bound_response_floor` returns Ok, then for the response supplied: the
covered `Content-Digest` agreed with the body, the signature parameters were admitted as
current, the presented keyid was resolved through the trust seam for the Response slot, and
the RFC 9421 signature verified over a base whose `;req` components were resolved against
the concrete request supplied to the call.
"""
security_consequence = """
A response signed for a different request cannot be presented as the answer to this one:
splicing changes the signature base, so no valid signature covers it.
"""
scope = """
This theorem characterizes values successfully returned by `verify_bound_response_floor`.
It does not establish that an arbitrary externally constructed
`CryptographicFloorVerifiedBoundResponse` was produced by that operation.

It says the response is bound to the request the CALLER SUPPLIED. It establishes nothing
about that request — not that it was authenticated, not that it was full-profile verified,
not that it is the request this peer sent. It reads no response evidence block, so it
establishes no `server_signer` correspondence and no request-evidence comparison.
"""
owner = "http_profile.verifier_results"
review_requirement = "Owner security-specification review"
supported_by = [
  "unit://http_profile.verifier_results",
  "unit://http_profile.freshness_window",
]
depends_on = ["THM-0001"]

[[theorem]]
id = "THM-0017"
title = "A successful unbound response-floor verification establishes no request binding at all"
statement = """
If `Verifier::verify_unbound_response_floor` returns Ok, then for the response supplied:
the covered `Content-Digest` agreed with the body, the signature parameters were admitted
as current, the presented keyid was resolved through the trust seam for the Response slot,
and the signature verified over a base covering ONLY response components — a `;req`
component is refused as malformed, because no request exists to resolve it against.
"""
security_consequence = """
A receipt emitted before a request could be parsed can still be attributed to a trusted
server signer, and it cannot smuggle in a request binding: a `;req` component makes the
message malformed rather than admitting an unresolvable reference.
"""
scope = """
This theorem characterizes values successfully returned by
`verify_unbound_response_floor`. It does not establish that an arbitrary externally
constructed `CryptographicFloorVerifiedUnboundResponse` was produced by that operation.

It establishes NO relationship to any request, and must never be read as a weaker form of
THM-0016. A caller that needs an answer to a specific request gets nothing from this claim.
Any `request_evidence` the response body carries is diagnostic and is outside this claim
entirely. It reads no response evidence block.
"""
owner = "http_profile.verifier_results"
review_requirement = "Owner security-specification review"
supported_by = [
  "unit://http_profile.verifier_results",
  "unit://http_profile.freshness_window",
]
depends_on = ["THM-0001"]

[[theorem]]
id = "THM-0018"
title = "A successful full bound response verification establishes block agreement with the expected handle"
statement = """
If `Verifier::verify_bound_response` returns Ok, then the bound response-floor proposition
holds for the same response and request, and in addition: the response evidence block
parsed and validated under the profile tag, the `server_signer` identity it declared is the
identity the signature was accepted under, and the `request_evidence` handle it carried
equals the handle supplied by the caller.
"""
security_consequence = """
A response cannot declare a server signer it did not sign as, and cannot claim to answer a
request whose evidence handle differs from the one the caller is holding — a semantic
check on top of the cryptographic `;req` binding, reported as its own refusal.
"""
scope = """
This theorem characterizes values successfully returned by `verify_bound_response`. It does
not establish that an arbitrary externally constructed `VerifiedMcpResponse` was produced
by that operation.

It establishes nothing about the PROVENANCE of the expected handle: the caller supplies it,
and a caller that supplies a handle from the wrong exchange gets a verified response bound
to the wrong request. It makes no delegation claim — the signer was resolved through the
trust seam, and whether a credential chain authorized it is THM-0019.
"""
owner = "http_profile.verifier_results"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.verifier_results"]
depends_on = ["THM-0016"]

[[theorem]]
id = "THM-0019"
title = "A successful delegated bound response verification establishes an accepted credential chain"
statement = """
If `Verifier::verify_delegated_bound_response` returns Ok, then the full bound response
proposition holds for the same response and request, and in addition: the response carried
an inline delegation credential, that credential verified as a chain to a root issuer key
the trust seam resolved for the Response slot, the credential was accepted under the
supplied expectations, the response signature verified under the credential's confirmed
key, and the keyid the signature was accepted under is the delegated kid the credential and
the block both name.
"""
security_consequence = """
A response signed directly by the root, or by a key with no chain to a trusted issuer,
cannot be accepted where delegation is required; and a credential cannot be lifted onto a
response signed by a different key, because the delegated kid must match on three sides.
"""
scope = """
This theorem characterizes values successfully returned by
`verify_delegated_bound_response`. It does not establish that an arbitrary externally
constructed `VerifiedDelegatedMcpResponse` was produced by that operation.

The expectations are SUPPLIED, not proved current or sane by this unit: the accepted epoch
set, the verifier audiences, the expected audience-scope hash and the credential clock-skew
tolerance all come from the caller, and this claim says the credential satisfied them, not
that they were the right ones. Revocation is likewise a caller-supplied predicate. It
establishes nothing about the provenance of the expected request-evidence handle (THM-0018).
"""
owner = "http_profile.verifier_results"
review_requirement = "Owner security-specification review"
supported_by = ["unit://http_profile.verifier_results"]
depends_on = ["THM-0018"]

[[theorem]]
id = "THM-0020"
title = "A successful delegated unbound response verification establishes a chain and never a binding"
statement = """
If `Verifier::verify_delegated_unbound_response` returns Ok, then the unbound response-floor
proposition holds for the same response, and in addition: the response carried an inline
delegation credential which verified as a chain to a root issuer key the trust seam resolved
