]
owner = "mats@sundvall.name"
introduced_by = "ADR-MCPRE-059 WP3"
review_requirement = "Owner review; discharge requires crossing boundary.crypto_primitives with a proof about the digest construction."
affected_contracts = ["contract://http_profile/block/continuation_verify"]
tool_specific_mechanism = "verus:uninterp"

