A compatibility constraint MCP-RE relies on, not a proved cryptographic property: nothing
here establishes that the representation is canonical, only that changing it inside the
present version would break every manifest already distributed to released clients. The
replacement (compact JWS over the received bytes), its version boundary and cutover, its
