[[assumption]]
id = "ASM-0053"
description = "The shared object named by `--pkcs11-module` is a trustworthy Cryptoki implementation."
justification = """
`Pkcs11Context::load_and_initialize` maps that file into the proxy's address space and runs
its initializers, after which it holds the User PIN, every object handle, the
response-signing capability over arbitrary bytes and the delegated TLS handshake signer. The
filesystem floor added in this round (`config_state::key_file_access::executable_path_violation`)
bounds WHO may write the file: it refuses a group- or world-writable module, or any
group/world-writable ancestor directory, before the `dlopen`. It does not and cannot bound
what the module DOES once mapped.

So the residual premise is trust in the implementation itself, and it belongs to the
operator who names it. It is acceptable because naming a module is an explicit deployment
act under a non-default feature. It stops being acceptable if a module path is ever derived
from anything but operator configuration.
"""
