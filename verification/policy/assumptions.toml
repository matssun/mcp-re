# ---------------------------------------------------------------------------
# WP2 — unit://http_profile.admission_currency
# ---------------------------------------------------------------------------

[[assumption]]
id = "ASM-0011"
description = "`AdmissionBinding::matches_state` decides whether this binding commits to a given admitted-state digest."
justification = """
Below `boundary.crypto_primitives`. What the predicate MEANS is a statement about SHA-256
preimages, which this profile trusts by declaration rather than proves. The currency
theorem is deliberately independent of it: the binding-to-assertion commitment is a
separate property, and stating an `ensures` here would import a hash claim into a theorem
that does not need one. Taken as an opaque decision procedure — its refusal path is still
on the theorem's control flow, its verdict simply carries no meaning.
"""
scope = ["unit://http_profile.admission_currency"]
owner = "mats@sundvall.name"
introduced_by = "ADR-MCPRE-059 WP2"
review_requirement = "Owner review; MUST be discharged before any theorem claiming the binding commits to the assertion's admitted state."
affected_contracts = ["contract://http_profile/admission/check_admission"]
tool_specific_mechanism = "verus:external_body"

[[assumption]]
id = "ASM-0012"
description = "`verify_admission_assertion` is opaque to the currency theorem, and contributes NO postcondition to it."
justification = """
The strongest form this assumption can take: no `ensures` at all. The §7 currency property
is established entirely by `check_admission`'s own comparisons against the authoritative
state, so the JWS verifier below it may return anything and the theorem still holds. This
is the point the dependency-cone rule (Operational Rule 17) makes concrete — the trusted
frontier of this theorem does not include signature verification, JSON decoding, base64,
Ed25519, or the assertion's own freshness window, even though the proved function calls
all of them.

An assumption WITHOUT an ensures cannot weaken the theorem it sits under; it can only
limit what that theorem says. What it costs is stated plainly: `check_admission` returning
`Ok` does NOT, by this proof, mean the assertion was validly signed or fresh. Those remain
test-and-review properties until their own unit exists.
"""
scope = ["unit://http_profile.admission_currency"]
owner = "mats@sundvall.name"
introduced_by = "ADR-MCPRE-059 WP2"
review_requirement = "Owner review; a separate unit for assertion validity is the discharge, not an ensures added here."
affected_contracts = ["contract://http_profile/admission/check_admission"]
tool_specific_mechanism = "verus:external_body"

[[assumption]]
id = "ASM-0013"
description = "`mcp_re_core::VerificationKey` is an opaque datatype; no theorem reads it."
justification = """
Nameability, not meaning. The trust seam is an `impl Fn(&str) -> Option<VerificationKey>`
closure parameter, and the pinned prover ICEs (`sst_to_air.rs:510`, unwrap on None) rather
than diagnosing a closure whose signature mentions a type it has no specification for.
Declaring the type opaque is what makes the parameter modellable; nothing is assumed about
keys, and no clause of the theorem mentions one.
"""
scope = ["unit://http_profile.admission_currency"]
owner = "mats@sundvall.name"
introduced_by = "ADR-MCPRE-059 WP2"
review_requirement = "Owner review; revisit if a theorem ever needs to say something about a key."
affected_contracts = ["contract://http_profile/admission/check_admission"]
tool_specific_mechanism = "verus:external_type_specification"

[[assumption]]
id = "ASM-0014"
description = "`#[derive(PartialEq)]` on the fieldless enum `AdmissionStatus` is structural equality."
justification = """
Trusted against rustc's derive expansion rather than against a hand-written impl, and it
is load-bearing: without it, `status != Admitted` is an opaque boolean and the theorem
cannot see that the paths returning `Ok` are the admitted ones. The risk it carries is
narrow and checkable by reading three lines of the enum — that a hand-written `PartialEq`
was substituted for the derive, which the type's own definition forbids by carrying
`#[derive(PartialEq, Eq)]`.
"""
scope = ["unit://http_profile.admission_currency"]
owner = "mats@sundvall.name"
introduced_by = "ADR-MCPRE-059 WP2"
review_requirement = "Owner review; re-examine if AdmissionStatus ever gains a hand-written PartialEq or a payload-carrying variant."
affected_contracts = ["contract://http_profile/admission/check_admission"]
tool_specific_mechanism = "verus:assume_specification"

