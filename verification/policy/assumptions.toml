# SPDX-License-Identifier: Apache-2.0
#
# ADR-MCPRE-059 §12 — the trusted-assumption registry.
#
# Every intentional trusted assumption introduced by the MCP-RE verification layer is
# recorded here, with a stable identifier. There is no second ledger and no hidden one.
#
# A proof that is green because of an unregistered `assume`, `admit`, `axiom`,
# `external_body`, `external`, `assume_specification`, or trusted wrapper is NOT valid
# MCP-RE evidence, and `tools/verification/check-assumptions` fails the merge gate when it
# finds one (§13, Case D).
#
# A temporary assumption used while developing a proof MUST NOT reach the merge or release
# gate unless it has been deliberately registered here and owner-ratified as part of the
# trusted computing base. "I will remove it later" is not a registration.

schema_version = 1

# Required fields on every entry:
#
#   id                       stable, never reused: ASM-NNNN
#   description              what is being trusted
#   justification            why trusting it is acceptable, and what would change that
#   scope                    unit:// identifiers this assumption is trusted within
#   owner                    who ratified it
#   introduced_by            commit or issue
#   review_requirement       who must review a change to it
#   affected_contracts       contract:// identifiers whose meaning depends on it
#   tool_specific_mechanism  e.g. verus:external_body, lean:external-model
#
# The registry is intentionally EMPTY.
#
# ADR-MCPRE-059's illustrative ASM-0001 is an example in the ADR text, not a starter row:
# "No real assumption should be introduced merely to populate the file." An empty registry
# is the honest state before any proof exists, and it is the state the first pilot must
# either preserve or deliberately depart from with a real entry.
#
# The Phase 3 pilot is expected to need exactly one — SHA-256 collision resistance, as an
# external model — and producing that single, justified, visible entry is part of what the
# pilot is demonstrating.

# ---------------------------------------------------------------------------
# Phase 2 — the Verus pilot's trusted computing base
# ---------------------------------------------------------------------------
#
# Four entries, each one a place where the pilot stopped proving. Three exist because
# vstd does not specify a `std` item the production code calls; one exists because
# attribute-style Verus cannot state a loop invariant, and moving to a `verus!{}` block
# would put the prover's crates in the production dependency graph — a cost the owner
# ruled out. None of them is a workaround for a proof that failed.

[[assumption]]
id = "ASM-0001"
description = "`parse_fixed_digits` returns at most a 4-digit value: n ASCII digits cannot denote more than n digits."
justification = """
Verus verifies the caller against this contract but does not check the body, because a
loop invariant over the iteration count cannot be expressed in the attribute-style
annotations this crate uses, and the `verus!{}` block that could express it would make
vstd a production dependency of a crate whose manifest purity is itself a control
(ADR-MCPS-011/012). The bound is exercised by the module's own tests at every width the
parser uses. It stops being acceptable if `parse_fixed_digits` is ever called with n > 4,
which its precondition refuses, or if attribute-style loop invariants become available —
at which point this entry should be discharged rather than renewed.
"""
scope = ["unit://core.time_rfc3339"]
owner = "mats@sundvall.name"
introduced_by = "ADR-MCPRE-059 Phase 2 pilot"
review_requirement = "Owner review; any change to parse_fixed_digits or its callers."
affected_contracts = ["contract://core/time/parse_rfc3339_utc"]
tool_specific_mechanism = "verus:external_body"

[[assumption]]
id = "ASM-0002"
description = "`u8::is_ascii_digit` is true exactly on 0x30..=0x39."
justification = """
The Rust standard library's documented behaviour, which vstd does not currently specify.
A wrong specification here would let a non-digit byte through the parser's digit test, so
it is stated as the exact code-point range rather than as an opaque boolean.
"""
scope = ["unit://core.time_rfc3339"]
owner = "mats@sundvall.name"
introduced_by = "ADR-MCPRE-059 Phase 2 pilot"
review_requirement = "Owner review; discharge if vstd gains a specification for it."
affected_contracts = ["contract://core/time/parse_rfc3339_utc"]
tool_specific_mechanism = "verus:assume_specification"

[[assumption]]
id = "ASM-0003"
description = "`<[T]>::split_last` terminates and returns."
justification = """
Totality only. The proofs use split_last for control flow and claim nothing about what it
returns, so no theorem here could be weakened by a wrong specification of its value.
"""
scope = ["unit://core.time_rfc3339"]
owner = "mats@sundvall.name"
introduced_by = "ADR-MCPRE-059 Phase 2 pilot"
review_requirement = "Owner review; strengthen if a proof ever depends on its result."
affected_contracts = ["contract://core/time/parse_rfc3339_utc"]
tool_specific_mechanism = "verus:assume_specification"

[[assumption]]
id = "ASM-0004"
description = "`McpReError` is nameable in a specification as a plain datatype, without verifying its derived Display impl."
justification = """
Registered for visibility rather than because a theorem rests on it: the specifications
mention which error a refusal returns, and the `thiserror`-derived formatting travels with
