# ---------------------------------------------------------------------------
# The freshness-gate unit's trusted computing base
# ---------------------------------------------------------------------------

[[assumption]]
id = "ASM-0005"
description = "`i64::saturating_sub` clamps at i64::MIN rather than wrapping."
justification = """
The standard library's documented behaviour. vstd specifies the unsigned forms only. The
clamp is load-bearing for the freshness theorem: it is what makes `created - skew` safe to
compare against `now` at the extremes, and a wrapping implementation would let a crafted
`created` near i64::MIN wrap past the comparison. Stated as the exact clamp rather than as
an opaque result so a wrong specification would be visible rather than convenient.
"""
scope = ["unit://http_profile.freshness_window"]
owner = "mats@sundvall.name"
introduced_by = "ADR-MCPRE-059 Phase 2 pilot"
review_requirement = "Owner review; discharge if vstd gains signed saturating specifications."
affected_contracts = ["contract://http_profile/verify/check_params"]
tool_specific_mechanism = "verus:assume_specification"

[[assumption]]
