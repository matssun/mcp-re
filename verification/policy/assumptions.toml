# ---------------------------------------------------------------------------
# The verifier's result claims — ADR-MCPRE-061 §12, MCPRE-136
# ---------------------------------------------------------------------------
#
# The three above are `verus:` mechanisms: things the prover is told to treat as opaque.
# The three below are of a different KIND. `http_profile.verifier_results` is class V0 —
# its claims rest on a test battery, not on an `ensures` — so what it must declare is not
# what the prover cannot see but what NO amount of testing could establish: the primitives
# and the seam the claims quantify over.
#
# They were unregistered before this entry. Every one of the seven verifier-result claims
# is false without them, and a claim whose premises are unnamed reads as stronger than it
# is.

[[assumption]]
id = "ASM-0027"
description = "Ed25519 verification accepts a signature over a message only if it was produced under the private key corresponding to the verification key supplied."
justification = """
The security of the signature scheme itself, as implemented by the pinned `ed25519-dalek`
and reached through `mcp_re_core::verify_ed25519_with`. No test can establish it: a battery
shows that valid signatures verify and that specific invalid ones do not, which is
conformance, not unforgeability. Stated so that every "the signature verified" conjunct in
the verifier-result claims has a named premise instead of an implied one. It stops being
acceptable if the algorithm is broken, or if the crate is replaced by an implementation
whose acceptance criterion is not the scheme's.
"""
scope = ["unit://http_profile.verifier_results"]
owner = "mats@sundvall.name"
introduced_by = "ADR-MCPRE-061 MCPRE-136"
review_requirement = "Owner review; any change of signature backend or pinned version."
affected_contracts = []
# Not a prover directive. No tool enforces this, and naming a `verus:` mechanism it does
# not use would misrepresent where the trust sits.
tool_specific_mechanism = "none:trusted-primitive"

[[assumption]]
id = "ASM-0028"
description = "SHA-256 is second-preimage resistant over the byte strings this profile digests, so digest agreement implies byte agreement."
justification = """
Content-digest binding and the evidence handles both reduce a message to a digest and then
compare digests. Every claim of the form "this response is bound to that request" is a
claim about digests, and becomes a claim about bytes only under this assumption. ASM-0023
and ASM-0024 state the LABELLED digest's shape for the prover; this states the property the
labelling is built on, for the claims the prover does not reach. It stops being acceptable
if SHA-256 is broken for second preimages, or if a profile revision digests attacker-chosen
structure without a domain separator.
"""
scope = ["unit://http_profile.verifier_results"]
owner = "mats@sundvall.name"
introduced_by = "ADR-MCPRE-061 MCPRE-136"
review_requirement = "Owner review; any change to the evidence digest algorithm or its labelling."
affected_contracts = []
tool_specific_mechanism = "none:trusted-primitive"

[[assumption]]
id = "ASM-0029"
description = "The trust seam answers its SELECTOR correctly: for a queried (keyid, slot), the `ResolvedActor` it returns carries the identity and verification key this deployment has authorized to sign under that keyid in that slot."
justification = """
The premise is about the SELECTOR, not about the seam being well-behaved in general, because
that is what the conjuncts need. `resolve_actor_for_slot` checks the returned actor's
`slot` against the slot it asked for, and the battery exercises a resolver that answers for
the wrong one; nothing in this unit can check the other two coordinates. Whether the
returned VERIFICATION KEY is the key the deployment authorized for that keyid, and whether
the returned IDENTITY is the identity that keyid denotes, are answers this unit consumes and
cannot audit — and a seam that returned an attacker's key for a legitimate keyid would
satisfy every check here.

`resolve_actor` is an injected closure and `ResolvedActor` is deliberately NOT sealed —
every in-process and test resolver is a legitimate producer, which
`docs/dev/sealed-owners.md` records as measured rather than assumed. So "the presented
keyid was resolved through the trust seam for the Response slot" is a claim about what the
seam answered for that selector, under this premise, and never a claim that the deployment
was right to trust the actor. It stops being acceptable if a deployment installs a resolver
whose answers are not its trust decision — which is what the trust plane exists to prevent,
one layer out.

The delegated claims consume it at a DIFFERENT selector: there the seam is queried for the
credential's root issuer kid, and the signing key is authorized by the credential chain
rather than by any seam answer. The premise is the same one; the keyid it is applied to is
not.
"""
scope = ["unit://http_profile.verifier_results"]
owner = "mats@sundvall.name"
introduced_by = "ADR-MCPRE-061 MCPRE-136"
review_requirement = "Owner review; any change to the seam's contract or to slot enforcement."
affected_contracts = []
tool_specific_mechanism = "none:trusted-seam"
