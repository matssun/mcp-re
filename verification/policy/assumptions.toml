justification = """
The security of the signature scheme itself, as implemented by the pinned `p256` and `ecdsa`
crates. No test can establish it: a battery shows that valid signatures verify and that
specific invalid ones do not, which is conformance, not unforgeability. The `P256Point` seal
in `cose_key/mod.rs` rests on the SEC1 decode refusing off-curve encodings. Mirrors ASM-0027
for the ES256 verifier. This is unforgeability, NOT signature uniqueness: a high-S pair
(r, n - s) also verifies, so receipt octets are not unique. It stops being acceptable if the
curve or scheme is broken, or if the crate is replaced by one whose acceptance criterion
differs.
"""
