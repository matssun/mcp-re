[[assumption]]
id = "ASM-0068"
description = "`getrandom` over the host CSPRNG returns `Err` or unpredictable bytes."
justification = """
Two units rest their secrecy on bytes drawn from the operating system. The request nonce
`host.request_freshness_inputs` produces is drawn by `SystemNonceSource::fill`, and replay
freshness is worth what that nonce's unpredictability is worth: a nonce an attacker can predict
is a request it can pre-sign a replay slot for. The delegated response-signing key
`proxy.delegated_signing_credential` mints on every rotation is seeded by `getrandom::fill` in
`delegated_wiring.rs`, and a predictable seed is a published private key. Both sites abort on
`Err` rather than continue with the zeroed buffer, and `host.request_freshness_inputs` measures
that every byte of a nonce is written; no measurement can say anything about whether the bytes
that came back were unpredictable. Nothing in this repository can: the property belongs to the
host's entropy source.

So the premise is exactly the split `getrandom` itself draws. An unavailable source is
reported, and every site handles that report; a source that answers with predictable bytes
is not distinguishable from a good one by any test, and that is the case this entry
registers. It is an environment premise and not a cryptographic one: the algorithms consuming
the bytes are `boundary.crypto_primitives`' premises, and this states only what they are fed.

`boundary.os_entropy` names six direct OS-entropy acquisition sites. Of those, three are not
relied upon by any verification unit in this scope: the rotation-backoff jitter in
`signing_plane/mod.rs`, which falls back to no jitter on `Err`; the OCSP request nonce in
`ocsp.rs`, which belongs to no unit; and the audit stream run identity in
`audit_sink/stream.rs`, which refuses startup on `Err` and is used to distinguish process
incarnations rather than as a secret or authorization token. No unit in this scope rests on any
of those three sites. The trust-epoch advance generation in `trust_epoch/advance.rs` refuses the
advance on `Err` and is relied upon by `proxy.delegated_epoch_label` to distinguish a fresh
authoritative advance from a previously observed epoch state; its purpose is freshness/collision
resistance, not secrecy.

It stops being acceptable if `getrandom` is configured with a backend other than the host OS
CSPRNG, if a site starts continuing with a buffer it did not fill after an `Err`, or if a host
class is admitted whose CSPRNG can answer before it is seeded.
"""
scope = [
  "unit://host.request_freshness_inputs",
  "unit://proxy.delegated_signing_credential",
  "unit://proxy.delegated_epoch_label",
  "boundary://boundary.os_entropy",
]
owner = "mats@sundvall.name"
introduced_by = "owner-signature:tcb-os-entropy-premise (r12, fb18b3b14dc7bf01, b243d21bc1720a78)"
review_requirement = "Owner review; any change of `getrandom` backend or version, and any new production acquisition site of OS entropy."
premise_class = "external-boundary"
boundary_owner = """
The HOST OPERATING SYSTEM's CSPRNG, reached through the pinned `getrandom` crate's `fill`: every
call either returns `Err` or fills the whole buffer with bytes unpredictable to every party other
than this process.
"""
affected_contracts = []
tool_specific_mechanism = "foreign-dependency"

[[assumption]]
id = "ASM-0069"
description = "The wall-clock `now` handed to the delegated-credential chain check is the verifying party's current UTC time, to within the deployment's configured skew of the issuer's clock."
justification = """
`http_profile.delegated_credential_chain` admits a credential only inside its own `nbf`/`exp`
window, widened by the clamped skew (`check_freshness`). The chain holds no clock: `now` is an
argument to every verifier operation, supplied by whoever verifies the response — the client
proxy's verification clock, an SDK caller, or, for a retained exchange, the instant at which
the exchange was retained. So the conclusion *this credential is inside its window* is a
conclusion about the instant the chain was GIVEN, and it is a conclusion about the present only
if that value is the present. Nothing in this repository can establish that: the reading comes
from a host clock disciplined by whatever the verifying party runs.

This is the per-unit counterpart of ASM-0057 and does not widen it. ASM-0057 states what the
serving path hands the request-side verifier operations, scoped to `http_profile.freshness_window`
and `http_profile.admission_currency`; the delegated chain is a response-side check fed by a
different party's clock, and widening an owner-reviewed premise to a consumer it was not written
for would reopen its review for the units it already serves.

A clock that steps backwards re-admits a credential whose `exp` has passed, and one that steps
forwards refuses a credential that is current; both are the same failure of this premise and
neither is detectable from one response. The skew clamp bounds how far a misconfigured
TOLERANCE can widen the window; it says nothing about a wrong READING.

It stops being acceptable if the chain is ever handed a value that is not an acquisition of the
verifying host's wall clock (or, for a retained exchange, the instant recorded when it was
retained), or if the chain gains a clock of its own.
"""
scope = [
  "unit://http_profile.delegated_credential_chain",
  "boundary://boundary.clock",
]
owner = "mats@sundvall.name"
introduced_by = "owner-signature:tcb-os-entropy-premise (r12, b243d21bc1720a78, clock half)"
review_requirement = "Owner review if the delegated-credential window is judged against any value other than the verifying party's wall-clock reading, or if the chain gains a clock of its own."
premise_class = "external-boundary"
boundary_owner = """
The operator of the VERIFYING host's clock discipline (NTP or equivalent), across the wall-clock
acquisition that supplies `now` to a delegated-response verification: the reading is the current
UTC time to within the configured skew of the issuer's clock.
"""
affected_contracts = []
sites = [
  "mcp-re-http-profile/src/delegation/verify.rs#check_freshness",
]
tool_specific_mechanism = "none:trusted-seam"

[[assumption]]
id = "ASM-0070"
description = "rustls' `WebPkiServerVerifier`, built over only the configured server-CA roots, completes a client handshake only for a server certificate that chains to one of those roots, names the server identity the connection was opened for, and is inside its validity window at the handshake, presented by a server that proved possession of that certificate's private key."
justification = """
THM-0109 says the client transport never sends a request body to a server it did not
authenticate, and three of its four conjuncts — chain of trust, server identity, validity
window — are decided inside rustls, not in this repository. `tls_config.rs` selects the
mechanism (the standard `WebPkiServerVerifier`, over a `RootCertStore` holding ONLY the
configured server CA, with the connection's `server_name` as the identity to match) and
refuses an empty bundle; that refusal is the one conjunct this repository decides. Everything
else the claim says about a handshake that completed is a faithful report of what rustls and
webpki checked, and the unit's controls drive real handshakes against real certificates
precisely because a stand-in verifier would establish nothing about the real one.

It is the client-side counterpart of the server-side premises ASM-0033..ASM-0036 and is
registered per unit rather than by widening any of them: those are about what the proxy's
listener reports about a CLIENT credential, and none of their consumers is this one.

The possession half is what makes "authenticated" mean more than "presented": on a full
handshake the server signs the transcript with the certificate's key and rustls rejects a
signature that does not verify. Without it a copied certificate would complete the handshake
under a true-sounding sentence.

Not proved here: a TLS implementation and its path validation are a far larger verification
target than the configuration selecting them. The fault-injection lane demonstrates that the
controls fail when the verifier is replaced by an accept-any one; it establishes nothing about
whether the verifier that IS installed checks what it says it checks.

It stops being acceptable if the client config installs any verifier other than
`WebPkiServerVerifier` in a production build, if the root store is ever populated from
anything but the configured server-CA bundle, or if the pinned rustls or webpki version
changes what path validation, name matching or validity checking accepts.
"""
scope = [
  "unit://client.transport_server_identity",
  "boundary://boundary.tls_mechanism",
]
owner = "mats@sundvall.name"
introduced_by = "owner-signature:asm-client-transport-webpki-verifier-premise (r12, a01feb270113496e)"
review_requirement = "Owner review; any change to the client transport's server verifier, its root store, or the pinned rustls/webpki version."
premise_class = "external-boundary"
boundary_owner = """
The `rustls` TLS client and its webpki path validation, across `WebPkiServerVerifier` as built in
`mcp-re-transport/src/tls_config.rs`: a handshake completes only for a server certificate that
chains to a configured root, matches the connection's `server_name`, is within its validity
window, and is presented by a server holding its private key.
"""
affected_contracts = []
tool_specific_mechanism = "foreign-dependency"

[[assumption]]
id = "ASM-0071"
description = "A read of the trust-epoch key and its generation over the delegated-signing plane's own connection, issued after an operator's `mcp-re-proxy trust-epoch advance` on that key was acknowledged, returns a counter and generation different, as a pair, from every pair that plane read before the advance."
justification = """
The sibling of ASM-0044, for the consumer ASM-0044 excludes by name. `DelegatedEpochWatch` reads
the same shared counter over its own connection and mints under `<base>#<counter>` for whatever
the read returned (THM-0133), and the plane tells the operator at startup that
`mcp-re-proxy trust-epoch advance` moves every replica to the next label. That sentence is
THM-0133 composed with this premise: the advance — the incremented counter and a fresh generation,
committed in one server-side step — is issued on a connection this replica does not hold, and what a later `GET` on the plane's
connection returns is decided by the store's replication and routing, not by anything here.

Narrow on purpose, exactly as ASM-0044 is: not "Redis is correct", not durability of the counter,
not ordering between replicas, and not that every replica observes the advance at the same time
— only that an acknowledged write becomes visible to a subsequent read on another connection. A
read that returns the OLD value is the case excluded here, and the one that would keep this
replica minting under a label the operator meant to retire. A read that FAILS, or returns a LOWER
value, is outside the premise and handled locally: no label, so nothing is minted.

It is a separate entry rather than a widening of ASM-0044 because the two consumers make
different local decisions with the value — a flush there, a refusal here — and a premise about
what one plane's read means must not be read as an ordering between the two planes'
observations, which nothing in the tree establishes.

It stops being acceptable if the epoch key is served from a read replica that can lag the
primary, if the deployment routes the plane's connection to a different primary than the
operator's, or if the key can be evicted or restored to an older value without that reading as
absence or regression at the reader.
"""
scope = ["unit://proxy.delegated_epoch_label", "boundary://boundary.shared_state_store"]
owner = "mats@sundvall.name"
introduced_by = "owner-signature:asm-delegated-epoch-label-store-premise (r12, 5fc98328eee54d1a)"
review_requirement = "Owner review; any change to the delegated plane's epoch reader, to the label it derives, or to the store topology the deployment documentation admits for the epoch key."
premise_class = "external-boundary"
boundary_owner = """
The shared-state store, across its read-your-acknowledged-writes ordering for the trust-epoch key
as the delegated-signing plane reads it, under the store topology the deployment documentation
admits for that key.
"""
affected_contracts = []
tool_specific_mechanism = "foreign-dependency"

[[assumption]]
id = "ASM-0072"
description = "For any two distinct request bodies a preflight receipt can be about, `content_digest_sha256` produces distinct SHA-256 digest values."
justification = """
`check_unbound_receipt_is_about_this_request` accepts a preflight receipt as being about this
call only when the `sha-256-received` digest the server signed into the receipt equals the
SHA-256 digest of the body this client sent. So `client.response_binding_disposition`'s *a
receipt about another request answers nothing* is conditional on two distinct bodies not
sharing that digest, and the unit registered no premise saying so. The comparison is exact
over the encoded digest; what it cannot do is make the DIGEST injective, and a claim may not
exceed its evidence closure.

It is the second-preimage property and no stronger, and the difference is the whole argument.
The adversary does not choose this client's request body: the client composes and sends it.
What an adversary can obtain is a receipt the server signed for bytes the adversary chose and
submitted, and to have it accepted here it needs those bytes to land on the digest of a body it
was handed. That is a second preimage of a value it did not choose. This premise is therefore
deliberately weaker than collision resistance (ASM-0037) and is a per-unit entry rather than a
widening of ASM-0028, whose scope the ADR-068 Phase-1 split narrowed to the six propositions that
conclude byte agreement from digest agreement on the profile side: widening an owner-reviewed
premise would reopen assumption review for all six consumers, and none of them is this one.

Nothing here may be read as MCP-RE having proved SHA-256's second-preimage resistance, and
colliding bodies exist because the digest is not injective. The claim is computational and
deployment-scoped. It is also a BYTE binding, which this premise does not strengthen: two
transmissions of identical bytes share the digest, and that residue is why the outcome stays
`bound: false`.

It stops being acceptable if the received digest moves to a digest without SHA-256's standing,
or if the request body becomes attacker-chosen before it is sent, which would need collision
resistance and not this.
"""
scope = [
  "unit://client.response_binding_disposition",
  "boundary://boundary.crypto_primitives",
]
owner = "mats@sundvall.name"
introduced_by = "owner-signature:asm-client-preflight-received-digest-premise (r12, 87ece9fc35fd3cf1)"
review_requirement = "Owner review; any change to the received-digest algorithm or to what it is computed over, and any change that lets the answering party choose the request body before it is sent."
premise_class = "assumed"
affected_contracts = []
tool_specific_mechanism = "none:trusted-primitive"
