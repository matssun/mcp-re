# ---------------------------------------------------------------------------
# WP2 — unit://http_profile.continuation_unbypassability
# ---------------------------------------------------------------------------

[[assumption]]
id = "ASM-0021"
description = "`ActorIdentity::actor_id` / `ResolvedActor::actor_id` are opaque; NO ensures."
justification = """
The canonical actor_id join is injective by construction (each field escaped before the
join), and that injectivity is a real property worth its own unit — it is a replay-key
component. It is not this theorem's property. The unbypassability theorem says nothing
about the key it builds, only about the continuation flag it returns alongside it, so the
seam contributes no postcondition and cannot weaken the result.

NOT DISCHARGED, and the reason is measured rather than assumed. Injectivity was attempted
and blocked by two observed ceilings under the pinned V1 toolchain, recorded with
reproducers in verification/baseline/wp2-http-profile-triage.md:

    ceiling 2   `format!` is unreachable — it expands through alloc::fmt::format and
                core::hint::must_use into unstable core::fmt::rt internals
    ceiling 9   `alloc::str::impl&%5::replace is not supported` — the escape step

Two alternatives were considered and REJECTED, both for the same reason: each would trade
one named assumption for a larger unnamed one, which is negative progress.

  * A broad trusted specification of the `format!` expansion. It would retire ASM-0021
    while introducing a trusted model of unstable formatting internals far bigger and less
    reviewable than the seam it replaced.
  * Rewriting the production join into a shape the pinned prover happens to handle.
    Rule 11 exists to prevent exactly this: the current construction is clear and correct,
    and no independent architectural argument asks for it to change. A prover's present
    capability is not a reason to distort production code.

Standing, therefore, and explicit — which is what an honest verification result looks like
when the security value of a claim and the prover's current reach do not coincide. Revisit
on a prover release that lifts either ceiling.
"""
scope = ["unit://http_profile.continuation_unbypassability"]
owner = "mats@sundvall.name"
introduced_by = "ADR-MCPRE-059 WP2"
review_requirement = "Owner review each release; discharge blocked by pinned-toolchain ceilings 2 and 9, not by choice."
affected_contracts = ["contract://http_profile/dispatch/prepare_http_dispatch"]
tool_specific_mechanism = "verus:external_body"

[[assumption]]
id = "ASM-0022"
description = "WITHDRAWN — discharged by unit://http_profile.continuation_binding."
justification = """
Was: `HttpContinuation::verify` opaque, no ensures, so continuation unbypassability was
proved without any claim that the check it cannot skip is the right check.

Discharged rather than retired: `verify` now carries a proved role-separation contract, and
`continuation_unbypassability` reaches it through a PROOF_DEPENDENCY edge instead of through
a trusted seam. The entry is kept, marked withdrawn, so the history of what the upper
theorem used to assume stays legible — an assumption that simply vanishes from the registry
leaves the earlier attestations unexplainable.
"""
scope = []
owner = "mats@sundvall.name"
introduced_by = "ADR-MCPRE-059 WP2"
review_requirement = "None — discharged by proof, ADR-MCPRE-059 WP3."
affected_contracts = []
tool_specific_mechanism = "none"

[[assumption]]
id = "ASM-0023"
description = "`RequestEvidenceDigest::matches_labeled` returning true means this handle's value IS the labeled digest of those bytes under that label."
justification = """
The replacement for ASM-0022, and deliberately much narrower: it constrains one three-line
comparator instead of leaving a twenty-line role-checking function meaningless.

What it does NOT assume is the important half. The digest is an UNINTERPRETED function of
`(label, bytes)` — nothing about SHA-256 is claimed, not collision resistance, not preimage
resistance, not even injectivity. Only functionality: the same label over the same bytes
gives the same value.

That is exactly enough to prove the binding DISCIPLINE — that each handle is checked under
its own required role label — and deliberately not enough to prove role SEPARATION, which
would need `label_a != label_b ==> digest(label_a, x) != digest(label_b, y)`. That is a
domain-separation property of the construction, it lives at
`boundary.crypto_primitives`, and no wording here should let it be read as proved.
"""
scope = ["unit://http_profile.continuation_binding"]
owner = "mats@sundvall.name"
introduced_by = "ADR-MCPRE-059 WP3"
review_requirement = "Owner review; discharge requires a proof about the digest construction itself, i.e. crossing boundary.crypto_primitives."
affected_contracts = ["contract://http_profile/block/continuation_verify"]
tool_specific_mechanism = "verus:external_body"

# --- Uninterpreted specification functions -----------------------------------
#
# `uninterp spec fn` is a trusted seam by construction: every theorem that mentions
# one holds for ALL interpretations, so the declaration itself assumes nothing beyond
# functionality — the same arguments give the same value. That is weaker than the
# `external_body` entries above, which pin a body's behaviour, and it is registered
# separately because the checker accounts for mechanisms per unit and these three are
# declared in `verus_std_specs.rs`, which every http_profile unit compiles.

[[assumption]]
id = "ASM-0024"
description = "`labeled_digest(label, bytes)` is a function of its arguments and nothing more."
justification = """
The declaration behind ASM-0023, stated where the checker can see it. Uninterpreted is
the entire content: nothing about SHA-256 is claimed — not collision resistance, not
preimage resistance, not injectivity. Only that the same label over the same bytes gives
the same value.

That is exactly enough to prove the binding DISCIPLINE (each handle is checked under its
own required role label) and deliberately not enough to prove role SEPARATION, which
needs `label_a != label_b ==> digest(label_a, x) != digest(label_b, y)`. That is a
domain-separation property of the construction and it stays at
`boundary.crypto_primitives`.
"""
scope = [
