[package]
name = "mcp-re-policy"
version = "0.16.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "MCP-RE authorization vocabulary: the frozen ADR-MCPS-013 denial taxonomy and the injected revocation seam. Pluggable Biscuit/UCAN/OAuth-bound mechanisms sit behind the ADR-MCPRE-065 boundary, not here."

[dependencies]
# ADR-MCPS-013. The authorization-denial vocabulary and the dormant revocation seam.
# Pure, and now dependency-free but for the error derive: the modules that read a JSON
# body and rendered a JSON-RPC envelope belonged to the `_meta` carrier ADR-MCPRE-050
# replaced, so serde and the Core primitives went with them. No networking/async.
thiserror = { workspace = true }

[lib]
name = "mcp_re_policy"
path = "src/lib.rs"

[lints]
workspace = true
