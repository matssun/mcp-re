# SPDX-License-Identifier: Apache-2.0
#
# The ALLOWED inner plane for the MCP-RE fleet (ADR-MCPRE-051 §3): a real MCP SDK
# Streamable-HTTP MCP backend that the proxy forwards verified requests to over
# `--inner-http-url`. This is the HTTP-profile replacement for the removed
# stdio-bridge sidecar. Point the proxy chart at it with:
#
#   helm upgrade ... --set 'inner.httpUrls={http://mcp-re-inner-fastmcp:8620/mcp/}'
#
# The port (8620) is the registry value config/ports.toml
# [services.mcp_re_inner_backend].port — keep the two in sync.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-re-inner-fastmcp
  labels:
    app.kubernetes.io/name: mcp-re-inner-fastmcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-re-inner-fastmcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-re-inner-fastmcp
    spec:
      # The inner backend is the component that EXECUTES tool code, and it is out of
      # the TCB by design — so it gets at least the hardening the proxy applies to
      # itself. It had none: root uid, no capability drop, no seccomp, no limits.
      #
      # No kube-apiserver credential either. Tool code executing here would otherwise
      # reach the cluster API as system:serviceaccount:<ns>:default with a token the
      # backend never uses, turning a compromised tool into whatever that account can
      # do.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fastmcp
          image: mcp-re-inner-fastmcp:0.16.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # A memory limit bounds the blast radius of tool code that allocates without
          # bound: without one the node's OOM killer picks a victim, which may be a
          # different pod.
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          env:
            - name: MCP_RE_INNER_BACKEND_HOST
              value: "0.0.0.0"
            - name: MCP_RE_INNER_BACKEND_PORT
              value: "8620"
            # DNS-rebinding protection stays ON; this names the hosts that are
            # legitimate in-cluster. The proxy reaches this backend by its Service DNS
            # name, which the SDK's default 127.0.0.1 allowlist refuses with 421 —
            # surfacing at the proxy as `mcp-re.upstream_response_invalid`.
            - name: MCP_RE_INNER_BACKEND_ALLOWED_HOSTS
              value: "mcp-re-inner-fastmcp:8620,mcp-re-inner-fastmcp,localhost:8620,127.0.0.1:8620"
          ports:
            - name: http
              containerPort: 8620
          # The SDK server's Python import + Uvicorn startup can take 30-60s on a cold
          # Autopilot node (node provisioning + first boot). Give the LIVENESS probe
          # a 60s initialDelay + headroom so it never SIGKILLs the container mid-boot
          # (that crashloops the pod until the node happens to warm up); readiness
          # keeps polling through the boot window without failing the rollout.
          readinessProbe:
            tcpSocket:
              port: 8620
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8620
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-re-inner-fastmcp
  labels:
    app.kubernetes.io/name: mcp-re-inner-fastmcp
spec:
  selector:
    app.kubernetes.io/name: mcp-re-inner-fastmcp
  ports:
    - name: http
      port: 8620
      targetPort: 8620
---
# The PEP's central claim is that an unauthorized request never reaches the inner
# server. Nothing in the inner backend enforces that: it listens on 0.0.0.0 and its
# ClusterIP Service is reachable by every pod in the cluster, so any workload with
# pod-network access could POST JSON-RPC straight to it — unsigned, unverified,
# unreplay-checked — and bypass the proxy entirely. The backend cannot defend itself
# (it is an unmodified MCP SDK server, out of the TCB by design), so the restriction
# has to be enforced by the network layer.
#
# This policy makes the proxy the ONLY admitted ingress. It selects the inner backend
# and allows ingress solely from the proxy workload.
#
# The `from` selector matches on `app.kubernetes.io/name` ALONE — deliberately, not for
# brevity. It previously also required `app.kubernetes.io/instance: mcp-re`, which is
# the HELM RELEASE NAME, and the release this repo actually installs is `mcp-re-proxy`.
# The selector therefore matched no pod at all, and a NetworkPolicy whose allow-rule
# matches nothing does not degrade to "allow" — it degrades to DENY EVERYTHING. On a
# CNI that enforces, the proxy could not reach the inner and every request failed with
# "inner server unavailable"; on one that does not, the same object silently protected
# nothing. Release names are a deployment choice; the workload identity is not, so the
# rule keys on the identity.
#
# EGRESS is restricted for the mirror-image reason, and it is the direction that
# matters most here: this pod executes tool code. With egress unconstrained, that code
# can open a TCP connection to the fleet's own security state — FLUSHDB the admitted-
# nonce keyspace (re-opening the replay window fleet-wide) or write the trust-epoch key
# (forcing every replica to re-mint under an epoch verifiers reject, a fleet-wide
# response-signing outage), both named as exactly those stakes in
# deploy/helm/mcp-re-proxy/values.yaml — and reach the Kubernetes API. A compromise of
# one MCP tool would escalate into a fleet-wide security-state compromise through the
# network layer this object exists to control.
#
# The backend needs no outbound connection at all: it serves the proxy's requests on
# the connection the proxy opened, and NetworkPolicy is connection-oriented, so reply
# traffic is not egress. DNS is the single exception, allowed because the Python
# runtime resolves at startup and a pod that cannot resolve fails in ways that read as
# an application bug. A tool that legitimately needs to reach an upstream is a
# deliberate addition here, not a default.
#
# REQUIRES a CNI that enforces NetworkPolicy (Calico, Cilium, GKE Dataplane V2, ...).
# On a cluster without one this object is accepted and silently enforces nothing.
# `gke-multi-replica-validation.sh` runs the deny test the previous note only advised:
# it drives an unrelated pod at the inner and reports whether containment is real.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-re-inner-fastmcp-allow-proxy-only
  labels:
    app.kubernetes.io/name: mcp-re-inner-fastmcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-re-inner-fastmcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-re-proxy
      ports:
        - protocol: TCP
          port: 8620
  egress:
    # DNS only. Naming both selectors in ONE `to` entry is load-bearing: two entries
    # would be ORed into "any pod in kube-system OR any kube-dns-labelled pod
    # anywhere", which is a materially wider allowance than the resolver.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
