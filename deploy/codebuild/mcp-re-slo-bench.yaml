# SPDX-License-Identifier: Apache-2.0
#
# Builds the ADR-MCPRE-051 §7 SLO bench image natively on arm64 INSIDE AWS and pushes
# it to ECR. The AWS counterpart of deploy/cloudbuild/mcp-re-images.yaml.
#
#   aws cloudformation deploy --region eu-north-1 \
#     --template-file deploy/codebuild/mcp-re-slo-bench.yaml \
#     --stack-name mcp-re-slo-bench-build --capabilities CAPABILITY_IAM
#
# WHY BUILD IN THE CLOUD AT ALL. The bench image is a from-source Rust build carrying
# a warmed cargo target/ so the Job runs with no recompile — it is large. Building it
# on a developer box and pushing it means uploading that image over a home link, and
# it competes for local disk with a target/ that is already tens of GB. Uploading the
# ~25 MB source context instead and letting the build and the push both happen inside
# the region is the same trade Cloud Build makes on the GCP side.
#
# WHY arm64. The SLO cluster is Graviton (see deploy/eks/mcp-re-slo-cluster.yaml), so
# the image must be arm64. This project uses an aarch64 CodeBuild environment, which
# builds it natively — no QEMU, and no emulated CPU anywhere near a measurement.
#
# HOW THE SOURCE ZIP IS PRODUCED. Exactly this, and nothing that zips the working tree:
#
#   git archive --format=zip HEAD -o /tmp/source.zip
#   aws s3 cp /tmp/source.zip \
#     "s3://mcp-re-build-$(aws sts get-caller-identity --query Account --output text)-<region>/source.zip"
#
# `git archive HEAD` emits TRACKED files at a commit. No other control governs this
# transfer: `.dockerignore` is read by `docker build` inside the build container, long
# after the tree is already in S3, and `.gcloudignore` governs a different upload
# entirely — so neither one keeps a file out of the object below, and
# `scripts/tracked_secrets_gate.py` (which checks those two files) says nothing about
# it. Zipping the working directory would upload `work/` — where the runbooks tell an
# operator to keep FILLED-IN cloud credential scripts, precisely because it is
# gitignored — into an object readable by every principal with read on this bucket.
#
# `git archive` also means the built image corresponds to a commit, not to whatever a
# developer happened to have on disk.
AWSTemplateFormatVersion: "2010-09-09"
Description: ECR repository and an arm64 CodeBuild project for the MCP-RE SLO bench image

Resources:
  BenchRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: mcp-re-slo-bench
      # The runbook deletes this repository on teardown; RETAIN would leave paid
      # storage behind after the stack is gone, which is the opposite of the point.
      EmptyOnDelete: true
      Tags:
        - { Key: project, Value: mcp-re }
        - { Key: ephemeral, Value: "true" }

  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub mcp-re-build-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # The source zip is an input to one build, not an artifact. Expiring it keeps
          # a torn-down project from paying storage on stale contexts indefinitely.
          - Id: expire-source-contexts
            Status: Enabled
            ExpirationInDays: 1
      Tags:
        - { Key: project, Value: mcp-re }
        - { Key: ephemeral, Value: "true" }

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      # Confused-deputy conditions. Trusting the bare codebuild.amazonaws.com service
      # principal lets the CodeBuild service assume this role on behalf of ANY project
      # in the account, so any other project could be pointed at it and inherit its
      # ECR push rights on mcp-re-slo-bench — the image that is then pulled and
      # executed on the SLO cluster, bypassing the pinned buildspec below that is the
      # review. SourceAccount bounds it to this account, SourceArn to this one project.
      #
      # The ARN is spelled out rather than !GetAtt-ed off BenchBuild, which would be
      # circular (the project names this role). It is held equal by the literal
      # `Name: mcp-re-slo-bench` on the project.
      #
      # Both are StringEquals, never StringLike: a wildcard here would re-admit the
      # sibling projects the condition exists to exclude.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/mcp-re-slo-bench
      Policies:
        - PolicyName: build-and-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*
              # GetAuthorizationToken is account-wide by API design; the push rights
              # below are scoped to this one repository.
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt BenchRepository.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::mcp-re-build-${AWS::AccountId}-${AWS::Region}/*

  BenchBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: mcp-re-slo-bench
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts: { Type: NO_ARTIFACTS }
      TimeoutInMinutes: 60
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        # Required to run a docker daemon inside the build container.
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region }
          - { Name: ECR_REGISTRY, Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com" }
      Source:
        Type: S3
        Location: !Sub mcp-re-build-${AWS::AccountId}-${AWS::Region}/source.zip
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                # Fail closed if the uploaded context is a zipped working tree rather
                # than a `git archive`. Nothing else inspects this transfer, and by the
                # time the build runs the object is already in S3 — so this cannot
                # un-upload anything, it refuses to BUILD from a context that carries
                # operator credential material and makes the mistake visible at once.
                - |
                  for p in work .claude .aws .gcloud .kube .env; do
                    if [ -e "$p" ]; then
                      echo "REFUSING: '$p' is in the build context. Upload it with"
                      echo "'git archive --format=zip HEAD', which emits tracked files only."
                      exit 1
                    fi
                  done
                - |
                  leaked=$(find . -path ./target -prune -o \
                    \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \
                       -o -name 'kubeconfig' -o -name '*seed.txt' \) -print | head -20)
                  if [ -n "$leaked" ]; then
                    echo "REFUSING: credential-shaped files in the build context:"
                    echo "$leaked"
                    exit 1
                  fi
                # The tag is READ FROM VERSION, never retyped — the same rule the
                # Job runner follows. A literal here goes stale on the next bump and
                # the Job then references a tag the registry does not hold.
                - TAG=$(tr -d '[:space:]' < VERSION)
                - echo "building mcp-re-slo-bench:$TAG for $(uname -m)"
                - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            build:
              commands:
                - docker build -f deploy/docker/Dockerfile.bench -t "$ECR_REGISTRY/mcp-re-slo-bench:$TAG" .
            post_build:
              commands:
                - docker push "$ECR_REGISTRY/mcp-re-slo-bench:$TAG"
                # Prove the pushed image is the architecture the Graviton nodes need.
                # A silently-amd64 image would not fail until a pod on the cluster
                # crashlooped with an exec-format error.
                - ARCH=$(docker image inspect "$ECR_REGISTRY/mcp-re-slo-bench:$TAG" --format '{{.Architecture}}')
                - echo "pushed architecture=$ARCH"
                - test "$ARCH" = "arm64"
      Tags:
        - { Key: project, Value: mcp-re }
        - { Key: ephemeral, Value: "true" }

Outputs:
  RepositoryUri:
    Value: !GetAtt BenchRepository.RepositoryUri
  SourceBucketName:
    Value: !Ref SourceBucket
  ProjectName:
    Value: !Ref BenchBuild
