# SPDX-License-Identifier: Apache-2.0
#
# Reference values for a horizontally-scaled MCP-RE proxy fleet (ADR-MCPS-049).
# Every security-relevant default here is the FAIL-SAFE one; relax deliberately.

# Number of proxy replicas behind the Service. >1 is the point of --fleet; the
# shared replay + trust-epoch backends keep them coherent.
replicaCount: 3

image:
  repository: mcp-re-proxy
  # Pin to a digest in production; a tag is shown here for readability.
  tag: "0.13.0"
  pullPolicy: IfNotPresent

# The port the proxy binds (mTLS/MCP-RE over TLS). The Service and the tcpSocket
# probes target this port.
#
# MIRRORED VALUE — the single source of truth is config/ports.toml
# ([services.mcp_re_proxy].port, in the repo's reserved 8600-8699 band). Helm
# cannot read that TOML at template time, so this scalar holds a copy that
# scripts/check_port_registry.py CI-gates equal. Change the port in
# config/ports.toml, then update this line to match (the gate enforces it).
bindPort: 8600

# Deployment topology (ADR-MCPS-049 clause 1). The proxy ALWAYS runs the maximal-
# security posture and refuses any unsafe config at startup — there is no security
# toggle. `fleet` selects the horizontally-scaled topology, which additionally
# rejects node-local replay caches. Do not set fleet=true with a memory/file replay
# cache (the proxy refuses to start).
fleet: true

# Client→proxy Service routing. The inner plane is stateless Streamable-HTTP
# (ADR-MCPRE-051 §3), so plain round-robin (`None`) is the norm — the MCP-RE
# authenticity checks run identically on every replica. Set `ClientIP` only when
# the inner BACKEND you front is itself session-stateful and you have not put its
# own sticky routing in front of it.
service:
  sessionAffinity: None # None | ClientIP

# Shared replay store (ADR-MCPS-020). MUST be a shared tier at >= REDIS_WAIT_QUORUM
# under --fleet, or the proxy refuses to start.
#
# The URL scheme is security-relevant, so the default is the safe one. This hop
# carries the admitted replay nonces: anyone who can reach it unauthenticated can
# DEL/FLUSHDB the keyspace and re-open the replay window fleet-wide. Use `rediss://`
# (TLS) and a credentialed URL — `rediss://:<password>@host:6379`, or an ACL user as
# `rediss://<user>:<password>@host:6379`. Supply the credential by overriding this
# value from a Secret; do not commit it.
replay:
  redisUrl: "rediss://mcp-re-redis:6379"
  durabilityTier: "redis-wait-quorum:2:2000"
  # Escape hatch for a plaintext `redis://` endpoint. The render-time guard refuses
  # a plaintext URL under fleet=true unless this is explicitly true, so running
  # unencrypted is a decision someone wrote down rather than a default. Only
  # defensible where the hop is confined by other means (a fenced validation
  # namespace, a service mesh terminating TLS transparently).
  allowPlaintextRedis: false

# Trust revocation (ADR-MCPS-021 / MCPS-84). The push tier + a trust-epoch Redis
# source gives near-zero cross-replica revocation lag (bounded T on outage). Set
# trustEpochRedisUrl to "" to run the push tier inert (bounded-T only).
#
# Same scheme rule as replay.redisUrl, and the stakes are higher: the epoch value
# read from this key drives credential minting, so an attacker who can write it
# forces every replica to re-mint under an epoch verifiers reject — a fleet-wide
# response-signing outage. `replay.allowPlaintextRedis` governs both URLs.
revocation:
  tier: "push:60"
  trustEpochRedisUrl: "rediss://mcp-re-redis:6379"
  trustEpochKey: "mcp-re:trust:epoch"

# Client-certificate lifetime ceiling (short-lived-cert revocation posture).
maxClientCertLifetimeSeconds: 3600

# mTLS channel binding (ADR-MCPS-023). The ONLY two values this chart can render
# into a pod that starts:
#
#   ""       omit the flag; the proxy applies its own fail-safe default, `exact`
#   "exact"  the same thing, stated explicitly
#
# `exact` binds each signed request to the verified client-cert identity. There is
# no "none": the proxy rejects it at argument parse. "lb-assertion" and
# "attested-ingress" parse but are refused at boot on the RFC 9421 serving path
# (rebinding an owner-signed ingress assertion to the request-evidence digest is
# pending owner authorization), so setting either CrashLoops the pods. The
# render-time guard rejects all three rather than letting the chart produce them.
transportBinding: ""

# The proxy's server identity (response signing + expected audience).
# RFC 9421 (ADR-MCPRE-050): the expected audience is the full tuple
# {audience, targetUri, route}; the signed request's audience block must equal it
# AND its targetUri must match the request @target-uri (mcp-re-http-profile verify).
# targetUri/trustDomain/route MUST agree with what mcp_re_gke_client.py signs
# (--target-uri / --trust-domain / --route). An empty route omits the flag (route
# = None on both sides).
# Every value below is deployment-specific and MUST be overridden. They are the
# identity of one dispatch boundary: the audience tuple is what makes a signed
# request valid HERE and nowhere else (RE-15). Two installs that both keep a shipped
# default would share one audience tuple and one trust epoch, so a request signed for
# either verifies at the other whenever they share a trust anchor, and advancing the
# epoch on one advances it on both. The render-time guard therefore rejects the
# `did:example:` / `example.com` / `epoch-1` placeholders rather than rendering a
# chart whose security properties depend on nobody else using the defaults.
identity:
  audience: "did:example:server-1"
  serverSigner: "did:example:server-1"
  serverKeyId: "server-key-1"
  targetUri: "https://proxy.internal:8600/mcp"
  trustDomain: "example.com"
  route: ""
  # ADR-MCPRE-052: delegated-signing is the ONLY response mode. The trust epoch
  # minted into every delegation credential (required; MUST be coordinated with the
  # verifiers' accepted-epoch set — §7). Advance it to invalidate an epoch of keys.
  delegatedTrustEpoch: "epoch-1"
  # Escape hatch for the demo/validation identity above. `emit_mtls_fixtures` bakes
  # `did:example:server-1` and `example.com` into trust.json as part of the resolved
  # actor id, so a harness driven by those fixtures MUST deploy with the matching
  # identity — the placeholder guard would otherwise make the fixtures unusable.
  # Setting this true is a statement that the deployment is a fenced validation run,
  # not a production boundary; leave it false everywhere else.
  allowExampleFixtures: false

# Inner MCP plane (ADR-MCPRE-051 §3). The proxy NO LONGER launches a subprocess;
# it forwards to a stateless Streamable-HTTP backend over `--inner-http-url`.
# MCP-RE is HTTP-profile ONLY: the inner plane is one or more Streamable-HTTP MCP
# backends. A stdio-only MCP server is out of scope for MCP-RE — front it with an
# EXTERNAL plain-MCP adapter (e.g. FastMCP's stdio↔HTTP proxy) that exposes HTTP,
# and point `httpUrls` at that adapter. MCP-RE owns no stdio bridge.
inner:
  # Streamable-HTTP backend URL(s). Required — the proxy fails closed with none.
  httpUrls: []
  #  - "http://inner-mcp.default.svc.cluster.local:8080/mcp"

# Signing-key custody (ADR-MCPS-028). `fileSeed` mounts a raw Ed25519 seed from
# the material Secret (dev / on-prem). `gcpKms` keeps the signing key in GCP
# Cloud KMS and, on GKE, authenticates via Workload Identity (useMetadata) so no
# key material ever lands in the pod — this is the ADR-MCPRE-052 delegated-credential
# ISSUER root (off the request path). The default image (deploy/docker/Dockerfile)
# is built with the `gcp_kms_keysource` feature, so it serves both modes; the KMS
# signer stays inert until `gcpKms` selects `--key-source gcp-kms`.
keySource: fileSeed # fileSeed | gcpKms

# GCP Cloud KMS custody (used only when keySource == gcpKms).
gcpKms:
  # KMS key-version resource path:
  #   projects/<p>/locations/<l>/keyRings/<r>/cryptoKeys/<k>/cryptoKeyVersions/<n>
  keyVersion: ""
  # Optional override of the cloudkms endpoint (blank = the public endpoint).
  endpoint: ""
  # Fetch the KMS access token from the GKE metadata server (Workload Identity).
  # Leave true on GKE; set false only to supply an operator MCP_RE_GCP_ACCESS_TOKEN.
  useMetadata: true
  # Optional SECOND, DISTINCT KMS key for delegated TLS (the TLS server private
  # key stays in KMS; the chart then omits --tls-key, which the proxy requires).
  tlsKeyVersion: ""
  # Name of a Secret with an `access-token` key, injected as MCP_RE_GCP_ACCESS_TOKEN
  # when useMetadata=false (no Workload-Identity metadata server — e.g. a local kind
  # cluster running the same image + chart as GKE). Empty on GKE (useMetadata=true).
  accessTokenSecretName: ""

# Pod ServiceAccount. On GKE, annotate it to bind a Google Service Account via
# Workload Identity so the gcpKms credential path needs no key file:
#   annotations:
#     iam.gke.io/gcp-service-account: <gsa>@<project>.iam.gserviceaccount.com
# The bound GSA needs roles/cloudkms.signerVerifier on the signing key.
serviceAccount:
  create: true
  # If empty, the fullname is used. Set to reuse an existing (WI-bound) account.
  name: ""
  annotations: {}

# TLS + trust material, mounted from a Secret. The Secret MUST provide these keys:
#   tls.crt, tls.key, client-ca.pem, trust.json, signing-seed — minus tls.key when
#   gcpKms.tlsKeyVersion is set. signing-seed is required even under keySource=gcpKms
#   (the CLI mandates --signing-key-seed; in KMS mode it is accepted but UNUSED).
tls:
  secretName: "mcp-re-proxy-material"
  mountPath: "/etc/mcp-re"

# Graceful drain: the proxy stops accepting on SIGTERM and finishes the in-flight
# request (MCPS-88). Give the kubelet headroom over the request deadline.
drainGracePeriodSeconds: 30

# preStop delay (seconds) before the proxy is sent SIGTERM on pod deletion. Keeps
# the pod serving while an L4 LoadBalancer removes it from rotation, closing the
# endpoint-propagation race that can drop a single new connection at the instant a
# rolling update terminates a replica. Must be < drainGracePeriodSeconds. 0 = off.
drainPreStopSeconds: 6

resources: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Pod / container hardening.
#
# The proxy mounts the response-signing seed and the TLS private key from a Secret,
# so a container escape is a key-compromise event. These defaults drop every
# capability, forbid privilege escalation, and pin the runtime's default seccomp
# profile — none of which changes the uid the process runs as.
#
# runAsNonRoot is deliberately NOT set here, and that is a known gap rather than an
# oversight: the proxy refuses to start on a key file with ANY group or other
# permission bit (`key_file_mode_is_insecure` is `mode & 0o077 != 0`), while a
# Kubernetes Secret mounted for a non-root uid needs fsGroup + mode 0440 — which
# that predicate rejects. Running non-root therefore requires deciding how the
# key-file check should treat an fsGroup-owned mount; see the audit's C053b.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL
