# SPDX-License-Identifier: Apache-2.0
{{- include "mcp-re-proxy.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-re-proxy.fullname" . }}
  labels:
    {{- include "mcp-re-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp-re-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-re-proxy.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "mcp-re-proxy.serviceAccountName" . }}
      # MCPS-88: SIGTERM triggers a graceful drain (stop accepting, finish the
      # in-flight request, exit 0). Give the kubelet headroom over the request
      # deadline so a rollout drains rather than kills.
      terminationGracePeriodSeconds: {{ .Values.drainGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-re-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if and (eq .Values.keySource "gcpKms") (not .Values.gcpKms.useMetadata) .Values.gcpKms.accessTokenSecretName }}
          # Operator-supplied Cloud KMS token path (useMetadata=false): the pod has
          # no Workload-Identity metadata server (e.g. a local kind cluster running
          # the IDENTICAL image + chart as GKE), so the KMS access token is injected
          # from a Secret as MCP_RE_GCP_ACCESS_TOKEN. On GKE leave useMetadata=true and
          # this block is omitted — the only substrate-forced difference between the
          # local and GKE runs of the SAME validation harness.
          env:
            - name: MCP_RE_GCP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gcpKms.accessTokenSecretName | quote }}
                  key: access-token
          {{- end }}
          args:
            - "--bind"
            - "0.0.0.0:{{ .Values.bindPort }}"
            {{- if .Values.podSecurityContext.fsGroup }}
            # C053b: the Secret is mounted 0440 and owned by fsGroup, so the key file is
            # group-readable by construction. Rendered ONLY when fsGroup is set, so a
            # chart that does not use the fsGroup mount model never relaxes the check.
            # The proxy still refuses unless the group is one it is actually a member of.
            - "--allow-group-readable-key-files"
            {{- end }}
            # There is NO security toggle: the proxy always runs the maximal-security
            # posture and refuses any unsafe config at startup. `--fleet` selects the
            # horizontally-scaled TOPOLOGY (it does not relax security) and additionally
            # rejects node-local replay caches.
            {{- if .Values.fleet }}
            - "--fleet"
            {{- end }}
            - "--replay-cache"
            - "shared"
            - "--replay-redis-url"
            - {{ .Values.replay.redisUrl | quote }}
            - "--replay-durability-tier"
            - {{ .Values.replay.durabilityTier | quote }}
            - "--revocation-tier"
            - {{ .Values.revocation.tier | quote }}
            {{- if .Values.revocation.trustEpochRedisUrl }}
            - "--trust-epoch-redis-url"
            - {{ .Values.revocation.trustEpochRedisUrl | quote }}
            - "--trust-epoch-key"
            - {{ .Values.revocation.trustEpochKey | quote }}
            {{- end }}
            - "--max-client-cert-lifetime"
            - "{{ .Values.maxClientCertLifetimeSeconds }}"
            # MCPRE-114 admission ceiling. Omitted when unset, which the proxy reads
            # as unbounded — so an existing release keeps its behaviour on upgrade.
            # An explicit per-core ceiling wins over the fleet-wide total, so only one
            # flag is ever emitted.
            {{- if .Values.admission.maxInFlight }}
            - "--max-in-flight"
            - "{{ .Values.admission.maxInFlight }}"
            {{- else if .Values.admission.maxInFlightTotal }}
            - "--max-in-flight-total"
            - "{{ .Values.admission.maxInFlightTotal }}"
            {{- end }}
            - "--audience"
            - {{ .Values.identity.audience | quote }}
            # RFC 9421 audience tuple (ADR-MCPRE-050): the signed request's audience
            # block must equal {audience, targetUri, route} AND targetUri must match
            # the request @target-uri, or the proxy fails closed invalid_audience.
            - "--target-uri"
            - {{ .Values.identity.targetUri | quote }}
            - "--trust-domain"
            - {{ .Values.identity.trustDomain | quote }}
            {{- if .Values.identity.route }}
            - "--route"
            - {{ .Values.identity.route | quote }}
            {{- end }}
            - "--server-signer"
            - {{ .Values.identity.serverSigner | quote }}
            - "--server-key-id"
            - {{ .Values.identity.serverKeyId | quote }}
            # ADR-MCPRE-052: delegated-signing is the ONLY response mode. The root key
            # (KMS/file) is the credential ISSUER off the request path; an in-memory
            # delegated key signs each response. The trust epoch is required and must be
            # coordinated with the verifiers' accepted-epoch set (§7).
            - "--delegated-trust-epoch"
            - {{ .Values.identity.delegatedTrustEpoch | quote }}
            {{- if eq .Values.keySource "gcpKms" }}
            # Cloud KMS custody: the signing key never enters the pod. On GKE the
            # token comes from the Workload-Identity metadata server (useMetadata).
            - "--key-source"
            - "gcp-kms"
            - "--gcp-kms-key-version"
            - {{ .Values.gcpKms.keyVersion | quote }}
            {{- if .Values.gcpKms.endpoint }}
            - "--gcp-kms-endpoint"
            - {{ .Values.gcpKms.endpoint | quote }}
            {{- end }}
            {{- if .Values.gcpKms.useMetadata }}
            - "--gcp-kms-use-metadata"
            {{- end }}
            {{- if .Values.gcpKms.tlsKeyVersion }}
            # Delegated TLS: the TLS server private key also stays in KMS, so the
            # exported --tls-key is omitted (the proxy rejects both together).
            - "--gcp-kms-tls-key-version"
            - {{ .Values.gcpKms.tlsKeyVersion | quote }}
            {{- end }}
            {{- else }}
            - "--key-source"
            - "file"
            {{- end }}
            {{- if ne .Values.keySource "gcpKms" }}
            # Passed ONLY under file custody, where the proxy actually reads it. Under
            # gcpKms the response key never leaves KMS and the seed is never read, so
            # passing it would put a deployment's most sensitive file in the pod for no
            # reason — in exactly the mode chosen because no key material should be
            # there. (The CLI used to require it unconditionally; it no longer does.)
            - "--signing-key-seed"
            - "{{ .Values.tls.mountPath }}/signing-seed"
            {{- end }}
            - "--tls-cert"
            - "{{ .Values.tls.mountPath }}/tls.crt"
            {{- if not (and (eq .Values.keySource "gcpKms") .Values.gcpKms.tlsKeyVersion) }}
            - "--tls-key"
            - "{{ .Values.tls.mountPath }}/tls.key"
            {{- end }}
            - "--client-ca"
            - "{{ .Values.tls.mountPath }}/client-ca.pem"
            - "--trust"
            - "{{ .Values.tls.mountPath }}/trust.json"
            {{- if .Values.transportBinding }}
            # mTLS channel binding (ADR-MCPS-023). `exact` — the proxy default, the
            # fail-safe, and the only value this flag can carry on the RFC 9421
            # serving path — binds each signed request to the verified client-cert
            # identity. The render-time guard rejects everything else, so this line
            # only ever emits `exact`.
            - "--transport-binding"
            - {{ .Values.transportBinding | quote }}
            {{- end }}
            # Inner plane (ADR-MCPRE-051 §3): the PEP forwards to one or more
            # stateless Streamable-HTTP backends (repeated --inner-http-url ⇒
            # round-robin). MCP-RE is HTTP-profile only — a stdio-only server is
            # fronted by an EXTERNAL plain-MCP adapter (e.g. FastMCP) that exposes
            # HTTP; point httpUrls at that adapter.
            {{- range .Values.inner.httpUrls }}
            - "--inner-http-url"
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: mcp-re
              containerPort: {{ .Values.bindPort }}
          # MCPS-88: the proxy speaks MCP-RE over TLS (no HTTP server), so the
          # honest probe is a tcpSocket check against the bind port — "port
          # accepting" genuinely means "ready to serve".
          readinessProbe:
            tcpSocket:
              port: mcp-re
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mcp-re
            periodSeconds: 10
          {{- if gt (int .Values.drainPreStopSeconds) 0 }}
          # Close the L4 LoadBalancer endpoint-propagation race: on pod deletion
          # keep serving for a short window BEFORE the proxy receives SIGTERM, so
          # the LB stops routing new connections to this pod before it drains. The
          # proxy's own SIGTERM drain (finish in-flight, stop accepting) then runs
          # within terminationGracePeriodSeconds. Without this, a new connection can
          # reach a pod in the ~1s between SIGTERM and its removal from the LB.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.drainPreStopSeconds }}"]
          {{- end }}
          volumeMounts:
            - name: material
              mountPath: {{ .Values.tls.mountPath | quote }}
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: material
          secret:
            secretName: {{ .Values.tls.secretName | quote }}
            # The proxy refuses a key file with any world bit or group WRITE bit
            # (signing-seed, tls.key). Secret volumes default to 0644, so the mode is
            # pinned. 0440 rather than 0400: under a non-root podSecurityContext the
            # file is owned by fsGroup, and the process reads it through its group
            # membership. Paired with --allow-group-readable-key-files below; the
            # proxy still verifies at startup that the group is one it is in.
            defaultMode: 0440
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
