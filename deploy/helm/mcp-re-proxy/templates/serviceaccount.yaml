# SPDX-License-Identifier: Apache-2.0
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mcp-re-proxy.serviceAccountName" . }}
  labels:
    {{- include "mcp-re-proxy.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  # On GKE, bind a Google Service Account here via Workload Identity:
  #   iam.gke.io/gcp-service-account: <gsa>@<project>.iam.gserviceaccount.com
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The proxy calls no Kubernetes API, and the pod already holds the response-signing
# seed and the TLS private key — a projected apiserver token would turn a single-pod
# key compromise into cluster access for whatever this account is bound to. The pod
# spec repeats this so it also holds when an existing ServiceAccount is reused.
# gcpKms (GKE metadata server) and awsKms/IRSA (the webhook's own `aws-iam-token`
# projected volume) are both unaffected.
automountServiceAccountToken: false
{{- end }}
