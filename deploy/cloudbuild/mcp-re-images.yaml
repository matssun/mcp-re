# Cloud Build config: EVERY deployable amd64 image this repo ships. Builds natively on
# amd64 (no local QEMU) and pushes to Artifact Registry.
#
#   gcloud builds submit --config deploy/cloudbuild/mcp-re-images.yaml .
#
# ONE config builds ALL FOUR, deliberately. The SLO bench used to live in a second
# config (slo-bench.yaml), which made a PARTIAL build the easy thing to do: submitting
# the "images" config produced a registry that looked complete and silently lacked the
# bench. The tag pinned by tools/slo/run_slo_job.sh then referred to nothing, and the
# SLO phase died at ImagePullBackOff on a cluster that was already billing — after the
# proofs had passed, so the failure landed as late as it possibly could.
#
# A build config that can be run "partly" will be. Adding an image here — not in a new
# file — is what keeps `submit` and "the registry is complete" the same event.
#
# Substitutions: _AR = the Artifact Registry docker path prefix.
substitutions:
  _AR: us-central1-docker.pkg.dev/project-b19bbb5e-9be8-4fcb-a2f/mcp-re
steps:
  - name: gcr.io/cloud-builders/docker
    id: proxy
    args: [build, -f, deploy/docker/Dockerfile, --target, proxy, -t, "${_AR}/mcp-re-proxy:0.15.0", .]
  - name: gcr.io/cloud-builders/docker
    id: inner
    args: [build, -f, deploy/docker/Dockerfile.inner, -t, "${_AR}/mcp-re-inner-fastmcp:0.15.0", .]
  # Proof 4 (zero-drop rolling update) drives load from an IN-CLUSTER generator; the
  # GKE fleet pulls this image from AR (the kind path builds it locally). Without it,
  # Proof 4 cannot run on GKE.
  - name: gcr.io/cloud-builders/docker
    id: loadgen
    args: [build, -f, deploy/docker/Dockerfile.loadgen, -t, "${_AR}/mcp-re-loadgen:0.15.0", .]
  # The ADR-051 §7 SLO baseline runner, run as K8s Jobs by tools/slo/run_slo_job.sh.
  # It is measured on the SAME cluster as the proofs, so it is built by the SAME submit.
  - name: gcr.io/cloud-builders/docker
    id: slo-bench
    args: [build, -f, deploy/docker/Dockerfile.bench, -t, "${_AR}/mcp-re-slo-bench:0.15.0", .]
images:
  - "${_AR}/mcp-re-proxy:0.15.0"
  - "${_AR}/mcp-re-inner-fastmcp:0.15.0"
  - "${_AR}/mcp-re-loadgen:0.15.0"
  - "${_AR}/mcp-re-slo-bench:0.15.0"
options:
  machineType: E2_HIGHCPU_8
timeout: 3600s
