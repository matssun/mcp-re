[package]
name = "mcp-re-http-profile"
version = "0.16.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "MCP-RE HTTP standards profile (ADR-MCPRE-050) — RFC 9421 HTTP Message Signatures + RFC 9530 Content-Digest carrier, minimal proof path. Pure: no networking/async/fs."

[dependencies]
# ADR-MCPRE-050 (v0.11 grill A.1): the HTTP standards profile is a NEW crate
# beside the native profile; mcp-re-core stays transport-agnostic and is reused
# only for its pure primitives (Ed25519 signing/verification, base64url) and the
# frozen wire-code taxonomy. This crate models the HTTP message shape itself and
# MUST NOT pull in any networking/async/fs crate — transport adaptation lives in
# the layers above (proxy/transport), mirroring the mcp-re-client-core seam rule.
mcp-re-core = { path = "../mcp-re-core" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
ciborium = "0.2"
coset = "0.4"
# MCPRE-501 slice 1: a transparency service signs receipts with ES256 (RFC 9942's
# own examples use it), so the SCITT receipt verifier needs P-256. Scoped to that
# verifier: MCP-RE request and response signing remain Ed25519-only, and
# `mcp-re-core` still refuses ES256 for message signatures. Pure crypto — no
# networking, async or fs, so the crate's purity rule holds.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }

# ADR-MCPRE-059 Phase 2: the Verus lane, optional and off by default. Identical posture
# to mcp-re-core — a production build never resolves these, and the specification text
# expands to nothing with the `cfg_attr` that carries it. Versions track
# verification/policy/toolchains.lock.toml.
[dependencies.vstd]
version = "=0.0.0-2026-08-09-0044"
optional = true

[dependencies.verus_builtin]
version = "=0.0.0-2026-08-09-0044"
optional = true

[dependencies.verus_builtin_macros]
version = "=0.0.0-2026-08-09-0044"
optional = true

[features]
# mcp-re-core/verify travels with it: `cargo verus verify` processes dependencies too, and
# a dependency whose manifest asks to be verified but whose prelude is feature-gated off
# fails to compile. The two lanes turn on together or not at all.
verify = [
  "dep:vstd",
  "dep:verus_builtin",
  "dep:verus_builtin_macros",
  "mcp-re-core/verify",
]

[package.metadata.verus]
verify = true

# `verus_keep_ghost` is defined by the prover's rustc driver, never by cargo. Declared so
# the guard in lib.rs does not read as a typo'd cfg on an ordinary build.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }

[lib]
name = "mcp_re_http_profile"
path = "src/lib.rs"
